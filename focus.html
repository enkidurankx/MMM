<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0f">
<title>FOCUS</title>
<style>
:root {
  --bg:#0a0a0f; --bg2:#111118; --bg3:#18181f; --bg4:#1f1f28;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.13);
  --text:#e8e8f0; --text2:#888899; --text3:#555566;
  --red:#e83030; --red-dim:rgba(232,48,48,0.13); --red-glow:rgba(232,48,48,0.3);
  --amber:#d97020; --amber-dim:rgba(217,112,32,0.13); --amber-glow:rgba(217,112,32,0.25);
  --blue:#2060d0; --blue-dim:rgba(32,96,208,0.13); --blue-glow:rgba(32,96,208,0.25);
  --purple:#8060d0; --green:#28b060;
  --nav-h:64px; --top-h:52px; --r:14px; --rsm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,'SF Pro Text','Helvetica Neue',Arial,sans-serif;font-size:14px;line-height:1.4;overflow:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none;outline:none;padding:0;text-align:left}
#app{display:flex;flex-direction:column;height:100dvh;max-width:430px;margin:0 auto}

/* TOPBAR */
.topbar{height:var(--top-h);display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;background:var(--bg);border-bottom:1px solid var(--border)}
.topbar-title{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;letter-spacing:.04em}
.topbar-logo{width:24px;height:24px;border:2px solid var(--purple);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--purple)}
.topbar-sub{font-size:10px;color:var(--text3);margin-top:1px}
.topbar-icons{display:flex;gap:8px}
.topbar-icons button{width:34px;height:34px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.topbar-icons button:active{background:var(--bg4)}

/* SCREENS */
.screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nav-h)+8px);display:none}
.screen.active{display:block}

/* BOTTOM NAV */
.nav{height:var(--nav-h);background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;padding:0 4px;flex-shrink:0;position:relative}
/* Tab-Buttons: gilt bewusst NUR fuer .nav-tab, damit der FAB nicht ueberschrieben wird */
.nav .nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:100%;color:var(--text3);font-size:10px;letter-spacing:.02em;touch-action:manipulation}
.nav .nav-tab.active{color:var(--purple)}
.nav .nav-tab .ni{font-size:20px;line-height:1}

/* FAB — sitzt als eigenes Bauteil ueber der Leiste, nicht darin */
.nav .nav-fab{
  flex:0 0 58px; width:58px; height:58px; padding:0;
  align-self:center; margin-top:-22px;
  display:flex; align-items:center; justify-content:center;
  border-radius:50%;
  /* Licht von oben: heller Scheitel, tiefere Basis — wirkt wie ein Hardware-Taster */
  background:linear-gradient(170deg,#9a78e8 0%,#8060d0 52%,#6a4bb8 100%);
  /* Aussparung in der Leiste + gerichteter Schatten + enger Schein */
  box-shadow:
    0 0 0 5px var(--bg2),
    0 0 0 6px rgba(255,255,255,.05),
    0 6px 16px rgba(0,0,0,.5),
    0 0 22px -4px rgba(128,96,208,.55);
  touch-action:manipulation;
  transition:transform .13s cubic-bezier(.3,.7,.4,1), box-shadow .13s ease;
}
/* Das Plus als Glyphe aus zwei Balken — gleichmaessig, exakt zentriert, schriftunabhaengig */
.nav .nav-fab i{position:relative;display:block;width:20px;height:20px}
.nav .nav-fab i::before,.nav .nav-fab i::after{
  content:"";position:absolute;left:50%;top:50%;background:#fff;border-radius:1.5px;
  box-shadow:0 1px 1px rgba(40,20,80,.25);
}
.nav .nav-fab i::before{width:20px;height:2.5px;transform:translate(-50%,-50%)}
.nav .nav-fab i::after{width:2.5px;height:20px;transform:translate(-50%,-50%)}
.nav .nav-fab:active{
  transform:scale(.93);
  box-shadow:
    0 0 0 5px var(--bg2),
    0 0 0 6px rgba(255,255,255,.05),
    0 2px 6px rgba(0,0,0,.45),
    0 0 12px -4px rgba(128,96,208,.4);
}
@media (prefers-reduced-motion:reduce){.nav .nav-fab{transition:none}}

/* MATRIX */
.matrix-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.what-now-btn{margin:0 12px 8px;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:linear-gradient(135deg,rgba(112,64,192,.2),rgba(80,40,160,.12));border:1px solid rgba(128,96,208,.35);border-radius:var(--r);touch-action:manipulation;width:calc(100% - 24px)}
.what-now-btn:active{border-color:var(--purple)}
.wn-label{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--purple);text-transform:uppercase}
.wn-sub{font-size:12px;color:var(--text2);margin-top:2px}
.wn-arrow{font-size:20px;color:var(--purple)}

.quadrant{background:var(--bg2);border-radius:var(--r);border:1px solid var(--border);min-height:160px;overflow:hidden;transition:border-color .2s,box-shadow .2s}
.quadrant.drag-over{border-color:var(--purple);box-shadow:0 0 0 1px var(--purple)}
.q-hd{padding:10px 12px 8px}
.q-hd-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.q-icon{font-size:14px} .q-badge{min-width:18px;height:18px;border-radius:9px;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--text2);padding:0 5px}
.q-label{font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.q-tasks{padding:8px;display:flex;flex-direction:column;gap:5px}
.task-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rsm);padding:8px 10px;touch-action:none;display:block;width:100%;text-align:left}
.task-card.dragging{opacity:.4;transform:scale(.97)}
.task-card.ghost{position:fixed;pointer-events:none;z-index:1000;transform:scale(1.04) rotate(1deg);box-shadow:0 8px 30px rgba(0,0,0,.6);opacity:.95;width:160px}
.tc-title{font-size:12px;font-weight:500;color:var(--text);line-height:1.3}
.tc-meta{font-size:10px;color:var(--text3);margin-top:3px;display:flex;gap:5px;align-items:center}
.tc-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.q-action-btn{margin:4px 8px 8px;padding:7px;border-radius:6px;text-align:center;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;touch-action:manipulation;width:calc(100% - 16px)}
.empty-q{text-align:center;padding:14px 10px;color:var(--text3);font-size:11px}

/* Q colors */
.q1{border-color:var(--red-glow)} .q1 .q-hd{background:var(--red-dim)} .q1 .q-icon,.q1 .q-label{color:var(--red)} .q1 .q-action-btn{background:var(--red);color:white} .q1 .tc-dot{background:var(--red)}
.q2{border-color:var(--amber-glow)} .q2 .q-hd{background:var(--amber-dim)} .q2 .q-icon,.q2 .q-label{color:var(--amber)} .q2 .q-action-btn{background:var(--amber);color:white} .q2 .tc-dot{background:var(--amber)}
.q3{border-color:var(--blue-glow)} .q3 .q-hd{background:var(--blue-dim)} .q3 .q-icon,.q3 .q-label{color:#5090e0} .q3 .q-action-btn{background:var(--blue);color:white} .q3 .tc-dot{background:#5090e0}
.q4 .q-hd{background:rgba(60,60,80,.1)} .q4 .q-icon,.q4 .q-label{color:var(--text3)} .q4 .q-action-btn{background:var(--bg4);color:var(--text2);border:1px solid var(--border2)} .q4 .tc-dot{background:var(--text3)}

/* HEUTE */
.screen-pad{padding:12px}
.sec-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:8px 0 6px;margin-bottom:4px;border-bottom:1px solid var(--border)}
.today-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rsm);padding:12px 14px;margin-bottom:6px;display:flex;align-items:center;gap:12px;touch-action:manipulation;width:100%;text-align:left}
.today-card:active{background:var(--bg3)}
.today-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.today-info{flex:1}
.today-title{font-size:14px;font-weight:500}
.today-meta{font-size:11px;color:var(--text3);margin-top:2px}
.start-btn{padding:6px 12px;background:var(--purple);border-radius:6px;font-size:11px;font-weight:700;color:white;white-space:nowrap;touch-action:manipulation}
.start-btn:active{opacity:.8}

/* ADD TASK */
#screen-add .topbar-local{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
#screen-add .topbar-local .back{font-size:14px;color:var(--purple);touch-action:manipulation}
#screen-add .topbar-local h2{font-size:16px;font-weight:700}
#screen-add .topbar-local .save{font-size:14px;font-weight:700;color:var(--purple);touch-action:manipulation}
#screen-add .topbar-local .save.off{color:var(--text3);pointer-events:none}

.ff{display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--border);min-height:56px;touch-action:manipulation;width:100%;background:transparent;text-align:left}
.ff:active{background:var(--bg3)}
.ff-icon{font-size:18px;color:var(--text3);width:22px;text-align:center;flex-shrink:0}
.ff-body{flex:1;min-width:0}
.ff-label{font-size:10px;color:var(--text3);margin-bottom:3px}
.ff-val{font-size:14px;color:var(--text)}
.ff-val.dim{color:var(--text3)}
.ff-arrow{font-size:16px;color:var(--text3)}
/* title field — not a button */
.ff-title{display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--border);min-height:56px}
.ff-title input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:15px;font-family:inherit}
.ff-title input::placeholder{color:var(--text3)}
.ff-title textarea{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:14px;font-family:inherit;resize:none;padding:4px 0}
.ff-title textarea::placeholder{color:var(--text3)}

.qp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px}
.qp-btn{padding:12px;border-radius:var(--rsm);border:1px solid var(--border);background:var(--bg2);text-align:center;touch-action:manipulation;width:100%;transition:border-color .15s,background .15s}
.qp-btn:active{opacity:.8}
.qp-icon{font-size:20px;margin-bottom:6px}
.qp-lbl{font-size:10px;font-weight:600;line-height:1.3;color:var(--text2)}
.qp-btn.sel1{border-color:var(--red);background:var(--red-dim)}
.qp-btn.sel2{border-color:var(--amber);background:var(--amber-dim)}
.qp-btn.sel3{border-color:var(--blue);background:var(--blue-dim)}
.qp-btn.sel4{border-color:var(--border2);background:var(--bg3)}

/* BOTTOM SHEET */
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;bottom:0;left:50%;transform:translate(-50%,100%);width:100%;max-width:430px;background:var(--bg2);border-radius:16px 16px 0 0;border-top:1px solid var(--border);padding:16px 16px 32px;z-index:101;max-height:80dvh;overflow-y:auto;transition:transform .25s cubic-bezier(.32,.72,0,1)}
.sheet-backdrop.open .sheet{transform:translate(-50%,0)}
.sheet-handle{width:36px;height:3px;background:var(--bg4);border-radius:2px;margin:0 auto 16px}
.sheet-title{font-size:16px;font-weight:700;margin-bottom:14px}
.sheet-opt{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--rsm);margin-bottom:6px;font-size:14px;touch-action:manipulation;width:100%;text-align:left;transition:background .12s}
.sheet-opt:active{background:var(--bg4)}
.sheet-opt.sel{border-color:var(--purple);color:var(--purple)}
.sheet-cancel{margin-top:10px;padding:13px;text-align:center;font-size:14px;color:var(--text3);touch-action:manipulation;width:100%}
.sheet-cancel:active{opacity:.7}

/* TASK DETAIL */
.detail-title{font-size:20px;font-weight:700;margin-bottom:4px}
.detail-badge{display:inline-block;padding:3px 10px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.06em;margin-bottom:14px}
.detail-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.detail-row-icon{font-size:16px;color:var(--text3);width:22px}
.detail-row-label{font-size:12px;color:var(--text3);width:80px;flex-shrink:0}
.detail-row-val{font-size:13px;color:var(--text);flex:1}
.detail-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.detail-action{flex:1;min-width:60px;padding:11px 6px;border-radius:var(--rsm);text-align:center;font-size:12px;font-weight:700;border:1px solid var(--border);background:var(--bg3);color:var(--text2);touch-action:manipulation}
.detail-action:active{opacity:.75}
.detail-action.primary{background:var(--purple);border-color:var(--purple);color:white}
.detail-action.danger{color:var(--red);border-color:var(--red-glow)}

/* WHAT NOW */
.wn-hero{text-align:center;padding:28px 24px 16px}
.wn-hero h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
.wn-hero p{color:var(--text2);margin-top:6px;font-size:13px}
.wn-card{margin:0 16px 16px;background:var(--bg2);border-radius:var(--r);border:1px solid var(--border2);overflow:hidden}
.wn-card-inner{padding:22px 20px 20px}
.wn-qbadge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}
.wn-qbadge.urgent{background:var(--red-dim);color:var(--red);border:1px solid var(--red-glow)}
.wn-qbadge.plan{background:var(--blue-dim);color:#5090e0;border:1px solid var(--blue-glow)}
.wn-task-title{font-size:21px;font-weight:700;line-height:1.2;margin-bottom:10px}
.wn-meta{display:flex;gap:12px;margin-bottom:20px;color:var(--text2);font-size:13px}
.big-btn{display:block;width:100%;padding:14px;border-radius:10px;font-size:16px;font-weight:800;letter-spacing:.04em;text-align:center;touch-action:manipulation;border:none}
.big-btn:active{opacity:.85;transform:scale(.98)}
.btn-red{background:var(--red);color:white}
.btn-purple{background:var(--purple);color:white;box-shadow:0 0 20px rgba(128,96,208,.4)}
.wn-others{padding:0 16px 16px}
.wn-others-label{font-size:11px;color:var(--text3);margin-bottom:8px}
.wn-other{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rsm);margin-bottom:5px;touch-action:manipulation;width:100%;text-align:left}
.wn-other:active{background:var(--bg3)}
.wn-other-title{font-size:13px;font-weight:500}
.wn-other-meta{font-size:11px;color:var(--text3);margin-top:2px}

/* RESCUE */
.rescue-box{text-align:center;padding:20px 16px 16px}
.rescue-count{font-size:42px;font-weight:900}
.rescue-sub{font-size:14px;color:var(--text2);margin-top:6px}
.rescue-item{display:flex;align-items:center;gap:14px;padding:13px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rsm);margin-bottom:5px}
.rescue-num{width:28px;height:28px;border-radius:50%;background:var(--purple);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;color:white}
.rescue-info{flex:1}
.rescue-title{font-size:14px;font-weight:500}
.rescue-meta{font-size:11px;color:var(--text3);margin-top:2px}
.rescue-start{padding:7px 12px;background:var(--purple);color:white;border-radius:6px;font-size:11px;font-weight:700;touch-action:manipulation}
.rescue-start:active{opacity:.8}
.rescue-more{margin:4px 0;padding:12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rsm);text-align:center;font-size:12px;color:var(--text2);touch-action:manipulation;width:100%}

/* BRAIN DUMP */
.brain-wrap{padding:12px 16px}
.brain-ta{width:100%;min-height:200px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);padding:14px;color:var(--text);font-size:14px;font-family:inherit;line-height:1.6;resize:none;outline:none}
.brain-ta:focus{border-color:var(--purple)}
.brain-count{text-align:right;font-size:10px;color:var(--text3);margin-top:4px}
.brain-create{display:block;width:100%;padding:14px;background:var(--purple);border-radius:var(--rsm);text-align:center;font-size:14px;font-weight:700;color:white;margin-top:8px;touch-action:manipulation;box-shadow:0 0 16px rgba(128,96,208,.3)}
.brain-create:active{opacity:.85}
.brain-prev-item{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rsm);margin-bottom:5px}
.brain-dot{width:6px;height:6px;border-radius:50%;background:var(--purple);flex-shrink:0}

/* TIMER */
.timer-screen{position:fixed;inset:0;background:var(--bg);z-index:150;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.timer-screen.open{transform:translateY(0)}
.timer-task{font-size:18px;font-weight:700;margin-bottom:40px}
.timer-time{font-size:64px;font-weight:200;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-bottom:40px}
.timer-btns{display:flex;gap:12px;width:100%}
.timer-btn{flex:1;padding:14px;border-radius:var(--rsm);font-size:14px;font-weight:700;touch-action:manipulation;text-align:center;border:none}
.timer-btn:active{opacity:.75}
.timer-pause-btn{background:var(--bg3);border:1px solid var(--border2)!important;color:var(--text)}
.timer-done-btn{background:var(--green);color:white}

/* DONE */
.done-screen{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;opacity:0;pointer-events:none;transition:opacity .3s}
.done-screen.open{opacity:1;pointer-events:auto}
.done-check{font-size:60px;margin-bottom:16px}
.done-lbl{font-size:14px;font-weight:700;letter-spacing:.12em;color:var(--green);text-transform:uppercase}
.done-task{font-size:22px;font-weight:700;margin-top:10px;margin-bottom:28px;color:var(--text2)}
.done-next-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px;text-align:left;margin-bottom:10px;touch-action:manipulation;width:100%;display:block}
.done-next-card:active{border-color:var(--purple)}
.done-next-title{font-size:16px;font-weight:600}
.done-next-meta{font-size:12px;color:var(--text3);margin-top:4px}
.done-return{padding:12px;text-align:center;font-size:13px;color:var(--text3);touch-action:manipulation;width:100%}
.done-return:active{opacity:.7}

/* PLANNER */
.cal-hd{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.cal-hd h2{font-size:16px;font-weight:700}
.cal-nav{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--text2)}
.cal-arrow{font-size:18px;color:var(--text3);touch-action:manipulation;padding:4px}
.cal-grid-wrap{padding:12px 16px}
.cal-wdays{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px}
.cal-wday{text-align:center;font-size:10px;font-weight:600;color:var(--text3);padding:4px 0}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:50%;font-size:13px;touch-action:manipulation;position:relative;background:transparent;border:none;color:var(--text)}
.cal-day:active{background:var(--bg3)}
.cal-day.today{background:var(--purple);color:white;font-weight:700}
.cal-day.selday:not(.today){background:var(--bg3);border:1px solid var(--purple)}
.cal-day.othermonth{color:var(--text3)}
.cal-dot{width:3px;height:3px;border-radius:50%;background:var(--red);position:absolute;bottom:4px}
.cal-events{padding:0 16px 16px}
.cal-ev-date{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;margin:10px 0}
.cal-ev{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.cal-ev-dur{font-size:11px;color:var(--text3);width:38px;flex-shrink:0;padding-top:1px}
.cal-ev-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:3px}
.cal-ev-info{flex:1}
.cal-ev-title{font-size:13px;font-weight:500}
.cal-ev-cat{font-size:11px;color:var(--text3);margin-top:2px}

/* MEHR */
.mehr-sec{padding:8px 16px 0}
.mehr-sec-lbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:10px 0 6px}
.mehr-item{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--border);touch-action:manipulation;width:100%;text-align:left;background:transparent}
.mehr-item:last-child{border-bottom:none}
.mehr-item:active{opacity:.7}
.mehr-icon{font-size:20px;width:28px;text-align:center}
.mehr-info{flex:1}
.mehr-title{font-size:14px}
.mehr-sub{font-size:11px;color:var(--text3);margin-top:2px}
.mehr-arrow{font-size:14px;color:var(--text3)}

/* OVERDUE */
.overdue-tag{color:var(--red);font-size:10px;font-weight:700}

/* ONE THING (Spec §16) */
.onething{position:fixed;inset:0;background:var(--bg);z-index:140;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:36px 28px;opacity:0;pointer-events:none;transition:opacity .25s}
.onething.open{opacity:1;pointer-events:auto}
.ot-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--text2);touch-action:manipulation}
.ot-eyebrow{font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--text3);text-transform:uppercase;margin-bottom:26px}
.ot-icon{font-size:44px;margin-bottom:10px}
.ot-jetzt{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.ot-title{font-size:26px;font-weight:800;line-height:1.15;margin-bottom:20px}
.ot-meta{display:flex;gap:18px;justify-content:center;margin-bottom:30px;color:var(--text2);font-size:14px}
.ot-next{margin-top:26px;padding:14px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);text-align:left;width:100%}
.ot-next-lbl{font-size:10px;color:var(--text3);margin-bottom:6px}
.ot-next-title{font-size:13px;font-weight:500;color:var(--text2)}
.ot-hint{font-size:11px;color:var(--text3);margin-top:16px}
/* MISC */
::-webkit-scrollbar{width:2px}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}
</style>
</head>

    </button>

      <button class="qp-btn" id="qp1" onclick="selectQP(1)"><div class="qp-icon">⚡</div><div class="qp-lbl">Dringend + Wichtig</div></button>

  <!-- PLANNER -->
  <div class="screen" id="screen-planner">
    <div class="cal-hd">
      <h2>Planer</h2>
      <div class="cal-nav">
        <button class="cal-arrow" onclick="changeMonth(-1)">‹</button>
        <span id="cal-month-label"></span>

      </div>

        <div class="cal-wday">Do</div><div class="cal-wday">Fr</div><div class="cal-wday">Sa</div><div class="cal-wday">So</div>

  <!-- MEHR -->
  <div class="screen" id="screen-mehr">
    <div class="mehr-sec">
      <div class="mehr-sec-lbl">Modi</div>
      <button class="mehr-item" onclick="openSheet('whatnow')"><div class="mehr-icon">⚡</div><div class="mehr-info"><div class="mehr-title">What Now?</div><div class="mehr-sub">Beste nächste Aufgabe</div></div><div class="mehr-arrow">›</div></button>
      <button class="mehr-item" onclick="openSheet('rescue')"><div class="mehr-icon">🛟</div><div class="mehr-info"><div class="mehr-title">Rescue Mode</div><div class="mehr-sub">Schritt für Schritt</div></div><div class="mehr-arrow">›</div></button>
      <button class="mehr-item" onclick="openSheet('braindump')"><div class="mehr-icon">🧠</div><div class="mehr-info"><div class="mehr-title">Brain Dump</div><div class="mehr-sub">Alles rausschreiben</div></div><div class="mehr-arrow">›</div></button>

<script>
const STORE = 'focus_v3';
let tasks = [];
try { tasks = JSON.parse(localStorage.getItem(STORE)||'[]'); } catch(e){}

const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const daysLeft = t => { if(!t.deadline) return null; const dl=new Date(t.deadline); dl.setHours(0,0,0,0); return Math.round((dl-today())/86400000); };
const isOverdue = t => { const d=daysLeft(t); return d!==null && d<0; };
const isToday = t => daysLeft(t)===0;
const isUrgent = t => { const d=daysLeft(t); return d!==null && d<=3; };
const getQ = t => { const u=isUrgent(t)||isOverdue(t); return t.important?(u?1:3):(u?2:4); };
const score = t => {
  let s=[100,50,40,5][getQ(t)-1];
  if(isOverdue(t)) s+=50;
  const d=daysLeft(t);
  if(d===0) s+=40; else if(d===1) s+=25; else if(d!==null&&d<=3) s+=15;
  if(t.dur&&t.dur<10) s+=10; else if(t.dur&&t.dur<20) s+=5;
  return s;
};
const saveTasks = () => localStorage.setItem(STORE, JSON.stringify(tasks));
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmtDur = m => (m==null||!isFinite(m))?'':(m<60?m+' min':Math.floor(m/60)+'h'+(m%60?' '+(m%60)+'min':''));
const fmtDL = t => {
  const d=daysLeft(t);
  if(d===null) return '';
  if(d<0) return Math.abs(d)+'d überfällig';
  if(d===0) return 'Heute'; if(d===1) return 'Morgen';
  if(d<=7) return 'in '+d+' Tagen';
  return new Date(t.deadline).toLocaleDateString('de-DE',{day:'numeric',month:'short'});
};
const qColors = ['','var(--red)','var(--amber)','#5090e0','var(--text3)'];

// NAV
let currentScreen='matrix';
function navTo(s){
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.nav .nav-tab').forEach(x=>x.classList.remove('active'));
  document.getElementById('screen-'+s).classList.add('active');
  const n=document.getElementById('nav-'+s); if(n) n.classList.add('active');
  currentScreen=s;
  const tb=document.getElementById('topbar');
  if(s==='add'){ tb.style.display='none'; resetForm(); }
  else { tb.style.display=''; }
  if(s==='heute') renderToday();
  if(s==='planner') renderCal();
  if(s==='matrix') renderMatrix();
}

// MATRIX
function renderMatrix(){
  const grid=document.getElementById('matrix-grid');
  const active=tasks.filter(t=>t.status==='active');
  const QUADS=[
    {n:1,cls:'q1',icon:'⚡',label:'DRINGEND + WICHTIG',action:'DO NOW'},
    {n:2,cls:'q2',icon:'🔶',label:'DRINGEND + UNWICHTIG',action:'QUICK / DELEGATE'},
    {n:3,cls:'q3',icon:'◎',label:'NICHT DRINGEND + WICHTIG',action:'PLAN'},
    {n:4,cls:'q4',icon:'·',label:'NICHT DRINGEND + UNWICHTIG',action:'LATER / MAYBE'},
  ];
  grid.innerHTML=QUADS.map(q=>{
    const qt=active.filter(t=>getQ(t)===q.n);
    return `<div class="quadrant ${q.cls}" data-q="${q.n}" id="quad${q.n}">
      <div class="q-hd">
        <div class="q-hd-top"><span class="q-icon">${q.icon}</span><span class="q-badge">${qt.length}</span></div>
        <div class="q-label">${q.label}</div>
      </div>
      <div class="q-tasks" id="qt${q.n}">
        ${qt.length?qt.slice(0,4).map(t=>`<button class="task-card" data-id="${t.id}" onclick="openTaskDetail('${t.id}')">
          <div class="tc-title">${esc(t.title)}${isOverdue(t)?' <span class="overdue-tag">!</span>':''}</div>
          <div class="tc-meta"><div class="tc-dot"></div>${[fmtDL(t),t.dur?fmtDur(t.dur):''].filter(Boolean).join(' · ')}</div>
        </button>`).join(''):'<div class="empty-q">Leer</div>'}
        ${qt.length>4?`<div class="empty-q">+${qt.length-4} weitere</div>`:''}
      </div>
      <button class="q-action-btn" onclick="qAction(${q.n})">${q.action}</button>
    </div>`;
  }).join('');
  // Drag
  document.querySelectorAll('.task-card[data-id]').forEach(setupDrag);
  document.querySelectorAll('.quadrant').forEach(el=>{
    el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drag-over');});
    el.addEventListener('dragleave',()=>el.classList.remove('drag-over'));
    el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('drag-over');handleDrop(+el.dataset.q);});
  });
}

function qAction(n){ if(n===1)openSheet('whatnow'); else if(n===3)navTo('planner'); else navTo('heute'); }

// DRAG
let dragTask=null, ghostEl=null, dragOverQ=null;
function setupDrag(card){
  card.setAttribute('draggable','true');
  card.addEventListener('dragstart',e=>{dragTask=tasks.find(t=>t.id===card.dataset.id);card.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
  card.addEventListener('dragend',()=>{card.classList.remove('dragging');dragTask=null;});
  let lp=null,isDrag=false,sx,sy;
  card.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;lp=setTimeout(()=>{isDrag=true;dragTask=tasks.find(t=>t.id===card.dataset.id);card.classList.add('dragging');makeGhost(card,e.touches[0]);navigator.vibrate&&navigator.vibrate(25);},400);},{passive:true});
  card.addEventListener('touchmove',e=>{
    if(!isDrag){if(Math.abs(e.touches[0].clientX-sx)>10||Math.abs(e.touches[0].clientY-sy)>10)clearTimeout(lp);return;}
    e.preventDefault();moveGhost(e.touches[0]);
    document.querySelectorAll('.quadrant').forEach(q=>q.classList.remove('drag-over'));
    const el=document.elementFromPoint(e.touches[0].clientX,e.touches[0].clientY);
    const q=el&&el.closest('.quadrant');
    if(q){q.classList.add('drag-over');dragOverQ=+q.dataset.q;}else dragOverQ=null;
  },{passive:false});
  card.addEventListener('touchend',()=>{clearTimeout(lp);if(isDrag){removeGhost();card.classList.remove('dragging');document.querySelectorAll('.quadrant').forEach(q=>q.classList.remove('drag-over'));if(dragOverQ)handleDrop(dragOverQ);isDrag=false;dragTask=null;dragOverQ=null;}});
}
function makeGhost(card,t){ghostEl=card.cloneNode(true);ghostEl.classList.add('ghost');ghostEl.classList.remove('task-card');ghostEl.style.cssText+=`;left:${t.clientX-80}px;top:${t.clientY-30}px`;document.body.appendChild(ghostEl);}
function moveGhost(t){if(ghostEl){ghostEl.style.left=(t.clientX-80)+'px';ghostEl.style.top=(t.clientY-30)+'px';}}
function removeGhost(){if(ghostEl){ghostEl.remove();ghostEl=null;}}
function handleDrop(tq){
  if(!dragTask)return;
  if(tq===1||tq===3)dragTask.important=true;
  if(tq===2||tq===4)dragTask.important=false;
  if((tq===1||tq===2)&&!isUrgent(dragTask))dragTask.deadline=today().toISOString();
  else if((tq===3||tq===4)&&isUrgent(dragTask)){const d=new Date(today());d.setDate(d.getDate()+7);dragTask.deadline=d.toISOString();}
  saveTasks();renderMatrix();
}

// HEUTE
function renderToday(){
  const active=tasks.filter(t=>t.status==='active').sort((a,b)=>score(b)-score(a));
  const overdue=active.filter(isOverdue);
  const tod=active.filter(t=>isToday(t)&&!isOverdue(t));
  const opt=active.filter(t=>!isOverdue(t)&&!isToday(t)&&t.important).slice(0,3);
  let h='';
  if(overdue.length) h+=`<div class="sec-label" style="color:var(--red)">⚠ ÜBERFÄLLIG</div>`+overdue.map(t=>todayCard(t,qColors[getQ(t)])).join('');
  if(tod.length) h+=`<div class="sec-label" style="margin-top:12px">HEUTE</div>`+tod.map(t=>todayCard(t,qColors[getQ(t)])).join('');
  if(opt.length) h+=`<div class="sec-label" style="margin-top:12px">OPTIONAL</div>`+opt.map(t=>todayCard(t,'var(--text3)')).join('');
  if(!h) h=`<div style="text-align:center;padding:40px 20px;color:var(--text3)"><div style="font-size:40px;margin-bottom:12px">✓</div>Alles erledigt für heute.</div>`;
  document.getElementById('today-content').innerHTML=h;
}
function todayCard(t,color){
  return `<button class="today-card" onclick="openTaskDetail('${t.id}')">
    <div class="today-dot" style="background:${color}"></div>
    <div class="today-info"><div class="today-title">${esc(t.title)}</div><div class="today-meta">${[fmtDur(t.dur),fmtDL(t)].filter(Boolean).join(' · ')}</div></div>
    <button class="start-btn" onclick="event.stopPropagation();startTask('${t.id}')">START</button>
  </button>`;
}

// ADD FORM
let nw={};let selQP=3;let editId=null;
function resetForm(){
  editId=null;
  document.querySelector('#screen-add .topbar-local h2').textContent='Neue Aufgabe';
  nw={important:true,deadline:null,dur:null,cat:null,rec:null};selQP=3;
  document.getElementById('task-title-input').value='';
  document.getElementById('task-notes').value='';
  setFieldDisplay('deadline','Kein Datum',true);
  setFieldDisplay('repeat','Keine',true);
  setFieldDisplay('duration','–',true);
  setFieldDisplay('category','Keine',true);
  setFieldDisplay('importance','Wichtig',false);
  updateQP();
  document.getElementById('save-btn').className='save off';
}
function setFieldDisplay(id,val,dim){const el=document.getElementById('field-'+id);el.textContent=val;el.className=dim?'ff-val dim':'ff-val';}
function onTitleInput(){const v=document.getElementById('task-title-input').value.trim();document.getElementById('save-btn').className=v?'save':'save off';}
function selectQP(n){selQP=n;nw.important=(n===1||n===3);if((n===1||n===2)&&!nw.deadline){nw.deadline=today().toISOString();setFieldDisplay('deadline','Heute',false);}updateQP();}
function updateQP(){[1,2,3,4].forEach(n=>{document.getElementById('qp'+n).className='qp-btn'+(selQP===n?' sel'+n:'');});}
function saveTask(){
  const title=document.getElementById('task-title-input').value.trim();
  if(!title)return;
  const notes=document.getElementById('task-notes').value.trim();
  if(editId){
    const t=tasks.find(x=>x.id===editId);
    if(t) Object.assign(t,{title,important:nw.important!==false,deadline:nw.deadline||null,dur:nw.dur||null,cat:nw.cat||null,rec:nw.rec||null,notes});
  } else {
    tasks.push({id:Date.now()+'',title,important:nw.important!==false,deadline:nw.deadline||null,dur:nw.dur||null,cat:nw.cat||null,notes,status:'active',rec:nw.rec||null,created:new Date().toISOString(),completed:null});
  }
  editId=null; saveTasks(); navTo('matrix');
}


function editTask(id){
  const t=tasks.find(x=>x.id===id); if(!t) return;
  closeSheet(); navTo('add');
  editId=id;
  document.querySelector('#screen-add .topbar-local h2').textContent='Aufgabe bearbeiten';
  nw={important:t.important,deadline:t.deadline,dur:t.dur,cat:t.cat,rec:t.rec};
  document.getElementById('task-title-input').value=t.title;
  document.getElementById('task-notes').value=t.notes||'';
  setFieldDisplay('deadline',t.deadline?fmtDL(t):'Kein Datum',!t.deadline);
  setFieldDisplay('repeat',t.rec||'Keine',!t.rec);
  setFieldDisplay('duration',t.dur?fmtDur(t.dur):'–',!t.dur);
  setFieldDisplay('category',t.cat||'Keine',!t.cat);
  setFieldDisplay('importance',t.important?'Wichtig':'Nicht wichtig',false);
  selQP=getQ(t); updateQP();
  document.getElementById('save-btn').className='save';
}

// MODAL (field picker)
const DL_OPTS=[{l:'Kein Datum',v:null},{l:'Heute',v:0},{l:'Morgen',v:1},{l:'In 3 Tagen',v:3},{l:'Diese Woche',v:5},{l:'Nächste Woche',v:7},{l:'In 14 Tagen',v:14},{l:'In einem Monat',v:30}];
const REC_OPTS=['Keine','Täglich','Werktags','Wöchentlich','Alle 2 Wochen','Monatlich','Jährlich'];
const DUR_OPTS=[null,5,10,15,20,30,45,60,90,120];
const CAT_OPTS=['Keine','Privat','Arbeit','Finanzen','Musik','Projekt','Haushalt','Gesundheit'];

let _opts=[];
function openModal(type){
  _opts=[];
  let h='<div class="sheet-title">';
  const row=(label,selected,fn)=>{
    const i=_opts.push(fn)-1;
    return `<button class="sheet-opt${selected?' sel':''}" onclick="_opts[${i}]()">${label}</button>`;
  };
  if(type==='deadline'){
    h+='Deadline</div>';
    h+=DL_OPTS.map(o=>{
      const dl=o.v!==null?(()=>{const d=new Date(today());d.setDate(d.getDate()+o.v);return d.toISOString();})():null;
      const sel=(!nw.deadline&&o.v===null)||(nw.deadline===dl);
      return row(o.l,sel,()=>setDL(dl,o.l));
    }).join('');
  } else if(type==='repeat'){
    h+='Wiederholung</div>';
    h+=REC_OPTS.map((o,i)=>{
      const v=i===0?null:o.toLowerCase().replace(/ /g,'_');
      return row(o,(!nw.rec&&i===0)||(nw.rec===v),()=>setRec(v,o));
    }).join('');
  } else if(type==='duration'){
    h+='Dauer</div>';
    h+=DUR_OPTS.map(d=>{
      const l=d===null?'–':fmtDur(d);
      return row(l,nw.dur===d,()=>setDur(d,l));
    }).join('');
  } else if(type==='category'){
    h+='Kategorie</div>';
    h+=CAT_OPTS.map(cat=>{
      const v=cat==='Keine'?null:cat;
      return row(cat,(cat==='Keine'&&!nw.cat)||(nw.cat===v),()=>setCat(v,cat));
    }).join('');
  } else if(type==='importance'){
    h+='Wichtigkeit</div>';
    h+=[['Wichtig',true],['Nicht wichtig',false]].map(([l,v])=>
      row(l,nw.important===v,()=>setImp(v,l))).join('');
  }
  h+=`<button class="sheet-cancel" onclick="closeSheet()">Abbrechen</button>`;
  openSheet('_modal',h);
}
function setDL(v,l){nw.deadline=v;setFieldDisplay('deadline',l,!v);closeSheet();}
function setRec(v,l){nw.rec=v;setFieldDisplay('repeat',l,!v);closeSheet();}
function setDur(v,l){nw.dur=v;setFieldDisplay('duration',l,!v);closeSheet();}
function setCat(v,l){nw.cat=v;setFieldDisplay('category',l,!v);closeSheet();}
function setImp(v,l){nw.important=v;setFieldDisplay('importance',l,false);closeSheet();}

// SHEET ENGINE
let sheetOpen=false;
function openSheet(type, html){
  const bd=document.getElementById('sheet-backdrop');
  const sc=document.getElementById('sheet-content');
  if(type==='_modal'){ sc.innerHTML=html; bd.classList.add('open'); return; }
  if(type==='whatnow') sc.innerHTML=renderWhatNow();
  else if(type==='rescue') sc.innerHTML=renderRescue();
  else if(type==='braindump') sc.innerHTML=renderBrainDump();
  else if(type==='taskdetail') sc.innerHTML=html;
  else if(type==='snooze') sc.innerHTML=html;
  bd.classList.add('open');
  sheetOpen=true;
}
function closeSheet(e){
  if(e&&e.target!==document.getElementById('sheet-backdrop'))return;
  document.getElementById('sheet-backdrop').classList.remove('open');
  sheetOpen=false;
}

// WHAT NOW
function renderWhatNow(){
  const active=tasks.filter(t=>t.status==='active').sort((a,b)=>score(b)-score(a));
  if(!active.length) return '<div style="text-align:center;padding:24px;color:var(--text2)"><div style="font-size:40px;margin-bottom:12px">✓</div>Keine offenen Aufgaben.</div>';
  const best=active[0]; const others=active.slice(1,4); const q=getQ(best);
  const badge=q<=2?'<div class="wn-qbadge urgent">⚡ Jetzt</div>':'<div class="wn-qbadge plan">◎ Geplant</div>';
  return `<div class="wn-hero"><h1>What Now?</h1><p>Wir finden für dich die nächste beste Aufgabe.</p></div>
  <div class="wn-card"><div class="wn-card-inner">
    ${badge}
    <div class="wn-task-title">${esc(best.title)}</div>
    <div class="wn-meta">${[best.dur?'⏱ '+fmtDur(best.dur):'',best.deadline?'📅 '+fmtDL(best):''].filter(Boolean).join('<span style="margin:0 2px">·</span>')}</div>
    <button class="big-btn ${q<=2?'btn-red':'btn-purple'}" onclick="startTask('${best.id}');closeSheet()">START</button>
  </div></div>
  ${others.length?`<div class="wn-others"><div class="wn-others-label">Andere Vorschläge</div>${others.map(t=>`<button class="wn-other" onclick="startTask('${t.id}');closeSheet()"><div><div class="wn-other-title">${esc(t.title)}</div><div class="wn-other-meta">${[t.dur?fmtDur(t.dur):'',fmtDL(t)].filter(Boolean).join(' · ')}</div></div><span style="color:var(--text3)">›</span></button>`).join('')}</div>`:''}`;
}

// RESCUE
function renderRescue(){
  const active=tasks.filter(t=>t.status==='active').sort((a,b)=>score(b)-score(a));
  const top=active.slice(0,3);
  return `<div class="rescue-box">
    <div style="font-size:40px;margin-bottom:8px">🛟</div>
    <div class="rescue-count">${active.length}</div>
    <div class="rescue-sub">Aufgaben offen.<br>Wir machen das jetzt einfach.</div>
  </div>
  <div style="padding:0 0 8px">
    ${top.map((t,i)=>`<div class="rescue-item"><div class="rescue-num">${i+1}</div><div class="rescue-info"><div class="rescue-title">${esc(t.title)}</div><div class="rescue-meta">${t.dur?fmtDur(t.dur):''}</div></div><button class="rescue-start" onclick="startTask('${t.id}');closeSheet()">START</button></div>`).join('')}
    ${active.length>3?`<button class="rescue-more" onclick="document.getElementById('rescue-rest').style.display='block';this.style.display='none'">Alle anzeigen (${active.length})</button><div id="rescue-rest" style="display:none">${active.slice(3).map((t,i)=>`<div class="rescue-item"><div class="rescue-num">${i+4}</div><div class="rescue-info"><div class="rescue-title">${esc(t.title)}</div><div class="rescue-meta">${t.dur?fmtDur(t.dur):''}</div></div><button class="rescue-start" onclick="startTask('${t.id}');closeSheet()">START</button></div>`).join('')}</div>`:''}
  </div>`;
}

// BRAIN DUMP
function renderBrainDump(){
  return `<h2 style="font-size:18px;font-weight:700;margin-bottom:6px">Brain Dump</h2>
  <p style="font-size:13px;color:var(--text2);margin-bottom:14px">Was musst du gerade alles machen?</p>
  <div class="brain-wrap" style="padding:0">
    <textarea class="brain-ta" id="brain-ta" placeholder="Rechnung bezahlen&#10;Album fertig machen&#10;Mutter anrufen&#10;..." oninput="updateBrain()"></textarea>
    <div class="brain-count"><span id="brain-cnt">0</span>/1000</div>
    <button class="brain-create" onclick="createBrainTasks()">Aufgaben erstellen</button>
    <div id="brain-prev" style="margin-top:12px"></div>
  </div>`;
}
function updateBrain(){
  const v=document.getElementById('brain-ta').value;
  document.getElementById('brain-cnt').textContent=v.length;
  const lines=v.split('\n').map(l=>l.trim()).filter(Boolean);
  document.getElementById('brain-prev').innerHTML=lines.length?lines.map(l=>`<div class="brain-prev-item"><div class="brain-dot"></div><div style="font-size:13px">${esc(l)}</div></div>`).join(''):'';
}
function createBrainTasks(){
  const v=document.getElementById('brain-ta').value;
  const lines=v.split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lines.length)return;
  lines.forEach(l=>tasks.push({id:Date.now()+''+Math.random().toString(36).slice(2,5),title:l,important:true,deadline:null,dur:null,cat:null,notes:'',status:'active',rec:null,created:new Date().toISOString(),completed:null}));
  saveTasks();closeSheet();renderMatrix();
}

// TASK DETAIL
function openTaskDetail(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  const q=getQ(t);
  const h=`<div class="detail-title">${esc(t.title)}</div>
  <div class="detail-badge" style="background:${qColors[q]}22;color:${qColors[q]};border:1px solid ${qColors[q]}44">${['','Dringend + Wichtig','Dringend + Unwichtig','Nicht dringend + Wichtig','Nicht dringend + Unwichtig'][q]}</div>
  ${t.deadline?`<div class="detail-row"><div class="detail-row-icon">📅</div><div class="detail-row-label">Deadline</div><div class="detail-row-val">${fmtDL(t)}</div></div>`:''}
  ${t.dur?`<div class="detail-row"><div class="detail-row-icon">⏱</div><div class="detail-row-label">Dauer</div><div class="detail-row-val">${fmtDur(t.dur)}</div></div>`:''}
  ${t.rec?`<div class="detail-row"><div class="detail-row-icon">🔁</div><div class="detail-row-label">Wiederholung</div><div class="detail-row-val">${t.rec}</div></div>`:''}
  ${t.cat?`<div class="detail-row"><div class="detail-row-icon">🏷</div><div class="detail-row-label">Kategorie</div><div class="detail-row-val">${t.cat}</div></div>`:''}
  ${t.notes?`<div class="detail-row"><div class="detail-row-icon">📝</div><div class="detail-row-label">Notiz</div><div class="detail-row-val">${esc(t.notes)}</div></div>`:''}
  <div class="detail-actions">
    <button class="detail-action primary" onclick="startTask('${t.id}');closeSheet()">▶ Start</button>
    <button class="detail-action" onclick="completeTask('${t.id}');closeSheet()">✓ Fertig</button>
  </div>
  <div class="detail-actions">
    <button class="detail-action" onclick="editTask('${t.id}')">✏️ Bearbeiten</button>
    <button class="detail-action" onclick="openSnooze('${t.id}')">😴 Snooze</button>
    <button class="detail-action danger" onclick="deleteTask('${t.id}')">🗑</button>
  </div>`;
  openSheet('taskdetail',h);
}
function deleteTask(id){if(!confirm('Löschen?'))return;tasks=tasks.filter(t=>t.id!==id);saveTasks();closeSheet();renderMatrix();if(currentScreen==='heute')renderToday();}
function openSnooze(id){
  _opts=[];
  const S=[['Heute Abend',0],['Morgen',1],['In 2 Tagen',2],['Nächste Woche',7]];
  const rows=S.map(([l,d])=>{
    const x=new Date(today());x.setDate(x.getDate()+d);
    const iso=x.toISOString();
    const i=_opts.push(()=>applySnooze(id,iso))-1;
    return `<button class="sheet-opt" onclick="_opts[${i}]()">${l}</button>`;
  }).join('');
  openSheet('snooze',`<div class="sheet-title">Snooze</div>${rows}<button class="sheet-cancel" onclick="closeSheet()">Abbrechen</button>`);
}
function applySnooze(id,dl){const t=tasks.find(x=>x.id===id);if(t){t.deadline=dl;saveTasks();renderMatrix();}closeSheet();}

// START / TIMER
let timerTask=null,timerSec=0,timerInt=null,timerRunning=false,otTask=null;

// Spec §16: START öffnet erst den reduzierten One-Thing-Screen
function startTask(id){
  const t=tasks.find(x=>x.id===id); if(!t) return;
  otTask=t; const q=getQ(t);
  document.getElementById('ot-icon').textContent=q<=2?'⚡':'◎';
  const jz=document.getElementById('ot-jetzt');
  jz.textContent=q<=2?'Jetzt':'Als nächstes';
  jz.style.color=qColors[q];
  document.getElementById('ot-title').textContent=t.title;
  document.getElementById('ot-meta').innerHTML=[
    t.dur?'⏱ '+fmtDur(t.dur):'', t.deadline?'📅 '+fmtDL(t):''
  ].filter(Boolean).map(s=>`<span>${s}</span>`).join('');
  document.getElementById('ot-start').onclick=()=>openTimer(t);
  const nx=tasks.filter(x=>x.status==='active'&&x.id!==t.id).sort((a,b)=>score(b)-score(a))[0];
  document.getElementById('ot-next-wrap').innerHTML = nx
    ? `<div class="ot-next"><div class="ot-next-lbl">Danach</div><div class="ot-next-title">${esc(nx.title)}</div><div class="ot-next-lbl" style="margin:3px 0 0">${[fmtDur(nx.dur),fmtDL(nx)].filter(Boolean).join(' · ')}</div></div>`
    : '';
  document.getElementById('onething').classList.add('open');
}
function closeOneThing(){document.getElementById('onething').classList.remove('open');otTask=null;}

function openTimer(t){
  closeOneThing();
  timerTask=t;timerSec=0;timerRunning=true;
  document.getElementById('timer-task-name').textContent=t.title;
  document.getElementById('timer-display').textContent='00:00';
  document.getElementById('timer-pause-btn').textContent='Pause';
  document.getElementById('timer-screen').classList.add('open');
  clearInterval(timerInt);
  timerInt=setInterval(()=>{if(timerRunning){timerSec++;const m=String(Math.floor(timerSec/60)).padStart(2,'0');const s=String(timerSec%60).padStart(2,'0');document.getElementById('timer-display').textContent=m+':'+s;}},1000);
}
function closeTimer(){clearInterval(timerInt);timerRunning=false;document.getElementById('timer-screen').classList.remove('open');timerTask=null;}
function togglePause(){timerRunning=!timerRunning;document.getElementById('timer-pause-btn').textContent=timerRunning?'Pause':'Weiter';}
function doneFromTimer(){clearInterval(timerInt);document.getElementById('timer-screen').classList.remove('open');if(timerTask)completeTask(timerTask.id);}
function completeTask(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  t.status='completed';t.completed=new Date().toISOString();
  if(t.rec){const nt={...t,id:Date.now()+'',status:'active',completed:null,created:new Date().toISOString()};const d=new Date(today());if(t.rec==='täglich')d.setDate(d.getDate()+1);else if(t.rec==='wöchentlich'||t.rec==='weekly')d.setDate(d.getDate()+7);else if(t.rec==='monatlich')d.setMonth(d.getMonth()+1);else d.setDate(d.getDate()+7);nt.deadline=d.toISOString();tasks.push(nt);}
  saveTasks();showDone(t);
}
function showDone(t){
  document.getElementById('done-task-name').textContent=t.title;
  const next=tasks.filter(x=>x.status==='active').sort((a,b)=>score(b)-score(a))[0];
  document.getElementById('done-next').innerHTML=next?`<div style="font-size:11px;color:var(--text3);margin-bottom:8px">WHAT NEXT?</div><button class="done-next-card" onclick="startTask('${next.id}');closeDone()"><div class="done-next-title">${esc(next.title)}</div><div class="done-next-meta">${[next.dur?fmtDur(next.dur):'',fmtDL(next)].filter(Boolean).join(' · ')}</div></button>`:'';
  document.getElementById('done-next').innerHTML+=`<button class="done-return" onclick="closeDone()">Zurück zur Matrix</button>`;
  document.getElementById('done-screen').classList.add('open');
  renderMatrix();if(currentScreen==='heute')renderToday();
}
function closeDone(){document.getElementById('done-screen').classList.remove('open');closeOneThing();}

// CALENDAR
let calY,calM,calD;
{const n=today();calY=n.getFullYear();calM=n.getMonth();calD=n.getDate();}
const MONTHS=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
function renderCal(){
  document.getElementById('cal-month-label').textContent=MONTHS[calM]+' '+calY;
  const first=new Date(calY,calM,1);
  let dow=first.getDay();dow=dow===0?6:dow-1;
  const dim=new Date(calY,calM+1,0).getDate();
  const prev=new Date(calY,calM,0).getDate();
  const n=today();const isTM=calY===n.getFullYear()&&calM===n.getMonth();
  const mt=tasks.filter(t=>{if(!t.deadline||t.status!=='active')return false;const d=new Date(t.deadline);return d.getFullYear()===calY&&d.getMonth()===calM;});
  const hasDot=new Set(mt.map(t=>new Date(t.deadline).getDate()));
  let h='';
  for(let i=0;i<dow;i++) h+=`<button class="cal-day othermonth" disabled>${prev-dow+i+1}</button>`;
  for(let d=1;d<=dim;d++){
    const iT=isTM&&d===n.getDate();const iS=d===calD&&!iT;
    h+=`<button class="cal-day${iT?' today':''}${iS?' selday':''}" onclick="selCalDay(${d})">${d}${hasDot.has(d)?'<div class="cal-dot"></div>':''}</button>`;
  }
  const rem=(dow+dim)%7;if(rem)for(let i=1;i<=7-rem;i++) h+=`<button class="cal-day othermonth" disabled>${i}</button>`;
  document.getElementById('cal-days').innerHTML=h;
  renderCalEvents();
}
function selCalDay(d){calD=d;renderCal();}
function changeMonth(dir){calM+=dir;if(calM<0){calM=11;calY--;}if(calM>11){calM=0;calY++;}renderCal();}
function renderCalEvents(){
  const sel=new Date(calY,calM,calD);sel.setHours(0,0,0,0);
  const dt=tasks.filter(t=>{if(!t.deadline||t.status!=='active')return false;const d=new Date(t.deadline);d.setHours(0,0,0,0);return d.getTime()===sel.getTime();}).sort((a,b)=>score(b)-score(a));
  const el=document.getElementById('cal-events');
  el.innerHTML=`<div class="cal-ev-date">${calD}. ${MONTHS[calM]}</div>`+(dt.length?dt.map(t=>`<div class="cal-ev"><div class="cal-ev-dur">${t.dur?fmtDur(t.dur):''}</div><div class="cal-ev-dot" style="background:${qColors[getQ(t)]}"></div><div class="cal-ev-info"><div class="cal-ev-title">${esc(t.title)}</div>${t.cat?`<div class="cal-ev-cat">${t.cat}</div>`:''}</div></div>`).join(''):'<div style="color:var(--text3);font-size:12px;padding:10px 0">Keine Aufgaben.</div>');
}

// INIT
renderMatrix();
</script>
