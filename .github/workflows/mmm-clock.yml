name: MMM Clock (macOS build)
on:
  push:
    paths: ['mmm-clock/**', '.github/workflows/mmm-clock.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: ./mmm-clock/build-app.sh
      - name: Zip
        run: cd mmm-clock && ditto -c -k --keepParent MMMClock.app MMMClock.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MMMClock-macOS
          path: mmm-clock/MMMClock.zip
