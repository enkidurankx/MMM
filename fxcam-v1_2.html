<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FX·Cam</title>
<style>
  /* FX·Cam v1.2 — metaframe / launcher for the live FX-camera apps on the MMM hub.
     v1.2: each channel carries its app's own accent colour (glyph in the top strip and
     grid; active tab underlined in that colour), keyed by slug so a hub refresh keeps it.
     v1.1: channel strip moved to the top (under the brand bar).
     Holds each tool in an <iframe allow="camera; microphone; fullscreen"> and swaps
     one at a time, so exactly one camera stream is ever live. Apps are matched to the
     live index.html by FILE SLUG, so version bumps and renames need no edit here. */
  :root{
    --bg:#0d0f12; --bg2:#16191e; --line:#262b31; --line2:#31373f;
    --ink:#e7ebee; --dim:#7f868c; --dim2:#5a6167;
    --accent:#3fe0d8; --accent2:#1f7a74; --rec:#ff3524;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);
            overflow:hidden;overscroll-behavior:none}
  body{display:flex;flex-direction:column}

  /* top strip */
  #top{display:flex;align-items:center;gap:11px;padding:11px 14px calc(11px) ;
       padding-top:calc(11px + env(safe-area-inset-top));
       border-bottom:1px solid var(--line);background:linear-gradient(var(--bg2),var(--bg))}
  #top .brand{font-family:var(--mono);font-size:13px;letter-spacing:.14em;color:var(--accent);
              text-shadow:0 0 8px rgba(63,224,216,.35)}
  #top .brand b{color:var(--dim);font-weight:400}
  #top .now{margin-left:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;
            text-transform:uppercase;color:var(--dim)}
  #top .now b{color:var(--ink);font-weight:600}

  /* stage holds the active app iframe, or the launcher grid */
  #stage{position:relative;flex:1;min-height:0;background:#000}
  #frame{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000}

  /* launcher grid (shown until a channel is picked; picking nothing => no camera runs) */
  #grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
        background:var(--line);padding:1px;overflow:auto}
  @media (max-width:560px){ #grid{grid-template-columns:repeat(2,1fr)} }
  .cell{background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:10px;padding:26px 12px;cursor:pointer;transition:background .12s;min-height:120px}
  .cell:hover{background:#1c2026}
  .cell .g{font-size:34px;line-height:1;color:var(--accent);text-shadow:0 0 12px rgba(63,224,216,.3)}
  .cell .n{font-family:var(--mono);font-size:14px;letter-spacing:.06em;color:var(--ink)}
  .cell .v{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--dim2)}
  #grid .lead{grid-column:1/-1;background:var(--bg);padding:16px 16px 14px;border-bottom:1px solid var(--line)}
  #grid .lead h1{margin:0 0 4px;font-family:var(--mono);font-size:15px;letter-spacing:.1em;font-weight:500;color:var(--accent)}
  #grid .lead p{margin:0;font-size:12px;line-height:1.6;color:var(--dim)}

  /* channel strip — top, always available for direct switching */
  #tabs{display:flex;align-items:stretch;gap:0;border-bottom:1px solid var(--line);
        background:var(--bg2);overflow-x:auto;-webkit-overflow-scrolling:touch}
  #tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;min-width:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;
       gap:3px;padding:9px 12px;background:none;border:0;border-right:1px solid var(--line);
       color:var(--dim);font-family:var(--mono);cursor:pointer}
  .tab .g{font-size:17px;line-height:1}
  .tab .n{font-size:9.5px;letter-spacing:.06em}
  .tab.home{color:var(--dim2)}
  .tab.on{color:var(--accent);background:#12161a;box-shadow:inset 0 2px 0 var(--accent)}
  .tab:active{background:#12161a}
</style>
</head>
<body>

<div id="top">
  <span class="brand">FX<b>·</b>Cam</span>
  <span class="now" id="nowlbl">6 channels</span>
</div>

<nav id="tabs"><!-- filled by JS --></nav>

<div id="stage">
  <div id="grid"><!-- filled by JS --></div>
  <!-- iframe injected here on demand -->
</div>

<script>
(() => {
  // file-SLUG match => survives version bumps and renames. Order = display order.
  const SLUGS = ['chrom3','lvds1','buf1','roto5','crt4','trk4'];
  // each app's own signature accent (read from its CSS), keyed by slug so a hub refresh keeps it
  const ACCENT = { chrom3:'#c8351a', lvds1:'#ffb700', buf1:'#3fe0d8', roto5:'#28d7e6', crt4:'#33ff66', trk4:'#ffb000' };
  // fallback if index.html can't be read (e.g. opened off-hub); refreshed at runtime.
  let APPS = [
    { slug:'chrom3', name:'chrom.3', ver:'v2.4', sym:'⧉', file:'chrom3-v2_4.html', color:ACCENT.chrom3 },
    { slug:'lvds1',  name:'LCD.nx',  ver:'v2.2', sym:'☰', file:'lvds1-v2_2.html',  color:ACCENT.lvds1  },
    { slug:'buf1',   name:'bu.FFer', ver:'v1.3', sym:'⧖', file:'buf1-v1_3.html',   color:ACCENT.buf1   },
    { slug:'roto5',  name:'roto.5',  ver:'v1.0', sym:'⬡', file:'roto5-v1_0.html',  color:ACCENT.roto5  },
    { slug:'crt4',   name:'crt.4',   ver:'v1.0', sym:'◳', file:'crt4-v1_0.html',   color:ACCENT.crt4   },
    { slug:'trk4',   name:'trk.4',   ver:'v1.2', sym:'⌖', file:'trk4-v1_2.html',   color:ACCENT.trk4   },
  ];

  const stage  = document.getElementById('stage');
  const grid   = document.getElementById('grid');
  const tabs   = document.getElementById('tabs');
  const nowlbl = document.getElementById('nowlbl');
  let frame = null;
  let active = -1;

  // Only one app mounted at a time. Removing the iframe unloads its document,
  // which tears down its getUserMedia stream => the camera is released on switch.
  function unmount(){
    if (frame){ frame.src = 'about:blank'; frame.remove(); frame = null; }
  }
  function mount(app){
    unmount();
    frame = document.createElement('iframe');
    frame.id = 'frame';
    frame.allow = 'camera; microphone; fullscreen; autoplay';
    frame.setAttribute('allowfullscreen', '');
    frame.src = app.file;
    stage.appendChild(frame);
  }
  function select(i){
    active = i;
    const app = APPS[i];
    grid.style.display = 'none';
    mount(app);
    nowlbl.innerHTML = 'ch ' + String(i+1).padStart(2,'0') + ' · <b>' + app.name + '</b>';
    renderTabs();
  }
  function home(){
    active = -1;
    unmount();
    grid.style.display = 'grid';
    nowlbl.textContent = APPS.length + ' channels';
    renderTabs();
  }

  function renderGrid(){
    grid.innerHTML =
      '<div class="lead"><h1>FX·Cam</h1><p>Pick a channel. Each app runs on its own — tap its <b>Start camera</b> once it opens. Switching channels releases the camera and hands it to the next.</p></div>';
    APPS.forEach((a,i) => {
      const c = document.createElement('div');
      c.className = 'cell';
      c.innerHTML = '<div class="g">'+a.sym+'</div><div class="n">'+a.name+'</div><div class="v">'+(a.ver||'')+'</div>';
      c.querySelector('.g').style.color = a.color;
      c.addEventListener('click', () => select(i));
      grid.appendChild(c);
    });
  }
  function renderTabs(){
    tabs.innerHTML = '';
    const h = document.createElement('button');
    h.className = 'tab home' + (active === -1 ? ' on' : '');
    h.innerHTML = '<span class="g">⌂</span><span class="n">home</span>';
    h.addEventListener('click', home);
    tabs.appendChild(h);
    APPS.forEach((a,i) => {
      const on = active === i;
      const b = document.createElement('button');
      b.className = 'tab' + (on ? ' on' : '');
      b.innerHTML = '<span class="g">'+a.sym+'</span><span class="n">'+a.name+'</span>';
      const g = b.querySelector('.g'), n = b.querySelector('.n');
      g.style.color = a.color;                         // glyph always in the app's accent
      if (on){                                         // active: light the strip in that accent
        b.style.color = a.color; n.style.color = a.color;
        b.style.background = '#12161a';
        b.style.boxShadow = 'inset 0 2px 0 ' + a.color;
      }
      b.addEventListener('click', () => { if (i !== active) select(i); });
      tabs.appendChild(b);
    });
  }

  // Pull current filenames/names/glyphs from the live hub index, matched by slug.
  async function refreshFromHub(){
    try {
      const res = await fetch('index.html', { cache:'no-store' });
      if (!res.ok) return;
      const txt = await res.text();
      const re = /\{\s*file:\s*"([^"]+)"[\s\S]*?name:\s*"([^"]+)"[\s\S]*?ver:\s*"([^"]*)"[\s\S]*?sym:\s*"([^"]*)"[\s\S]*?group:\s*"([^"]*)"\s*\}/g;
      const found = {};
      let m;
      while ((m = re.exec(txt))){
        const [ , file, name, ver, sym ] = m;
        const slug = SLUGS.find(s => file.startsWith(s + '-') || file === s + '.html');
        if (slug) found[slug] = { slug, name, ver, sym, file, color: ACCENT[slug] };
      }
      const next = SLUGS.map(s => found[s]).filter(Boolean);
      if (next.length){ APPS = next; renderGrid(); if (active === -1) renderTabs(); }
    } catch(e){ /* off-hub or blocked — keep fallback list */ }
  }

  renderGrid();
  renderTabs();
  refreshFromHub();
})();
</script>
</body>
</html>
