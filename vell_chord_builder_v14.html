<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vell — Chord Builder</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Bebas+Neue&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

:root{
  --bg:#0c0c0e;
  --surface:#141418;
  --surface2:#1c1c22;
  --border:#26262e;
  --dim:#3a3a46;
  --text:#d4d4e0;
  --muted:#666680;
  --amber:#f0aa30;
  --amber2:#c07818;
  --amber-bg:#1e1408;
  --blue:#5090c8;
  --blue-bg:#0c1828;
  --green:#40a060;
  --green-bg:#081a10;
  --red:#c04040;
  --font:'DM Mono',monospace;
  --head:'Bebas Neue',sans-serif;
  --r:10px;
}

html{height:100%;background:var(--bg)}
body{
  height:100%;min-height:100vh;min-height:100dvh;
  background:var(--bg);color:var(--text);
  font-family:var(--font);font-size:14px;
  display:flex;flex-direction:column;
  overflow:hidden;
  user-select:none;
  -webkit-user-select:none;
}

/* ── HEADER ─────────────────────────────────── */
.hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px 10px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.hdr-title{font-family:var(--head);font-size:22px;letter-spacing:.08em;color:var(--amber)}
.hdr-sub{font-size:10px;color:var(--muted);letter-spacing:.1em;margin-top:1px}
.hdr-right{display:flex;gap:10px;align-items:center}
.export-btn{
  font-family:var(--head);font-size:16px;letter-spacing:.08em;
  background:var(--green-bg);border:1.5px solid var(--green);color:var(--green);
  border-radius:8px;padding:8px 16px;cursor:pointer;
  transition:background .15s;
}
.export-btn:active{background:#143020}
.export-btn:disabled{opacity:.35;pointer-events:none}

/* ── MAIN SCROLL CONTAINER ─────────────────── */
.scroll{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:0 0 120px;
  -webkit-overflow-scrolling:touch;
}

/* ── BUILDER PANEL ─────────────────────────── */
.section{padding:14px 16px;border-bottom:1px solid var(--border)}
.section-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}

/* Root picker */
.root-grid{
  display:grid;grid-template-columns:repeat(6,1fr);gap:6px;
}
.root-btn{
  aspect-ratio:1;border-radius:8px;
  background:var(--surface2);border:1.5px solid var(--border);
  color:var(--text);font-family:var(--head);font-size:18px;letter-spacing:.04em;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .1s,border-color .1s,color .1s;
  min-height:48px;
}
.root-btn:active{transform:scale(.94)}
.root-btn.selected{background:var(--amber-bg);border-color:var(--amber);color:var(--amber)}
.root-btn.black-note{color:var(--muted)}
.root-btn.black-note.selected{color:var(--amber)}

/* Quality picker */
.quality-grid{
  display:flex;flex-wrap:wrap;gap:7px;
}
.q-btn{
  border-radius:8px;padding:10px 14px;
  background:var(--surface2);border:1.5px solid var(--border);
  color:var(--text);font-family:var(--font);font-size:13px;font-weight:500;letter-spacing:.04em;
  cursor:pointer;white-space:nowrap;
  transition:background .1s,border-color .1s,color .1s;
  min-height:44px;display:flex;align-items:center;
}
.q-btn:active{transform:scale(.94)}
.q-btn.selected{background:var(--amber-bg);border-color:var(--amber);color:var(--amber)}

/* ── CURRENT CHORD DISPLAY ─────────────────── */
.current-chord{
  margin:0 16px;
  background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);
  padding:14px 16px;display:flex;align-items:center;gap:12px;
}
.cc-name{font-family:var(--head);font-size:42px;letter-spacing:.04em;color:var(--amber);flex:1;line-height:1}
.cc-notes{font-size:11px;color:var(--muted);letter-spacing:.05em;line-height:1.7}
.cc-quality{font-size:11px;color:var(--amber2);font-style:italic}
.play-btn{
  width:54px;height:54px;border-radius:50%;flex-shrink:0;
  background:var(--amber-bg);border:2px solid var(--amber);color:var(--amber);
  font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .1s,transform .1s;
  -webkit-tap-highlight-color:transparent;
}
.play-btn:active{background:#3a2808;transform:scale(.9)}
.play-btn.disabled{opacity:.3;pointer-events:none}
.add-chord-btn{
  width:100%;margin:12px 16px 0;width:calc(100% - 32px);
  background:var(--amber-bg);border:2px solid var(--amber);color:var(--amber);
  font-family:var(--head);font-size:20px;letter-spacing:.08em;
  border-radius:var(--r);padding:14px;cursor:pointer;
  transition:background .12s,transform .1s;display:block;
}
.add-chord-btn:active{background:#3a2808;transform:scale(.98)}
.add-chord-btn:disabled{opacity:.35;pointer-events:none}

/* ── KEYBOARD VISUAL ──────────────────────── */
.keyboard-section{padding:12px 16px}
.piano-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.piano{position:relative;height:90px;display:flex}
.wkey{
  position:relative;width:30px;height:90px;
  background:#ccccd4;border:1px solid #999;border-top:none;
  border-radius:0 0 4px 4px;flex-shrink:0;z-index:1;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px;
}
.wkey .klabel{font-size:8px;color:#888;font-family:var(--font);pointer-events:none}
.bkey{
  position:absolute;width:20px;height:56px;
  background:#181820;border:1px solid #000;
  border-top:none;border-radius:0 0 3px 3px;z-index:2;top:0;
}
.wkey.kplayed{background:var(--amber)!important}
.bkey.kplayed{background:var(--amber2)!important}
.wkey.ksugg1{background:#3a6a9a!important}.bkey.ksugg1{background:#1e3a5a!important}
.wkey.ksugg2{background:#38806a!important}.bkey.ksugg2{background:#1a3a30!important}

/* ── SUGGESTIONS ───────────────────────────── */
.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 16px}
.sugg-source{font-size:10px;color:var(--muted);letter-spacing:.07em;padding:0 16px 4px;font-style:italic}
.sugg-card{
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:8px;padding:7px 8px 6px;cursor:pointer;
  transition:border-color .12s,background .12s;
  display:flex;flex-direction:column;gap:2px;
  position:relative;
}
.sugg-card:active{background:var(--blue-bg)}
.sugg-card.s-active{border-color:var(--blue);background:var(--blue-bg)}
.sugg-label{font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sugg-name{font-family:var(--head);font-size:17px;color:var(--blue);letter-spacing:.04em;line-height:1}
.sugg-why{font-size:9px;color:var(--muted);font-style:italic;line-height:1.3}
.sugg-notes{font-size:9px;color:#2a5a78;letter-spacing:.02em}
.sugg-row{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.s-play-btn{
  width:28px;height:28px;border-radius:50%;
  background:var(--blue-bg);border:1.5px solid var(--blue);color:var(--blue);
  font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .1s;flex-shrink:0;
}
.s-play-btn:active{background:#142840}
.s-add-btn{
  font-family:var(--head);font-size:11px;letter-spacing:.06em;
  background:var(--blue-bg);border:1.5px solid var(--blue);color:var(--blue);
  border-radius:5px;padding:3px 8px;cursor:pointer;transition:background .1s;
}
.s-add-btn:active{background:#142840}

/* ── SEQUENCE ──────────────────────────────── */
.seq-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px 8px;
}
.seq-title{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.seq-header-btns{display:flex;gap:8px;align-items:center}
.clear-btn{
  font-family:var(--font);font-size:11px;letter-spacing:.06em;
  background:none;border:1px solid var(--red);color:var(--red);
  border-radius:6px;padding:5px 10px;cursor:pointer;transition:background .1s;
}
.clear-btn:active{background:#200808}

.seq-list{padding:0 16px;display:flex;flex-direction:column;gap:6px;min-height:60px}
.seq-empty{
  text-align:center;color:var(--muted);font-size:12px;
  letter-spacing:.06em;padding:20px;line-height:2;
}

.seq-item{
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:8px;display:flex;align-items:center;gap:8px;
  padding:9px 10px;
  transition:border-color .15s,background .15s;
  touch-action:pan-y;
}
.seq-item.playing{border-color:var(--amber);background:var(--amber-bg)}
.seq-item.editing{border-color:var(--green);background:var(--green-bg)}
.seq-num{font-size:11px;color:var(--muted);width:16px;text-align:right;flex-shrink:0}
.seq-name{font-family:var(--head);font-size:19px;color:var(--text);flex:1;letter-spacing:.04em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seq-item.playing .seq-name{color:var(--amber)}
.seq-item.editing .seq-name{color:var(--green)}
.seq-beats{
  font-family:var(--head);font-size:13px;color:var(--amber);
  background:var(--amber-bg);border:1px solid var(--amber2);
  border-radius:5px;padding:3px 4px;cursor:pointer;flex-shrink:0;
  white-space:nowrap;
  -webkit-appearance:none;appearance:none;
  outline:none;
}
.seq-beats:focus{border-color:var(--amber)}
.seq-btn{
  width:30px;height:30px;border-radius:6px;flex-shrink:0;
  background:none;border:1px solid var(--border);color:var(--muted);
  font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:border-color .1s,color .1s,background .1s;
}
.seq-btn:active{background:var(--surface2)}
.seq-btn.play-btn-seq:active{border-color:var(--amber);color:var(--amber)}
.seq-btn.dup-btn:active{border-color:var(--blue);color:var(--blue)}
.seq-btn.edit-btn:active{border-color:var(--green);color:var(--green)}
.seq-btn.del-btn:active{border-color:var(--red);color:var(--red)}
.seq-btn.up-btn:active,.seq-btn.dn-btn:active{border-color:var(--slate);color:var(--slate)}
.seq-reorder{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.seq-reorder .seq-btn{width:24px;height:22px;font-size:9px}

/* ── AUTOPLAY BAR — fixed footer ───────────── */
.autoplay-bar{
  position:fixed;bottom:0;left:0;right:0;
  display:flex;align-items:center;gap:10px;
  padding:10px 16px 12px;
  background:var(--surface);
  border-top:1px solid var(--border);
  z-index:100;
}
.autoplay-btn{
  width:46px;height:46px;border-radius:50%;flex-shrink:0;
  border:2px solid var(--green);background:var(--green-bg);color:var(--green);
  font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .12s,transform .1s;
}
.autoplay-btn:active{transform:scale(.92)}
.autoplay-btn.playing{border-color:var(--amber);background:var(--amber-bg);color:var(--amber)}
.bpm-group{display:flex;flex-direction:column;flex:1;gap:4px}
.bpm-top{display:flex;align-items:center;justify-content:space-between}
.bpm-label{font-size:10px;color:var(--muted);letter-spacing:.1em}
.bpm-val{font-family:var(--head);font-size:18px;color:var(--amber);letter-spacing:.04em}
input[type=range].bpm-slider{
  flex:1;accent-color:var(--amber);cursor:pointer;height:4px;
  -webkit-appearance:none;background:var(--surface2);border-radius:2px;
  width:100%;
}
input[type=range].bpm-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:var(--amber);cursor:pointer;
}
.bar-progress{
  height:3px;background:var(--surface2);border-radius:2px;overflow:hidden;
  margin-top:2px;
}
.bar-progress-fill{
  height:100%;background:var(--amber);border-radius:2px;width:0%;
  transition:width .05s linear;
}

/* Duration selector — kept for per-chord override */
.dur-row{
  padding:8px 16px 6px;display:flex;align-items:center;gap:10px;
}
.dur-label{font-size:10px;color:var(--muted);letter-spacing:.08em;white-space:nowrap}
input[type=range]{
  flex:1;accent-color:var(--amber);cursor:pointer;height:4px;
  -webkit-appearance:none;background:var(--surface2);border-radius:2px;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:var(--amber);cursor:pointer;
}
.dur-val{font-size:12px;color:var(--amber);width:38px;text-align:right;font-family:var(--head)}

/* ── GENERATOR + BASS ──────────────────────── */
.bass-row{display:flex;align-items:center;gap:10px;margin:10px 16px 0;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.bass-row select,.gen select{font-family:var(--font);font-size:12px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 8px;outline:none}
.gen{margin:16px 16px 0;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:12px 14px}
.gen-row{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:11px;color:var(--muted);letter-spacing:.06em}
.gen-row:first-of-type{margin-top:6px}
.gen-row .gl{width:76px;flex-shrink:0;text-transform:uppercase;letter-spacing:.1em}
.gen-row input[type=range]{flex:1;min-width:0;accent-color:var(--amber)}
.gen-ends{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);letter-spacing:.08em;margin:2px 0 0 86px}
.gen-seg{display:flex;gap:6px}
.gen-seg button{font-family:var(--head);font-size:16px;letter-spacing:.06em;min-width:40px;padding:5px 0;background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;cursor:pointer}
.gen-seg button.on{background:var(--amber-bg);border-color:var(--amber);color:var(--amber)}
.gen-btns{display:flex;gap:10px;margin-top:14px}
.gen-btns .gen-btn{margin-top:0;width:auto;flex:1}
.gen-btns .gen-btn.ext{flex:0 0 96px;background:none}
.gen-btn{width:100%;margin-top:14px;background:var(--amber-bg);border:2px solid var(--amber);color:var(--amber);font-family:var(--head);font-size:20px;letter-spacing:.08em;border-radius:var(--r);padding:12px;cursor:pointer;transition:background .12s,transform .1s}
.gen-btn:active{background:#3a2808;transform:scale(.98)}
.seq-btn.lock-btn.on{border-color:var(--amber);color:var(--amber)}
@media(max-width:430px){.seq-item{gap:5px;padding:8px}.seq-btn{width:27px;height:27px}.seq-name{font-size:17px}.seq-beats{padding:3px 2px}.seq-num{width:12px}}
.seq-item.locked{border-color:var(--amber2)}
.sugg-head{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 0}
.sugg-re{font-family:var(--font);font-size:12px;background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:4px 10px;cursor:pointer}
.sugg-re:active{border-color:var(--amber);color:var(--amber)}

/* ── FLASH ANIMATION ───────────────────────── */
@keyframes flash{0%{opacity:1}50%{opacity:.4}100%{opacity:1}}
.flash{animation:flash .25s ease}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <div class="hdr-title">VELL</div>
    <div class="hdr-sub">CHORD BUILDER</div>
  </div>
  <div class="hdr-right">
    <button class="export-btn" id="export-btn" onclick="exportMidi()" disabled>EXPORT MIDI</button>
  </div>
</div>

<div class="scroll" id="scroll">

  <!-- Root picker -->
  <div class="section">
    <div class="section-label">Root</div>
    <div class="root-grid" id="root-grid"></div>
  </div>

  <!-- Quality picker -->
  <div class="section">
    <div class="section-label">Quality</div>
    <div class="quality-grid" id="quality-grid"></div>
  </div>

  <!-- Current chord display -->
  <div style="margin-top:14px">
    <div class="current-chord" id="current-chord-display">
      <div style="flex:1">
        <div class="cc-name" id="cc-name">—</div>
        <div class="cc-notes" id="cc-notes">pick a root and quality</div>
        <div class="cc-quality" id="cc-quality"></div>
      </div>
      <button class="play-btn disabled" id="play-current" onclick="playCurrentChord()">▶</button>
    </div>
    <div class="bass-row"><span>Bass</span><select id="bass-select" onchange="setBass(this.value)"></select></div>
    <button class="add-chord-btn" id="add-chord-btn" disabled onclick="addToSequence()">
      ADD TO SEQUENCE →
    </button>
  </div>

  <!-- Generator -->
  <div class="gen" id="gen">
    <div class="section-label">Generator</div>
    <div class="gen-row"><span class="gl">Length</span>
      <div class="gen-seg" id="gen-len"><button data-v="4">4</button><button data-v="6">6</button><button data-v="8">8</button></div>
    </div>
    <div class="gen-row"><span class="gl">Color</span><input type="range" id="gen-color" min="0" max="100" step="1"></div>
    <div class="gen-ends"><span>Debussy</span><span>Sakamoto</span></div>
    <div class="gen-row"><span class="gl">Surprise</span><input type="range" id="gen-surprise" min="0" max="100" step="1"></div>
    <div class="gen-ends"><span>familiar</span><span>strange</span></div>
    <div class="gen-row"><span class="gl">Voicing</span>
      <select id="gen-style"><option value="close">close</option><option value="open">open</option><option value="quartal">quartal</option></select>
    </div>
    <div class="gen-btns">
      <button class="gen-btn" onclick="generateProgression()" title="new progression; locked chords stay">GENERATE</button>
      <button class="gen-btn ext" id="gen-ext" onclick="extendProgression()" title="adds chords at the end, everything before stays">+ 6</button>
    </div>
  </div>

  <!-- Sequence -->
  <div class="seq-header">
    <div class="seq-title">Sequence (<span id="seq-count">0</span> chords)</div>
    <div class="seq-header-btns">
      <button class="clear-btn" onclick="clearSequence()">CLEAR</button>
    </div>
  </div>
  <div class="seq-list" id="seq-list">
    <div class="seq-empty" id="seq-empty">add chords above<br>to build your sequence</div>
  </div>

  <!-- Per-chord duration (beats per bar, default 4) -->
  <div class="dur-row">
    <div class="dur-label">Beats/bar</div>
    <input type="range" id="dur-slider" min="2" max="8" step="1" value="4" oninput="updateDur()">
    <div class="dur-val" id="dur-val">4</div>
  </div>

  <!-- Keyboard -->
  <div class="keyboard-section">
    <div class="section-label" style="margin-bottom:8px">Keyboard</div>
    <div class="piano-wrap"><div class="piano" id="piano"></div></div>
  </div>

  <!-- Suggestions -->
  <div class="sugg-head"><div class="section-label" style="margin-bottom:0">Suggestions</div><button class="sugg-re" onclick="refreshSuggestions()" title="new suggestions">↻</button></div>
  <div class="sugg-source" id="sugg-source"></div>
  <div class="suggestions">
    <div class="sugg-card" id="sugg-0">
      <div class="sugg-label">A</div>
      <div class="sugg-name" id="sugg-name-0">—</div>
      <div class="sugg-why" id="sugg-why-0"></div>
      <div class="sugg-notes" id="sugg-notes-0"></div>
      <div class="sugg-row">
        <button class="s-play-btn" id="sp0" onclick="event.stopPropagation();playSugg(0)">▶</button>
        <button class="s-add-btn" id="sa0" onclick="event.stopPropagation();addSugg(0)">ADD</button>
      </div>
    </div>
    <div class="sugg-card" id="sugg-1">
      <div class="sugg-label">B</div>
      <div class="sugg-name" id="sugg-name-1">—</div>
      <div class="sugg-why" id="sugg-why-1"></div>
      <div class="sugg-notes" id="sugg-notes-1"></div>
      <div class="sugg-row">
        <button class="s-play-btn" id="sp1" onclick="event.stopPropagation();playSugg(1)">▶</button>
        <button class="s-add-btn" id="sa1" onclick="event.stopPropagation();addSugg(1)">ADD</button>
      </div>
    </div>
    <div class="sugg-card" id="sugg-2">
      <div class="sugg-label">C</div>
      <div class="sugg-name" id="sugg-name-2">—</div>
      <div class="sugg-why" id="sugg-why-2"></div>
      <div class="sugg-notes" id="sugg-notes-2"></div>
      <div class="sugg-row">
        <button class="s-play-btn" id="sp2" onclick="event.stopPropagation();playSugg(2)">▶</button>
        <button class="s-add-btn" id="sa2" onclick="event.stopPropagation();addSugg(2)">ADD</button>
      </div>
    </div>
    <div class="sugg-card" id="sugg-3">
      <div class="sugg-label">D</div>

// ══════════════════════════════════════════════
// AUDIO ENGINE — Web Audio piano synthesis
// ══════════════════════════════════════════════

let audioCtx = null;

function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

// Ensure AudioContext is running, then call cb(ctx).
// Handles the browser autoplay policy: context may be suspended until
// a user gesture is processed; we resume() and wait for the state change.
function withCtx(cb) {
  const ctx = getCtx();
  if (ctx.state === 'running') { cb(ctx); return; }
  ctx.resume().then(() => cb(ctx)).catch(() => {});
}

function midiToFreq(midi) {
  return 440 * Math.pow(2, (midi - 69) / 12);
}

// Synthesise one piano note: dual detuned oscillators + filter + envelope
function _scheduleNote(ctx, midi, when, duration, vol) {
  const freq = midiToFreq(midi);

  const master = ctx.createGain();
  master.gain.setValueAtTime(0.001, when);
  master.gain.linearRampToValueAtTime(vol, when + 0.01);
  master.gain.exponentialRampToValueAtTime(vol * 0.6, when + 0.08);
  master.gain.exponentialRampToValueAtTime(vol * 0.35, when + 0.5);
  master.gain.exponentialRampToValueAtTime(0.0001, when + duration + 0.8);

  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(3200, when);
  filter.frequency.exponentialRampToValueAtTime(1600, when + 0.3);
  filter.Q.value = 0.8;

  const osc1 = ctx.createOscillator(); osc1.type = 'triangle'; osc1.frequency.value = freq;
  const osc2 = ctx.createOscillator(); osc2.type = 'sine';     osc2.frequency.value = freq * 1.002;
  const osc3 = ctx.createOscillator(); osc3.type = 'sine';     osc3.frequency.value = freq * 0.5;

  const g1 = ctx.createGain(); g1.gain.value = 0.6;
  const g2 = ctx.createGain(); g2.gain.value = 0.3;
  const g3 = ctx.createGain(); g3.gain.value = 0.12;

  osc1.connect(g1); osc2.connect(g2); osc3.connect(g3);
  g1.connect(filter); g2.connect(filter); g3.connect(filter);
  filter.connect(master);
  master.connect(ctx.destination);

  osc1.start(when); osc2.start(when); osc3.start(when);
  const stop = when + duration + 1.2;
  osc1.stop(stop); osc2.stop(stop); osc3.stop(stop);
}

function playChord(notes, rootPc = null, stagger = 0.018) {   // rootPc = the bass pitch class (the root, or the pedal of a slash chord)
  withCtx(ctx => {
    const now = ctx.currentTime + 0.05;
    // Bass note slightly before chord, louder
    if (rootPc !== null) {
      _scheduleNote(ctx, bassNote(rootPc), now, 3.0, 0.35);
    }
    const vol = 0.20 / Math.max(notes.length * 0.4, 1);
    notes.forEach((midi, i) => _scheduleNote(ctx, midi, now + i * stagger, 2.5, vol));
  });
}

function playNote(midi, when, duration, vol) {
  // Legacy wrapper for selectRoot bass note — schedules immediately via withCtx
  withCtx(ctx => {
    const t = Math.max(when, ctx.currentTime + 0.03);
    _scheduleNote(ctx, midi, t, duration, vol);
  });
}

function playSequenceItem(item) {
  withCtx(ctx => {
    const now = ctx.currentTime + 0.05;
    const noteDur = Math.max(item.dur * 0.4, 0.5);
    // Bass
    _scheduleNote(ctx, bassNote(item.bassPc ?? item.rootPc), now, noteDur + 0.8, 0.35);
    const vol = 0.20 / Math.max(item.notes.length * 0.4, 1);
    item.notes.forEach((midi, i) => _scheduleNote(ctx, midi, now + i * 0.018, noteDur, vol));
  });
}

  'quart3':'4ths','quart4':'4ths+',

function buildVoicing(rootPc, qualityKey) {
  const q = QUALITIES.find(q => q.key === qualityKey);
  if (!q) return [];
  const BASE = 60; // C4
  const rootMidi = BASE + ((rootPc + 12) % 12);
  let notes = q.intervals.map(iv => rootMidi + iv);
  while (Math.min(...notes) < 48) notes = notes.map(n => n + 12);
  while (Math.max(...notes) > 84) notes = notes.map(n => n - 12);
  return notes.sort((a, b) => a - b);
}

// Voice-lead newNotes toward prevNotes: for each pitch class in newNotes,
// pick the octave closest to the centroid of prevNotes.
function voiceLeadFrom(prevNotes, newNotes) {
  if (!prevNotes || prevNotes.length === 0) return newNotes;
  const centroid = prevNotes.reduce((a, b) => a + b, 0) / prevNotes.length;
  return newNotes.map(midi => {
    const pc = midi % 12;
    // Try octaves 2–6
    let best = midi, bestDist = Infinity;
    for (let oct = 2; oct <= 6; oct++) {
      const candidate = pc + oct * 12;
      const dist = Math.abs(candidate - centroid);
      if (dist < bestDist) { bestDist = dist; best = candidate; }
    }
    return best;
  }).sort((a, b) => a - b);
}

// Bass note: root two octaves below middle C, but never below midi 28
function bassNote(rootPc) {
  let midi = 36 + ((rootPc + 12) % 12); // C2 range
  while (midi < 28) midi += 12;
  return midi;
}


function chordDisplayName(rootPc, qualityKey, bassPc = null) {
  const rn = pcName(rootPc);
  const qd = QDISPLAY[qualityKey] ?? qualityKey;
  return rn + qd + (bassPc !== null && bassPc !== undefined && bassPc !== rootPc ? '/' + pcName(bassPc) : '');
}

  if(k.includes('sus') || k === '7sus4') return 'sus';
  return 'minor'; // default fallback

const MOOD_FALLBACK = {
  dark:     ['dark', 'interior', 'drift', 'warm', 'open'],
  drift:    ['drift', 'open', 'warm', 'dark', 'interior'],
  open:     ['open', 'drift', 'warm', 'dark', 'interior'],

// ══════════════════════════════════════════════
// GENERATOR v13 — progressions between Debussy and Sakamoto
//
// A chord is chosen by a score, not read from a table:
//   lateral motion (steps and thirds) beats fourths and fifths (no gravity towards home)
//   + the colour of the quality (Debussy side: planing, whole tone, quartal, dominants that never resolve;
//     Sakamoto side: minor shadow, interior chords, sus, Lydian light)
//   + common tones and short voice leading, + a mood arc, + a rarity bonus when SURPRISE is up
// SURPRISE also sets how wild the final pick is (low = best of a few, high = a wider throw).
// ══════════════════════════════════════════════

const GEN = { len: 6, color: 60, surprise: 50, style: 'close' };
try { Object.assign(GEN, JSON.parse(localStorage.getItem('vell.gen.v1') || '{}')); } catch (e) {}
function genSave() { try { localStorage.setItem('vell.gen.v1', JSON.stringify(GEN)); } catch (e) {} }

// d = weight on the Debussy side, s = weight on the Sakamoto side, m = mood
const VOC = {
  'maj9':     { d: .6, s: .5, m: 'warm' },     'maj7':     { d: .4, s: .4, m: 'warm' },
  'maj7#11':  { d: 1,  s: 1,  m: 'drift' },    'add9':     { d: .7, s: .5, m: 'open' },
  '6/9':      { d: .8, s: .8, m: 'open' },     'add#11':   { d: .7, s: .6, m: 'drift' },
  'min9':     { d: .3, s: 1,  m: 'dark' },     'min11':    { d: .3, s: .9, m: 'dark' },
  'min7':     { d: .2, s: .6, m: 'dark' },     'minadd9':  { d: .4, s: .6, m: 'dark' },
  'min6/9':   { d: .3, s: .7, m: 'dark' },     'minjmaj7': { d: .2, s: .9, m: 'interior' },
  'min7b5':   { d: .3, s: .6, m: 'interior' }, 'sus2':     { d: .6, s: 1,  m: 'open' },
  'sus4':     { d: .5, s: .6, m: 'open' },     '7sus4':    { d: .6, s: .3, m: 'open' },
  'maj7sus2': { d: .6, s: .8, m: 'open' },     'dom9':     { d: .8, s: .1, m: 'drift' },
  '7#11':     { d: .9, s: .2, m: 'drift' },    'wt9':      { d: 1,  s: .1, m: 'drift' },
  'maj7#5':   { d: .7, s: .4, m: 'drift' },    'quart3':   { d: .8, s: .5, m: 'open' },
  'quart4':   { d: .8, s: .5, m: 'open' },
};
const VOC_KEYS = Object.keys(VOC);
const ENDS = new Set(['sus2', 'sus4', 'maj7sus2', '6/9', 'add9', 'quart3', 'quart4', 'maj7#11']);   // a phrase hovers, it does not arrive
const PULLQ = new Set(['dom7', 'dom9', '7#11', 'wt9']);                                             // dominant colours: never let them fall a fourth
const OPENQ = new Set(['sus2', 'sus4', '7sus4', 'maj7sus2', 'quart3', 'quart4', '6/9', 'add9']);    // fourths and fifths are fine below these
const MW = [.5, 1, 1, 1, .9, .25, .45, .25, .9, 1, 1, 1];                                           // weight of a root motion in semitones up
const MOTION_NAME = ['same root', '½ step ↑', 'step ↑', '3rd ↑', 'maj 3rd ↑', '4th ↑', 'tritone', '4th ↓', 'maj 3rd ↓', '3rd ↓', 'step ↓', '½ step ↓'];
const MOOD_WORD = { dark: 'shadow', drift: 'shimmer', open: 'open air', interior: 'inner light', warm: 'warmth' };
const NAMED = (() => {
  const m = {};
  for (const T of [TRANSITIONS, TRANSITIONS_EXT]) for (const fam in T) for (const t of T[fam]) m[fam + '|' + (t.mot % 12) + '|' + t.q] = t.label.replace(/^[^·]*· /, '');
  return m;
})();

const qPcs = (root, qk) => { const q = QUALITIES.find(x => x.key === qk); return q ? [...new Set(q.intervals.map(i => (root + i) % 12))] : []; };
const lerp = (a, b, t) => a + (b - a) * t;
const avg = a => a.reduce((x, y) => x + y, 0) / a.length;

// ---- voicing: pick the octaves of the colour tones (everything but root and fifth, those live in the bass) ----
const V_LO = 52, V_HI = 81;
function vcCost(prev, notes) {
  if (!prev || !prev.length) return Math.abs(avg(notes) - 64) * 0.12;
  let s = 0;
  for (const n of notes) { let d = 99; for (const p of prev) d = Math.min(d, Math.abs(n - p)); s += d; }
  return s / notes.length + 0.25 * Math.abs(notes[notes.length - 1] - prev[prev.length - 1]) + 0.04 * Math.abs(avg(notes) - avg(prev));
}
function stylePenalty(notes, style) {
  const span = notes[notes.length - 1] - notes[0];
  let pen = 0;
  for (let i = 1; i < notes.length; i++) {
    const g = notes[i] - notes[i - 1];
    if (g === 1) pen += 0.6;
    else if (g === 2 && notes[i - 1] < 60) pen += 0.8;      // no muddy seconds low down
  }
  if (style === 'open') {
    pen += Math.max(0, 14 - span) * 0.5 + Math.max(0, span - 26) * 0.5;
    if (notes[1] - notes[0] < 5) pen += 2;
    pen += Math.max(0, 67 - notes[notes.length - 1]) * 0.3;
  } else if (style === 'quartal') {
    for (let i = 1; i < notes.length; i++) { const g = notes[i] - notes[i - 1]; if (g !== 5 && g !== 6) pen += 1.5; }
  } else {
    pen += Math.max(0, span - 12) * 0.5;
  }
  return pen;
}
function voiceChord(root, qk, bassPc, prevNotes, style) {
  const q = QUALITIES.find(x => x.key === qk); if (!q) return [];
  const pcs = qPcs(root, qk), fifth = (root + 7) % 12;
  let req = pcs.filter(p => p !== root && p !== fifth);
  let opt = pcs.filter(p => !req.includes(p));
  if (!req.length) { req = opt; opt = []; }
  const cands = pc => { const a = []; for (let m = V_LO; m <= V_HI; m++) if (m % 12 === pc) a.push(m); return a; };
  const subsets = [[]]; opt.forEach(p => subsets.push([p])); if (opt.length > 1) subsets.push(opt.slice());
  const tgt = Math.min(4, pcs.length);
  const run = st => {
    let best = null, bestC = Infinity;
    for (const sub of subsets) {
      const L = req.concat(sub); if (L.length < 3) continue;
      const lists = L.map(cands), cur = [];
      const rec = i => {
        if (i === L.length) {
          const notes = cur.slice().sort((a, b) => a - b);
          for (let k = 1; k < notes.length; k++) if (notes[k] === notes[k - 1]) return;
          const c = vcCost(prevNotes, notes) + stylePenalty(notes, st) + 0.9 * Math.abs(L.length - tgt);
          if (c < bestC) { bestC = c; best = notes; }
          return;
        }
        for (const m of lists[i]) { cur[i] = m; rec(i + 1); }
      };
      rec(0);
    }
    return { best, cost: bestC };
  };
  let r = run(style);
  if (style === 'quartal' && r.best && stylePenalty(r.best, 'quartal') >= 1.5) {   // no stack of fourths in this chord: open voicing instead
    const o = run('open'); if (o.best) r = o;
  }
  if (!r.best) { const o = run('close'); r = o; }
  return r.best || buildVoicing(root, qk);
}
const bassOf = it => (it.bassPc !== null && it.bassPc !== undefined) ? it.bassPc : it.rootPc;

// ---- candidates for the next chord ----
function genCandidates(ctx, opts) {
  const prev = ctx[ctx.length - 1];
  const f = GEN.color / 100, su = GEN.surprise / 100;
  const prevPcs = new Set(prev.notes.map(n => n % 12)); prevPcs.add(bassOf(prev));
  const prevFam = qFamily(prev.qualityKey);
  const prevMot = ctx.length > 1 ? (prev.rootPc - ctx[ctx.length - 2].rootPc + 12) % 12 : null;
  let planeRun = 0, pedalRun = 0;
  for (let i = ctx.length - 1; i >= 0 && ctx[i].tag === 'plane'; i--) planeRun++;
  for (let i = ctx.length - 1; i >= 0 && ctx[i].bassPc !== null && ctx[i].bassPc !== undefined; i--) pedalRun++;
  const pedal = bassOf(prev);
  const recent = ctx.slice(-4), last3 = ctx.slice(-3);
  const pos = opts.pos || 0, N = opts.N || Infinity, all = opts.all || ctx;
  const targetMood = SLOT_MOODS[pos % 8];
  const out = [];
  for (let r2 = 0; r2 < 12; r2++) {
    const int = (r2 - prev.rootPc + 12) % 12;
    for (const qk of VOC_KEYS) {
      if (int === 0 && qk === prev.qualityKey) continue;
      if (all.some(c => c.rootPc === r2 && c.qualityKey === qk)) continue;
      const v = VOC[qk];
      const plane = (qk === prev.qualityKey && int !== 0);
      {
        const slash = false, bass = null;
        let sc = 0;
        // motion
        const mw = Math.pow(MW[int], 1 - 0.7 * su);
        sc += 2 * Math.log(Math.max(.05, mw));
        if ((int === 5 || int === 7) && !OPENQ.has(qk)) sc -= 1.5 * (1 - 0.6 * su);
        if (int === 5 && PULLQ.has(prev.qualityKey)) sc -= 1.5;
        if (int === 5 || int === 6 || int === 7) sc += su * 0.8;      // surprise opens the door to the far moves
        // colour
        const w = Math.pow(lerp(v.d, v.s, f), 1 - 0.6 * su);
        sc += 1.5 * Math.log(Math.max(.05, w)) + su * 0.7 * (1 - (v.d + v.s) / 2);
        const named = NAMED[prevFam + '|' + int + '|' + qk];
        if (named) sc += 0.9 * (0.4 + 0.6 * f);
        // memory
        if (int === 0) sc -= 0.3;
        if (last3.slice(0, -1).some(c => c.rootPc === r2)) sc -= 0.5;
        if (!plane && qk === prev.qualityKey) sc -= 0.35;
        sc -= 0.3 * all.filter(c => c.qualityKey === qk).length;
        if (prevMot !== null && int === prevMot && !plane) sc -= 0.45;
        if (plane) sc += 0.9 * (1 - f) + 0.3 * su - (planeRun >= 2 ? 1.4 : 0);
        // arc and ending
        if (v.m === targetMood) sc += 0.45 * (1 - 0.5 * su);
        if (pos === N - 1) sc += ENDS.has(qk) ? 1.0 : (PULLQ.has(qk) ? -1.0 : 0);
        // common tones
        const pcs = qPcs(r2, qk);
        sc += 0.35 * Math.min(3, pcs.filter(p => prevPcs.has(p)).length);
        if (opts.next) {
          const nmot = (opts.next.rootPc - r2 + 12) % 12;
          sc += 1.0 * Math.log(Math.max(.05, Math.pow(MW[nmot], 1 - 0.7 * su))) + 0.3 * Math.min(3, pcs.filter(p => opts.next.notes.some(n => n % 12 === p)).length);
        }
        out.push({ rootPc: r2, qualityKey: qk, bassPc: bass, mood: v.m, score: sc, int, plane, pcs });
      }
    }
  }
  return out;
}

// a pedal (the bass stays on the last bass) is a special colour, more at home on the Debussy side
function maybePedal(c, ctx) {
  const prev = ctx[ctx.length - 1], pedal = bassOf(prev), f = GEN.color / 100, su = GEN.surprise / 100;
  let run = 0; for (let i = ctx.length - 1; i >= 0 && ctx[i].bassPc !== null && ctx[i].bassPc !== undefined; i--) run++;
  if (pedal === c.rootPc || c.int === 0 || run >= 3 || (c.bassPc !== null && c.bassPc !== undefined)) return c;
  const p = (0.03 + 0.2 * (1 - f) + 0.08 * su) * (run > 0 ? 2 : 1);
  if (Math.random() >= p) return c;
  const d = Object.assign({}, c, { bassPc: pedal });
  d.notes = voiceChord(d.rootPc, d.qualityKey, pedal, prev.notes, GEN.style);
  d.why = genWhy(d, prev);
  return d;
}

function genWhy(c, prev) {
  const fam = qFamily(prev.qualityKey), named = NAMED[fam + '|' + c.int + '|' + c.qualityKey];
  let tag = named || MOOD_WORD[c.mood];
  if (c.plane) tag = 'planing · parallel ' + (QDISPLAY[c.qualityKey] ?? c.qualityKey);
  if (c.bassPc !== null && c.bassPc !== undefined) tag += ' · pedal on ' + pcName(c.bassPc);
  const prevPcs = new Set(prev.notes.map(n => n % 12)); prevPcs.add(bassOf(prev));
  const common = c.pcs.filter(p => prevPcs.has(p)).map(pcName);
  return MOTION_NAME[c.int] + ' · ' + tag + (common.length ? ' · shared: ' + common.join(' ') : '');
}

// score the best candidates with real voicings, then pick one (pick = false: return the ranked list)
function genRank(ctx, opts, take = 30) {
  const prev = ctx[ctx.length - 1];
  const pre = genCandidates(ctx, opts).sort((a, b) => b.score - a.score).slice(0, take);
  const su = GEN.surprise / 100;
  pre.forEach(c => {
    c.notes = voiceChord(c.rootPc, c.qualityKey, c.bassPc, prev.notes, GEN.style);
    c.score2 = c.score - 0.45 * vcCost(prev.notes, c.notes) + (Math.random() - 0.5) * su * 1.2;
    c.why = genWhy(c, prev);
  });
  return pre.sort((a, b) => b.score2 - a.score2);
}
function genPick(ranked) {
  const su = GEN.surprise / 100, T = 0.3 + 1.0 * su, top = ranked.slice(0, 12), mx = top[0].score2;
  const w = top.map(c => Math.exp((c.score2 - mx) / T)), sum = w.reduce((a, b) => a + b, 0);
  let r = Math.random() * sum;
  for (let i = 0; i < top.length; i++) { r -= w[i]; if (r <= 0) return top[i]; }
  return top[0];
}
function genItem(c, dur) {
  return { displayName: chordDisplayName(c.rootPc, c.qualityKey, c.bassPc), notes: c.notes, dur, rootPc: c.rootPc, qualityKey: c.qualityKey,
           bassPc: c.bassPc ?? null, tag: c.plane ? 'plane' : (c.bassPc !== null && c.bassPc !== undefined ? 'pedal' : null), locked: false };
}
function genStart(dur) {
  const f = GEN.color / 100, su = GEN.surprise / 100;
  const root = Math.floor(Math.random() * 12);
  const w = VOC_KEYS.map(k => Math.pow(lerp(VOC[k].d, VOC[k].s, f), 1 - 0.6 * su));
  let r = Math.random() * w.reduce((a, b) => a + b, 0), qk = VOC_KEYS[0];
  for (let i = 0; i < w.length; i++) { r -= w[i]; if (r <= 0) { qk = VOC_KEYS[i]; break; } }
  const notes = voiceChord(root, qk, null, null, GEN.style);
  return genItem({ rootPc: root, qualityKey: qk, bassPc: null, notes, plane: false }, dur);
}

// ---- the whole progression: unlocked chords are new, locked ones stay and pull their neighbours towards them ----
function generateItems(oldSeq, selected, dur) {
  const N = GEN.len, res = [];
  for (let i = 0; i < N; i++) {
    const old = oldSeq[i];
    if (old && old.locked) { res.push(old); continue; }
    if (!res.length) {
      if (selected) { res.push(Object.assign(genItem(selected, dur), { locked: false })); continue; }
      res.push(genStart(dur)); continue;
    }
    let next = null;
    for (let j = i + 1; j < Math.min(N, oldSeq.length); j++) if (oldSeq[j] && oldSeq[j].locked) { next = oldSeq[j]; break; }
    const ranked = genRank(res.slice(-3), { pos: i, N, next, all: res });
    res.push(genItem(maybePedal(genPick(ranked), res.slice(-3)), dur));
  }
  oldSeq.slice(N).filter(x => x.locked).forEach(x => res.push(x));
  return res;
}
function rerollOne(seq, idx, dur) {
  const ctx = seq.slice(Math.max(0, idx - 3), idx), next = seq[idx + 1] || null;
  if (!ctx.length) { const it = genStart(seq[idx].dur); it.locked = false; return it; }
  const ranked = genRank(ctx, { pos: idx, N: Infinity, next, all: seq.filter((_, k) => k !== idx) });
  const it = genItem(maybePedal(genPick(ranked), ctx), seq[idx].dur); return it;
}

// ---- suggestions: ranked by the same score, from the last chords of the sequence (or the chord on the pickers) ----
function getSuggestionsCtx(ctx, pos) {
  const ranked = genRank(ctx, { pos, N: Infinity, all: typeof sequence !== 'undefined' && sequence.length ? sequence : ctx }, 40);
  const out = [], usedRoots = new Set([ctx[ctx.length - 1].rootPc]), usedKeys = new Set();
  for (let slot = 0; slot < 8; slot++) {
    const pri = MOOD_FALLBACK[SLOT_MOODS[slot]];
    let pick = null;
    for (const mood of pri) {
      pick = ranked.find(c => c.mood === mood && !usedRoots.has(c.rootPc) && !usedKeys.has(c.rootPc + c.qualityKey));
      if (pick) break;
    }
    if (!pick) pick = ranked.find(c => !usedKeys.has(c.rootPc + c.qualityKey));
    if (!pick) continue;
    pick = maybePedal(pick, ctx);
    usedRoots.add(pick.rootPc); usedKeys.add(pick.rootPc + pick.qualityKey);
    out.push({ rootPc: pick.rootPc, qualityKey: pick.qualityKey, bassPc: pick.bassPc, name: chordDisplayName(pick.rootPc, pick.qualityKey, pick.bassPc),
               why: pick.why, notes: pick.notes, noteNames: [...new Set(pick.notes.map(n => NOTE_NAMES[n % 12]))], tag: pick.plane ? 'plane' : (pick.bassPc !== null && pick.bassPc !== undefined ? 'pedal' : null) });
  }
  return out;
}
function getSuggestions(rootPc, qualityKey) {   // kept for the old call: one chord as the whole context
  const notes = voiceChord(rootPc, qualityKey, null, null, GEN.style);
  return getSuggestionsCtx([{ rootPc, qualityKey, bassPc: null, notes }], 0);
}

let selectedRoot = null;
let selectedQuality = null;
let selectedBass = null;   // null = the root is the bass; a pitch class makes a slash chord
let currentNotes = [];
let suggestions = [];

const WKW=30, WHITE_PCS=[0,2,4,5,7,9,11];
const BLACK_OFF={1:0.62,3:1.62,6:3.62,8:4.62,10:5.62};
let keyEls={};

function buildKeyboard(){
  const piano=document.getElementById('piano');piano.innerHTML='';keyEls={};let wi=0;
  for(let oct=3;oct<=5;oct++){
    const os=wi;
    for(const pc of WHITE_PCS){
      const midi=(oct+1)*12+pc;if(midi>83)break;
      const el=document.createElement('div');el.className='wkey';el.dataset.midi=midi;
      if(pc===0){const lb=document.createElement('span');lb.className='klabel';lb.textContent='C'+oct;el.appendChild(lb);}
      piano.appendChild(el);keyEls[midi]=el;wi++;
    }
    for(const[ps,off]of Object.entries(BLACK_OFF)){
      const pc=parseInt(ps),midi=(oct+1)*12+pc;if(midi>83)continue;
      const el=document.createElement('div');el.className='bkey';el.dataset.midi=midi;
      el.style.left=((os+off)*WKW)+'px';
      piano.appendChild(el);keyEls[midi]=el;
    }
  }
}

function updateKeyboard(){
  for(const el of Object.values(keyEls)) el.classList.remove('kplayed','ksugg1','ksugg2');
  for(const m of currentNotes){const el=keyEls[m];if(el)el.classList.add('kplayed')}
  if(suggestions[0])for(const m of suggestions[0].notes){const el=keyEls[m];if(el&&!el.classList.contains('kplayed'))el.classList.add('ksugg1')}
  if(suggestions[1])for(const m of suggestions[1].notes){const el=keyEls[m];if(el&&!el.classList.contains('kplayed'))el.classList.add('ksugg2')}
}

}

function buildQualityGrid(){
  const grid=document.getElementById('quality-grid');

    const btn=document.createElement('button');
    btn.className='q-btn';btn.textContent=q.label;btn.dataset.key=q.key;
    btn.addEventListener('click',()=>selectQuality(q.key));
    grid.appendChild(btn);
  });
}

// ══════════════════════════════════════════════
// SELECTION HANDLERS
// ══════════════════════════════════════════════

function selectRoot(pc){
  selectedRoot=pc;
  document.querySelectorAll('.root-btn').forEach(b=>{
    b.classList.toggle('selected',parseInt(b.dataset.pc)===pc);
  });
  // Play root in bass register — C2 = midi 36
  const rootMidi = 36 + pc;
  playNote(rootMidi, 0, 2.5, 0.35); // 'when' handled inside playNote via withCtx
  updateCurrent();
}

function selectQuality(key){
  selectedQuality=key;
  document.querySelectorAll('.q-btn').forEach(b=>{
    b.classList.toggle('selected',b.dataset.key===key);
  });
  updateCurrent();
  // Play the full chord if root is already selected
  if(selectedRoot !== null && currentNotes.length){
    playChord(currentNotes, selectedBass ?? selectedRoot);
  }
}

function updateCurrent(){
  if(selectedRoot===null||selectedQuality===null){
    document.getElementById('cc-name').textContent=
      selectedRoot!==null ? pcName(selectedRoot) :
      selectedQuality!==null ? (QDISPLAY[selectedQuality]??selectedQuality) : '—';
    document.getElementById('cc-notes').textContent=
      selectedRoot===null&&selectedQuality===null ? 'pick a root and quality':
      selectedRoot===null ? 'pick a root' : 'pick a quality';
    document.getElementById('cc-quality').textContent='';
    document.getElementById('play-current').classList.add('disabled');
    document.getElementById('add-chord-btn').disabled=true;
    currentNotes=[];
    // Still show suggestions from last sequence item if available
    refreshSuggestions();
    updateKeyboard();return;
  }

  const notes=voiceChord(selectedRoot,selectedQuality,selectedBass,sequence.length?sequence[sequence.length-1].notes:null,GEN.style);
  currentNotes=notes;
  const name=chordDisplayName(selectedRoot,selectedQuality,selectedBass);
  const noteNames=[...new Set(notes.map(n=>NOTE_NAMES[n%12]))];

  document.getElementById('cc-name').textContent=name;
  document.getElementById('cc-notes').textContent=noteNames.join(' · ');
  document.getElementById('cc-quality').textContent=selectedQuality;
  document.getElementById('play-current').classList.remove('disabled');
  document.getElementById('add-chord-btn').disabled=false;

  refreshSuggestions();
  updateKeyboard();
}

// Suggestions always come from the LAST item in the sequence (if any), else current selection
function refreshSuggestions(){
  let ctx, srcLabel, pos;
  if(sequence.length > 0){
    ctx = sequence.slice(-3);
    pos = sequence.length;
    srcLabel = '← from ' + ctx.map(c => c.displayName).join(' → ');
  } else if(selectedRoot !== null && selectedQuality !== null){
    ctx = [{ rootPc: selectedRoot, qualityKey: selectedQuality, bassPc: selectedBass, notes: currentNotes.length ? currentNotes : voiceChord(selectedRoot, selectedQuality, selectedBass, null, GEN.style) }];
    pos = 0;
    srcLabel = '';
  } else {
    suggestions = [];
    renderSuggestions();
    return;
  }
  suggestions = getSuggestionsCtx(ctx, pos);
  document.getElementById('sugg-source').textContent = srcLabel;
  renderSuggestions();
}

function playCurrentChord(){
  if(!currentNotes.length)return;
  playChord(currentNotes, selectedBass ?? selectedRoot);
  const btn=document.getElementById('play-current');
  btn.classList.add('flash');setTimeout(()=>btn.classList.remove('flash'),300);
}

// ══════════════════════════════════════════════
// SUGGESTIONS UI
// ══════════════════════════════════════════════

function renderSuggestions(){
  for(let i=0;i<8;i++){
    const s=suggestions[i];
    document.getElementById('sugg-name-'+i).textContent=s?s.name:'—';
    document.getElementById('sugg-why-'+i).textContent=s?s.why:'';
    document.getElementById('sugg-notes-'+i).textContent=s?[...new Set(s.noteNames)].join(' · '):'';
    document.getElementById('sugg-'+i).classList.remove('s-active');
    document.getElementById('sp'+i).style.display=s?'flex':'none';
    document.getElementById('sa'+i).style.display=s?'block':'none';
  }
}

function playSugg(idx){
  const s=suggestions[idx];if(!s)return;
  playChord(s.notes, s.bassPc ?? s.rootPc);
  const btn=document.getElementById('sp'+idx);
  btn.classList.add('flash');setTimeout(()=>btn.classList.remove('flash'),300);
}

function addSugg(idx){
  const s=suggestions[idx];if(!s)return;
  cancelEdit();
  const dur=parseFloat(document.getElementById('dur-slider').value);
  const ledNotes = s.notes;   // the suggestion was voiced against the chords before it
  sequence.push({displayName:s.name,notes:ledNotes,dur,rootPc:s.rootPc,qualityKey:s.qualityKey,bassPc:s.bassPc??null,tag:s.tag??null,locked:false});
  renderSequence();
  selectedRoot=s.rootPc;selectedQuality=s.qualityKey;selectedBass=s.bassPc??null;currentNotes=ledNotes;
  setBassSelect();
  document.querySelectorAll('.root-btn').forEach(b=>b.classList.toggle('selected',parseInt(b.dataset.pc)===s.rootPc));
  document.querySelectorAll('.q-btn').forEach(b=>b.classList.toggle('selected',b.dataset.key===s.qualityKey));
  document.getElementById('cc-name').textContent=s.name;
  document.getElementById('cc-notes').textContent=[...new Set(s.noteNames)].join(' · ');
  document.getElementById('cc-quality').textContent=s.qualityKey;
  document.getElementById('play-current').classList.remove('disabled');
  document.getElementById('add-chord-btn').disabled=false;
  refreshSuggestions();
  updateKeyboard();
  flashItem();
}

// ══════════════════════════════════════════════
// SEQUENCE
// ══════════════════════════════════════════════

function addToSequence(){
  if(selectedRoot===null||selectedQuality===null)return;
  const dur=parseFloat(document.getElementById('dur-slider').value);
  const name=chordDisplayName(selectedRoot,selectedQuality,selectedBass);
  const prevIdx = editingIdx !== null ? editingIdx - 1 : sequence.length - 1;
  const prevNotes = prevIdx >= 0 && sequence[prevIdx] ? sequence[prevIdx].notes : null;
  const ledNotes = voiceChord(selectedRoot,selectedQuality,selectedBass,prevNotes,GEN.style);
  const entry={displayName:name,notes:ledNotes,dur,rootPc:selectedRoot,qualityKey:selectedQuality,bassPc:selectedBass,tag:null,locked:false};

  if(editingIdx !== null){
    sequence[editingIdx] = entry;
    editingIdx = null;
    document.getElementById('add-chord-btn').textContent='ADD TO SEQUENCE →';
  } else {
    sequence.push(entry);
    setTimeout(()=>{
      const list=document.getElementById('seq-list');
      list.scrollTop=list.scrollHeight;
    },50);
  }
  renderSequence();
  refreshSuggestions();
  flashItem();
}

function duplicateItem(idx){
  if(!sequence[idx]) return;
  const copy = {...sequence[idx], notes:[...sequence[idx].notes], locked:false};
  sequence.splice(idx + 1, 0, copy);
  if(autoPlaying && playIdx > idx) playIdx++;
  renderSequence();
  refreshSuggestions();
  // Flash the new item
  setTimeout(()=>{
    const items = document.querySelectorAll('.seq-item');
    const el = items[idx + 1];
    if(el){ el.style.borderColor='var(--amber)'; setTimeout(()=>el.style.borderColor='',500); }
  }, 30);
}

function removeFromSequence(idx){
  if(autoPlaying && playIdx >= idx) playIdx = Math.max(0, playIdx - 1);
  sequence.splice(idx,1);
  renderSequence();
  if(!sequence.length){ document.getElementById('export-btn').disabled=true; stopAutoplay(); }
  refreshSuggestions();
}

function moveItem(idx, dir){
  const newIdx = idx + dir;
  if(newIdx < 0 || newIdx >= sequence.length) return;
  [sequence[idx], sequence[newIdx]] = [sequence[newIdx], sequence[idx]];
  if(autoPlaying){
    if(playIdx === idx) playIdx = newIdx;
    else if(playIdx === newIdx) playIdx = idx;
  }
  renderSequence();
}

// editingIdx: when set, ADD button replaces that slot instead of appending
let editingIdx = null;

function editItem(idx){
  const item = sequence[idx];
  if(!item) return;
  editingIdx = idx;
  // Pre-select that chord in the pickers
  selectedRoot = item.rootPc; selectedQuality = item.qualityKey; selectedBass = item.bassPc ?? null; currentNotes = item.notes; setBassSelect();
  document.querySelectorAll('.root-btn').forEach(b=>b.classList.toggle('selected',parseInt(b.dataset.pc)===item.rootPc));
  document.querySelectorAll('.q-btn').forEach(b=>b.classList.toggle('selected',b.dataset.key===item.qualityKey));
  document.getElementById('cc-name').textContent = item.displayName;
  document.getElementById('cc-notes').textContent = [...new Set(item.notes.map(n=>NOTE_NAMES[n%12]))].join(' · ');
  document.getElementById('cc-quality').textContent = item.qualityKey;
  document.getElementById('play-current').classList.remove('disabled');
  // Change ADD button label
  document.getElementById('add-chord-btn').disabled = false;
  document.getElementById('add-chord-btn').textContent = `REPLACE #${idx+1} →`;
  updateKeyboard();
  renderSequence(); // highlight the editing item
  // Scroll up to the builder
  document.getElementById('scroll').scrollTo({top:0, behavior:'smooth'});
}

function cancelEdit(){
  editingIdx = null;
  document.getElementById('add-chord-btn').textContent = 'ADD TO SEQUENCE →';
}

function clearSequence(){
  stopAutoplay();
  sequence=[];editingIdx=null;renderSequence();
  document.getElementById('export-btn').disabled=true;
  document.getElementById('add-chord-btn').textContent='ADD TO SEQUENCE →';
  refreshSuggestions();
}

const BEAT_OPTIONS = [1, 2, 3, 4, 6, 8];

function setBeats(idx, val){
  if(sequence[idx]) sequence[idx].dur = parseInt(val);
  // no need to re-render the whole list — value already reflected in the select
}

function renderSequence(){
  const list=document.getElementById('seq-list');
  const empty=document.getElementById('seq-empty');
  [...list.querySelectorAll('.seq-item')].forEach(el=>el.remove());
  document.getElementById('seq-count').textContent=sequence.length;
  document.getElementById('export-btn').disabled=sequence.length===0;
  if(!sequence.length){empty.style.display='block';return}
  empty.style.display='none';
  sequence.forEach((item,idx)=>{
    const el=document.createElement('div');
    let cls = 'seq-item';
    if(autoPlaying && idx === playIdx) cls += ' playing';
    if(editingIdx === idx) cls += ' editing';
    if(item.locked) cls += ' locked';
    el.className = cls;

    const options = BEAT_OPTIONS.map(b =>
      `<option value="${b}" ${item.dur===b?'selected':''}>${b}b</option>`
    ).join('');

    el.innerHTML=`
      <div class="seq-num">${idx+1}</div>
      <div class="seq-name">${item.displayName}</div>
      <select class="seq-beats" onchange="setBeats(${idx},this.value)">${options}</select>
      <div class="seq-reorder">
        <button class="seq-btn up-btn" onclick="moveItem(${idx},-1)" ${idx===0?'style="opacity:.3;pointer-events:none"':''}>▲</button>
        <button class="seq-btn dn-btn" onclick="moveItem(${idx},1)" ${idx===sequence.length-1?'style="opacity:.3;pointer-events:none"':''}>▼</button>
      </div>
      <button class="seq-btn play-btn-seq" onclick="playSequenceItem(sequence[${idx}])">▶</button>
      <button class="seq-btn lock-btn${item.locked?' on':''}" onclick="toggleLock(${idx})" title="lock: the generator keeps this chord">${item.locked?'●':'○'}</button>
      <button class="seq-btn re-btn" onclick="rerollItem(${idx})" title="new chord here, same neighbours" ${item.locked?'style="opacity:.3;pointer-events:none"':''}>↻</button>
      <button class="seq-btn edit-btn" onclick="editItem(${idx})">✎</button>
      <button class="seq-btn del-btn" onclick="removeFromSequence(${idx})">×</button>
    `;
    list.appendChild(el);
  });
}

function flashItem(){
  const items=document.querySelectorAll('.seq-item');
  const last=items[items.length-1];
  if(last){last.style.borderColor='var(--amber)';setTimeout(()=>last.style.borderColor='',500)}
}

function updateDur(){
  const v=document.getElementById('dur-slider').value;
  document.getElementById('dur-val').textContent=v;
}

// ══════════════════════════════════════════════
// AUTOPLAY ENGINE — BPM-based, 1 bar per chord
// ══════════════════════════════════════════════

let autoPlaying = false;
let playIdx = 0;
let barTimer = null;
let barStartTime = null;
let rafId = null;

function getBpm(){ return parseInt(document.getElementById('bpm-slider').value) }
function getBeats(){ return parseInt(document.getElementById('dur-slider').value) }
function barDurationMs(beats){ return (60000 / getBpm()) * (beats ?? getBeats()) }

function updateBpm(){
  document.getElementById('bpm-val').textContent = getBpm();
  // If playing, the next bar will pick up the new tempo naturally
}

function toggleAutoplay(){
  if(autoPlaying) stopAutoplay();
  else startAutoplay();
}

function startAutoplay(){
  if(!sequence.length) return;
  autoPlaying = true;
  playIdx = 0;
  document.getElementById('autoplay-btn').textContent = '■';
  document.getElementById('autoplay-btn').classList.add('playing');
  scheduleBar();
}

function stopAutoplay(){
  autoPlaying = false;
  clearTimeout(barTimer);
  cancelAnimationFrame(rafId);
  document.getElementById('autoplay-btn').textContent = '▶';
  document.getElementById('autoplay-btn').classList.remove('playing');
  document.getElementById('bar-fill').style.width = '0%';
  renderSequence(); // remove playing highlight
}

function scheduleBar(){
  if(!autoPlaying || !sequence.length) return;
  const item = sequence[playIdx];
  playSequenceItem(item);
  barStartTime = performance.now();
  const dur = barDurationMs(item.dur);
  renderSequence();
  const items = document.querySelectorAll('.seq-item');
  if(items[playIdx]) items[playIdx].scrollIntoView({block:'nearest',behavior:'smooth'});

  cancelAnimationFrame(rafId);
  animateBar(dur);

  barTimer = setTimeout(()=>{
    if(!autoPlaying) return;
    playIdx = (playIdx + 1) % sequence.length;
    scheduleBar();
  }, dur);
}

function animateBar(dur){
  if(!autoPlaying) return;
  const elapsed = performance.now() - barStartTime;
  const pct = Math.min(100, (elapsed / dur) * 100);
  document.getElementById('bar-fill').style.width = pct + '%';
  if(pct < 100) rafId = requestAnimationFrame(()=>animateBar(dur));
}

// ══════════════════════════════════════════════
// MIDI EXPORT — fixed encoder
// ══════════════════════════════════════════════

// one word plus date and time: a new name for every export, so the last file is never overwritten
function midiFileName(){
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return 'vell_' + d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + '_' + p(d.getHours()) + '-' + p(d.getMinutes()) + '.mid';
}

function exportMidi(){
  if(!sequence.length) return;
  const BPM = getBpm();
  const TPB = 480;
  const uspb = Math.round(60000000 / BPM); // microseconds per beat

  // Variable-length quantity encoder
  function vlq(n){
    n = n >>> 0; // ensure unsigned
    if(n === 0) return [0x00];
    const bytes = [];
    bytes.push(n & 0x7f); n >>= 7;
    while(n > 0){ bytes.unshift((n & 0x7f) | 0x80); n >>= 7; }
    return bytes;
  }

  function u32be(n){ return [(n>>>24)&0xff,(n>>>16)&0xff,(n>>>8)&0xff,n&0xff] }
  function u16be(n){ return [(n>>>8)&0xff, n&0xff] }
  function u24be(n){ return [(n>>>16)&0xff,(n>>>8)&0xff,n&0xff] }

  const track2 = [];
  track2.push(...vlq(0), 0xff, 0x51, 0x03, ...u24be(uspb));
  track2.push(...vlq(0), 0xc0, 0x00);

  let pendingGap = 0;

  for(const item of sequence){
    const durTicks = Math.round(item.dur * TPB);
    const gapTicks = Math.round(TPB * 0.18);
    const vel = 62;
    const notes = [bassNote(item.bassPc ?? item.rootPc), ...item.notes];   // bass first, as in playback

    // Note-on for all notes; first carries any pending gap
    for(let i = 0; i < notes.length; i++){
      track2.push(...vlq(i === 0 ? pendingGap : 0), 0x90, notes[i], vel);
    }
    pendingGap = 0;

    // Note-off after durTicks
    for(let i = 0; i < notes.length; i++){
      track2.push(...vlq(i === 0 ? durTicks : 0), 0x80, notes[i], 0x00);
    }

    pendingGap = gapTicks;
  }

  // End of track
  track2.push(...vlq(0), 0xff, 0x2f, 0x00);

  // Assemble file
  const header = [
    0x4d,0x54,0x68,0x64,   // "MThd"
    ...u32be(6),            // header chunk length = 6
    ...u16be(0),            // format 0
    ...u16be(1),            // 1 track
    ...u16be(TPB),          // ticks per beat
  ];

  const trackChunk = [
    0x4d,0x54,0x72,0x6b,   // "MTrk"
    ...u32be(track2.length),
    ...track2,
  ];

  const fileBytes = new Uint8Array([...header, ...trackChunk]);
  const blob = new Blob([fileBytes], { type: 'audio/midi' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = midiFileName(); a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ══════════════════════════════════════════════
// KEYBOARD SHORTCUTS
// ══════════════════════════════════════════════

document.addEventListener('keydown', e => {
  if(e.code === 'Space'){
    e.preventDefault();
    e.stopImmediatePropagation();
    toggleAutoplay();
  }
}, true); // capture phase — fires before any element handles it

// Blur sliders/selects after interaction so spacebar is never eaten by them
document.addEventListener('pointerup', e => {
  if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')){
    e.target.blur();
  }
}, { passive: true });
// ══════════════════════════════════════════════

const DT=[
  {iv:[0,4,7,11,14],fn:(r)=>({r,q:'maj9'})},{iv:[0,3,7,10,14],fn:(r)=>({r,q:'min9'})},
  {iv:[0,4,7,11],fn:(r)=>({r,q:'maj7'})},{iv:[0,3,7,10],fn:(r)=>({r,q:'min7'})},
  {iv:[0,4,7],fn:(r)=>({r,q:'maj'})},{iv:[0,3,7],fn:(r)=>({r,q:'min'})},
  {iv:[0,5,7],fn:(r)=>({r,q:'sus4'})},{iv:[0,2,7],fn:(r)=>({r,q:'sus2'})},
  {iv:[0,3,6],fn:(r)=>({r,q:'dim'})},
];
let midiNotes=new Set(),midiT=null;
function detectMidi(notes){
  const pcs=[...new Set([...notes].map(m=>m%12))];if(pcs.length<2)return;
  let best=null,bs=-1;
  for(let root=0;root<12;root++){
    const ivs=pcs.map(p=>(p-root+12)%12).sort((a,b)=>a-b);
    for(const t of DT){
      const m=t.iv.filter(i=>ivs.includes(i%12)).length;
      const sc=m/t.iv.length;
      if(m>=Math.min(t.iv.length,pcs.length)&&sc>bs){bs=sc;best=t.fn(root)}
    }
  }
  if(best){selectRoot(best.r);selectQuality(best.q)}
}
if(navigator.requestMIDIAccess){
  navigator.requestMIDIAccess().then(acc=>{
    function conn(){for(const inp of acc.inputs.values())inp.onmidimessage=e=>{
      const[st,note,vel]=e.data,type=st&0xf0;
      if(type===0x90&&vel>0)midiNotes.add(note);
      else if(type===0x80||(type===0x90&&vel===0))midiNotes.delete(note);
      clearTimeout(midiT);midiT=setTimeout(()=>detectMidi(midiNotes),100);
    }}
    conn();acc.onstatechange=()=>conn();
  }).catch(()=>{});
}

// ══════════════════════════════════════════════
// GENERATOR UI
// ══════════════════════════════════════════════
function setBass(v){
  selectedBass = v === '' ? null : parseInt(v);
  if(selectedRoot !== null && selectedQuality !== null){ updateCurrent(); if(currentNotes.length) playChord(currentNotes, selectedBass ?? selectedRoot); }
}
function setBassSelect(){
  const el = document.getElementById('bass-select'); if(!el) return;
  el.value = selectedBass === null ? '' : String(selectedBass);
}
function buildBassSelect(){
  const el = document.getElementById('bass-select');
  el.innerHTML = '<option value="">root</option>' + ROOTS.map(p => `<option value="${p}">${pcName(p)}</option>`).join('');
}
function toggleLock(idx){
  if(!sequence[idx]) return;
  sequence[idx].locked = !sequence[idx].locked;
  renderSequence();
}
function rerollItem(idx){
  if(!sequence[idx] || sequence[idx].locked) return;
  const it = rerollOne(sequence, idx);
  sequence[idx] = it;
  renderSequence(); refreshSuggestions();
  playSequenceItem(it);
}
function generateProgression(){
  cancelEdit();
  const dur = parseFloat(document.getElementById('dur-slider').value);
  const sel = (sequence.length === 0 && selectedRoot !== null && selectedQuality !== null)
    ? { rootPc: selectedRoot, qualityKey: selectedQuality, bassPc: selectedBass, notes: voiceChord(selectedRoot, selectedQuality, selectedBass, null, GEN.style), plane: false }
    : null;
  sequence = generateItems(sequence, sel, dur);
  editingIdx = null;
  renderSequence(); refreshSuggestions();
  if(autoPlaying) stopAutoplay();
  startAutoplay();
}
function extendProgression(){
  cancelEdit();
  if(!sequence.length){ generateProgression(); return; }
  const dur = parseFloat(document.getElementById('dur-slider').value);
  const add = GEN.len, N = sequence.length + add, res = sequence.slice();
  for(let k = 0; k < add; k++){
    const ranked = genRank(res.slice(-3), { pos: res.length, N, all: res });
    res.push(genItem(maybePedal(genPick(ranked), res.slice(-3)), dur));
  }
  const first = sequence.length;
  sequence = res;
  renderSequence(); refreshSuggestions();
  const items = document.querySelectorAll('.seq-item');
  for(let i = first; i < items.length; i++){ items[i].style.borderColor = 'var(--amber)'; setTimeout(((el) => () => el.style.borderColor = '')(items[i]), 700); }
  const list = document.getElementById('seq-list'); list.scrollTop = list.scrollHeight;
  if(items[first]) items[first].scrollIntoView({block:'nearest', behavior:'smooth'});
  playSequenceItem(sequence[first]);
}
function markExt(){ const b = document.getElementById('gen-ext'); if(b) b.textContent = '+ ' + GEN.len; }
function initGenUI(){
  const seg = document.getElementById('gen-len');
  const markLen = () => { seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', parseInt(b.dataset.v) === GEN.len)); markExt(); };
  seg.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { GEN.len = parseInt(b.dataset.v); markLen(); genSave(); }));
  markLen();
  const bind = (id, key) => { const el = document.getElementById(id); el.value = GEN[key]; el.addEventListener('input', () => { GEN[key] = key === 'style' ? el.value : parseInt(el.value); genSave(); if(key === 'style') refreshSuggestions(); }); };
  bind('gen-color', 'color'); bind('gen-surprise', 'surprise'); bind('gen-style', 'style');
  buildBassSelect();
}

// ══════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════
buildRootGrid();
buildQualityGrid();
buildKeyboard();
initGenUI();
