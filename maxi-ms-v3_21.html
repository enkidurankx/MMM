<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#171613">
<title>maxi.MS v3.21</title>
<style>
:root{
  /* night (default) */
  --panel:#171613;
  --module:#201e1a;
  --module-hi:#282520;
  --line:#33302a;
  --legend:#e9e3d4;
  --label:#8c8573;
  --dim:#8c8573;
  /* accent tracks the filter CHARACTER knob: amber (ladder) -> hot red (sallen-key) */
  --accent:#ffae3a;
  --accent-2:#c98226;
  --accent-dim:rgba(255,174,58,.22);
  --on-accent:#14120e;
  --well:#141310;
  --deep:#0e0d0b;
  --footer:#131210;
  --knob-track:#2d2a25;
  --edge:#35312b;
  --led-off:#2c2925;
  --white-key:linear-gradient(#d9d2c1,#b7b0a0);
  --black-key:linear-gradient(#1d1b18,#0b0a09);
  --diag-bg:#3a1412;
  --diag-line:#ff5d5d;
  --diag-fg:#ffb4b4;
  --info-bg:#1d2118;

  /* density scale — one place to retune the whole panel */
  --gap:8px;
  --mod-pad:9px;
  --knob-col:64px;    /* min width of a knob cell; drives how many pack per row */
  --knob-max:78px;    /* cap so a knob never balloons in a wide module */
  --hit:44px;         /* minimum comfortable touch target */
  --grab:32px;        /* empty strip at the right to drag the panel by */
}
/* day — a daylight silkscreen panel, not an inverted one */
/* Day theme: cool neutral grey instead of the old beige. The panel recedes to
   a soft slate, the modules come forward as near-white cards, and the text is
   a cool near-black. Everything stays desaturated so the section hues and the
   filter accent are the only colour on screen — which is the point of them. */
body.day{
  --panel:#dfe4ea;
  --module:#f6f8fa;
  --module-hi:#ffffff;
  --line:#ccd3dc;
  --legend:#141922;
  --label:#3c4655;
  --dim:#59636f;
  --on-accent:#ffffff;
  --well:#e4e9ef;
  --deep:#c3cbd5;
  --footer:#dbe1e8;
  --knob-track:#c8d0da;
  --edge:#a7b2bf;
  --led-off:#bfc8d3;
  --white-key:linear-gradient(#ffffff,#eaeef3);
  --black-key:linear-gradient(#333b45,#171c23);
  --diag-bg:#fdeceb;
  --diag-line:#c0392b;
  --diag-fg:#8a2820;
  --info-bg:#e9f1ea;
}
/* ---------- section colours ----------
   Each page owns a hue so you can tell where you are at a glance. The FILTER
   page is deliberately not a fixed colour: it stays tied to --accent, which
   tracks the lowpass circuit (amber ladder -> hot red sallen-key). That signal
   predates this palette and is worth more than uniformity.
   Chosen off the warm panel: gold, green, teal, violet, steel, rose — spaced
   far enough apart to read instantly, desaturated enough to sit on the
   silkscreen without turning the thing into a toy. */
/* Every section carries its own hue, so the whole scroll is colour-mapped at
   once rather than one page at a time. body[data-page] mirrors whichever
   section you are currently inside, for the header strip and the drag HUD. */
body,.sect{--sec:var(--accent)}
[data-sec="0"],body[data-page="0"]{--sec:#e0a83c}   /* osc    — gold  */
[data-sec="1"],body[data-page="1"]{--sec:var(--filt)} /* filter — own hue, still circuit-tracking */
[data-sec="2"],body[data-page="2"]{--sec:#4fb2c9}   /* env    — teal  */
[data-sec="3"],body[data-page="3"]{--sec:#74b96a}   /* mod    — green (LFOs) */
[data-sec="4"],body[data-page="4"]{--sec:#9a86d4}   /* voice  — violet*/
[data-sec="5"],body[data-page="5"]{--sec:#8fa0b8}   /* out    — steel */
[data-sec="6"],body[data-page="6"]{--sec:#d97ba8}   /* arp    — rose  */
body.day [data-sec="0"],body.day[data-page="0"]{--sec:#96620a}
body.day [data-sec="2"],body.day[data-page="2"]{--sec:#0f6a80}
body.day [data-sec="3"],body.day[data-page="3"]{--sec:#2d7440}
body.day [data-sec="4"],body.day[data-page="4"]{--sec:#57409f}
body.day [data-sec="5"],body.day[data-page="5"]{--sec:#48596e}
body.day [data-sec="6"],body.day[data-page="6"]{--sec:#a03468}

nav button[data-p="0"]{--tabc:#e0a83c}
nav button[data-p="1"]{--tabc:var(--filt)}
nav button[data-p="2"]{--tabc:#4fb2c9}
nav button[data-p="3"]{--tabc:#74b96a}
nav button[data-p="4"]{--tabc:#9a86d4}
nav button[data-p="5"]{--tabc:#8fa0b8}
nav button[data-p="6"]{--tabc:#d97ba8}
body.day nav button[data-p="0"]{--tabc:#96620a}
body.day nav button[data-p="2"]{--tabc:#0f6a80}
body.day nav button[data-p="3"]{--tabc:#2d7440}
body.day nav button[data-p="4"]{--tabc:#57409f}
body.day nav button[data-p="5"]{--tabc:#48596e}
body.day nav button[data-p="6"]{--tabc:#a03468}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html{height:100%;max-width:100%;overflow-x:hidden}
body{
  height:100vh;
  height:100dvh;
  overflow:hidden;overscroll-behavior:none;
  background:var(--panel);
  color:var(--legend);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;
  touch-action:manipulation;
  user-select:none;-webkit-user-select:none;
}
.lbl{
  font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--label);
}
.val{font-family:ui-monospace,SFMono-Regular,"Roboto Mono",monospace;font-size:11px;color:var(--legend);letter-spacing:.02em}

/* ---------- header ---------- */
header{
  position:relative;
  display:flex;align-items:center;gap:8px;min-width:0;max-width:100%;
  padding:calc(env(safe-area-inset-top) + 6px) 10px 6px;
  border-bottom:1px solid var(--line);
  flex:0 0 auto;
}
/* the top edge takes the colour of whichever section you are scrolled into */
header:after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;
  background:var(--sec);transition:background .18s;
}
@media (min-width:760px){ header{padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;gap:12px} }
.brand{min-width:0;flex:1 1 auto;overflow:hidden}
.wordmark{
  font-size:clamp(13px,3.4vw,16px);font-weight:800;letter-spacing:.12em;
  color:var(--legend);white-space:nowrap;
}
.wordmark em{font-style:normal;color:var(--accent);transition:color .12s}
.sub{
  font-size:10px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
/* the spec line goes first — it is documentation, not a control */
@media (max-width:700px){ .sub{display:none} }
.leds{display:flex;gap:4px;margin-left:auto;align-items:center;flex:0 0 auto}
@media (max-width:430px){ .leds{display:none} }
.led{width:6px;height:6px;border-radius:1px;background:var(--led-off);transition:background .05s,box-shadow .05s}
.led.on{background:var(--accent);box-shadow:0 0 6px var(--accent)}
#power,#theme,#patch{
  border:1px solid var(--line);background:var(--module);color:var(--label);
  font-size:10px;font-weight:700;letter-spacing:.12em;border-radius:2px;
  padding:0 11px;min-height:var(--hit);flex:0 0 auto;
}
@media (max-width:400px){ #power,#theme,#patch{padding:0 8px;letter-spacing:.06em} }
#patch{color:var(--legend)}
#power.live{color:var(--accent);border-color:var(--accent-dim)}

/* ---------- tabs ---------- */
nav{
  display:flex;flex:0 0 auto;border-bottom:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none;
}
nav button .dot{
  display:none;width:7px;height:7px;border-radius:50%;background:var(--tabc);flex:0 0 auto;
}
nav::-webkit-scrollbar{display:none}
nav button{
  position:relative;
  flex:1 0 auto;background:none;border:0;border-bottom:2px solid transparent;
  color:var(--dim);padding:0 15px;min-height:var(--hit);
  font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
}
/* the faint bar teaches the page->colour mapping before you get there */
nav button:after{
  content:"";position:absolute;left:9px;right:9px;bottom:0;height:2px;
  background:var(--tabc);opacity:.24;transition:opacity .12s;
}
nav button.sel:after{opacity:1}
@media (min-width:620px) and (max-width:899px){ nav button{flex:1 1 0;padding:0 8px} }
@media (max-width:519px){
  nav{mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 28px),transparent);
      -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 28px),transparent)}
}
nav button.sel{color:var(--legend)}

/* ---------- panels ---------- */
main{
  flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
  /* right gutter deliberately empty: somewhere to put a thumb and drag the
     panel without landing on a knob. The dotted rail marks it.
     Deep bottom padding so the last row always clears the keyboard. */
  padding:0 var(--grab) 78px var(--gap);
  touch-action:pan-y;scroll-behavior:smooth;
  background-image:repeating-linear-gradient(to bottom,var(--line) 0 4px,transparent 4px 11px);
  background-repeat:no-repeat;
  background-size:2px calc(100% - 20px);
  background-position:right calc(var(--grab)/2 - 1px) top 10px;
}
@media (hover:hover) and (pointer:fine){ :root{--grab:16px} }
@media (prefers-reduced-motion:reduce){ main{scroll-behavior:auto} }
/* ---------- sections ----------
   One continuous panel. Each section is a colour-banded band with a sticky
   heading, so the colour and the name of where you are stay on screen the
   whole time you are inside it — no tab to look back up at. */
.sect{
  max-width:1180px;margin:0 auto var(--gap);
  scroll-margin-bottom:80px;
  border-left:3px solid var(--sec);
  border-radius:0 3px 3px 0;
  scroll-margin-top:2px;
  position:relative;
}
/* section tint via opacity rather than color-mix, so it also renders on
   older iPad Safari instead of the declaration being dropped wholesale */
.sect:before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:linear-gradient(90deg,var(--sec),transparent 280px);
  opacity:.07;border-radius:0 3px 3px 0;
}
.sect > *{position:relative;z-index:1}
.sect > h2{
  position:sticky;top:0;z-index:6;
  display:flex;align-items:center;gap:9px;
  padding:7px 10px 7px 9px;
  background:var(--panel);
  border-bottom:1px solid var(--line);
  font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
  color:var(--sec);
}
.sect > h2:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sec);flex:0 0 auto}
.sect > h2:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--sec),transparent)}
.mods{
  column-width:clamp(140px,40vw,206px);
  column-gap:var(--gap);
  padding:var(--gap) 6px;
}
.mods > .mod{
  break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid;
  margin:0 0 var(--gap);
}
/* prose and wide readouts run the full width instead of sitting in a column */
.mod.wide{column-span:all}

/* ---------- modulation matrix ----------
   destination down the left, one column per LFO. The two columns are tinted
   apart so a glance tells you which LFO an amount belongs to. */
.mx{
  display:grid;grid-template-columns:minmax(64px,1fr) minmax(58px,78px) minmax(58px,78px);
  gap:4px 6px;align-items:center;
}
.mxh{
  font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--label);text-align:center;padding-bottom:2px;
}
.mxh.a{color:var(--mxa)} .mxh.b{color:var(--mxb)}
.mxd{
  font-size:10px;line-height:1.25;color:var(--legend);letter-spacing:.03em;
  padding-right:2px;
}
.mxc{border-radius:3px;padding:3px 2px}
.mxc.a{background:var(--mxa-bg)} .mxc.b{background:var(--mxb-bg)}
.mxc .knob{gap:1px}
.mxc .knob .lbl{display:none}          /* the row already names it */
.mxc .knob svg{max-width:52px}
.mxc.a .karc{stroke:var(--mxa)}
.mxc.b .karc{stroke:var(--mxb)}
.mxc .val{font-size:10px}
:root{
  --mxa:#e0a83c; --mxb:#4fb2c9;
  --mxa-bg:rgba(224,168,60,.10); --mxb-bg:rgba(79,178,201,.10);
}
body.day{
  --mxa:#96620a; --mxb:#0f6a80;
  --mxa-bg:rgba(150,98,10,.09); --mxb-bg:rgba(15,106,128,.09);
}
.mod{
  display:block;
  background:var(--module);border:1px solid var(--line);border-radius:3px;
  padding:var(--mod-pad);
}
.mod > h3{
  font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--label);margin-bottom:8px;display:flex;align-items:center;gap:8px;
}
.mod > h3:before{
  content:"";width:3px;height:10px;border-radius:1px;background:var(--sec);flex:0 0 auto;
}
.mod > h3:after{
  content:"";flex:1;height:1px;
  background:linear-gradient(90deg,var(--sec),var(--line) 42%);
}

/* THE density fix: knobs pack side by side and fill the module instead of
   each taking a full-width line. Switches and toggles still span the row,
   so the MS-20 reading order (mode first, then its knobs) is unchanged. */
.row{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(var(--knob-col),1fr));
  gap:10px 7px;align-items:start;
}
.row > .sw{grid-column:1/-1}

/* ---------- knob ---------- */
.knob{display:flex;flex-direction:column;align-items:center;gap:3px;padding:0}
.knob svg{width:100%;max-width:var(--knob-max);height:auto;display:block;touch-action:none;margin-inline:auto}
.knob .lbl{text-align:center;line-height:1.25}
.knob .val{color:var(--dim);font-variant-numeric:tabular-nums}
.knob.act .val{color:var(--sec)}
.knob.fine .val::after{content:" ·f";color:var(--dim)}
.kbg{fill:none;stroke:var(--knob-track);stroke-width:5;stroke-linecap:round}
.karc{fill:none;stroke:var(--sec);stroke-width:5;stroke-linecap:round;transition:stroke .12s}
.kdot{stroke:var(--legend);stroke-width:2.4;stroke-linecap:round}
.kcap{fill:var(--well);stroke:var(--edge);stroke-width:1}
.ktick{stroke:var(--label);stroke-width:1;opacity:.6}

/* ---------- MIDI Learn ---------- */
.knob,.sw{position:relative}
.ccbadge{position:absolute;top:-2px;right:-2px;font:700 8px/1 ui-monospace,monospace;
  letter-spacing:.02em;color:var(--on-accent);background:var(--accent);
  border-radius:2px;padding:1px 3px;pointer-events:none;z-index:3;white-space:nowrap}
body.learn .knob,body.learn .sw{cursor:crosshair}
body.learn .knob svg,body.learn .swopts,body.learn .tog{outline:1px dashed var(--accent-dim);outline-offset:2px}
.learnsel .kcap,.learnsel .swopts,.learnsel.sw button.tog{animation:learnpulse .8s ease-in-out infinite}
.learnsel .val,.learnsel .lbl{color:var(--accent)!important}
@keyframes learnpulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.6)}}
.midirow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:2px 0}
.mbtn{border:1px solid var(--line);background:var(--well);color:var(--dim);border-radius:2px;
  padding:0 12px;min-height:var(--hit);font:700 10px/1 inherit;letter-spacing:.07em;text-transform:uppercase;cursor:pointer}
.mbtn.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.midihint{flex:1 1 220px;min-width:180px;font-size:10px;color:var(--dim);line-height:1.4}

/* ---------- switch ---------- */
.sw{display:flex;flex-direction:column;gap:4px;min-width:0}
.sw .lbl{padding-left:1px}
.swopts{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:2px;overflow:hidden;background:var(--well)}
.swopts button{
  flex:1 1 0;min-width:52px;background:none;border:0;color:var(--dim);
  padding:0 4px;min-height:var(--hit);
  font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
}
.swopts button.sel{background:var(--sec);color:var(--on-accent)}
.tog{
  border:1px solid var(--line);background:var(--well);color:var(--dim);border-radius:2px;
  padding:0 6px;min-height:var(--hit);
  font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;width:100%;
}
.tog.on{background:var(--sec);color:var(--on-accent);border-color:var(--sec)}

/* ---------- presets ---------- */
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{
  background:var(--well);border:1px solid var(--line);color:var(--label);border-radius:2px;
  padding:0 13px;min-height:var(--hit);font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
}
.chips button.sel{border-color:var(--sec);color:var(--sec)}
.note b{color:var(--label);font-weight:700}

/* ---------- keyboard ---------- */
footer{flex:0 0 auto;border-top:1px solid var(--line);background:var(--footer);padding-bottom:env(safe-area-inset-bottom)}
.kbtools{display:flex;align-items:center;gap:6px;padding:5px 8px;max-width:1180px;margin-inline:auto}
.kbtools button{
  background:var(--module);border:1px solid var(--line);color:var(--label);border-radius:2px;
  padding:0 12px;min-height:38px;font-size:10px;font-weight:700;letter-spacing:.1em;flex:0 0 auto;
}
.kbtools button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
#octlabel{font-family:ui-monospace,monospace;font-size:11px;color:var(--dim);min-width:28px;text-align:center}
#modstrip{
  flex:1;height:34px;background:var(--deep);border:1px solid var(--line);border-radius:2px;
  position:relative;overflow:hidden;touch-action:none;
}
#modfill{position:absolute;left:0;top:0;bottom:0;width:0%;background:var(--accent-dim);border-right:1px solid var(--accent)}
#modstrip span{
  position:absolute;left:7px;top:50%;transform:translateY(-50%);
  font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--dim);pointer-events:none;
}
#keys{position:relative;height:clamp(78px,14vh,132px);touch-action:none;display:flex;background:var(--deep)}
.wk{
  flex:1;border-right:1px solid var(--deep);background:var(--white-key);
  border-radius:0 0 2px 2px;position:relative;
}
.wk.dn{background:linear-gradient(var(--accent),var(--accent-2))}
.bk{
  position:absolute;top:0;height:62%;width:8%;background:var(--black-key);
  border-radius:0 0 2px 2px;z-index:2;box-shadow:0 2px 3px rgba(0,0,0,.6);
}
.bk.dn{background:linear-gradient(var(--accent-2),var(--accent))}

.stat{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:baseline;max-width:420px}
.stat > div{display:contents}
.stat span{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--label)}
.stat b{font-family:ui-monospace,monospace;font-size:10px;font-weight:400;color:var(--legend);text-align:right}
#diag{
  position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;
  background:var(--diag-bg);border-top:1px solid var(--diag-line);color:var(--diag-fg);
  font-family:ui-monospace,monospace;font-size:10px;line-height:1.5;padding:8px 10px;
  max-height:34vh;overflow:auto;
}
#diag.info{background:var(--info-bg);border-top-color:var(--accent);color:var(--legend)}
/* ---------- drag HUD: your thumb covers the knob, so the value reads up here ---------- */
#hud{
  position:fixed;left:50%;transform:translateX(-50%);
  top:calc(env(safe-area-inset-top) + 96px);
  z-index:40;display:none;align-items:baseline;gap:10px;pointer-events:none;
  background:var(--module-hi);border:1px solid var(--edge);border-radius:3px;
  padding:10px 14px;box-shadow:0 4px 18px rgba(0,0,0,.35);
}
#hud.show{display:flex}
#hud span{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--label)}
#hud b{font-family:ui-monospace,monospace;font-size:20px;font-weight:400;color:var(--sec);font-variant-numeric:tabular-nums}
#hud.fine b:after{content:" ·f";font-size:11px;color:var(--dim)}

/* ---------- patch sheet ---------- */
#sheet{position:fixed;inset:0;z-index:45;display:none;background:rgba(0,0,0,.45)}
#sheet.open{display:block}
#sheetbox{
  position:absolute;left:0;right:0;bottom:0;
  background:var(--module);border-top:1px solid var(--edge);border-radius:8px 8px 0 0;
  padding:14px 14px calc(env(safe-area-inset-bottom) + 16px);
  max-height:62vh;overflow-y:auto;
}
#sheetbox h3{
  font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--label);margin-bottom:12px;display:flex;align-items:center;gap:8px;
}
#sheetbox h3:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--sec),var(--line) 42%)}
#sheetbox .chips{gap:7px}
#sheetbox .chips button{flex:1 0 44%;padding:14px 12px;font-size:11px}
/* ---------- phone / narrow: the sections sit side by side and scroll sideways (like the RS-505 rack) ----------
   Each section keeps its own vertical scroll and its sticky heading. The next section peeks in at the right edge.
   From 900px up the panel is vertical again, everything on one page. */
@media screen{
  main{
    display:flex;flex-direction:row;align-items:stretch;gap:8px;
    overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;

<script>
"use strict";

/* ============================================================
   DSP — written as plain functions/classes so the exact same
   source can be injected into an AudioWorklet (via toString)
   or run on a ScriptProcessorNode fallback.
   Nothing here may close over outer scope.
   ============================================================ */

function fastTanh(x){
  if(x < -3) return -1;
  if(x >  3) return  1;
  const x2 = x*x;
  return x*(27+x2)/(27+9*x2);
}

function polyBlep(t, dt){
  if(t < dt){ t /= dt; return t+t - t*t - 1; }
  if(t > 1-dt){ t = (t-1)/dt; return t*t + t+t + 1; }
  return 0;
}

function fastTan(x){ // x in [0, ~1.3]
  if(x > 1.35) x = 1.35;
  const x2 = x*x;
  return x*(1 + x2*(0.33333333 + x2*(0.13333333 + x2*0.05396825)));
}

/* Saturator with UNITY small-signal gain. This matters: a plain tanh
   costs loop gain, which is exactly what stops a ladder self-oscillating.
   Normalising the slope at zero keeps the feedback loop able to reach
   unity, so resonance can tip over into oscillation and the saturator
   then limits its amplitude — which is what the hardware does. */
function satU(x){
  const y = x*0.7;
  if(y < -3) return -1.4285714;
  if(y >  3) return  1.4285714;
  const y2 = y*y;
  return (y*(27+y2)/(27+9*y2))*1.4285714;
}

/* Asymmetric near-hard clip — diode pair in the resonance path.
   Deliberately not smooth: the buzz and the even harmonics are the MS-20. */
function clipAsym(x){
  if(x >  1.00) return  1.00 + (x-1.00)*0.05;
  if(x < -0.78) return -0.78 + (x+0.78)*0.05;
  return x;
}

class Voice {
  constructor(sr, idx){
    this.sr = sr; this.idx = idx;
    this.active=false; this.held=false; this.note=-1; this.vel=1; this.age=0;
    this.freq=440; this.freqT=440; this.glideC=0;
    this.p1=Math.random(); this.p2=Math.random(); this.ps=Math.random();
    this.tri1=0; this.tri2=0;
    this.ea=0; this.eaS=0; this.em=0; this.emS=0;
    this.l1=0;this.l2=0;this.l3=0;this.l4=0;
    this.t1=0;this.t2=0;this.t3=0;this.t4=0;
    this.ic1=0;this.ic2=0;
    this.jc1=0; this.jc2=0; this.dcX=0; this.dcY=0;
    this.subCyc=0; this.oscDcX=0; this.oscDcY=0; this.osc2DcX=0; this.osc2DcY=0;
    this.lj1=0; this.lj2=0; this.la1=1; this.la2=1; this.lw1=0; this.lw2=0; this.lwT1=0; this.lwT2=0; this.pp0=0; this.pp1=0; this.pp2=0; this.sh1c=0;
    this.n0=0;this.n1=0;this.n2=0;
    this.lfoP=Math.random(); this.lfoRnd=0; this.lfoLast=0;
    this.lfo2P=Math.random(); this.lfo2Rnd=0;
    this.shP=0; this.shV=0; this.shSm=0;
    this.drA=0; this.drB=0; this.drAT=0; this.drBT=0; this.drCnt=0;
    this.tune=(Math.random()*2-1);
    this.cutErr=(Math.random()*2-1);
    this.timeErr=1+(Math.random()*2-1)*0.04;
    /* AGE: this voice's own component tolerances (envelope caps, VCA gain) and its own hum phase */
    this.envErr=(Math.random()*2-1); this.lvlErr=(Math.random()*2-1); this.humP=Math.random(); this.noteJit=1;
    this.pan=0; this.ctl=0;
    this.gL=0; this.kL=1; this.a1=0;this.a2=0;this.a3=0;
    this.h1=0;this.h2=0;this.h3=0; this.kH=1; this.hMake=1; this.hpOn=false;
    this.detune=0;
  }

  noteOn(note, vel, p, fromFreq){
    const f = 440*Math.pow(2,(note-69)/12);
    this.note=note; this.vel=vel; this.freqT=f;
    if(fromFreq>0 && p.glide>0.001){ this.freq=fromFreq; }
    else if(!this.active || p.glide<=0.001){ this.freq=f; }
    if(!this.active){
      if(p.osync>0.5){ this.p1=0; this.p2=0; this.ps=0; }
      else { this.p1=Math.random(); this.p2=Math.random(); this.ps=Math.random(); }
      if(p.lkey>0.5) this.lfoP=0;
      if(p.l2key>0.5) this.lfo2P=0;
      this.shP=0; this.subCyc=0;
    }
    /* AGE: every note starts a little differently, like envelopes built from real capacitors */
    this.noteJit = 1+(Math.random()*2-1)*0.07*(p.age||0);
    this.active=true; this.held=true; this.eaS=1; this.emS=1;
  }

  noteOff(){ this.held=false; this.eaS=4; this.emS=4; }

  env(cur, stage, cA, cD, s, cR){
    if(stage===1){
      cur = 1.28 + (cur-1.28)*cA;
      if(cur>=1){ cur=1; this.__next=2; } else this.__next=1;
    } else if(stage===2){
      cur = s + (cur-s)*cD;
      if(cur-s < 0.0008){ cur=s; this.__next=3; } else this.__next=2;
    } else if(stage===3){ cur=s; this.__next=3; }
    else if(stage===4){
      cur *= cR;
      this.__next = (cur<0.00003)?0:4;
      if(this.__next===0) cur=0;
    } else { cur=0; this.__next=0; }
    return cur;
  }

  render(L, R, n, p, gLfo, gLfo2){
    if(!this.active && this.ea<0.00002) return;
    const sr=this.sr;
    const os = p.os>0.5 ? 2 : 1;
    const srOS = sr*os;
    const nyq = srOS*0.45;
    const dcR = Math.max(0.99, 1 - 6.283185307*10/srOS);   /* SH-1 osc-bus DC blocker, ~10 Hz */
    const drift = p.drift;
    const age = p.age||0;
    const te = this.timeErr*(1+this.envErr*0.22*age)*this.noteJit;
    const humInc = 50/srOS, humAmt = age*0.006, hissAmt = age*0.004;
    const useNoise = p.noiselv>0.0001;
    const useRing  = p.ringlv >0.0001;
    const useSub   = p.sublv  >0.0001;
    /* SUB interval: -3rd, -5th, -oct, -oct-3rd, -oct-5th, -2 oct. Octaves can be divided off OSC 1 (SH-1 style);
       the other intervals run as their own square at that ratio. */
    const SUBST = [-4,-7,-12,-16,-19,-24];
    const subSt  = SUBST[Math.max(0,Math.min(5,Math.round(p.subint==null ? (p.suboct>0.5?5:2) : p.subint)))];
    const subDiv = subSt===-12 ? 2 : subSt===-24 ? 4 : 0;
    const subRat = Math.pow(2, subSt/12);

    /* control-rate cache — recomputed every 8 samples, not every sample */
    let cc=0;
    let cA=0,cD=0,cR=0,cMA=0,cMD=0,cMR=0,glideC=0,slewC=0,sh1n=1,sh2n=1;
    const m1 = p.osc1m|0, m2 = p.osc2m|0, on1 = p.osc1on>0.5?1:0, on2 = p.osc2on>0.5?1:0;
    let dt1=0,dt2=0,dtS=0,pw1=0.5,pw2=0.5,lfo=0,lfo2=0,sh=0,mw1=1,mw2=1;

    for(let i=0;i<n;i++){

      if(cc-- <= 0){
        cc = 7;
        /* 1.5195 = ln(1.28/0.28): attack reaches 1.0 in exactly aa seconds
           given the 1.28 overshoot target. 6.9078 = ln(1000): decay and
           release reach -60 dB in the stated time. Without this the knobs
           read as time constants and voices stay allocated ~10x too long. */
        cA =Math.exp(-1.5195/(Math.max(0.0005,p.aa*te)*sr));
        cD =Math.exp(-6.9078/(Math.max(0.0005,p.ad*te)*sr));
        cR =Math.exp(-6.9078/(Math.max(0.0008,p.ar*te)*sr));
        cMA=Math.exp(-1.5195/(Math.max(0.0005,p.ma*te)*sr));
        cMD=Math.exp(-6.9078/(Math.max(0.0005,p.md*te)*sr));
        cMR=Math.exp(-6.9078/(Math.max(0.0008,p.mr*te)*sr));
        glideC = p.glide>0.001 ? Math.exp(-8/(p.glide*sr)) : 0;
        slewC  = Math.exp(-8/(Math.max(0.0004,p.sslew)*sr));

        /* SH-1 drive normalisation. The saturator sits after the level knobs,
           so without this the levels set how HARD the bus is driven — i.e. the
           knob changed grit instead of loudness. Normalising to the default bus
           sum (0.85 + 0.60 + 0.35*0.8 = 1.73) keeps the drive character fixed
           while the knobs go back to being pure volume, and leaves the default
           patch bit-for-bit what it was. */
        /* per oscillator now (each oscillator has its own model): group 1 = OSC 1 + SUB, group 2 = OSC 2,
           each normalised to its own default sum so the level knobs stay pure volume */
        { let g1 = p.osc1lv*on1 + (useSub ? p.sublv*0.8 : 0);
          sh1n  = 1.13/(g1<0.05?0.05:g1);
          const g2 = p.osc2lv*on2; sh2n = 0.6/(g2<0.05?0.05:g2); }
        /* LIVE: a slow wander of its own per oscillator (a tired VCO that never quite sits still) */
        if(m1===2 || m2===2){
          if(Math.random()<0.02){ this.lwT1=Math.random()*2-1; this.lwT2=Math.random()*2-1; }
          this.lw1 += (this.lwT1-this.lw1)*0.004; this.lw2 += (this.lwT2-this.lw2)*0.004;
        }

        if(p.lkey>0.5){
          this.lfoP += p.lrate*8/sr;
          while(this.lfoP>=1){ this.lfoP-=1; this.lfoPrev=this.lfoRnd||0; this.lfoRnd=Math.random()*2-1; }
          lfo = this.shape(this.lfoP, p.lwave, this.lfoRnd||0, this.lfoPrev||0);
        } else lfo = gLfo;

        /* LFO 2 — dedicated to the two filter cutoffs. Deliberately NOT scaled
           by the MOD strip: LFO 1 stays the performance source under your thumb,
           LFO 2 is a standing movement you set and leave. */
        if(p.l2key>0.5){
          this.lfo2P += p.l2rate*8/sr;
          while(this.lfo2P>=1){ this.lfo2P-=1; this.lfo2Prev=this.lfo2Rnd||0; this.lfo2Rnd=Math.random()*2-1; }
          lfo2 = this.shape(this.lfo2P, p.l2wave, this.lfo2Rnd||0, this.lfo2Prev||0);
        } else lfo2 = gLfo2;

        /* Each LFO decides for itself whether the MOD strip scales it. Default
           is off — an LFO with a destination set is audible immediately.
           (Before this, every LFO 1 route was multiplied by modw, which starts
           at zero, so LFO 1 appeared to do nothing at all.) */
        mw1 = p.l1mod>0.5 ? p.modw : 1;
        mw2 = p.l2mod>0.5 ? p.modw : 1;

        this.shP += p.srate*8/sr;
        if(this.shP>=1){ this.shP-=1; this.shV=(p.ssrc>0.5)?lfo:(Math.random()*2-1); }
        this.shSm = this.shV + (this.shSm-this.shV)*slewC;
        sh = this.shSm;

        this.drCnt -= 8;
        if(this.drCnt<=0){
          this.drCnt=(sr*0.08)|0;
          this.drAT=Math.random()*2-1; this.drBT=Math.random()*2-1;
        }
        this.drA += (this.drAT-this.drA)*0.00128;
        this.drB += (this.drBT-this.drB)*0.00088;
        if(m1===1 || m2===1){ const wpk=Math.random()*2-1;
          this.pp0=0.9952*this.pp0+wpk*0.0400; this.pp1=0.9740*this.pp1+wpk*0.0929; this.pp2=0.8500*this.pp2+wpk*0.2100;
          this.sh1c=(this.pp0+this.pp1+this.pp2)*(4.0+6.0*drift); }   /* thermal 1/f drift — audible baseline + drift-knob scaling */
        else this.sh1c=0;

        this.freq = glideC>0 ? this.freqT + (this.freq-this.freqT)*glideC : this.freqT;

        const cents = this.tune*3*drift + this.drA*9*drift + this.detune
                    + sh*p.spitch*100 + this.em*(p.menvamt??1)*p.megpitch*100;
        const base = this.freq*p.bend*Math.pow(2,cents/1200);
        /* matrix: each oscillator has its own pitch sum, so an LFO can take
           one oscillator, the other, or both at once */
        const c1 = (lfo*p.l1p1*mw1 + lfo2*p.l2p1*mw2)*100 + (m1===1?this.sh1c:0) + (m1===2?this.lw1*14:0);
        const c2 = (lfo*p.l1p2*mw1 + lfo2*p.l2p2*mw2)*100 + (m2===1?this.sh1c:0) + (m2===2?this.lw2*14:0);
        const fo1 = Math.min(base*Math.pow(2,p.osc1oct)*Math.pow(2,c1/1200), nyq);
        const fo2 = Math.min(base*Math.pow(2,p.osc2oct)*Math.pow(2,(p.osc2det+this.drB*4*drift+c2)/1200), nyq);
        dt1=fo1/srOS; dt2=fo2/srOS; dtS=dt1*subRat;

        pw1 = 0.5 + p.osc1pw*0.45 + (lfo*p.l1w1*mw1 + lfo2*p.l2w1*mw2)*0.4 + sh*p.spw*0.4;
        pw1 = pw1<0.03?0.03:(pw1>0.97?0.97:pw1);
        pw2 = 0.5 + p.osc2pw*0.45 + (lfo*p.l1w2*mw1 + lfo2*p.l2w2*mw2)*0.4;
        pw2 = pw2<0.03?0.03:(pw2>0.97?0.97:pw2);
      }

      /* ---- per-sample envelopes (cached coefficients) ---- */
      this.ea = this.env(this.ea, this.eaS, cA, cD, p.as, cR); this.eaS=this.__next;
      this.em = this.env(this.em, this.emS, cMA, cMD, p.ms, cMR); this.emS=this.__next;
      if(this.eaS===0 && !this.held){ this.active=false; }

      let noise=0;
      if(useNoise){
        const w = Math.random()*2-1;
        this.n0 = 0.99765*this.n0 + w*0.0990460;
        this.n1 = 0.96300*this.n1 + w*0.2965164;
        this.n2 = 0.57000*this.n2 + w*1.0526913;
        const pink = (this.n0+this.n1+this.n2 + w*0.1848)*0.22;
        noise = w*(1-p.noisecol) + pink*p.noisecol;
      }

      let acc = 0;

      for(let k=0;k<os;k++){
        /* LIVE: every cycle runs a little long or short and a little loud or soft (jitter of an unstable core) */
        const d1 = m1===2 ? dt1*(1+this.lj1) : dt1, d2 = m2===2 ? dt2*(1+this.lj2) : dt2;
        const wrapped1 = (this.p1 + d1) >= 1;
        this.p1 += d1; if(this.p1>=1){ this.p1-=1; if(m1===2){ this.lj1=(Math.random()*2-1)*0.0035; this.la1=1+(Math.random()*2-1)*0.035; } }
        this.p2 += d2; if(this.p2>=1){ this.p2-=1; if(m2===2){ this.lj2=(Math.random()*2-1)*0.0035; this.la2=1+(Math.random()*2-1)*0.035; } }
        if(p.osync>0.5 && wrapped1 && dt1>0) this.p2 = this.p1*(dt2/dt1);

        const o1 = this.osc(this.p1, dt1, p.osc1w, pw1, 1);
        const o2 = this.osc(this.p2, dt2, p.osc2w, pw2, 2);

        let g1 = o1*p.osc1lv*on1, g2 = o2*p.osc2lv*on2;
        if(m1===2){ g1 = (fastTanh(g1*this.la1*1.25+0.06)-0.06)*0.82; }   /* LIVE: soft, slightly lopsided output stage */
        if(m2===2){ g2 = (fastTanh(g2*this.la2*1.25+0.06)-0.06)*0.82; }
        let mix = 0;
        if(useSub){
          let subph;
          if(m1===1 && subDiv){                         /* SH-1: sub derived from the master phase — flips on every 2nd (or 4th) master cycle */
            if(wrapped1){ this.subCyc++; if(this.subCyc>=subDiv) this.subCyc=0; }
            subph = (this.subCyc + this.p1)/subDiv;
          } else {
            this.ps += dtS; if(this.ps>=1) this.ps-=1;
            subph = this.ps;
          }
          let sub = (subph<0.5)?1:-1;
          sub += polyBlep(subph, dtS);
          let psh = subph-0.5; if(psh<0) psh+=1;
          sub -= polyBlep(psh, dtS);
          g1 += sub*p.sublv*0.8;       /* the sub belongs to OSC 1 (it is derived from it) */
        }
        /* SH-1 analog grit per oscillator: hard-ish ASYMMETRIC drive (even + odd harmonics) plus an extra
           even-harmonic term, then a 5-15 Hz DC blocker, ahead of the filter. */
        if(m1===1){
          let d = g1*sh1n*1.7;
          d = d>0 ? fastTanh(d) : fastTanh(d*1.6);
          d += 0.09*d*Math.abs(d);
          g1 = d*0.72/sh1n;
          const yb = g1 - this.oscDcX + dcR*this.oscDcY; this.oscDcX = g1; this.oscDcY = yb; g1 = yb;
        }
        if(m2===1){
          let d = g2*sh2n*1.7;
          d = d>0 ? fastTanh(d) : fastTanh(d*1.6);
          d += 0.09*d*Math.abs(d);
          g2 = d*0.72/sh2n;
          const yb = g2 - this.osc2DcX + dcR*this.osc2DcY; this.osc2DcX = g2; this.osc2DcY = yb; g2 = yb;
        }
        mix += g1 + g2;
        if(useNoise) mix += noise*p.noiselv*0.7;
        if(useRing)  mix += o1*o2*p.ringlv*Math.max(on1,on2);

        if(age>0){   /* AGE: mains hum (50 Hz with a little 150 Hz) and hiss under the oscillators, so the VCA gates it like on hardware */
          this.humP += humInc; if(this.humP>=1) this.humP-=1;
          const hp6 = this.humP*6.283185307;
          mix += humAmt*(Math.sin(hp6)+0.35*Math.sin(3*hp6)) + hissAmt*(Math.random()*2-1);
        }
        const f = this.filt(mix, p, lfo, sh, lfo2, mw1, mw2);
        acc = (k===0) ? f : 0.5*(acc+f);
      }

      /* ---- output stage ---- */
      let out = acc * this.ea * (0.35 + 0.65*this.vel) * (1 + this.lvlErr*0.11*age);
      out = fastTanh(out*1.1)*0.9;
      /* dc block */
      const y = out - this.dcX + 0.9975*this.dcY;
      this.dcX = out; this.dcY = y;
      out = y;

      L[i] += out*(1-this.pan)*0.5;
      R[i] += out*(1+this.pan)*0.5;
    }
  }

  shape(ph, wave, rnd, prev){
    if(wave===0) return Math.sin(ph*6.283185307);
    if(wave===1) return 1-4*Math.abs(ph-0.5);
    if(wave===2) return 2*ph-1;
    if(wave===3) return ph<0.5?1:-1;
    if(wave===5) return prev + (rnd-prev)*(0.5-0.5*Math.cos(ph*3.14159265));   /* smooth random: glides to each new value */
    return rnd;
  }

  osc(ph, dt, wave, pw, which){
    if(wave===0){                       /* saw */
      return 2*ph-1 - polyBlep(ph,dt);
    } else if(wave===1){                /* pulse */
      let o = (ph<pw)?1:-1;
      o += polyBlep(ph,dt);
      let p2 = ph-pw; if(p2<0) p2+=1;
      o -= polyBlep(p2,dt);
      return o;
    } else {                            /* triangle (integrated square) */
      let o = (ph<0.5)?1:-1;
      o += polyBlep(ph,dt);
      let p2 = ph-0.5; if(p2<0) p2+=1;
      o -= polyBlep(p2,dt);
      if(which===1){ this.tri1 += 4*dt*o; this.tri1 *= 0.9992; return this.tri1; }
      else { this.tri2 += 4*dt*o; this.tri2 *= 0.9992; return this.tri2; }
    }
  }

  /* ---- filter: MS-20 series highpass, then ONE of two lowpass models ---- */
  filt(x, p, lfo, sh, lfo2, mw1, mw2){
    const sr=this.sr, os = p.os>0.5?2:1, srOS=sr*os;
    const sem = p.fmodel>1.5, ms20 = p.fmodel>0.5 && !sem;

    if((this.ctl--)<=0){
      this.ctl = 15;
      const kt = 12*Math.log2(Math.max(20,this.freq)/261.63);

      /* ---- lowpass cutoff ---- */
      let semis = p.cutSemi + kt*p.ktrk
        + this.em*(p.menvamt??1)*p.egcut*84
        + this.ea*(p.aegcut||0)*84      /* amp envelope -> cutoff, in addition to the mod envelope */
        + (lfo*p.l1lp*mw1 + lfo2*p.l2lp*mw2)*72
        + sh*p.scut*72
        + (this.vel-0.5)*p.velcut*72
        + this.cutErr*2.5*p.drift;
      let fc = 16.35*Math.pow(2, semis/12);
      if(fc<12) fc=12; else if(fc>srOS*0.44) fc=srOS*0.44;

      this.gL = 1-Math.exp(-6.283185307*fc/srOS);

      const g = fastTan(3.14159265*Math.min(fc*(ms20?1.0729:1), srOS*0.45)/srOS);
      const kres = 1.9 - 2.15*p.res;
      this.a1 = 1/(1+g*(g+kres));
      this.a2 = g*this.a1;
      this.a3 = g*this.a2;
      this.kL = kres;
      /* SEM: the same state-variable core with positive damping only (it never screams), from very flat to a round peak */
      const gs = fastTan(3.14159265*Math.min(fc, srOS*0.45)/srOS), ks = 2.0 - 1.82*p.res;
      this.s1 = 1/(1+gs*(gs+ks)); this.s2 = gs*this.s1; this.s3 = gs*this.s2; this.kS = ks;

      /* ---- highpass: own cutoff, own peak, tracks the key if asked ----
         The MS-20's HPF is a second 12 dB/oct Sallen-Key with its own PEAK,
         not a gentle DC-blocking slope. It is the tool that keeps a screaming
         resonant patch from swamping everything below it, so it stays in
         circuit for the ladder model too. */
      let hsemi = 12*Math.log2(Math.max(8,p.hp)/16.35)
        + kt*p.hpktrk
        + this.em*(p.menvamt??1)*p.eghp*84
        + (lfo*p.l1hp*mw1 + lfo2*p.l2hp*mw2)*72
        + this.cutErr*2.0*p.drift;
      let fh = 16.35*Math.pow(2, hsemi/12);
      /* The diode clipper loads the resonance loop and pulls the highpass
         flat once it is driven hard — up to ~120 cents at full peak, and
         only near oscillation, where the clipper actually conducts. Fitted
         correction, within 4 cents across the range. */
      if(p.hpres > 0.895){
        const e = p.hpres - 0.895;
        fh *= Math.pow(2, (1313.75*e - 1583.96*e*e)/1200);
      }
      if(fh<8) fh=8; else if(fh>srOS*0.42) fh=srOS*0.42;
      this.hpOn = fh > 12;

      const gh = fastTan(3.14159265*fh/srOS);
      /* same negative-damping trick as the lowpass: past ~88% the highpass
         self-oscillates, which the hardware also does */
      const kh = 1.9 - 2.15*p.hpres;
      this.h1 = 1/(1+gh*(gh+kh));
      this.h2 = gh*this.h1;
      this.h3 = gh*this.h2;
      this.kH = kh;
      this.hMake = 1 + p.hpres*0.5;
    }

    let sig = x;

    /* ---- series highpass ---- */
    if(this.hpOn){
      const w3 = sig - this.jc2;
      const w1 = this.h1*this.jc1 + this.h2*w3;
      const w2 = this.jc2 + this.h2*this.jc1 + this.h3*w3;
      this.jc1 = clipAsym(2*w1 - this.jc1);
      this.jc2 = 2*w2 - this.jc2;
      sig = (sig - this.kH*w1 - w2) * this.hMake;
      if(sig >  6) sig =  6; else if(sig < -6) sig = -6;
    }

    /* input drive — the MS-20 overloads far earlier than the Moog */
    const dr = 1 + p.drv*(ms20 ? 20 : sem ? 6 : 11);
    sig = satU(sig*dr) * (1/(1+p.drv*(ms20?3.0:sem?1.4:2.2)));

    let out;

    if(sem){
      /* Oberheim SEM style: 12 dB/oct state-variable lowpass, soft and round. Linear integrators with a gentle
         tanh on the band state only, so a high peak rounds off instead of clipping; no self-oscillation. */
      const v3 = sig - this.ic2;
      const v1 = this.s1*this.ic1 + this.s2*v3;
      const v2 = this.ic2 + this.s2*this.ic1 + this.s3*v3;
      this.ic1 = 2*v1 - this.ic1; this.ic1 = this.ic1>3 ? 3 : this.ic1<-3 ? -3 : this.ic1;
      this.ic1 = 1.6*Math.tanh(this.ic1/1.6);
      this.ic2 = 2*v2 - this.ic2;
      out = v2 * (1 - 0.25*p.res);
    } else if(ms20){
      /* Sallen-Key lowpass: 12 dB/oct, negative damping, diode limiter */
      const v3 = sig - this.ic2;
      const v1 = this.a1*this.ic1 + this.a2*v3;
      const v2 = this.ic2 + this.a2*this.ic1 + this.a3*v3;
      this.ic1 = clipAsym(2*v1 - this.ic1);
      this.ic2 = 2*v2 - this.ic2;
      /* No resonance makeup here. There used to be a *(1 + res*1.4) term, up to
         2.4x, but the raw filter is already level-flat across resonance
         (measured 0.500 -> 0.567 RMS from res 0 to 0.85). The makeup was
         compensating for a loss that does not happen, so it just slammed the
         master stage: at res 1 the Sallen-Key ran 18x hotter than the ladder
         and peaked at 4.6x the input. The scream comes from the resonance
         peak, which is untouched — only the surplus level is gone. */
      /* strim: manual Sallen-Key output trim (default 1.0 = no change).
         Sallen runs hotter than the ladder at high resonance by design
         (12 dB passes more energy than 24 dB, and the ladder loses level
         with resonance). This is a by-ear match knob, not a measured fix. */
      out = v2 * p.strim;
    } else {
      /* transistor ladder: 24 dB/oct, saturating stages, k>4 oscillates */
      const k = p.res*4.5;
      const g = this.gL;
      const u = satU(sig - k*this.l4);
      this.l1 += g*(u       - this.t1);  this.t1 = satU(this.l1);
      this.l2 += g*(this.t1 - this.t2);  this.t2 = satU(this.l2);
      this.l3 += g*(this.t2 - this.t3);  this.t3 = satU(this.l3);
      this.l4 += g*(this.t3 - this.t4);  this.t4 = satU(this.l4);
      if(this.l4 >  4) this.l4 =  4;
      else if(this.l4 < -4) this.l4 = -4;
      out = this.l4;
    }

    out += 1e-18;      /* denormal guard */
    return out;
  }
}

class Engine {
  constructor(sr){
    this.sr=sr;
    this.voices=[];
    for(let i=0;i<8;i++) this.voices.push(new Voice(sr,i));
    this.p=null;
    /* Continuous params glide to their target instead of jumping. The UI can
       only send a value per pointermove (~60/s); landing those raw is what
       made cutoff and level sweeps sound stepped. Kept as a plain array on
       the instance so the DSP region stays closure-free. */
    this.smKeys=['osc1lv','osc2lv','sublv','noiselv','ringlv','noisecol',
                 'osc1pw','osc2pw','osc2det','cutSemi','res','drv','strim','hp','hpres',
                 'ktrk','hpktrk','egcut','aegcut','eghp','velcut','scut',
                 'l1p1','l1p2','l1w1','l1w2','l1lp','l1hp',
                 'l2rate','l2p1','l2p2','l2w1','l2w2','l2lp','l2hp',
                 'spitch','spw','megpitch','menvamt','drift','age','vol','modw'];
    this.smT=null;
    this.counter=0;
    this.gPhase=0; this.gRnd=0; this.gPrev=0;
    this.g2Phase=0; this.g2Rnd=0; this.g2Prev=0;
    this.lastFreq=0;
    this.stack=[];
    this.seq=[]; this.arpIdx=0; this.arpPhase=0; this.arpNote=-1; this.arpDirty=true;
    this.meter=[0,0,0,0];   /* 4 LEDs, each showing a pair of the 8 voices */
    this.frame=0;
  }
  handle(m){
    if(m.t==='init'){
      this.p=m.p; this.applyVoiceLayout();
      this.smT={}; for(const k of this.smKeys) this.smT[k]=this.p[k];
    }
    else if(m.t==='p'){
      /* smoothed keys move a target; process() glides the real value there */
      const sk = (m.k==='cut') ? 'cutSemi' : m.k;
      if(this.smT && this.smT[sk]!==undefined){
        this.smT[sk]=m.v;
        if(m.k==='cut') this.p.cut=m.v;
        return;
      }
      this.p[m.k]=m.v;
      if(m.k==='mode'||m.k==='spread'||m.k==='uni') this.applyVoiceLayout();
      if(m.k==='arpmode'||m.k==='arpoct') this.arpDirty=true;
      if(m.k==='arpon'){
        this.arpNote=-1; this.arpPhase=0; this.arpIdx=0; this.arpDirty=true;
        if(m.v>0.5){ for(const v of this.voices) if(v.held) v.noteOff(); }
        else this.resyncHeld();
      }
    }
    else if(m.t==='on') this.noteOn(m.n,m.v);
    else if(m.t==='off') this.noteOff(m.n);
    else if(m.t==='panic'){
      this.stack.length=0; this.seq.length=0;
      this.arpNote=-1; this.arpPhase=0; this.arpIdx=0;
      for(const v of this.voices){ v.active=false; v.held=false; v.ea=0; v.eaS=0; }
    }
  }
  applyVoiceLayout(){
    const p=this.p, mode=p.mode;
    const sp = p.spread;
    const N=this.voices.length, c=(N-1)/2;
    for(let i=0;i<N;i++){
      const v=this.voices[i];
      const q = (i-c)/c;                 /* -1 .. +1 across however many voices */
      if(mode===1){ /* unison */
        v.pan = q*sp;
        v.detune = q*p.uni*25;
      } else if(mode===2){ /* mono */
        v.pan=0; v.detune=0;
      } else {
        v.pan = q*sp*0.8;
        v.detune = 0;
      }
    }
  }
  trigger(n,vel){
    const p=this.p;
    const prev = this.lastFreq;
    if(p.mode===1){
      for(const v of this.voices) v.noteOn(n,vel,p,prev);
    } else if(p.mode===2){
      this.voices[0].noteOn(n,vel,p,prev);
    } else {
      let tgt=null;
      for(const v of this.voices) if(!v.active && v.ea<0.00002){ tgt=v; break; }
      if(!tgt){ let best=this.voices[0]; for(const v of this.voices) if(!v.held && v.ea<best.ea) best=v; tgt=best; }
      tgt.age=++this.counter;
      tgt.noteOn(n,vel,p,prev);
    }
    this.lastFreq = 440*Math.pow(2,(n-69)/12);
  }

  untrigger(n){
    for(const v of this.voices) if(v.active && v.held && v.note===n) v.noteOff();
  }

  /* re-sound whatever is held, used when the arp is switched off */
  resyncHeld(){
    const p=this.p;
    for(const v of this.voices) if(v.held) v.noteOff();
    if(this.stack.length===0) return;
    if(p.mode===0){ for(const n of this.stack.slice(-this.voices.length)) this.trigger(n,0.9); }
    else this.trigger(this.stack[this.stack.length-1],0.9);
  }

  buildArpSeq(){
    const p=this.p;
    const oct = Math.max(1, Math.min(4, Math.round(p.arpoct)));
    const sorted = this.stack.slice().sort((a,b)=>a-b);
    const src = (p.arpmode===3) ? this.stack : sorted;   /* 3 = as played */
    let base=[];
    for(let o=0;o<oct;o++) for(const n of src) base.push(n+12*o);
    if(p.arpmode===1) base.reverse();
    else if(p.arpmode===2 && base.length>2){            /* up-down, ends not repeated */
      base = base.concat(base.slice(1,-1).reverse());
    }
    this.seq = base;
    if(this.arpIdx >= this.seq.length) this.arpIdx = 0;
  }

  /* Arp clock runs on the audio thread — tied to the audio clock rather
     than a main-thread timer, so it does not drift when the UI is busy. */
  arpTick(frames){
    const p=this.p;
    if(p.arpon<0.5) return;

    if(this.stack.length===0){
      if(this.arpNote>=0){ this.untrigger(this.arpNote); this.arpNote=-1; }
      this.arpPhase=0; this.arpIdx=0;
      return;
    }
    if(this.arpDirty){ this.buildArpSeq(); this.arpDirty=false; }
    if(this.seq.length===0) return;

    const stepLen = Math.max(64, this.sr*60/(Math.max(20,p.arpbpm)*Math.max(1,p.arpdiv)));
    const gateLen = Math.max(96, stepLen*Math.max(0.03,p.arpgate));

    this.arpPhase += frames;

    if(this.arpNote>=0 && this.arpPhase>=gateLen){
      this.untrigger(this.arpNote); this.arpNote=-1;
    }
    if(this.arpPhase>=stepLen){
      this.arpPhase -= stepLen;
      if(this.arpNote>=0){ this.untrigger(this.arpNote); this.arpNote=-1; }
      let n;
      if(p.arpmode===4) n = this.seq[(Math.random()*this.seq.length)|0];
      else {
        if(this.arpIdx>=this.seq.length) this.arpIdx=0;
        n = this.seq[this.arpIdx++];
      }
      this.trigger(n,0.9);
      this.arpNote=n;
    }
  }

  /* mono / unison note priority: 0 lowest held key, 1 highest, 2 last pressed (as before) */
  monoTarget(){
    const s=this.stack, pr=this.p.prio|0; if(!s.length) return -1;
    if(pr===0) return Math.min.apply(null,s);
    if(pr===1) return Math.max.apply(null,s);
    return s[s.length-1];
  }
  noteOn(n,vel){
    if(this.stack.indexOf(n)<0) this.stack.push(n);
    if(this.p.arpon>0.5){ this.arpDirty=true; return; }
    const p=this.p;
    if((p.mode===1 || p.mode===2) && (p.prio|0)!==2 && this.voices[0].held){
      const tg=this.monoTarget(); if(tg!==n) return;   /* the new key does not win: the sounding note stays */
    }
    this.trigger(n,vel);
  }
  noteOff(n){
    const p=this.p;
    const ix=this.stack.indexOf(n); if(ix>=0) this.stack.splice(ix,1);
    if(p.arpon>0.5){ this.arpDirty=true; return; }
    if(p.mode===2 || p.mode===1){
      if(this.stack.length>0){
        const nn=this.monoTarget();
        if(nn===this.voices[0].note && this.voices[0].held) return;   /* the sounding note is still the winner */
        if(p.mode===1) for(const v of this.voices) v.noteOn(nn,v.vel,p,this.lastFreq);
        else this.voices[0].noteOn(nn,this.voices[0].vel,p,this.lastFreq);
        this.lastFreq=440*Math.pow(2,(nn-69)/12);
      } else {
        for(const v of this.voices) if(v.note===n||p.mode===1) v.noteOff();
      }
    } else {
      for(const v of this.voices) if(v.active && v.note===n && v.held) v.noteOff();
    }
  }
  process(L,R,n){
    if(!this.p) return;
    this.arpTick(n);
    for(let i=0;i<n;i++){ L[i]=0; R[i]=0; }
    const p=this.p;
    /* global free-run LFO advanced once per block-sample for shared phase */
    let gl=0;
    this.gPhase += p.lrate*n/this.sr;
    while(this.gPhase>=1){ this.gPhase-=1; this.gPrev=this.gRnd; this.gRnd=Math.random()*2-1; }
    const ph=this.gPhase;
    if(p.lwave===0) gl=Math.sin(ph*6.283185307);
    else if(p.lwave===1) gl=1-4*Math.abs(ph-0.5);
    else if(p.lwave===2) gl=2*ph-1;
    else if(p.lwave===3) gl=ph<0.5?1:-1;
    else if(p.lwave===5) gl=this.gPrev+(this.gRnd-this.gPrev)*(0.5-0.5*Math.cos(ph*3.14159265));
    else gl=this.gRnd;

    let gl2=0;
    this.g2Phase += p.l2rate*n/this.sr;
    while(this.g2Phase>=1){ this.g2Phase-=1; this.g2Prev=this.g2Rnd; this.g2Rnd=Math.random()*2-1; }
    const ph2=this.g2Phase;
    if(p.l2wave===0) gl2=Math.sin(ph2*6.283185307);
    else if(p.l2wave===1) gl2=1-4*Math.abs(ph2-0.5);
    else if(p.l2wave===2) gl2=2*ph2-1;
    else if(p.l2wave===3) gl2=ph2<0.5?1:-1;
    else if(p.l2wave===5) gl2=this.g2Prev+(this.g2Rnd-this.g2Prev)*(0.5-0.5*Math.cos(ph2*3.14159265));
    else gl2=this.g2Rnd;

    /* Render in 32-sample slices, gliding the smoothed params between each.
       Voices write from index 0, so a subarray view needs no DSP change.
       Per-block gliding floors the update rate at 375 Hz; this lifts it to
       1500 Hz, which is what actually removes the audible staircase. */
    const CH=32;
    const T=this.smT, K=this.smKeys;
    const ga = T ? 1-Math.exp(-CH/(0.015*this.sr)) : 0;
    for(let off=0; off<n; off+=CH){
      const m = (n-off) < CH ? (n-off) : CH;
      if(T){
        for(let j=0;j<K.length;j++){
          const k=K[j], d=T[k]-p[k];
          if(d>1e-9 || d<-1e-9) p[k]+=d*ga; else p[k]=T[k];
        }
      }
      const Ls=L.subarray(off,off+m), Rs=R.subarray(off,off+m);
      for(const v of this.voices) v.render(Ls,Rs,m,p,gl,gl2);
    }

    const vol=p.vol;
    for(let i=0;i<n;i++){
      L[i]=fastTanh(L[i]*1.25)*vol;
      R[i]=fastTanh(R[i]*1.25)*vol;
    }
    if((this.frame++ & 15)===0){
      for(let i=0;i<4;i++){
        const a=this.voices[i*2].ea, b=this.voices[i*2+1].ea;
        this.meter[i] = a>b ? a : b;
      }
    }
  }
}

const DEF = {

  arpon:0, arpbpm:120, arpdiv:1, arpmode:0, arpoct:1, arpgate:0.5,

const P = Object.assign({}, DEF);
const ARPDIV = [1,2,3,4,6,8];              /* steps per beat: 1/4 … 1/32 */
const ARPDIVLBL = ['1/4','1/8','1/8T','1/16','1/16T','1/32'];

/* worklet-side params (subset the engine reads) */
/* LFO tempo sync: with SYNC on, the LFO runs at a note value of the tempo (the arp TEMPO knob) instead of its RATE.
   Multipliers are cycles per beat (quarter note). */
const LFODIV=[['4/1',1/16],['2/1',1/8],['1/1',1/4],['1/2',1/2],['1/4',1],['1/4T',1.5],['1/8',2],['1/8T',3],['1/16',4],['1/16T',6],['1/32',8]];
function lfoRate(n){
  const sync = n===1 ? P.l1sync : P.l2sync, div = n===1 ? P.l1div : P.l2div;
  if(sync>0.5){ const d=LFODIV[Math.max(0,Math.min(LFODIV.length-1,Math.round(div)))]; return Math.max(20,P.arpbpm)/60*d[1]; }
  return n===1 ? P.lrate : P.l2rate;
}
function sendLfoRates(){ send('lrate', lfoRate(1)); send('l2rate', lfoRate(2)); }
function engineParams(){
  return {
    osc1w:P.osc1w, osc1lv:P.osc1lv, osc1oct:P.osc1oct, osc1pw:P.osc1pw,

    hp:P.hp, hpres:P.hpres, hpktrk:P.hpktrk, eghp:P.eghp,

    l1p1:P.l1p1, l1p2:P.l1p2, l1w1:P.l1w1, l1w2:P.l1w2, l1lp:P.l1lp, l1hp:P.l1hp,
    l2rate:lfoRate(2), l2wave:P.l2wave, l2key:P.l2key, l2mod:P.l2mod,

    srate:P.srate, ssrc:P.ssrc, sslew:P.sslew, scut:P.scut, spitch:P.spitch, spw:P.spw,

    arpon:P.arpon, arpbpm:P.arpbpm, arpdiv:ARPDIV[P.arpdiv]||2,

/* ============================================================
   AUDIO GRAPH
   ============================================================ */
let ctx=null, node=null, engineFallback=null, running=false;
let chorusMix=null, delayMix=null;

async function boot(){
  /* iOS: without this the session behaves as 'ambient' and the hardware
     mute switch silences Web Audio entirely. */
  if('audioSession' in navigator){
    try{ navigator.audioSession.type='playback'; }catch(e){}
  }
  /* No sampleRate here on purpose — requesting one forces a resampler.
     iPhones from the 6s onward are 48 kHz only. */
  ctx = new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
  await ctx.resume();

  const src = [
    fastTanh.toString(),
    polyBlep.toString(),
    fastTan.toString(),
    satU.toString(),
    clipAsym.toString(),
    Voice.toString(),
    Engine.toString(),
    `class SP extends AudioWorkletProcessor{
       constructor(){ super(); this.e=new Engine(sampleRate);
         this.port.onmessage = ev => { this.e.handle(ev.data);
           if(ev.data.t==='meter') this.port.postMessage({m:this.e.meter}); }; }
       process(inp,out){ const o=out[0]; this.e.process(o[0],o[1],o[0].length); return true; }
     }
     registerProcessor('maxims-synth', SP);`
  ].join('\n');

  let usedWorklet=false;
  try{
    const url = URL.createObjectURL(new Blob([src],{type:'application/javascript'}));
    await ctx.audioWorklet.addModule(url);
    URL.revokeObjectURL(url);
    node = new AudioWorkletNode(ctx,'maxims-synth',{numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[2]});
    node.port.onmessage = e => { if(e.data.m) paintLeds(e.data.m); };
    node.port.postMessage({t:'init', p:engineParams()});
    usedWorklet=true;
  }catch(e){
    /* ScriptProcessor fallback — same DSP, worse scheduling */
    engineFallback = new Engine(ctx.sampleRate);
    engineFallback.handle({t:'init', p:engineParams()});
    node = ctx.createScriptProcessor(2048,0,2);
    node.onaudioprocess = ev => {
      engineFallback.process(ev.outputBuffer.getChannelData(0), ev.outputBuffer.getChannelData(1), ev.outputBuffer.length);
    };
  }

  /* --- tube drive, first in the effects (before chorus and delay) ---
     A triode-like asymmetric curve, tanh(x+b)-tanh(b): the bias makes it bend harder on one side, so it adds even
     harmonics (the warm, thick part of a tube) as well as odd ones. Up to +32 dB into the curve, 4x oversampled,
     DC removed after it, a tone control, and a make-up gain so the level stays about the same. At TUBE 0 the stage
     is bypassed exactly (clean path), between 0 and 5 % it fades in. */
  const tubeIn = ctx.createGain(), tubePre = ctx.createGain(), tubeSh = ctx.createWaveShaper();
  const tubeDc = ctx.createBiquadFilter(), tubeTone = ctx.createBiquadFilter(), tubePost = ctx.createGain();
  const tubeWet = ctx.createGain(), tubeDry = ctx.createGain(), tubeOut = ctx.createGain();
  /* the drive sits inside the table (TUBE_K) because a WaveShaper clamps its input to +-1: the gain node in front
     only scales by pre/TUBE_K, so even +32 dB never runs off the end of the curve into a hard clip */
  { const N=8192, c=new Float32Array(N), B=TUBE_B, s=1-Math.tanh(B)*Math.tanh(B);
    for(let i=0;i<N;i++){ const x=(i/(N-1))*2-1; c[i]=(Math.tanh(TUBE_K*x+B)-Math.tanh(B))/s; }
    tubeSh.curve=c; tubeSh.oversample='4x'; }
  tubeDc.type='highpass'; tubeDc.frequency.value=22; tubeDc.Q.value=0.6;
  tubeTone.type='lowpass'; tubeTone.Q.value=0.5;
  node.connect(tubeIn);
  tubeIn.connect(tubeDry).connect(tubeOut);
  tubeIn.connect(tubePre).connect(tubeSh).connect(tubeDc).connect(tubeTone).connect(tubePost).connect(tubeWet).connect(tubeOut);
  window.__tube = {pre:tubePre, post:tubePost, wet:tubeWet, dry:tubeDry, tone:tubeTone};
  syncTube(true);

  /* --- native FX: BBD-ish chorus + stereo delay --- */
  const dry = ctx.createGain(); dry.gain.value = 1;
  const chIn = ctx.createGain();
  const d1 = ctx.createDelay(0.05), d2 = ctx.createDelay(0.05);
  d1.delayTime.value=0.011; d2.delayTime.value=0.0165;
  const lfoA = ctx.createOscillator(), lfoB = ctx.createOscillator();
  const gA = ctx.createGain(), gB = ctx.createGain();
  lfoA.frequency.value=0.38; lfoB.frequency.value=0.53; lfoB.type='triangle';
  gA.gain.value=0.0028; gB.gain.value=0.0021;
  lfoA.connect(gA).connect(d1.delayTime); lfoB.connect(gB).connect(d2.delayTime);
  lfoA.start(); lfoB.start();
  const pL = ctx.createStereoPanner ? ctx.createStereoPanner() : ctx.createGain();
  const pR = ctx.createStereoPanner ? ctx.createStereoPanner() : ctx.createGain();
  if(pL.pan){ pL.pan.value=-0.75; pR.pan.value=0.75; }
  chorusMix = ctx.createGain(); chorusMix.gain.value=P.chorus;

  const dl = ctx.createDelay(1.5), fb = ctx.createGain(), dtone = ctx.createBiquadFilter();
  dl.delayTime.value=P.dtime; fb.gain.value=P.dfb;
  dtone.type='lowpass'; dtone.frequency.value=3200;
  delayMix = ctx.createGain(); delayMix.gain.value=P.delay;
  const master = ctx.createGain(); master.gain.value=1;

  tubeOut.connect(dry).connect(master);
  tubeOut.connect(chIn);
  chIn.connect(d1).connect(pL).connect(chorusMix);
  chIn.connect(d2).connect(pR).connect(chorusMix);
  chorusMix.connect(master);
  master.connect(dl).connect(dtone).connect(fb).connect(dl);
  dtone.connect(delayMix).connect(ctx.destination);
  master.connect(ctx.destination);

  window.__fx = {dl, fb};
  running=true;
  setInterval(()=>{ if(node.port) node.port.postMessage({t:'meter'}); else if(engineFallback) paintLeds(engineFallback.meter); }, 90);
  initMIDI();
  return usedWorklet;
}

/* tube settings -> nodes. Overall small-signal gain into the curve is pre (1 = 0 dB ... 40 = +32 dB). */
const TUBE_K=48, TUBE_B=0.28;
function tubeMakeup(pre){   /* what a 0.4 peak comes out as, so turning TUBE up gets thicker, not much louder */
  const s=1-Math.tanh(TUBE_B)*Math.tanh(TUBE_B), yk=(Math.tanh(0.4*pre+TUBE_B)-Math.tanh(TUBE_B))/s;
  return Math.pow(0.4/Math.max(1e-4,yk), 0.8);
}
function syncTube(now){
  const T=window.__tube; if(!T||!ctx) return;
  const d=P.tube, pre=Math.pow(10, (d*32)/20);
  const post=tubeMakeup(pre)*Math.pow(10,-4.5*d/20);   /* a squarer wave is louder at the same peak: take a little back */
  const wet=Math.min(1,d*20), tone=1800*Math.pow(10, P.ttone*1.0);
  const at=ctx.currentTime, tc=now?0.001:0.03;
  T.pre.gain.setTargetAtTime(pre/TUBE_K, at, tc);
  T.post.gain.setTargetAtTime(post, at, tc);
  T.wet.gain.setTargetAtTime(wet, at, tc);
  T.dry.gain.setTargetAtTime(1-wet, at, tc);
  T.tone.frequency.setTargetAtTime(tone, at, tc);
}
/* all native effect settings at once (after a preset, a patch or a restore) */
function syncFx(){
  if(chorusMix) chorusMix.gain.value=P.chorus;
  if(delayMix) delayMix.gain.value=P.delay;
  if(window.__fx){ window.__fx.dl.delayTime.value=P.dtime; window.__fx.fb.gain.value=P.dfb; }
  syncTube();
}
function send(k,v){
  const msg={t:'p',k,v};
  if(node && node.port) node.port.postMessage(msg);
  else if(engineFallback) engineFallback.handle(msg);
}
function sendNote(t,n,v){
  const msg = t==='on' ? {t:'on',n,v} : {t:'off',n};
  if(node && node.port) node.port.postMessage(msg);
  else if(engineFallback) engineFallback.handle(msg);
}

/* ============================================================
   MIDI IN — WebMIDI, routed through the same sendNote path as
   the on-screen keys. The engine already speaks note messages,
   so this is just translation.
   ============================================================ */
let midiAccess=null, midiCount=0, sustain=false;
const midiHeld=new Set();       /* notes physically held, for sustain-pedal release */
const midiSust=new Set();       /* notes still sounding only because the pedal is down */

function midiStatus(txt){ const e=$('#s-midi'); if(e) e.textContent=txt; }

function midiNoteOn(n,vel){
  midiHeld.add(n); midiSust.delete(n);
  sendNote('on', n, 0.15 + 0.85*(vel/127));   /* map 1..127 into a musical range */
}
function midiNoteOff(n){
  midiHeld.delete(n);
  if(sustain){ midiSust.add(n); return; }     /* pedal down: keep it sounding */
  sendNote('off', n);
}
function midiSustain(down){
  sustain=down;
  if(!down){ midiSust.forEach(n=>{ if(!midiHeld.has(n)) sendNote('off',n); }); midiSust.clear(); }
}
function midiPanic(){
  midiHeld.forEach(n=>sendNote('off',n)); midiSust.forEach(n=>sendNote('off',n));
  midiHeld.clear(); midiSust.clear(); sustain=false;
}

function onMIDIMessage(ev){
  const [st,d1,d2]=ev.data;
  const cmd=st&0xf0;
  if(cmd===0x90 && d2>0)      midiNoteOn(d1,d2);
  else if(cmd===0x80 || (cmd===0x90 && d2===0)) midiNoteOff(d1);
  else if(cmd===0xB0){
    if(midiLearnCC(d1,d2)){ /* consumed by learn or a binding */ }
    else if(d1===1){                           /* mod wheel -> MOD strip */
      const v=d2/127; P.modw=v; send('modw',v);
      const f=$('#modfill'); if(f){ f.style.width=(v*100)+'%'; f.style.setProperty('--m',v); }
    } else if(d1===64) midiSustain(d2>=64);     /* sustain pedal */
    else if(d1===123 || d1===120) midiPanic();  /* all-notes-off / all-sound-off */
  } else if(cmd===0xE0){                         /* pitch bend, ±2 semitones */
    const norm=((d2<<7|d1)-8192)/8192;           /* -1 .. +1 */
    send('bend', Math.pow(2, norm*2/12));         /* engine 'bend' is a freq multiplier */
  }
}

function bindMIDIPorts(){
  if(!midiAccess) return;
  midiCount=0;
  midiAccess.inputs.forEach(inp=>{ inp.onmidimessage=onMIDIMessage; midiCount++; });
  midiStatus(midiCount ? midiCount+' device'+(midiCount>1?'s':'') : 'no device');
}

async function initMIDI(){
  if(!navigator.requestMIDIAccess){ midiStatus('unsupported'); return; }
  try{
    midiAccess = await navigator.requestMIDIAccess({sysex:false});
    bindMIDIPorts();
    midiAccess.onstatechange = ()=>bindMIDIPorts();
  }catch(e){ midiStatus('blocked'); }
}

/* ============================================================
   MIDI LEARN — bind Beatstep encoders (CC) to on-screen controls.
   Beatstep encoders can be Absolute or Relative #1 (64-centred:
   65=+1, 63=-1) or Relative #2 (1..=+, 127..=-). We auto-detect
   which from the first turn during Learn and store it per binding,
   so the ambiguous overlap between the two relative schemes never
   has to be resolved per-message. Relative feeds a normalized nudge
   into the control (fine when slow, fast when the encoder
   accelerates); absolute maps 0-127 with soft pickup so it doesn't
   jump. The engine already smooths its params, so a bound move is
   the same zipper-free path as a mouse drag. Bindings persist via
   the same localStorage state as everything else. */
const MIDI_SENS = 1/140;              /* normalized travel per encoder tick */
const midiBind = {};                  /* cc -> {key, mode:'rel1'|'rel2'|'abs', ch, caught} */
let learnMode=false, learnTarget=null, _lastLearnEl=null, _lastLearnAt=0;

const ctrlByKey = k => allControls.find(c=>c._key===k);
function ccBadge(el, cc){
  if(!el) return;
  let b=el.querySelector('.ccbadge');
  if(cc==null){ if(b) b.remove(); return; }
  if(!b){ b=document.createElement('div'); b.className='ccbadge'; el.appendChild(b); }
  b.textContent='CC'+cc;
}
function refreshBadges(){
  allControls.forEach(c=>ccBadge(c,null));
  for(const cc in midiBind){ const el=ctrlByKey(midiBind[cc].key); ccBadge(el, +cc); }
}
function midiHint(txt){ const h=$('#midi-hint'); if(h) h.textContent=txt; }
function boundCount(){ return Object.keys(midiBind).length; }
function learnIdleHint(){
  const n=boundCount();
  midiHint(learnMode
    ? (learnTarget ? 'Now turn a Beatstep encoder to bind it.' : 'Tap a knob to bind (tap a bound knob twice to unbind).')
    : (n ? n+' encoder'+(n>1?'s':'')+' mapped. Tap LEARN to change.' : 'Set encoders to Relative #1 in MIDI Control Center, then tap LEARN.'));
}
function setLearn(on){
  learnMode=on; document.body.classList.toggle('learn',on);
  if(!on && learnTarget){ learnTarget.classList.remove('learnsel'); learnTarget=null; }
  const btn=$('#midi-learn'); if(btn) btn.classList.toggle('on',on);
  learnIdleHint();
}
function selectLearnTarget(el){
  const now=Date.now();
  if(el===_lastLearnEl && now-_lastLearnAt<340){    /* double-tap a control -> unbind it */
    unbindKey(el._key); _lastLearnEl=null;
    if(learnTarget){ learnTarget.classList.remove('learnsel'); learnTarget=null; }
    return;
  }
  _lastLearnEl=el; _lastLearnAt=now;
  if(learnTarget) learnTarget.classList.remove('learnsel');
  learnTarget=el; el.classList.add('learnsel');
  learnIdleHint();
}
function unbindKey(key){
  let changed=false;
  for(const cc in midiBind){ if(midiBind[cc].key===key){ delete midiBind[cc]; changed=true; } }
  if(changed){ ccBadge(ctrlByKey(key),null); saveState(); learnIdleHint(); }
}
function clearAllMidi(){
  for(const cc in midiBind) delete midiBind[cc];
  refreshBadges(); saveState(); learnIdleHint();
}
function detectMode(v){
  if(v>=57 && v<=71) return 'rel1';                 /* clustered around 64 */
  if((v>=1&&v<=16) || (v>=112&&v<=127)) return 'rel2';
  return 'abs';                                      /* a mid sweep value */
}
/* returns true if the CC was consumed by learn or an existing binding */
function midiLearnCC(cc, v){
  if(learnMode && learnTarget){
    const mode=detectMode(v);
    for(const c in midiBind){ if(midiBind[c].key===learnTarget._key) delete midiBind[c]; } /* one cc per control */
    midiBind[cc]={ key:learnTarget._key, mode, caught:false };
    ccBadge(learnTarget, cc);
    learnTarget.classList.remove('learnsel'); learnTarget=null;
    saveState();
    midiHint('Bound CC'+cc+' ('+mode+'). Tap another knob, or LEARN to finish.');
    return true;
  }
  const bnd=midiBind[cc];
  if(!bnd) return false;
  const el=ctrlByKey(bnd.key); if(!el) return true;
  if(bnd.mode==='abs'){
    const norm=v/127;
    if(!bnd.caught){                                  /* soft pickup: engage on cross-over */
      const cur=el._curNorm?el._curNorm():norm;
      if(Math.abs(norm-cur)>0.06) return true;        /* wait until the encoder catches the value */
      bnd.caught=true;
    }
    el._setNorm && el._setNorm(norm);
  } else {
    const d = bnd.mode==='rel1' ? (v-64) : (v<64 ? v : v-128);
    if(d) el._nudgeNorm && el._nudgeNorm(d*MIDI_SENS);
  }
  return true;
}
function serializeBinds(){
  return Object.keys(midiBind).map(cc=>({cc:+cc, key:midiBind[cc].key, mode:midiBind[cc].mode}));
}
function restoreBinds(arr){
  for(const cc in midiBind) delete midiBind[cc];
  if(Array.isArray(arr)){
    arr.forEach(b=>{
      if(b && typeof b.cc==='number' && typeof b.key==='string' && ctrlByKey(b.key))
        midiBind[b.cc]={ key:b.key, mode:(b.mode==='rel1'||b.mode==='rel2'||b.mode==='abs')?b.mode:'rel1', caught:false };
    });
  }
  refreshBadges();
  learnIdleHint();
}
/* Learn intercepts a control tap before its own drag handler (capture phase
   on an ancestor). Outside learn mode it does nothing. */
document.addEventListener('pointerdown', e=>{
  if(!learnMode) return;
  const c=e.target.closest && e.target.closest('.knob,.sw');
  if(c && c._key){ e.stopPropagation(); e.preventDefault(); selectLearnTarget(c); }
}, true);
