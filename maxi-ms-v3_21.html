const ledEls = [...document.querySelectorAll('.led')];
function paintLeds(m){ for(let i=0;i<4;i++) ledEls[i].classList.toggle('on', m[i]>0.008); }

/* accent hue follows filter CHARACTER — amber ladder -> hot red sallen-key */
function paintAccent(){
  const ms20 = Math.round(P.fmodel)===1;   /* SEM keeps the amber of the ladder */
  const day = document.body.classList.contains('day');
  const h = ms20 ? 352 : 38;
  const s = day ? (ms20?74:88) : (ms20?84:90);
  const l = day ? (ms20?45:33) : (ms20?56:58);   /* darker so it reads on paper */
  const st = document.documentElement.style;
  st.setProperty('--accent',     `hsl(${h} ${s}% ${l}%)`);
  st.setProperty('--accent-2',   `hsl(${h} ${s}% ${l-13}%)`);
  st.setProperty('--accent-dim', `hsl(${h} ${s}% ${l}% / ${day?0.15:0.22})`);

  /* The Filter section used to borrow --accent, which is amber for the ladder
     and therefore the same colour as the Osc section. It now has its own hue
     that still switches with the circuit: cool blue for the transistor ladder,
     hot red for the sallen-key screamer. --accent stays amber for the
     instrument's identity (wordmark, keys, LEDs, MOD strip). */
  /* SEM: a soft lime, as gentle as the filter itself */
  const sem = Math.round(P.fmodel)===2;
  const fh = ms20 ? 352 : sem ? 78 : 212;
  const fs = ms20 ? (day?74:84) : sem ? (day?62:55) : (day?68:70);
  const fl = ms20 ? (day?45:56) : sem ? (day?32:58) : (day?36:60);
  st.setProperty('--filt', `hsl(${fh} ${fs}% ${fl}%)`);
  paintOscColours();
}
/* each oscillator wears the colour of its model: PRESENT gold, SH-1 rust red, LIVE warm yellow */
function paintOscColours(){
  const day=document.body.classList.contains('day');
  const C = day ? ['#96620a','#a33a1c','#857000'] : ['#e0a83c','#d8603e','#e8cf4a'];
  [['Oscillator 1',P.osc1m],['Oscillator 2',P.osc2m]].forEach(([k,m])=>{
    const el=document.querySelector('.mod[data-k="'+k+'"]'); if(el) el.style.setProperty('--sec', C[Math.round(m)||0]);
  });
}

function setTheme(day){
  document.body.classList.toggle('day', !!day);
  const b=$('#theme'); if(b) b.textContent = day ? 'DAY' : 'NIGHT';
  const m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content', day ? '#dfe4ea' : '#171613');
  paintAccent();
  saveState();
}
function initTheme(saved){
  let day;
  if(saved && typeof saved.theme==='boolean') day = saved.theme;   /* explicit choice wins */
  else { try{ day = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches); }catch(e){ day=false; } }
  setTheme(day);
  const b=$('#theme');
  if(b) b.onclick=()=>setTheme(!document.body.classList.contains('day'));
}

/* --- drag HUD: readout large enough to see past a thumb --- */
const hudEl=document.getElementById('hud');
function hudShow(label,val,fine){
  if(!hudEl) return;
  hudEl.firstElementChild.textContent=label;
  hudEl.lastElementChild.textContent=val;
  hudEl.classList.toggle('fine',!!fine);
  hudEl.classList.add('show');
}
function hudHide(){ if(hudEl) hudEl.classList.remove('show','fine'); }

/* --- knob --- */
/* on a screen the value is written on the knob cap (phones keep it under the knob: too small on a 44 px knob) */
function deskVal(){ return window.matchMedia('(min-width:900px)').matches; }
function knob(key, label, min, max, opt){
  opt = opt||{};
  const curve = opt.curve||'lin';
  const fmt = opt.fmt||(v=>v.toFixed(2));
  /* bipolar params fill outward from twelve o'clock, like a centre-detent pot */
  const bip = min<0 && max>0 && Math.abs(min+max)<1e-9;

  const el = document.createElement('div'); el.className='knob';
  const R=28.5, CX=32, CY=32, A0=-215, A1=35;
  el.innerHTML = `<svg viewBox="0 0 64 64" aria-hidden="true">
      <path class="kbg" d=""/><path class="karc" d=""/>
      ${bip?'<line class="ktick" x1="32" y1="1.5" x2="32" y2="6"/>':''}
      <circle class="kskirt" cx="32" cy="32" r="25.5"/>
      <circle class="kcap" cx="32" cy="32" r="22"/>
      <line class="kdot" x1="32" y1="32" x2="32" y2="17"/>
      <text class="kval" x="32" y="32.5" text-anchor="middle" dominant-baseline="middle"></text>
    </svg>
    <div class="lbl">${label}</div><div class="val"></div>`;
  const bg=el.querySelector('.kbg'), arc=el.querySelector('.karc'),
        dot=el.querySelector('.kdot'), valEl=el.querySelector('.val'), kvEl=el.querySelector('.kval');

  const pol=(a)=>{const r=(a-90)*Math.PI/180;return [CX+R*Math.cos(r), CY+R*Math.sin(r)];};
  const path=(from,to)=>{const [x1,y1]=pol(from),[x2,y2]=pol(to);
    return `M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${R} ${R} 0 ${Math.abs(to-from)>180?1:0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;};
  bg.setAttribute('d', path(A0,A1));

  const toNorm = v => curve==='exp' ? Math.log(v/min)/Math.log(max/min) : (v-min)/(max-min);
  const toVal  = t => curve==='exp' ? min*Math.pow(max/min,t) : min+(max-min)*t;

  let t = toNorm(P[key]);
  const draw=()=>{
    const a = A0+(A1-A0)*t;
    const from = bip ? A0+(A1-A0)*0.5 : A0;
    arc.setAttribute('d', Math.abs(a-from)<0.6 ? '' : path(Math.min(from,a), Math.max(from,a)));
    const rr=(a-90)*Math.PI/180;
    const r0=deskVal()?15.5:8;   /* screen: the value sits on the cap, the pointer only marks its rim */
    dot.setAttribute('x1',(CX+r0*Math.cos(rr)).toFixed(2));
    dot.setAttribute('y1',(CY+r0*Math.sin(rr)).toFixed(2));
    dot.setAttribute('x2',(CX+20.5*Math.cos(rr)).toFixed(2));
    dot.setAttribute('y2',(CY+20.5*Math.sin(rr)).toFixed(2));
    valEl.textContent = fmt(P[key]);
    const s=fmt(P[key]); kvEl.textContent=s;
    if(s.length>=5){ kvEl.setAttribute('textLength', String(Math.min(26, s.length*5.1))); kvEl.setAttribute('lengthAdjust','spacingAndGlyphs'); } else kvEl.removeAttribute('textLength');
  };
  el._redraw=draw;
  const commit=()=>{ P[key]=toVal(t); if(opt.on) opt.on(P[key]); else send(opt.pkey||key, P[key]); draw(); saveState(); patchDirty(); };
  draw();

  /* Vertical drag, the natural gesture for a rotary. Press and hold without
     moving to enter fine mode — reachable with a thumb, unlike a modifier key. */
  let sx=0, sy=0, st=0, drag=false, moved=false, fine=false, holdT=0, pid=null;
  const svg=el.querySelector('svg');
  const stopHold=()=>{ if(holdT){ clearTimeout(holdT); holdT=0; } };
  svg.addEventListener('pointerdown', e=>{
    /* mouse: left button only. A right- or middle-button press never gets a
       matching pointerup here, which left the knob stuck to the cursor. */
    if(e.pointerType==='mouse' && e.button!==0) return;
    drag=true; moved=false; fine=false; sx=e.clientX; sy=e.clientY; st=t; pid=e.pointerId;
    try{ svg.setPointerCapture(e.pointerId); }catch(err){}
    el.classList.add('act'); e.preventDefault();
    hudShow(label, valEl.textContent, false);
    stopHold();
    holdT=setTimeout(()=>{ if(drag && !moved){ fine=true; el.classList.add('fine'); draw(); hudShow(label, valEl.textContent, true); } }, 380);
  });
  svg.addEventListener('pointermove', e=>{
    if(!drag) return;
    /* If the button came up somewhere we never heard about — released outside
       the window, or the pointerup swallowed — buttons is already 0. */
    if(e.pointerType==='mouse' && e.buttons===0){ end(); return; }
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(!moved && (Math.abs(dx)>3 || Math.abs(dy)>3)){ moved=true; stopHold(); }
    if(!moved) return;
    const k = fine ? 0.1 : (Math.abs(dx) > 80 ? 0.22 : 1);
    t = Math.max(0, Math.min(1, st + (sy-e.clientY)/320*k));
    commit();
    hudShow(label, valEl.textContent, fine || Math.abs(dx) > 80);
  });
  function end(){
    if(!drag) return;
    drag=false; stopHold(); fine=false;
    if(pid!==null){ try{ if(svg.hasPointerCapture(pid)) svg.releasePointerCapture(pid); }catch(err){} pid=null; }
    el.classList.remove('act'); el.classList.remove('fine'); draw();
    hudHide();
  }
  svg.addEventListener('pointerup', end);
  svg.addEventListener('pointercancel', end);
  /* capture can be lost with no pointerup at all — DOM reflow, another element
     grabbing the pointer, the browser dropping it. That is the classic stuck knob. */
  svg.addEventListener('lostpointercapture', end);
  /* last resort: the release happened anywhere on the page, or the window lost focus */
  window.addEventListener('pointerup', end, true);
  window.addEventListener('pointercancel', end, true);
  window.addEventListener('blur', end);
  svg.addEventListener('contextmenu', e=>{ e.preventDefault(); end(); });

  let lastTap=0;
  svg.addEventListener('click', ()=>{
    if(moved) return;                      /* a drag is not a tap */
    const now=Date.now();
    if(now-lastTap<320){ t=toNorm(DEF[key]); commit(); }
    lastTap=now;
  });

  el._sync = ()=>{ t=toNorm(P[key]); draw(); };
  el._key = key;
  el._curNorm = ()=>t;
  el._nudgeNorm = dt=>{ t=Math.max(0,Math.min(1,t+dt)); commit(); };
  el._setNorm   = t0=>{ t=Math.max(0,Math.min(1,t0));   commit(); };
  return el;
}

function sw(key, label, opts, opt){
  opt=opt||{};
  const el=document.createElement('div'); el.className='sw';
  el.innerHTML=`<div class="lbl">${label}</div><div class="swopts"></div>`;
  const box=el.querySelector('.swopts');
  opts.forEach((o,i)=>{
    const b=document.createElement('button'); b.textContent=o;
    b.onclick=()=>{ P[key]=i; [...box.children].forEach((c,j)=>c.classList.toggle('sel',j===i));
      if(opt.on) opt.on(i); else send(key,i); saveState(); patchDirty(); };
    if(P[key]===i) b.classList.add('sel');
    box.appendChild(b);
  });
  el._sync=()=>[...box.children].forEach((c,j)=>c.classList.toggle('sel',j===P[key]));
  el._key=key;
  const n=opts.length;
  el._curNorm=()=> n>1 ? P[key]/(n-1) : 0;
  let _acc=0;
  el._nudgeNorm=dt=>{ _acc+=dt; const step=1/n;
    while(Math.abs(_acc)>=step){ const dir=_acc>0?1:-1; const i=Math.max(0,Math.min(n-1,P[key]+dir));
      if(i!==P[key]) box.children[i].click(); _acc-=dir*step; if(i===P[key]&&(i===0||i===n-1)){_acc=0;break;} } };
  el._setNorm=t0=>{ const i=Math.max(0,Math.min(n-1,Math.round(t0*(n-1)))); if(i!==P[key]) box.children[i].click(); };
  return el;
}

function tog(key,label,opt){
  opt=opt||{};
  const el=document.createElement('div'); el.className='sw';
  el.innerHTML=`<div class="lbl">&nbsp;</div><button class="tog">${label}</button>`;
  const b=el.querySelector('button');
  const paint=()=>b.classList.toggle('on',P[key]>0.5);
  b.onclick=()=>{ P[key]=P[key]>0.5?0:1; paint(); if(opt.on) opt.on(P[key]); else send(key,P[key]); saveState(); patchDirty(); };
  paint(); el._sync=paint; el._key=key;
  el._curNorm=()=>P[key]>0.5?1:0;
  let _tacc=0;
  el._nudgeNorm=dt=>{ _tacc+=dt; if(Math.abs(_tacc)>=0.5){ b.click(); _tacc=0; } };
  el._setNorm=t0=>{ const want=t0>=0.5?1:0; if((P[key]>0.5?1:0)!==want) b.click(); };
  return el;
}

const allControls=[];
function mod(page, title, controls, cls){
  const m=document.createElement('div'); m.className='mod'; m.dataset.k=title;
  m.innerHTML=`<h3>${title}</h3>`;
  const r=document.createElement('div'); r.className='row'+(cls?' '+cls:'');
  controls.forEach(c=>{ r.appendChild(c); allControls.push(c); });
  r.style.setProperty('--n', Math.max(1, controls.filter(c=>c.classList.contains('knob') || c.querySelector('.tog')).length));
  m.appendChild(r);
  $('#p'+page+' .mods').appendChild(m);
}

const WAVES=['SAW','PLS','TRI'];
const SUBNAMES=['−3rd','−5th','−oct','−oct−3','−oct−5','−2oct'];
const WAVES2=['SIN','TRI','SAW','SQR','RND','SMTH'];   /* RND steps, SMTH glides (smooth random) */
const hz = v => v>=1000 ? (v/1000).toFixed(2)+'k' : v.toFixed(0);
const ms = v => v<1 ? (v*1000).toFixed(0)+'m' : v.toFixed(2)+'s';
const pct = v => (v*100).toFixed(0);
const noteName = s => { const n=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const m=Math.round(s)+12; return n[((m%12)+12)%12]+(Math.floor(m/12)-1); };

function buildUI(){
  /* ---- 0 OSC ---- */
  mod(0,'Oscillator 1',[
    sw('osc1m','Model',['PRESENT','SH-1','LIVE'],{on:v=>{P.osc1m=v;send('osc1m',v);send('sh1',v===1?1:0);paintOscColours();}}),
    tog('osc1on','On'),
    sw('osc1w','Wave',WAVES),
    knob('osc1lv','Level',0,1,{fmt:pct}),
    knob('osc1oct','Octave',-2,2,{fmt:v=>(v>0?'+':'')+Math.round(v), on:v=>{P.osc1oct=Math.round(v);send('osc1oct',P.osc1oct);} }),
    knob('osc1pw','Width',-1,1,{fmt:v=>v.toFixed(2)})
  ],'c2');
  mod(0,'Oscillator 2',[
    sw('osc2m','Model',['PRESENT','SH-1','LIVE'],{on:v=>{P.osc2m=v;send('osc2m',v);paintOscColours();}}),
    tog('osc2on','On'),
    sw('osc2w','Wave',WAVES),
    knob('osc2lv','Level',0,1,{fmt:pct}),
    knob('osc2oct','Octave',-2,2,{fmt:v=>(v>0?'+':'')+Math.round(v), on:v=>{P.osc2oct=Math.round(v);send('osc2oct',P.osc2oct);} }),
    knob('osc2det','Detune',-50,50,{fmt:v=>v.toFixed(1)+'¢'}),
    knob('osc2pw','Width',-1,1),
    tog('osync','Sync 2→1')
  ],'c2');
  mod(0,'Sub · Noise · Ring',[
    knob('sublv','Sub',0,1,{fmt:pct}),
    knob('subint','Interval',0,5,{fmt:v=>SUBNAMES[Math.max(0,Math.min(5,Math.round(v)))], on:v=>{P.subint=Math.round(v);send('subint',P.subint);}}),
    knob('noiselv','Noise',0,1,{fmt:pct}),
    knob('noisecol','Colour',0,1,{fmt:v=>v<0.5?'WHT':'PNK'}),
    knob('ringlv','Ring mod',0,1,{fmt:pct})
  ],'c3');

  /* ---- 1 FILTER ---- */
  /* Two filters in series, laid out as a matching pair: highpass first,
     then lowpass, exactly the MS-20 order. Each gets its own Cutoff and

/* ---- modulation matrix ----------------------------------------------
   Rows are destinations, columns are the two LFOs. A destination can be fed
   by either LFO, both at once, or neither; the two oscillators are separate
   rows, so an LFO can take one, the other, or both. Amounts are bipolar, so
   one LFO can push two destinations in opposite directions. */
const MATRIX_ROWS = [
  ['Osc 1 pitch', 'l1p1', 'l2p1', v=>(v>0?'+':'')+(v*100).toFixed(0)+'\u00a2'],
  ['Osc 2 pitch', 'l1p2', 'l2p2', v=>(v>0?'+':'')+(v*100).toFixed(0)+'\u00a2'],
  ['Osc 1 width', 'l1w1', 'l2w1', v=>(v>0?'+':'')+pct(v)],
  ['Osc 2 width', 'l1w2', 'l2w2', v=>(v>0?'+':'')+pct(v)],
  ['LP cutoff',   'l1lp', 'l2lp', v=>(v>0?'+':'')+pct(v)],
  ['HP cutoff',   'l1hp', 'l2hp', v=>(v>0?'+':'')+pct(v)]
];
function buildMatrix(){
  const m=document.createElement('div'); m.className='mod wide';
  m.innerHTML='<h3>Modulation matrix</h3>';
  const g=document.createElement('div'); g.className='mx';
  const head=(t,cls)=>{ const d=document.createElement('div'); d.className='mxh'+(cls?' '+cls:''); d.textContent=t; return d; };
  g.appendChild(head(''));
  g.appendChild(head('LFO 1','a'));
  g.appendChild(head('LFO 2','b'));
  for(const [name,k1,k2,fmt] of MATRIX_ROWS){
    const d=document.createElement('div'); d.className='mxd'; d.textContent=name;
    g.appendChild(d);
    for(const [k,cls] of [[k1,'a'],[k2,'b']]){
      const cell=document.createElement('div'); cell.className='mxc '+cls;
      const kn=knob(k,name,-1,1,{fmt});
      allControls.push(kn);
      cell.appendChild(kn); g.appendChild(cell);
    }
  }
  m.appendChild(g);
  $('#p3 .mods').appendChild(m);
}

/* ---- navigation ----------------------------------------------------------
   The panel is one continuous scroll now. The bar is a jump list, not a set
   of pages: tapping scrolls there, and a scroll observer keeps the bar and
   the header strip showing whichever section you are actually inside. */
const NAVBTNS=[...document.querySelectorAll('nav button')];
NAVBTNS.forEach(b=>{
  const dot=document.createElement('i'); dot.className='dot';
  b.insertBefore(dot,b.firstChild);
});

function markSection(p){
  if(document.body.dataset.page === String(p)) return;
  document.body.dataset.page = p;                /* header strip + HUD colour */
  NAVBTNS.forEach(x=>x.classList.toggle('sel', +x.dataset.p===p));
  const b=NAVBTNS.find(x=>+x.dataset.p===p);
  if(b) try{ b.scrollIntoView({inline:'center',block:'nearest'}); }catch(e){}
}

const SIDE=window.matchMedia('(max-width:899px)');   /* phone: sections scroll sideways; screen: one panel */
let pickUntil=0;   /* after a tab tap the scrollspy waits until the smooth scroll has settled */
function selectPage(p){                          /* jump to a section */
  const sec=$('#p'+p); if(!sec) return;
  const main=document.querySelector('main');
  if(SIDE.matches) main.scrollTo({left: sec.getBoundingClientRect().left - main.getBoundingClientRect().left + main.scrollLeft - parseFloat(getComputedStyle(main).paddingLeft), behavior:'smooth'});
  else main.scrollTo({top: sec.offsetTop - main.offsetTop, behavior:'smooth'});
  markSection(p); pickUntil=Date.now()+900;
}
NAVBTNS.forEach(b=>{ b.onclick=()=>selectPage(+b.dataset.p); });

/* scrollspy: whichever section covers the top of the panel wins */
(function(){
  const main=document.querySelector('main');
  const secs=[...document.querySelectorAll('.sect')];
  let tick=false;
  function update(){
    tick=false;
    if(Date.now()<pickUntil) return;
    let cur=secs[0];
    if(SIDE.matches){
      const x=main.getBoundingClientRect().left + Math.min(main.clientWidth*0.3,120);
      for(const s of secs){ if(s.getBoundingClientRect().left <= x) cur=s; }
      /* at the far right end several sections are on screen (wide screens): keep a picked one that is visible */
      if(main.scrollLeft + main.clientWidth >= main.scrollWidth - 2){
        const mr=main.getBoundingClientRect(), now=document.getElementById('p'+document.body.dataset.page);
        const vis=now && now.getBoundingClientRect().left>=mr.left-2 && now.getBoundingClientRect().right<=mr.right+2;
        cur = vis ? now : secs[secs.length-1];
      }
    } else {
      const y=main.scrollTop + 4;
      for(const s of secs){ if(s.offsetTop - main.offsetTop <= y) cur=s; }
      /* bottom of the scroll always belongs to the last section */
      if(main.scrollTop + main.clientHeight >= main.scrollHeight - 2) cur=secs[secs.length-1];
    }
    markSection(+cur.dataset.sec);
  }
  main.addEventListener('scroll',()=>{ if(!tick){ tick=true; requestAnimationFrame(update); } },{passive:true});
  window.addEventListener('resize',update);
  setTimeout(update,0);
})();

/* mouse wheel on a PC: the panel runs sideways, so a plain vertical wheel moves it sideways
   once the section under the pointer has nothing left to scroll vertically */
(function(){
  const main=document.querySelector('main');
  main.addEventListener('wheel',e=>{
    if(!SIDE.matches || e.ctrlKey || Math.abs(e.deltaX)>Math.abs(e.deltaY)) return;
    if(e.target.closest('.knob')) return;
    const s=e.target.closest('.sect');
    if(s){ const canDown=s.scrollTop+s.clientHeight<s.scrollHeight-1, canUp=s.scrollTop>0;
      if((e.deltaY>0&&canDown)||(e.deltaY<0&&canUp)) return; }
    main.scrollBy({left:e.deltaY*(e.deltaMode===1?32:1),behavior:'auto'});
    e.preventDefault();
  },{passive:false});
})();

/* screen: hand-set front panel. Modules are moved out of their sections into fixed places (and back on a phone);
   placeholders remember where each one came from. Then one knob size for the whole panel is fitted to the screen. */
const DESK=[
  [['Oscillator 1'],['Oscillator 2'],['Sub · Noise · Ring'],['LFO 1'],['LFO 2'],['Sample & hold']],
  [['1 · Highpass — sallen-key 12 dB','Tube drive'],['2 · Lowpass'],['Lowpass tracking','Mod env destinations'],['Modulation matrix'],['Arpeggiator']],
  [['Amp envelope'],['Mod envelope'],['Allocation'],['Analog behaviour'],['Effects','Master'],['Pattern']]
];
let deskOn=false;
function modByTitle(){ const o={}; document.querySelectorAll('.mod').forEach(m=>{ const h=m.querySelector(':scope > h3'); if(h) o[h.textContent.trim()]=m; }); return o; }
function layoutDesk(on){
  if(on===deskOn) return;
  deskOn=on;
  const main=document.querySelector('main');
  if(on){
    const by=modByTitle(), panel=document.createElement('div'); panel.id='panel';
    DESK.forEach(col=>{
      const c=document.createElement('div'); c.className='pcol';
      col.forEach(line=>{
        const l=document.createElement('div'); l.className='pline'+(line[0]==='Modulation matrix'?' x2':'');
        line.forEach(title=>{
          const m=by[title]; if(!m) return;
          const ph=document.createComment('mod:'+title); m.before(ph); m._ph=ph;
          const sec=m.closest('.sect'); if(sec) m.dataset.sec=sec.dataset.sec;
          if(title==='Arpeggiator'){        /* LATCH belongs to the arp on a screen */
            const lb=$('#latchbtn'), ph2=document.createComment('latch'); lb.before(ph2);
            const w=document.createElement('div'); w.className='sw latchsw'; lb.classList.add('tog'); w.appendChild(lb);
            const first=m.querySelector(':scope > .row > .sw'); if(first) first.after(w); else m.querySelector(':scope > .row').appendChild(w);
            m._latch={ph:ph2, w};
          }
          /* oscillators: ON sits on top of the MODEL buttons, SYNC under the WAVE buttons, so every oscillator line has 5 cells */
          if(/^Oscillator /.test(title)){
            const sws=[...m.querySelectorAll(':scope > .row > .sw')];
            const host=(lbl)=>sws.find(x=>!x.querySelector('.tog') && x.querySelector('.lbl') && x.querySelector('.lbl').textContent===lbl);
            m._moves=[];
            sws.filter(x=>x.querySelector('.tog')).forEach(x=>{
              const lb=x.querySelector('.tog').textContent, h = /^ON$/i.test(lb) ? host('Model') : host('Wave');
              if(!h) return;
              const ph=document.createComment('tog'); x.before(ph); x.classList.add('inhost'); h.appendChild(x); m._moves.push([x,ph]);
            });
          }
          const togs=[...m.querySelectorAll(':scope > .row > .sw')].filter(x=>x.querySelector(':scope > .tog') && !x.classList.contains('latchsw'));
          if(togs.length>1){ const st=document.createElement('div'); st.className='togstack'; togs[0].before(st); togs.forEach(x=>st.appendChild(x)); m._stack=st; }
          let cells=0;
          m.querySelectorAll(':scope > .row > *').forEach(x=>{
            if(x.classList.contains('sw') && !x.querySelector('.tog')){ const w2=x.querySelectorAll('.swopts button').length>3; x.classList.toggle('w2',w2); cells+=w2?2:1; }
            else cells+=1;
          });
          if(title==='Modulation matrix') cells=7;
          m.style.setProperty('--cells', Math.max(1,cells));
          l.appendChild(m);
        });
        c.appendChild(l);
      });
      panel.appendChild(c);
    });
    main.appendChild(panel);
    const midi=document.querySelector('.mod.midi'); if(midi){ const ph=document.createComment('mod:midi'); midi.before(ph); midi._ph=ph; $('#sheetbox').appendChild(midi); }
  }else{
    document.querySelectorAll('.mod').forEach(m=>{ if(m._moves){ m._moves.forEach(([x,ph])=>{ x.classList.remove('inhost'); ph.replaceWith(x); }); m._moves=null; } if(m._latch){ const lb=$('#latchbtn'); lb.classList.remove('tog'); m._latch.ph.replaceWith(lb); m._latch.w.remove(); m._latch=null; } if(m._stack){ const st=m._stack; [...st.children].forEach(x=>st.before(x)); st.remove(); m._stack=null; } if(m._ph){ m._ph.replaceWith(m); m._ph=null; m.style.removeProperty('--cells'); m.classList.remove('tape'); } });
    const p=$('#panel'); if(p) p.remove();
  }
}
function fitPanel(){
  const st=document.documentElement.style;
  const was=deskOn; layoutDesk(BIGKEYS.matches);
  if(was!==deskOn) allControls.forEach(c=>c._redraw && c._redraw());
  if(!BIGKEYS.matches){ st.removeProperty('--kz'); return; }
  const lines=[...document.querySelectorAll('#panel .pline')];
  const panel=$('#panel');
  const fits=()=>panel.scrollWidth<=panel.clientWidth+1 && lines.every(l=>l.scrollWidth<=l.clientWidth+1 && [...l.children].every(m=>m.scrollHeight<=m.clientHeight+1 && m.scrollWidth<=m.clientWidth+1));
  let lo=30, hi=110;
  for(let i=0;i<9;i++){ const mid=(lo+hi)/2; st.setProperty('--kz', mid+'px'); if(fits()) lo=mid; else hi=mid; }
  st.setProperty('--kz', Math.floor(lo*0.93)+'px');   /* a little air around the knobs */
}
let _fitT=0;
addEventListener('resize',()=>{ clearTimeout(_fitT); _fitT=setTimeout(fitPanel,120); });

/* ---- patch manager -----------------------------------------------------
   Own patches live in localStorage (mmm.maxi-ms.patches.v1) as {name: params}; saving under an existing name asks
   once ("Replace?"). Delete needs two taps. Export writes all own patches to a JSON file, import merges one back
   (same name: the imported one wins). The PATCH button shows the patch you are on, with a dot once you changed it. */
const PATCH_KEY='mmm.maxi-ms.patches.v1';
let curPatch='', curDirty=false;
function readPatches(){ try{ const o=JSON.parse(localStorage.getItem(PATCH_KEY)||'{}'); return (o&&typeof o==='object'&&!Array.isArray(o))?o:{}; }catch(e){ return {}; } }
function writePatches(o){ try{ localStorage.setItem(PATCH_KEY, JSON.stringify(o)); return true; }catch(e){ showErr('× Could not save (browser storage full or blocked)'); return false; } }
function patchParams(){ const p={}; for(const k in DEF) p[k]=P[k]; return p; }
function paintPatchName(){
  const b=$('#patch'); if(!b) return;
  const own = curPatch && Object.prototype.hasOwnProperty.call(readPatches(), curPatch);
  b.querySelector('.pk').textContent = curPatch ? (own ? 'USER' : 'FACTORY') : '';
  b.querySelector('.pn').textContent = curPatch || 'Init';
  b.querySelector('.pd').textContent = curDirty ? '•' : '';
  b.title = (curPatch||'Init')+(curDirty?' (changed)':'')+' – browse and manage patches';
  const c=$('#pcur'); if(c) c.textContent = curPatch ? (curPatch+(curDirty?' (changed)':'')) : '';
}
function patchDirty(){ if(curPatch && !curDirty){ curDirty=true; paintPatchName(); } }
/* patches from before per-oscillator models only know the old bus switch sh1: it becomes the model of both oscillators */
function migrateOsc(p){
  if(p && ('sh1' in p) && !('osc1m' in p)){ p=Object.assign({},p); p.osc1m=p.osc2m=(+p.sh1>0.5)?1:0; }
  if(p && ('suboct' in p) && !('subint' in p)){ p=Object.assign({},p); p.subint=(+p.suboct>0.5)?5:2; }
  return p;
}
function applyParams(p){
  p=migrateOsc(p);
  for(const k in DEF) P[k] = (k in p && isFinite(p[k])) ? +p[k] : DEF[k];
  P.cutSemi = P.cut;
  const ep=engineParams(); for(const k in ep) send(k, ep[k]);
  syncFx();
  allControls.forEach(c=>c._sync && c._sync());
  paintAccent();
  saveState();
}
function loadPatch(name){
  const all=readPatches(); if(!all[name]) return;
  applyParams(all[name]);
  document.querySelectorAll('#presets button').forEach(b=>b.classList.remove('sel'));
  curPatch=name; curDirty=false; paintPatchName(); renderMyPatches();
}
function renderMyPatches(){
  const box=$('#mylist'); if(!box) return; box.innerHTML='';
  const names=Object.keys(readPatches()).sort((a,b)=>a.localeCompare(b));
  if(!names.length){ const d=document.createElement('div'); d.className='pempty'; d.textContent='No own patches yet. Type a name above and tap Save.'; box.appendChild(d); return; }
  names.forEach(n=>{
    const row=document.createElement('div'); row.className='pitem'+(n===curPatch?' sel':'');
    const l=document.createElement('button'); l.className='pload'; l.textContent=n; l.title='Load '+n;
    l.onclick=()=>{ loadPatch(n); $('#sheet').classList.remove('open'); };
    const d=document.createElement('button'); d.className='pdel'; d.textContent='×'; d.setAttribute('aria-label','Delete '+n);
    let armT=0;
    d.onclick=()=>{
      if(!d.classList.contains('arm')){ d.classList.add('arm'); d.textContent='Delete?'; armT=setTimeout(()=>{ d.classList.remove('arm'); d.textContent='×'; },3000); return; }
      clearTimeout(armT); const all=readPatches(); delete all[n]; writePatches(all);
      if(curPatch===n){ curPatch=''; curDirty=false; paintPatchName(); }
      renderMyPatches();
    };
    row.appendChild(l); row.appendChild(d); box.appendChild(row);
  });
}
/* patch bar (like the browser bar of a software synth): previous / next step through own patches, then factory */
function patchOrder(){ return Object.keys(readPatches()).sort((a,b)=>a.localeCompare(b)).map(n=>[n,1]).concat(Object.keys(PRESETS).map(n=>[n,0])); }
function stepPatch(d){
  const L=patchOrder(); if(!L.length) return;
  let i=L.findIndex(x=>x[0]===curPatch && (x[1]===1)===Object.prototype.hasOwnProperty.call(readPatches(),curPatch));
  i = i<0 ? (d>0?0:L.length-1) : (i+d+L.length)%L.length;
  const [n,own]=L[i]; if(own) loadPatch(n); else applyPreset(n);
}
(function(){
  const sheet=$('#sheet'), inp=$('#pname'), save=$('#psave');
  const open=()=>{ renderMyPatches(); paintPatchName(); if(curPatch && !inp.value) inp.value=curPatch; sheet.classList.add('open'); };
  $('#patch').onclick=()=>{ if(sheet.classList.contains('open')) sheet.classList.remove('open'); else open(); };
  $('#pprev').onclick=()=>stepPatch(-1);
  $('#pnext').onclick=()=>stepPatch(1);
  $('#pquick').onclick=()=>{
    const all=readPatches(), q=$('#pquick');
    if(curPatch && all[curPatch]){            /* own patch: save over it straight away */
      all[curPatch]=patchParams(); if(!writePatches(all)) return;
      curDirty=false; paintPatchName(); q.classList.add('flash'); q.lastChild.textContent='Saved';
      setTimeout(()=>{ q.classList.remove('flash'); q.lastChild.textContent='Save'; },1100);
    } else { open(); inp.value=''; inp.placeholder='Name for the new patch'; setTimeout(()=>inp.focus(),50); }
  };
  $('#pclose').onclick=()=>sheet.classList.remove('open');
  sheet.addEventListener('click', e=>{
    if(e.target.id==='sheet' || e.target.closest('#presets button')) sheet.classList.remove('open');
  });
  let armSave='';
  const doSave=()=>{
    const name=inp.value.trim().slice(0,28);
    if(!name){ inp.focus(); inp.placeholder='Type a name first'; return; }
    const all=readPatches();
    if(all[name] && armSave!==name){ armSave=name; save.textContent='Replace?'; setTimeout(()=>{ if(armSave===name){ armSave=''; save.textContent='Save'; } },3000); return; }
    armSave=''; all[name]=patchParams();
    if(!writePatches(all)) return;
    save.textContent='Saved ✓'; save.classList.add('flash'); setTimeout(()=>{ save.textContent='Save'; save.classList.remove('flash'); },1200);
    document.querySelectorAll('#presets button').forEach(b=>b.classList.remove('sel'));
    curPatch=name; curDirty=false; paintPatchName(); renderMyPatches();
  };
  save.onclick=doSave;
  inp.addEventListener('keydown',e=>{ e.stopPropagation(); if(e.key==='Enter') doSave(); if(e.key==='Escape') sheet.classList.remove('open'); });
  inp.addEventListener('keyup',e=>e.stopPropagation());
  $('#pexp').onclick=()=>{
    const all=readPatches(); if(!Object.keys(all).length){ inp.placeholder='Nothing to export yet'; return; }
    const blob=new Blob([JSON.stringify({app:'maxi.MS',v:1,patches:all},null,1)],{type:'application/json'});
    const a=document.createElement('a'); const d=new Date(), z=n=>String(n).padStart(2,'0');
    a.href=URL.createObjectURL(blob); a.download='maxi-ms_patches_'+d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'.json';
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
  };
  const file=$('#pfile');
  $('#pimp').onclick=()=>file.click();
  file.onchange=()=>{
    const fl=file.files&&file.files[0]; if(!fl) return;
    fl.text().then(txt=>{
      const o=JSON.parse(txt), src=(o&&o.patches&&typeof o.patches==='object')?o.patches:o;
      const all=readPatches(); let n=0;
      for(const k in src){ const p=src[k]; if(p&&typeof p==='object'&&!Array.isArray(p)){ all[String(k).slice(0,28)]=p; n++; } }
      if(!n) throw new Error('no patches in this file');
      writePatches(all); renderMyPatches(); inp.placeholder=n+' patch'+(n>1?'es':'')+' imported';
    }).catch(err=>showErr('× Import failed: '+(err&&err.message||err))).finally(()=>{ file.value=''; });
  };
})();

/* ---- keyboard ---- */
let octave=3, latch=false;
const touching=new Map();      /* pointerId -> {el, n} */
const latched=new Set();       /* midi notes held by LATCH */
const WHITE=[0,2,4,5,7,9,11], BLACKPOS=[0,1,3,4,5];

function paintKeys(){
  const on=new Set(latched);
  for(const c of touching.values()) on.add(c.n);
  document.querySelectorAll('#keys .wk, #keys .bk').forEach(el=>{
    el.classList.toggle('dn', on.has(midiFor(el)));
  });
}
function clearLatch(){
  latched.forEach(n=>sendNote('off',n));
  latched.clear();
  paintKeys();
}
/* phone: 10 white keys (the screen is narrow). Screen: whole octaves plus the top C, as many as fit at about
   36 px per white key (2 to 5 octaves, like a 25- to 61-key synth). Rebuilt when the width changes the count. */
const BIGKEYS=window.matchMedia('(min-width:900px)');
function keyCount(){
  if(!BIGKEYS.matches) return 10;
  const kb=$('#keys'), w=(kb && kb.clientWidth) || (innerWidth-230);
  const oct=Math.max(2, Math.min(5, Math.floor((w-36)/(7*36))));
  return oct*7+1;
}
function buildKeys(){
  const kb=$('#keys'); kb.innerHTML='';
  const nW=keyCount(); kb.dataset.n=nW;
  for(let i=0;i<nW;i++){ const d=document.createElement('div'); d.className='wk'; d.dataset.i=i; kb.appendChild(d); }
  const wpc=100/nW, bw=wpc*0.6;
  for(let o=0;o<Math.ceil(nW/7);o++) for(const b of BLACKPOS){
    const idx=o*7+b; if(idx>=nW-1) continue;
    const d=document.createElement('div'); d.className='bk';
    d.style.left=((idx+1)*wpc - bw/2)+'%'; d.style.width=bw+'%'; d.dataset.b=idx;
    kb.appendChild(d);
  }
  $('#octlabel').textContent='C'+octave;
  if(typeof paintKeys==='function') paintKeys();
}
addEventListener('resize',()=>{ const kb=$('#keys'); if(kb && +kb.dataset.n!==keyCount()) buildKeys(); });
function midiFor(el){
  if(el.dataset.i!==undefined){
    const i=+el.dataset.i, o=Math.floor(i/7), d=i%7;
    return 12*(octave+1)+WHITE[d]+12*o;
  }
  const b=+el.dataset.b, o=Math.floor(b/7), d=b%7;
  return 12*(octave+1)+WHITE[d]+1+12*o;
}
function keyAt(x,y){
  const els=document.elementsFromPoint(x,y);
  for(const e of els) if(e.classList && (e.classList.contains('bk')||e.classList.contains('wk'))) return e;
  return null;
}
function press(el,y){
  if(!el) return -1;
  const n=midiFor(el);
  if(latch && latched.has(n)){        /* tap a lit key to drop it */
    latched.delete(n); sendNote('off',n); paintKeys(); return n;
  }
  const r=el.getBoundingClientRect();
  const v=Math.max(0.25, Math.min(1, (y-r.top)/r.height*0.9+0.35));
  if(latch) latched.add(n);
  sendNote('on',n,v);
  paintKeys();
  return n;
}
function release(n){
  if(!latch && !latched.has(n)) sendNote('off',n);
  paintKeys();
}

function initKeyEvents(){
  const kb=$('#keys');
  kb.addEventListener('pointerdown', e=>{
    if(e.pointerType==='mouse' && e.button!==0) return;
    e.preventDefault(); try{ kb.setPointerCapture(e.pointerId); }catch(err){}
    const el=keyAt(e.clientX,e.clientY); if(!el) return;
    touching.set(e.pointerId,{el, n:press(el,e.clientY)});
  });
  kb.addEventListener('pointermove', e=>{
    if(!touching.has(e.pointerId)) return;
    if(e.pointerType==='mouse' && e.buttons===0){ up(e); return; }
    const cur=touching.get(e.pointerId);
    const el=keyAt(e.clientX,e.clientY);
    if(el && el!==cur.el){
      if(!latch){ touching.delete(e.pointerId); release(cur.n); }
      touching.set(e.pointerId,{el,n:press(el,e.clientY)});
    }
  });
  function up(e){
    const c=touching.get(e.pointerId);
    if(c){ touching.delete(e.pointerId); release(c.n); }
  }
  function allUp(){ for(const [id,c] of [...touching]){ touching.delete(id); release(c.n); } }
  kb.addEventListener('pointerup',up); kb.addEventListener('pointercancel',up);
  kb.addEventListener('lostpointercapture',up);
  window.addEventListener('pointerup',up,true);
  window.addEventListener('pointercancel',up,true);
  window.addEventListener('blur',allUp);      /* alt-tab away mid-note */

  $('#octdn').onclick=()=>{ octave=Math.max(0,octave-1); $('#octlabel').textContent='C'+octave; paintKeys(); saveState(); };
  $('#octup').onclick=()=>{ octave=Math.min(7,octave+1); $('#octlabel').textContent='C'+octave; paintKeys(); saveState(); };
  $('#latchbtn').onclick=e=>{
    latch=!latch; e.target.classList.toggle('on',latch);
    if(!latch) clearLatch();
  };

  /* mod strip */
  const strip=$('#modstrip'), fill=$('#modfill');
  const setMod=(e)=>{
    const r=strip.getBoundingClientRect();
    const up=r.height>r.width;   /* upright on a screen: bottom = 0, top = 1, like a mod wheel */
    const v=Math.max(0,Math.min(1, up ? (r.bottom-e.clientY)/r.height : (e.clientX-r.left)/r.width));
    P.modw=v; fill.style.width=(v*100)+'%'; fill.style.setProperty('--m',v); send('modw',v);
  };
  let mdrag=false;
  strip.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse' && e.button!==0) return;
    mdrag=true; try{ strip.setPointerCapture(e.pointerId); }catch(err){}
    setMod(e); e.preventDefault();
  });
  strip.addEventListener('pointermove',e=>{
    if(!mdrag) return;
    if(e.pointerType==='mouse' && e.buttons===0){ mdrag=false; return; }
    setMod(e);
  });
  const mup=()=>{ mdrag=false; };
  strip.addEventListener('pointerup',mup);
  strip.addEventListener('pointercancel',mup);
  strip.addEventListener('lostpointercapture',mup);
  window.addEventListener('pointerup',mup,true);
  window.addEventListener('blur',mup);

  /* computer keyboard, for desktop */
  const MAP='awsedftgyhujkolp;';
  const down=new Set();
  addEventListener('keydown',e=>{
    const i=MAP.indexOf(e.key.toLowerCase());
    if(i<0||down.has(e.key)) return;
    down.add(e.key);
    const n=12*(octave+1)+i;
    if(latch && latched.has(n)){ latched.delete(n); sendNote('off',n); paintKeys(); return; }
    if(latch) latched.add(n);
    sendNote('on',n,0.8); paintKeys();
  });
  addEventListener('keyup',e=>{
    const i=MAP.indexOf(e.key.toLowerCase());
    if(i<0) return; down.delete(e.key);
    release(12*(octave+1)+i);
  });
}

/* ---- screen wake lock ---- */
let wakeLock=null;
async function acquireWake(){
  try{
    if('wakeLock' in navigator && !document.hidden){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', ()=>{ wakeLock=null; });
    }
  }catch(e){ /* denied on low battery etc — not fatal */ }
}

/* ---- health: detect real dropouts instead of guessing ---- */
let hFb=0, hTot=0, hStrikes=0, hDropped=false;
function startHealth(usedWorklet){
  const set=(id,v)=>{ const e=$(id); if(e) e.textContent=v; };
  set('#s-eng', usedWorklet ? 'AudioWorklet' : 'ScriptProcessor');
  set('#s-sr', Math.round(ctx.sampleRate)+' Hz');

  setInterval(()=>{
    set('#s-lat', ctx.outputLatency ? (ctx.outputLatency*1000).toFixed(1)+' ms' : '—');
    set('#s-os', P.os>0.5 ? '2×' : '1×');

    const ps = ctx.playbackStats || ctx.playoutStats;
    if(!ps){ set('#s-drop','not reported'); return; }

    const fb=ps.fallbackFramesDuration, tot=ps.totalFramesDuration;
    const dFb=fb-hFb, dTot=tot-hTot;
    hFb=fb; hTot=tot;
    if(dTot<=0) return;

    const frac = dFb/dTot;
    set('#s-drop', (ps.fallbackFramesEvents!==undefined?ps.fallbackFramesEvents+' events · ':'')
                   + (frac*100).toFixed(2)+'%');

    if(frac>0.0005) hStrikes++; else if(hStrikes>0) hStrikes--;

    if(P.autoq>0.5 && hStrikes>=3 && !hDropped && P.os>0.5){
      P.os=0; send('os',0); hDropped=true;
      allControls.forEach(c=>c._sync && c._sync());
      showNote('Dropouts detected — oversampling dropped to 1×. Turn off Auto quality on the Voice page to override.');
    }
  }, 2000);
}
function showErr(msg){
  const d=$('#diag'); if(!d) return;
  d.classList.remove('info');
  d.style.display='block';
  d.textContent = (d.textContent?d.textContent+'\n':'') + msg;
}
function showNote(msg){
  const d=$('#diag'); if(!d) return;
  d.classList.add('info');
  d.style.display='block';
  d.textContent = msg;
  setTimeout(()=>{ if(d.classList.contains('info')) d.style.display='none'; }, 9000);
}
addEventListener('error', e=>showErr('× '+e.message+'  ('+(e.filename||'')+':'+(e.lineno||0)+')'));
addEventListener('unhandledrejection', e=>showErr('× '+((e.reason&&e.reason.message)||e.reason)));

/* ---- panel is built at load; audio waits for the first tap ---- */
/* ---- session persistence ----------------------------------------------
   Reopen exactly where you left off. This is the one place the app keeps
   mutable state outside the source: a namespaced localStorage entry holding
   the whole P plus theme and octave, written debounced on any change and
   read once at boot. Saved values are merged OVER DEF, so params added in a
   later version still fall back to their defaults. Everything is wrapped in
   try/catch: private-mode, a full quota, or a corrupt entry must never keep
   the panel from loading — on any failure it just boots the default patch.
   Tapping any preset overwrites the saved state, so a preset is the reset. */
const STORE_KEY='maxi.MS:state:v1';
let _saveTimer=null, _restoring=false;
function snapshot(){
  const p={}; for(const k in DEF) p[k]=P[k];
  return {p, theme:document.body.classList.contains('day'), octave, midi:serializeBinds(), patch:curPatch, dirty:curDirty};
}
function saveState(){
  if(_restoring || _saveTimer) return;
  _saveTimer=setTimeout(()=>{
    _saveTimer=null;
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(snapshot())); }catch(e){}
  }, 300);
}
function loadState(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(!raw) return null;
    const s=JSON.parse(raw);
    if(!s || typeof s!=='object' || !s.p || typeof s.p!=='object') return null;
    return s;
  }catch(e){ return null; }
}
function restoreState(s){
  s.p=migrateOsc(s.p);
  for(const k in DEF) P[k] = (k in s.p && isFinite(s.p[k])) ? s.p[k] : DEF[k];
  P.cutSemi = P.cut;
  const ep=engineParams();
  for(const k in ep) send(k, ep[k]);        /* no-op before boot; boot's init msg carries P */
  syncFx();
  allControls.forEach(c=>c._sync && c._sync());
  paintAccent();
  document.querySelectorAll('#presets button').forEach(b=>b.classList.remove('sel'));
  if(s.midi) restoreBinds(s.midi);
  if(typeof s.patch==='string'){ curPatch=s.patch.slice(0,28); curDirty=!!s.dirty; paintPatchName(); }
}

function initUI(){
  const saved = loadState();
  if(saved && typeof saved.octave==='number' && saved.octave>=0 && saved.octave<=7) octave=saved.octave|0;
  buildUI(); buildKeys(); initKeyEvents();
  const ol=$('#octlabel'); if(ol) ol.textContent='C'+octave;
  _restoring = true;
  if(saved){ initTheme(saved); restoreState(saved); }
  else     { initTheme();      applyPreset('Ladder bass'); }
  _restoring = false;
  requestAnimationFrame(fitPanel);
}
try{ initUI(); }catch(err){
  _restoring=false;
  /* a bad restore should never brick the panel — fall back to the default patch */
  try{ initTheme(); applyPreset('Ladder bass'); }catch(e){}
  showErr('× UI build failed: '+err.message);
}

/* ---- lazy boot ----------------------------------------------------------
   Browsers refuse to start an AudioContext without a user gesture, so the
   engine waits for the first touch of anything — a key, a knob, POWER. No
   door in front of the panel. Notes struck during the (async) boot are
   re-sent once it lands, so the first key still sounds. */
let booted=false, booting=null;

function ensureAudio(){
  if(booted) return Promise.resolve(true);
  if(booting) return booting;
  const pw=$('#power'); pw.textContent='…';
  booting = boot().then(w=>{
    booted=true; booting=null;
    startHealth(w); acquireWake();
    pw.textContent = w ? 'LIVE' : 'LIVE · COMPAT'; pw.classList.add('live');
    pw.onclick=()=>{ if(ctx.state==='running'){ctx.suspend();pw.textContent='STANDBY';pw.classList.remove('live');}
                     else {ctx.resume();pw.textContent='LIVE';pw.classList.add('live');} };
    /* anything held down through the boot never reached the engine — re-strike it */
    for(const c of touching.values()) if(c.n>=0) sendNote('on',c.n,0.8);
    latched.forEach(n=>sendNote('on',n,0.8));
    return w;
  }).catch(err=>{
    booting=null;                      /* let the next tap try again */
    pw.textContent='STANDBY';
    showErr('× Audio could not start: '+err.message+'  — tap to retry');
    return false;
  });
  return booting;
}

/* capture phase: this runs before the key/knob handlers on the same gesture */
addEventListener('pointerdown', ensureAudio, {capture:true});
addEventListener('keydown', e=>{ if(!e.metaKey && !e.ctrlKey && !e.altKey) ensureAudio(); }, {capture:true});
$('#power').onclick = ensureAudio;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden && ctx && ctx.state==='running'){
    if(node&&node.port) node.port.postMessage({t:'panic'});
    else if(engineFallback) engineFallback.handle({t:'panic'});
    latched.clear(); touching.clear();
    if(typeof midiPanic==='function') midiPanic();
    document.querySelectorAll('.dn').forEach(k=>k.classList.remove('dn'));
  } else if(!document.hidden && ctx && ctx.state==='running'){
    acquireWake();
  }
});
</script>
</body>
