<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Heliographie Engine 12.4 - Baryta Solid</title>
<style>
:root{
  --bg:#141210;
  --panel:#1f1b18;
  --panel-hi:#2a2420;
  --border:#443a32;
  --text:#d4c5b9;
  --dim:#8b7c70;
  --accent:#ffb000;
  --accent-dim:#b37b00;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html,body{height:100%;overscroll-behavior:none}
body{
  margin:0;font-family:ui-monospace,monospace;
  background:var(--bg);color:var(--text);overflow:hidden;
}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}

/* ---------- kopfzeile ---------- */
#bar{
  flex:none;display:flex;align-items:center;gap:.35rem;
  padding:.3rem .5rem;border-bottom:1px solid var(--border);
}
#bar .tag{
  font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent-dim);margin-right:.2rem;white-space:nowrap;
}
#meta{
  flex:1;min-width:0;font-size:.64rem;color:var(--dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.tbtn{
  flex:none;min-height:34px;padding:0 .6rem;
  background:var(--panel-hi);color:var(--text);
  border:1px solid var(--border);border-radius:3px;
  font:inherit;font-size:.66rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;cursor:pointer;
}
.tbtn.go{background:var(--accent-dim);border-color:var(--accent);color:#fff}
.tbtn:active:not(:disabled){background:var(--accent);color:#000}
.tbtn:disabled{opacity:.35}

/* ---------- bühne ---------- */
#main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
#stage{
  flex:1 1 auto;min-height:0;position:relative;
  display:flex;align-items:center;justify-content:center;
  padding:6px;overflow:hidden;touch-action:none;
  background:repeating-linear-gradient(45deg,#100e0c 0 8px,#131110 8px 16px);
}
#zoomWrap{
  position:relative;width:0;height:0;
  transform-origin:center center;will-change:transform;
  box-shadow:0 6px 26px rgba(0,0,0,.9);
}
#app:not(.hasimg) #zoomWrap{display:none}
#zoomWrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:#000}
#origCanvas{opacity:0;pointer-events:none}
#app.compare #origCanvas{opacity:1}
#app.sharp #zoomWrap canvas{image-rendering:pixelated}
#empty{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:1.5rem;color:var(--dim);
  font-size:.76rem;line-height:1.8;letter-spacing:.05em;
}
.badge{
  position:absolute;padding:.2rem .45rem;border-radius:3px;
  background:rgba(20,18,16,.85);border:1px solid var(--border);
  font-size:.64rem;letter-spacing:.1em;color:var(--accent);
  pointer-events:none;opacity:0;transition:opacity .25s;
}
#zoomTag{left:.5rem;bottom:.5rem}
#hintTag{left:50%;bottom:1.2rem;transform:translateX(-50%);color:var(--text)}
#app.zoomed #zoomTag{opacity:1}
#hintTag.show{opacity:1}

/* ---------- regler-leiste ---------- */
#strip{
  flex:none;background:var(--panel);border-top:1px solid var(--border);
  padding-bottom:var(--safe-b);
}
#chips{
  display:flex;gap:.3rem;overflow-x:auto;overflow-y:hidden;
  padding:.35rem .5rem;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
}
#chips::-webkit-scrollbar{display:none}
.sep{
  flex:none;align-self:center;padding:0 .25rem;
  font-size:.54rem;letter-spacing:.16em;text-transform:uppercase;color:#5c5048;
  border-left:1px solid var(--border);height:60%;display:flex;align-items:center;
}
.sep:first-child{border-left:none}
.chip{
  flex:none;min-height:34px;padding:0 .55rem;
  display:flex;align-items:baseline;gap:.35rem;
  background:var(--panel-hi);border:1px solid var(--border);border-radius:3px;
  color:var(--dim);font:inherit;font-size:.66rem;letter-spacing:.04em;
  white-space:nowrap;cursor:pointer;
}
.chip b{color:var(--text);font-weight:400}
.chip i{font-style:normal;color:var(--accent-dim);font-weight:700}
.chip[aria-pressed="true"]{border-color:var(--accent);background:#332a20}
.chip[aria-pressed="true"] b{color:var(--accent)}
.chip[aria-pressed="true"] i{color:var(--accent)}
#slot{
  display:flex;align-items:center;gap:.6rem;
  padding:.1rem .7rem .5rem;
}
#slot .val{
  flex:none;min-width:3.8rem;min-height:32px;
  font:inherit;font-size:.72rem;font-weight:700;color:var(--accent);
  background:var(--panel-hi);border:1px solid var(--border);border-radius:3px;
  cursor:pointer;
}
#slot .val:active{background:var(--accent-dim);color:#000}
input[type=range]{
  -webkit-appearance:none;appearance:none;
  flex:1;min-width:0;height:44px;margin:0;background:transparent;
  touch-action:none;cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{
  height:8px;border-radius:4px;
  background:linear-gradient(#0b0a09,#1a1614);border:1px solid var(--border);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:32px;height:32px;margin-top:-13px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ffd06b,var(--accent) 55%,var(--accent-dim));
  border:1px solid #6b4700;box-shadow:0 2px 6px rgba(0,0,0,.7);
}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:#0b0a09;border:1px solid var(--border)}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;border:1px solid #6b4700;background:var(--accent)}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:2px solid #fff;outline-offset:2px}

/* vollbild: alles weg, bild bekommt den ganzen schirm */
#app.immersive #bar,#app.immersive #strip{display:none}

/* ---------- dialog ---------- */
#veil{position:fixed;inset:0;z-index:20;background:rgba(10,9,8,.9);display:none;align-items:center;justify-content:center;padding:1.2rem}
#veil.open{display:flex}
#dialog{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:1rem}
#dialog h2{margin:0 0 .8rem;font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.seg{display:flex;gap:.4rem;margin-bottom:.5rem}
.seg button{flex:1;min-height:46px;background:var(--panel-hi);border:1px solid var(--border);border-radius:4px;color:var(--text);font:inherit;font-size:.74rem;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-dim);border-color:var(--accent);color:#fff}
.hint{color:var(--dim);font-size:.64rem;letter-spacing:.05em;line-height:1.6}
#track{height:6px;background:#0b0a09;border:1px solid var(--border);border-radius:3px;overflow:hidden;margin:.9rem 0 .5rem}
#fill{height:100%;width:0;background:var(--accent);transition:width .15s linear}
#stepTxt{font-size:.7rem;letter-spacing:.08em;color:var(--dim);min-height:1.2em}
.dlgRow{display:flex;gap:.5rem;margin-top:.8rem}
.dlgRow .tbtn{flex:1;min-height:46px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- querformat: leiste nach rechts ---------- */
@media (orientation:landscape) and (max-height:560px){
  #main{flex-direction:row}
  #strip{
    width:250px;flex:none;border-top:none;border-left:1px solid var(--border);
    display:flex;flex-direction:column;min-height:0;
  }
  #chips{flex-direction:column;overflow-x:hidden;overflow-y:auto;flex:1;align-items:stretch}
  .chip{justify-content:space-between}
  .sep{border-left:none;border-top:1px solid var(--border);height:auto;padding:.35rem .25rem 0}
  .sep:first-child{border-top:none}
}
</style>
</head>
<body>
<div id="app">

  <header id="bar">
    <span class="tag">Niépce 12.4</span>
    <span id="meta">kein Bild</span>
    <button class="tbtn" id="loadBtn">Bild</button>
    <button class="tbtn" id="abBtn" disabled>A/B</button>
    <button class="tbtn go" id="exportBtn" disabled>Export</button>
  </header>

  <div id="main">
    <div id="stage">
      <div id="zoomWrap">
        <canvas id="dstCanvas" width="8" height="8"></canvas>
        <canvas id="origCanvas" width="8" height="8"></canvas>
      </div>
      <div id="empty">Bild laden, um zu belichten.<br>Tippen = Vollbild · zwei Finger zoomen<br>Doppeltipp = 1:1</div>
      <div class="badge" id="zoomTag">1.0×</div>
      <div class="badge" id="hintTag">Tippen für Regler</div>
    </div>

    <footer id="strip">
      <div id="chips"></div>
      <div id="slot">
        <input type="range" id="live" min="0" max="1" step="0.01" value="0" aria-label="Reglerwert">
        <button class="val" id="liveVal" title="Zurücksetzen">–</button>
      </div>
    </footer>
  </div>

  <input type="file" id="upload" accept="image/*" hidden>

  <div id="veil">
    <div id="dialog">
      <h2>Export</h2>
      <div class="seg" id="mpSeg">
        <button data-mp="4000000">4 MP</button>
        <button data-mp="8000000">8 MP</button>
        <button data-mp="16000000">16 MP</button>
      </div>
      <p class="hint" id="dlgHint"></p>
      <div id="track" hidden><div id="fill"></div></div>
      <div id="stepTxt"></div>
      <div class="dlgRow">
        <button class="tbtn" id="cancelBtn">Abbrechen</button>
        <button class="tbtn go" id="goBtn">Belichten</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   Parameter
   ============================================================ */
const GROUPS = [
  {key:'licht',  name:'Licht'},
  {key:'optik',  name:'Optik'},
  {key:'korn',   name:'Korn'},
  {key:'chemie', name:'Chemie'}
];
const SLIDERS = [
  {g:'licht',  id:'threshold',   label:'Schwelle',    short:'Schwelle',  min:20,  max:230, value:128, step:1},
  {g:'licht',  id:'spectral',    label:'Spektral',    short:'Spektral',  min:0,   max:1,   value:0.8, step:0.1},
  {g:'licht',  id:'sun',         label:'Sonnenbahn',  short:'Sonne',     min:0,   max:15,  value:3.0, step:0.5},
  {g:'licht',  id:'vignette',    label:'Vignette',    short:'Vignette',  min:-100,max:100, value:0,   step:5},
  {g:'optik',  id:'blur',        label:'Optik Mitte', short:'Mitte',     min:0,   max:10,  value:0.5, step:0.5},
  {g:'optik',  id:'edge_blur',   label:'Randunschärfe',short:'Rand',     min:0,   max:30,  value:6.0, step:0.5},
  {g:'korn',   id:'grain_scale', label:'Körnung',     short:'Körnung',   min:1,   max:6,   value:2.0, step:0.5},
  {g:'korn',   id:'clump',       label:'Makro-Klump', short:'Klump',     min:0,   max:3,   value:1.2, step:0.1},
  {g:'chemie', id:'coating',     label:'Fließspuren', short:'Fließ',     min:0,   max:2,   value:0.5, step:0.1},
  {g:'chemie', id:'smear',       label:'Auswasch-Smear',short:'Smear',   min:0,   max:2,   value:0.4, step:0.1},
  {g:'chemie', id:'baryta',      label:'Baryt-Textur',short:'Baryt',     min:0,   max:1,   value:0.3, step:0.05}
];

const app      = document.getElementById('app');
const stage    = document.getElementById('stage');
const zoomWrap = document.getElementById('zoomWrap');
const dstCanvas= document.getElementById('dstCanvas');
const origCanvas=document.getElementById('origCanvas');
const ctxDst   = dstCanvas.getContext('2d',{willReadFrequently:true});
const ctxOrig  = origCanvas.getContext('2d');
const upload   = document.getElementById('upload');
const metaEl   = document.getElementById('meta');
const emptyEl  = document.getElementById('empty');
const zoomTag  = document.getElementById('zoomTag');
const hintTag  = document.getElementById('hintTag');
const exportBtn= document.getElementById('exportBtn');
const abBtn    = document.getElementById('abBtn');
const chipsEl  = document.getElementById('chips');
const live     = document.getElementById('live');
const liveVal  = document.getElementById('liveVal');

/* --- Reglerwerte liegen im Modell, nicht im DOM --- */
const state = {};
const chipEls = {};
SLIDERS.forEach(s=>state[s.id]=s.value);
let activeId = SLIDERS[0].id;

function fmt(v){ return String(v); }
function buildChips(){
  let lastG=null;
  SLIDERS.forEach(s=>{
    if(s.g!==lastG){
      const sep=document.createElement('span');
      sep.className='sep';
      sep.textContent=GROUPS.find(g=>g.key===s.g).name;
      chipsEl.appendChild(sep);
      lastG=s.g;
    }
    const c=document.createElement('button');
    c.type='button'; c.className='chip'; c.dataset.id=s.id;
    c.innerHTML='<b></b><i></i>';
    c.querySelector('b').textContent=s.short;
    c.setAttribute('aria-pressed', s.id===activeId ? 'true':'false');
    c.addEventListener('click',()=>selectParam(s.id,true));
    chipsEl.appendChild(c);
    chipEls[s.id]=c;
  });
}
function paramDef(id){ return SLIDERS.find(s=>s.id===id); }
function refreshChip(id){
  chipEls[id].querySelector('i').textContent = fmt(state[id]);
}
function selectParam(id, scroll){
  activeId=id;
  const d=paramDef(id);
  live.min=d.min; live.max=d.max; live.step=d.step; live.value=state[id];
  live.setAttribute('aria-label', d.label);
  liveVal.textContent = fmt(state[id]);
  Object.keys(chipEls).forEach(k=>chipEls[k].setAttribute('aria-pressed', String(k===id)));
  if(scroll) chipEls[id].scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
}
buildChips();
SLIDERS.forEach(s=>refreshChip(s.id));
selectParam(activeId,false);

live.addEventListener('input', e=>{
  state[activeId] = e.target.value;
  liveVal.textContent = fmt(state[activeId]);
  refreshChip(activeId);
  requestRender();
});
liveVal.addEventListener('click', ()=>{
  const d=paramDef(activeId);
  state[activeId]=d.value; live.value=d.value;
  liveVal.textContent=fmt(d.value); refreshChip(activeId);
  requestRender();
});

/* ============================================================
   Bildzustand
   ============================================================ */
let sourceImg = new Image();
let imageLoaded = false;
let originalFileName = 'baryta_print';
let cache = {noise:null,coarse:null,micro:null,baryta:null,w:0,h:0,scale:0};

const opticalCanvas = document.createElement('canvas');
const ctxOpt = opticalCanvas.getContext('2d',{willReadFrequently:true});
const edgeCanvas = document.createElement('canvas');
const ctxEdge = edgeCanvas.getContext('2d');
const rawCanvas = document.createElement('canvas');
const ctxRaw = rawCanvas.getContext('2d',{willReadFrequently:true});

function generateNoiseChannel(w,h,scale){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const ctx=c.getContext('2d',{willReadFrequently:true});
  const low=document.createElement('canvas');
  low.width=Math.max(1,Math.ceil(w/scale)); low.height=Math.max(1,Math.ceil(h/scale));
  const ctxLow=low.getContext('2d');
  const img=ctxLow.createImageData(low.width,low.height);
  for(let i=0;i<img.data.length;i+=4){
    const v=Math.random()*255;
    img.data[i]=v; img.data[i+1]=v; img.data[i+2]=v; img.data[i+3]=255;
  }
  ctxLow.putImageData(img,0,0);
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(low,0,0,w,h);
  const rgba=ctx.getImageData(0,0,w,h).data;
  const out=new Uint8ClampedArray(w*h);
  for(let idx=0,i=0; idx<out.length; idx++, i+=4) out[idx]=rgba[i];
  return out;
}
function generateBarytaChannel(w,h){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const ctx=c.getContext('2d',{willReadFrequently:true});
  ctx.fillStyle='rgb(128,128,128)'; ctx.fillRect(0,0,w,h);
  const low=document.createElement('canvas');
  low.width=Math.max(1,Math.ceil(w/4)); low.height=Math.max(1,Math.ceil(h/4));
  const ctxLow=low.getContext('2d');
  const img=ctxLow.createImageData(low.width,low.height);
  for(let i=0;i<img.data.length;i+=4){
    const v=128+(Math.random()-0.5)*40;
    img.data[i]=v; img.data[i+1]=v; img.data[i+2]=v; img.data[i+3]=255;
  }
  ctxLow.putImageData(img,0,0);
  ctx.imageSmoothingEnabled=true; ctx.globalAlpha=0.25;
  ctx.drawImage(low,0,0,w,h);
  const rgba=ctx.getImageData(0,0,w,h).data;
  const out=new Uint8ClampedArray(w*h);
  for(let idx=0,i=0; idx<out.length; idx++, i+=4) out[idx]=rgba[i];
  return out;
}

function applyOpticalPipeline(ctxTarget, img, w, h, sunAmt, blurAmt, edgeBlurAmt){
  const contrastBoost=100+(sunAmt*2.5);
  ctxTarget.filter = blurAmt>0 ? `blur(${blurAmt}px) contrast(${contrastBoost}%)` : `contrast(${contrastBoost}%)`;
  if(sunAmt>0){
    const steps=7, drawW=w+(sunAmt*2), drawH=h+(sunAmt*2);
    for(let i=0;i<steps;i++){
      const p=(i/(steps-1))-0.5;
      const dx=p*sunAmt*1.5, dy=(p*p)*sunAmt*0.5;
      ctxTarget.globalAlpha = i===0 ? 1.0 : (1.0/(i+1));
      ctxTarget.drawImage(img, dx-sunAmt, dy-sunAmt, drawW, drawH);
    }
    ctxTarget.globalAlpha=1.0;
  }else{
    ctxTarget.drawImage(img,0,0,w,h);
  }
  ctxTarget.filter='none';
  if(edgeBlurAmt>0){
    edgeCanvas.width=w; edgeCanvas.height=h;
    ctxEdge.filter=`blur(${edgeBlurAmt}px)`;
    ctxEdge.drawImage(ctxTarget.canvas,0,0,w,h);
    ctxEdge.filter='none';
    ctxEdge.globalCompositeOperation='destination-in';
    const grad=ctxEdge.createRadialGradient(w/2,h/2,Math.min(w,h)*0.15,w/2,h/2,Math.min(w,h)*0.6);
    grad.addColorStop(0,'rgba(0,0,0,0)');
    grad.addColorStop(1,'rgba(0,0,0,1)');
    ctxEdge.fillStyle=grad; ctxEdge.fillRect(0,0,w,h);
    ctxTarget.globalCompositeOperation='source-over';
    ctxTarget.drawImage(edgeCanvas,0,0,w,h);
  }
}

function readParams(){
  return {
    grainScale: parseFloat(state.grain_scale),
    clump     : parseFloat(state.clump),
    threshold : parseInt(state.threshold),
    blur      : parseFloat(state.blur),
    edgeBlur  : parseFloat(state.edge_blur),
    vignette  : parseInt(state.vignette),
    sun       : parseFloat(state.sun),
    spectral  : parseFloat(state.spectral),
    coating   : parseFloat(state.coating),
    smear     : parseFloat(state.smear),
    baryta    : parseFloat(state.baryta)
  };
}
function developPixels(data, w, h, P, maps, start, end){
  const cx=w/2, cy=h/2;
  const maxDist=Math.sqrt(cx*cx+cy*cy);
  const vigStrength=Math.abs(P.vignette)/100;
  const vigSign = P.vignette<0 ? -1 : 1;
  const hasVig = P.vignette!==0;
  const coatK = P.coating>0 ? 20*P.coating : 0;
  const kx1=w*0.1, ky1=h*0.2, ky2=h*0.05, kx2=w*0.3;

  for(let idx=start; idx<end; idx++){
    const i = idx*4;
    const x = idx % w, y = (idx / w) | 0;

    const lumaNormal = data[i]*0.299 + data[i+1]*0.587 + data[i+2]*0.114;
    const lumaUV     = data[i+1]*0.2 + data[i+2]*0.8;
    let luma = lumaNormal*(1.0-P.spectral) + lumaUV*P.spectral;

    let vig = 1.0;
    if(hasVig){
      const dx=x-cx, dy=y-cy;
      const norm=Math.min(1.0, Math.sqrt(dx*dx+dy*dy)/maxDist);
      const f=norm*norm*(3.0-2.0*norm);
      vig = 1.0 + vigSign*(f*vigStrength*0.6);
      luma *= vig;
    }

    const noiseVal  = maps.noise[idx];
    const coarseVal = maps.coarse[idx];
    const microVal  = maps.micro ? maps.micro[idx] : 128;
    const coatVal   = coatK ? Math.sin(x/kx1 + y/ky1)*Math.cos(y/ky2 - x/kx2)*coatK : 0;

    const microTexture = (microVal-128)*0.35;
    const shadowFactor = Math.max(0, 1.0-(luma/180));
    const clumpMod = (coarseVal/255-0.5)*2.0;
    const vigThresholdMod = hasVig ? (1.0-vig)*35 : 0;
    const localThreshold = P.threshold + vigThresholdMod + (clumpMod*60*P.clump*shadowFactor) + coatVal;
    const dither = (Math.random()-0.5)*12;
    const diff = (luma + (noiseVal-128) + microTexture + dither) - localThreshold;

    if(diff<0){
      const v=Math.random()*6;
      data[i]=25+v; data[i+1]=22+v; data[i+2]=18+v;
    }else{
      const v=Math.random()*10;
      data[i]=240+v; data[i+1]=235+v; data[i+2]=225+v;
    }
    if(P.smear>0 && Math.abs(diff) < (15*P.smear)){
      const mix=(diff+15*P.smear)/(30*P.smear);
      data[i]  = data[i]*mix   + (120+Math.random()*15)*(1-mix);
      data[i+1]= data[i+1]*mix + (110+Math.random()*10)*(1-mix);
      data[i+2]= data[i+2]*mix + (100+Math.random()*5)*(1-mix);
    }
    if(P.baryta>0 && maps.baryta){
      const t=(maps.baryta[idx]-128)*0.15*P.baryta;
      data[i]  = Math.min(255,Math.max(0,data[i]+t));
      data[i+1]= Math.min(255,Math.max(0,data[i+1]+t));
      data[i+2]= Math.min(255,Math.max(0,data[i+2]+t));
    }
    data[i+3]=255;
  }
}

/* ============================================================
   Vorschau
   ============================================================ */
function processImage(){
  if(!imageLoaded || !sourceImg.complete || !sourceImg.naturalWidth) return;
  const w=dstCanvas.width, h=dstCanvas.height;
  if(!w||!h) return;
  const P=readParams();

  if(!cache.noise || cache.w!==w || cache.h!==h || cache.scale!==P.grainScale){
    cache.noise  = generateNoiseChannel(w,h,P.grainScale);
    cache.coarse = generateNoiseChannel(w,h,25);
    cache.micro  = generateNoiseChannel(w,h,0.8);
    cache.baryta = generateBarytaChannel(w,h);
    cache.w=w; cache.h=h; cache.scale=P.grainScale;
  }

  opticalCanvas.width=w; opticalCanvas.height=h;
  applyOpticalPipeline(ctxOpt, sourceImg, w, h, P.sun, P.blur, P.edgeBlur);

  const imgData=ctxOpt.getImageData(0,0,w,h);
  developPixels(imgData.data, w, h, P, cache, 0, w*h);

  rawCanvas.width=w; rawCanvas.height=h;
  ctxRaw.putImageData(imgData,0,0);
  const blurPx=Math.max(0.5, w*0.0005);
  ctxDst.filter=`blur(${blurPx.toFixed(2)}px) contrast(102%)`;
  ctxDst.drawImage(rawCanvas,0,0);
  ctxDst.filter='none';
}

let renderQueued=false, lastRenderMs=0;
function requestRender(){
  if(renderQueued) return;
  renderQueued=true;
  const delay = lastRenderMs>60 ? Math.min(lastRenderMs,180) : 0;
  setTimeout(()=>requestAnimationFrame(()=>{
    renderQueued=false;
    const t=performance.now();
    processImage();
    lastRenderMs=performance.now()-t;
  }), delay);
}

/* ============================================================
   Einpassen · Zoom · Pan
   ============================================================ */
let zoom=1, panX=0, panY=0;
const pointers=new Map();
let pinchBase=null, tapTimer=null, downPt=null, moved=false;

function applyTransform(){
  zoomWrap.style.transform=`translate(${panX}px, ${panY}px) scale(${zoom})`;
  app.classList.toggle('zoomed', zoom>1.02);
  app.classList.toggle('sharp', zoom>=2);
  zoomTag.textContent=zoom.toFixed(1)+'×';
}
function clampPan(){
  const maxX=Math.max(0,(zoomWrap.offsetWidth*zoom - stage.clientWidth)/2);
  const maxY=Math.max(0,(zoomWrap.offsetHeight*zoom - stage.clientHeight)/2);
  panX=Math.min(maxX,Math.max(-maxX,panX));
  panY=Math.min(maxY,Math.max(-maxY,panY));
}
function resetZoom(){ zoom=1; panX=0; panY=0; applyTransform(); }
function fitPreview(){
  if(!imageLoaded) return;
  const cs=getComputedStyle(stage);
  const availW=stage.clientWidth  - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const availH=stage.clientHeight - parseFloat(cs.paddingTop)  - parseFloat(cs.paddingBottom);
  if(availW<=0||availH<=0) return;
  const f=Math.min(availW/dstCanvas.width, availH/dstCanvas.height);
  zoomWrap.style.width =Math.max(1,Math.floor(dstCanvas.width *f))+'px';
  zoomWrap.style.height=Math.max(1,Math.floor(dstCanvas.height*f))+'px';
  clampPan(); applyTransform();
}
if(window.ResizeObserver) new ResizeObserver(()=>fitPreview()).observe(stage);
window.addEventListener('resize', fitPreview);
window.addEventListener('orientationchange', ()=>setTimeout(fitPreview,300));

function toggleImmersive(){
  if(!imageLoaded) return;
  app.classList.toggle('immersive');
  if(app.classList.contains('immersive')){
    hintTag.classList.add('show');
    setTimeout(()=>hintTag.classList.remove('show'),1400);
  }
  setTimeout(fitPreview,0);
}

stage.addEventListener('pointerdown', e=>{
  stage.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){ downPt={x:e.clientX,y:e.clientY}; moved=false; }
  if(pointers.size===2){
    const p=[...pointers.values()];
    pinchBase={dist:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y), zoom};
    moved=true;
  }
});
stage.addEventListener('pointermove', e=>{
  if(!pointers.has(e.pointerId)) return;
  const prev=pointers.get(e.pointerId);
  const dx=e.clientX-prev.x, dy=e.clientY-prev.y;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(downPt && Math.hypot(e.clientX-downPt.x, e.clientY-downPt.y)>10) moved=true;
  if(pointers.size===2 && pinchBase){
    const p=[...pointers.values()];
    const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
    zoom=Math.min(8,Math.max(1, pinchBase.zoom*(d/pinchBase.dist)));
    if(zoom<=1.02){ panX=0; panY=0; }
    clampPan(); applyTransform();
  }else if(pointers.size===1 && zoom>1.02){
    panX+=dx; panY+=dy; clampPan(); applyTransform();
  }
});
['pointerup','pointercancel'].forEach(t=>stage.addEventListener(t, e=>{
  pointers.delete(e.pointerId);
  if(pointers.size<2) pinchBase=null;
  if(t==='pointerup' && pointers.size===0 && !moved){
    if(tapTimer){                       // zweiter Tipp → 1:1 bzw. zurück
      clearTimeout(tapTimer); tapTimer=null;
      if(zoom>1.02) resetZoom();
      else { zoom=3; clampPan(); applyTransform(); }
    }else{                              // einzelner Tipp → Vollbild
      tapTimer=setTimeout(()=>{ tapTimer=null; toggleImmersive(); }, 280);
    }
  }
}));
stage.addEventListener('wheel', e=>{
  e.preventDefault();
  zoom=Math.min(8,Math.max(1, zoom*(e.deltaY<0?1.12:0.89)));
  if(zoom<=1.02){ panX=0; panY=0; }
  clampPan(); applyTransform();
},{passive:false});

/* ============================================================
   Bild laden
   ============================================================ */
document.getElementById('loadBtn').addEventListener('click',()=>upload.click());
upload.addEventListener('change', e=>{
  const file=e.target.files[0];
  if(!file) return;
  const dot=file.name.lastIndexOf('.');
  originalFileName = dot!==-1 ? file.name.substring(0,dot) : file.name;
  const reader=new FileReader();
  reader.onload=ev=>{
    sourceImg.onload=()=>{
      // Rasterauflösung an die tatsächliche Bühne koppeln
      const dpr=Math.min(window.devicePixelRatio||1,2);
      const box=stage.getBoundingClientRect();
      const longest=Math.max(box.width||window.innerWidth, box.height||window.innerHeight);
      const maxPrev=Math.max(640, Math.min(1300, Math.round(longest*dpr)));
      let w=sourceImg.naturalWidth, h=sourceImg.naturalHeight;
      if(w>maxPrev || h>maxPrev){
        const r=Math.min(maxPrev/w, maxPrev/h);
        w=Math.floor(w*r); h=Math.floor(h*r);
      }
      dstCanvas.width=w; dstCanvas.height=h;
      origCanvas.width=w; origCanvas.height=h;
      ctxOrig.drawImage(sourceImg,0,0,w,h);
      imageLoaded=true;
      cache.noise=null;
      emptyEl.style.display='none';
      app.classList.add('hasimg');
      metaEl.textContent=`${sourceImg.naturalWidth}×${sourceImg.naturalHeight}`;
      exportBtn.disabled=false; abBtn.disabled=false;
      resetZoom(); fitPreview(); processImage();
    };
    sourceImg.src=ev.target.result;
  };
  reader.readAsDataURL(file);
});

/* ---------- A/B ---------- */
['pointerdown','pointerup','pointercancel','pointerleave'].forEach(evt=>{
  abBtn.addEventListener(evt, e=>{
    if(abBtn.disabled) return;
    app.classList.toggle('compare', e.type==='pointerdown');
  });
});

/* ============================================================
   Export
   ============================================================ */
const veil=document.getElementById('veil'),
      mpSeg=document.getElementById('mpSeg'),
      dlgHint=document.getElementById('dlgHint'),
      track=document.getElementById('track'),
      fill=document.getElementById('fill'),
      stepTxt=document.getElementById('stepTxt'),
      goBtn=document.getElementById('goBtn'),
      cancelBtn=document.getElementById('cancelBtn');

let targetMP=(navigator.deviceMemory && navigator.deviceMemory<=4) ? 8000000 : 16000000;
let cancelled=false, busy=false;

function markSeg(){ [...mpSeg.children].forEach(b=>b.setAttribute('aria-pressed', String(+b.dataset.mp===targetMP))); }
function updateHint(){
  const mp=targetMP/1000000;
  dlgHint.textContent = mp>=16
    ? '16 MP braucht viel Speicher — auf älteren Telefonen kann der Tab abstürzen. Im Zweifel 8 MP.'
    : `Rendert auf ${mp} MP. Korn wird proportional mitskaliert.`;
}
mpSeg.addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b||busy) return;
  targetMP=+b.dataset.mp; markSeg(); updateHint();
});
exportBtn.addEventListener('click', ()=>{
  if(!imageLoaded) return;
  cancelled=false; busy=false;
  track.hidden=true; fill.style.width='0'; stepTxt.textContent='';
  goBtn.disabled=false;
  markSeg(); updateHint();
  veil.classList.add('open');
});
cancelBtn.addEventListener('click', ()=>{
  if(busy){ cancelled=true; stepTxt.textContent='Abbruch …'; }
  else veil.classList.remove('open');
});
goBtn.addEventListener('click', ()=>{ if(!busy) runExport(); });

const nextFrame=()=>new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));
function progress(p,txt){
  fill.style.width=Math.round(p*100)+'%';
  if(txt) stepTxt.textContent=txt;
}

async function runExport(){
  busy=true; goBtn.disabled=true; track.hidden=false;
  const P=readParams();
  try{
    let tW=sourceImg.naturalWidth, tH=sourceImg.naturalHeight;
    const s=Math.sqrt(targetMP/(tW*tH));
    tW=Math.floor(tW*s); tH=Math.floor(tH*s);
    const MAX_DIM=7500;
    if(tW>MAX_DIM||tH>MAX_DIM){
      const r=Math.min(MAX_DIM/tW,MAX_DIM/tH);
      tW=Math.floor(tW*r); tH=Math.floor(tH*r);
    }
    const ratio=tW/dstCanvas.width;

    progress(0.02,'Optik …'); await nextFrame();
    const opt=document.createElement('canvas');
    opt.width=tW; opt.height=tH;
    const ctxOff=opt.getContext('2d',{willReadFrequently:true});
    applyOpticalPipeline(ctxOff, sourceImg, tW, tH, P.sun*ratio, P.blur*ratio, P.edgeBlur*ratio);
    if(cancelled) throw 'abort';

    progress(0.12,'Korn …'); await nextFrame();
    const maps={};
    maps.noise=generateNoiseChannel(tW,tH,P.grainScale*ratio); await nextFrame();
    if(cancelled) throw 'abort';
    progress(0.24,'Klumpen …'); await nextFrame();
    maps.coarse=generateNoiseChannel(tW,tH,25*ratio); await nextFrame();
    if(cancelled) throw 'abort';
    progress(0.34,'Mikrostruktur …'); await nextFrame();
    maps.micro=generateNoiseChannel(tW,tH,0.8*ratio); await nextFrame();
    if(cancelled) throw 'abort';
    if(P.baryta>0){
      progress(0.42,'Baryt …'); await nextFrame();
      maps.baryta=generateBarytaChannel(tW,tH); await nextFrame();
    }
    if(cancelled) throw 'abort';

    progress(0.5,'Belichten …'); await nextFrame();
    const imgData=ctxOff.getImageData(0,0,tW,tH);
    const total=tW*tH, CHUNK=400000;
    for(let start=0; start<total; start+=CHUNK){
      developPixels(imgData.data, tW, tH, P, maps, start, Math.min(total,start+CHUNK));
      progress(0.5+0.42*(Math.min(total,start+CHUNK)/total));
      await nextFrame();
      if(cancelled) throw 'abort';
    }

    progress(0.94,'Papier …'); await nextFrame();
    const raw=document.createElement('canvas');
    raw.width=tW; raw.height=tH;
    raw.getContext('2d').putImageData(imgData,0,0);
    const finalC=document.createElement('canvas');
    finalC.width=tW; finalC.height=tH;
    const ctxF=finalC.getContext('2d');
    const blurPx=Math.max(0.8,tW*0.0005);
    ctxF.filter=`blur(${blurPx.toFixed(2)}px) contrast(102%)`;
    ctxF.drawImage(raw,0,0);

    progress(0.98,'Datei schreiben …'); await nextFrame();
    await new Promise(res=>{
      finalC.toBlob(blob=>{
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=url; a.download=`${originalFileName}_baryta.png`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(()=>URL.revokeObjectURL(url),60000);
        res();
      },'image/png');
    });
    progress(1,`Fertig — ${tW}×${tH}`);
    setTimeout(()=>veil.classList.remove('open'),900);
  }catch(err){
    if(err==='abort') stepTxt.textContent='Abgebrochen.';
    else{ console.error(err); stepTxt.textContent='Zu wenig Speicher. Kleinere Auflösung wählen.'; track.hidden=true; }
  }finally{
    busy=false; goBtn.disabled=false;
  }
}

applyTransform();
</script>
