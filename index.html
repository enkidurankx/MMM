<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0e14">
<title>enkidu rankX — tools</title>
<style>
  :root {
    --void:   #0b0e14;
    --panel:  #111825;
    --edge:   #1d2736;
    --edge-2: #2b3a4e;
    --ink:    #e6edf7;
    --dim:    #74839a;
    --faint:  #3d4a5e;
    --audio:  #ffb03a;
    --visual: #58d6c0;
    --livefx: #ff6a4d;
    --accent: var(--livefx);
    --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    background:
      radial-gradient(120% 80% at 50% -10%, #131c2b 0%, var(--void) 62%),
      var(--void);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 15px;
    line-height: 1.45;
    min-height: 100%;
    padding: 14px 14px 40px;
    /* dot field, echoing the map grid in the reference */
    background-attachment: fixed;
  }
  body::before {   /* faint dot field, echoing the map grid in the reference */
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image: radial-gradient(circle, #223047 1px, transparent 1.1px);
    background-size: 26px 26px;
    opacity:.55;
    -webkit-mask-image: radial-gradient(130% 90% at 50% 0%, #000 30%, transparent 78%);
            mask-image: radial-gradient(130% 90% at 50% 0%, #000 30%, transparent 78%);
  }
  main { position:relative; z-index:1; max-width: 1080px; margin:0 auto; }

  /* ── header: dot-matrix panel ───────────────────────────────── */
  .head {
    position:relative; border:1px solid var(--edge);
    background: linear-gradient(#101724, #0d131e);
    padding: 16px 14px 12px; margin-bottom: 20px;
  }
  .brk { position:absolute; width:9px; height:9px; border:1px solid var(--accent); opacity:.85; }
  .brk.tl { top:-1px; left:-1px;  border-right:0; border-bottom:0; }
  .brk.tr { top:-1px; right:-1px; border-left:0;  border-bottom:0; }
  .brk.bl { bottom:-1px; left:-1px;  border-right:0; border-top:0; }
  .brk.br { bottom:-1px; right:-1px; border-left:0;  border-top:0; }

  #marquee { display:block; margin:0 auto; image-rendering:auto; }
  .head-meta {
    display:flex; justify-content:space-between; align-items:baseline;
    flex-wrap:wrap; gap:6px 12px; margin-top:12px; padding-top:10px;
    border-top:1px dashed var(--edge);
    font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim);
  }
  .head-meta b { color:var(--ink); font-weight:600; }
  .tagline { font-size:12px; letter-spacing:.04em; color:var(--dim); text-transform:none; }

  /* ── rack ───────────────────────────────────────────────────── */
  .group { margin-bottom: 26px; }
  .group[data-g="audio"]  { --accent: var(--audio); }
  .group[data-g="visual"] { --accent: var(--visual); }
  .group[data-g="livefx"] { --accent: var(--livefx); }

  .grp-head {
    display:flex; align-items:center; gap:10px;
    margin-bottom:12px; cursor:pointer; list-style:none; user-select:none;
  }
  .grp-head::-webkit-details-marker { display:none; }
  .grp-caret {
    width:0; height:0; border-left:6px solid var(--accent);
    border-top:4px solid transparent; border-bottom:4px solid transparent;
    transition: transform .18s ease; flex:none;
  }
  .group[open] .grp-caret { transform: rotate(90deg); }
  .grp-label {
    font-size:11px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--accent); font-weight:600;
  }
  .grp-rule { flex:1; height:1px; background:linear-gradient(90deg, var(--accent), transparent); opacity:.4; }
  .grp-count { font-size:10.5px; color:var(--dim); letter-spacing:.1em; }

  .rack { display:grid; gap:10px; grid-template-columns: 1fr; }
  @media (min-width: 620px) { .rack { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 960px) { .rack { grid-template-columns: repeat(3, 1fr); } }

  /* ── channel tile ───────────────────────────────────────────── */
  .ch {
    position:relative; display:block; overflow:hidden;
    background: linear-gradient(160deg, var(--panel), #0d131e);
    border:1px solid var(--edge);
    padding:12px 13px 11px; text-decoration:none; color:inherit;
    transition: border-color .16s ease, transform .16s ease, background .16s ease;
  }
  .ch::after {   /* left signal bar, lights on hover */
    content:""; position:absolute; left:0; top:0; bottom:0; width:2px;
    background:var(--accent); opacity:.35; transition:opacity .16s ease;
  }
  .ch:hover, .ch:focus-visible {
    border-color: var(--edge-2); transform: translateY(-1px);
    background: linear-gradient(160deg, #16202f, #0f1622);
  }
  .ch:hover::after, .ch:focus-visible::after { opacity:1; }
  .ch:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  .idx {   /* oversized ghost numeral — the channel index */
    position:absolute; right:8px; top:2px; font-size:44px; font-weight:700;
    line-height:1; letter-spacing:-.04em; color:transparent;
    -webkit-text-stroke:1px var(--faint); opacity:.55; pointer-events:none;
  }
  .ch:hover .idx, .ch:focus-visible .idx { -webkit-text-stroke-color: var(--accent); opacity:.4; }

  .ch-top { display:flex; align-items:center; gap:8px; margin-bottom:7px; }
  .sym { font-size:15px; color:var(--accent); line-height:1; }
  .name { font-size:15px; font-weight:600; letter-spacing:.01em; }
  .desc {
    display:block; font-size:11.5px; line-height:1.5; color:var(--dim);
    margin-right:44px; min-height:2.5em;
  }
  .meta {
    display:flex; align-items:center; gap:7px; margin-top:9px;
    padding-top:8px; border-top:1px dashed var(--edge);
    font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint);
  }
  .ver { color:var(--dim); }
  .dots { flex:1; height:3px; opacity:.5;
    background-image: radial-gradient(circle, var(--faint) .8px, transparent .9px);
    background-size: 5px 3px; }

  footer {
    max-width:1080px; margin:28px auto 0; padding-top:14px;
    border-top:1px solid var(--edge);
    font-size:11px; letter-spacing:.08em; color:var(--faint);
    display:flex; gap:14px; flex-wrap:wrap;
  }
  footer a { color:var(--dim); text-decoration:none; border-bottom:1px solid var(--edge); }
  footer a:hover, footer a:focus-visible { color:var(--livefx); border-bottom-color:var(--livefx); }

  @media (prefers-reduced-motion: reduce) {
    * { transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>
<main>
  <section class="head">
    <span class="brk tl"></span><span class="brk tr"></span>
    <span class="brk bl"></span><span class="brk br"></span>
    <canvas id="marquee" aria-label="enkidu rankX"></canvas>
    <div class="head-meta">
      <span class="tagline">Browser-Instrumente · kein Login, keine Daten, einfach spielen</span>
      <span><b id="cnt">0</b> Tools · Stand <b id="upd">—</b></span>
    </div>
  </section>
  <div id="racks"></div>
</main>
<footer>
  <a href="https://enkidu-rankx.de">enkidu-rankx.de</a>
  <a href="https://sondage.bandcamp.com">bandcamp</a>
</footer>
<script>
const TOOLS = [
  { file: "rec4D-v2_2.html",             name: "rec.4D",   ver: "v2.2", date: "03.08.2026", desc: "4-Spur-Recorder + Drums",              sym: "▥", group: "audio"  },
  { file: "rb88-v4_8.html",              name: "rb.88",    ver: "v4.8", date: "03.08.2026", desc: "Drum Machine · groove switch",         sym: "▦", group: "audio"  },
  { file: "maxi-ms-v3_9.html",           name: "maxi.MS",  ver: "v3.9", date: "18.08.2026", desc: "My own lil synth — MS-20 highpass + ladder, 8 voice, 2 LFO, MIDI", sym: "∿", group: "audio"  },
  { file: "rs505-v1_18.html",             name: "RS-505",   ver: "v1.18", date: "18.08.2026", desc: "Paraphonic-String-Synth · 4-Line-Ensemble", sym: "≋", group: "audio"  },
  { file: "disk-rot-v1_2.html",          name: "Disk.rot", ver: "v1.2", date: "07.08.2026", desc: "Simuliert einen ausfallenden CD-Player", sym: "◎", group: "audio"  },
  { file: "speaknspell.html",            name: "Sp&Sp",    ver: "",     date: "20.07.2026", desc: "Speak & Spell Sprachsynthese",         sym: "◉", group: "audio"  },
  { file: "vell_chord_builder_v12.html", name: "Chords",   ver: "v12",  date: "20.07.2026", desc: "Harmonik-Werkzeug",                    sym: "♪", group: "audio"  },
  { file: "fxcam-v1_7.html",            name: "FX·Cam",   ver: "v1.7", date: "14.08.2026", desc: "Meta · Launcher/Umschalter für die 8 Live-FX-Kamera-Apps", sym: "⊞", group: "visual" },
  { file: "heliograph_v1_5.html",        name: "Helios",   ver: "v1.5", date: "03.08.2026", desc: "Foto zu Bitumen-Heliographie",         sym: "◐", group: "visual" },
  { file: "solargraph_engine_v1_9.html", name: "PinHole",  ver: "v1.9", date: "02.08.2026", desc: "Foto zu simulierter Langzeitbelichtung", sym: "☉", group: "visual" },
  { file: "chrom3-v2_7.html",            name: "chrom.3",  ver: "v2.7", date: "12.08.2026", desc: "Kamera · Frames sequenziell R→G→B",     sym: "⧉", group: "livefx" },
  { file: "lvds1-v2_5.html",            name: "LCD.nx",   ver: "v2.5", date: "12.08.2026", desc: "Kamera · LVDS-Zeilentreiber-Glitch · Touch-Panelschaden", sym: "☰", group: "livefx" },
  { file: "buf1-v1_6.html",             name: "bu.FFer",  ver: "v1.6", date: "12.08.2026", desc: "Kamera · nichtlineare Frame-Buffer-Wiedergabe · temporaler Glitch", sym: "⧖", group: "livefx" },
  { file: "roto5-v1_3.html",            name: "roto.5",   ver: "v1.3", date: "12.08.2026", desc: "Kamera · Stilrotoskop · Sobel-Kanten in 5 Modi", sym: "⬡", group: "livefx" },
  { file: "crt4-v1_4.html",             name: "crt.4",    ver: "v1.4", date: "13.08.2026", desc: "Kamera · CRT-Monitor · Scanlines/Glitch rotieren unabhängig · 4 FX-Winkel", sym: "◳", group: "livefx" },
  { file: "trk4-v1_20.html",             name: "trk.4",    ver: "v1.20", date: "20.08.2026", desc: "Kamera · KI-Objekt-Tracker (COCO-SSD) · Personen/Tiere/Fahrzeuge · lädt Modell (Netz)", sym: "⌖", group: "livefx" },
  { file: "therm3-v1_4.html",           name: "therm.3",  ver: "v1.4", date: "12.08.2026", desc: "Kamera · Thermal-Segmentierung (MediaPipe) · Person als Heatmap in 3 Paletten · lädt Modell (Netz)", sym: "♨", group: "livefx" },
  { file: "flow-x-v1_3.html",           name: "flow.x",   ver: "v1.3", date: "12.08.2026", desc: "Kamera · generative Optical-Flow-Advektion (WebGL2) · Bewegung malt fließende Farbspuren", sym: "⇝", group: "livefx" },
  { file: "hudx-v1_4.html",            name: "hud.x",    ver: "v1.4", date: "14.08.2026", desc: "Kamera · kinetisches Tactical-HUD · selbstkomponierend, reagiert auf Bewegung · 6-Modi-Shader", sym: "⎔", group: "livefx" },
  { file: "imux-v1_1.html",            name: "imu.x",    ver: "v1.1", date: "14.08.2026", desc: "Kamera · bewegungsgetriebener Feedback-Warp (WebGL2) · Neigung/Roll/Ruck verzerren ein zerfallendes Bild", sym: "⦿", group: "livefx" },
];

const GROUPS = [
  { id: "audio",  label: "Audio"  },
  { id: "visual", label: "Visual" },
  { id: "livefx", label: "Live Cam FX" },
];

// ── dot-matrix header ───────────────────────────────────────────────
// The title is rasterised to an LED grid rather than set as type: the tools here
// are all about pixel structure, phosphor and scan decay, so the masthead is made
// of the same material. Text -> offscreen bitmap -> sampled -> drawn as dots.
(function marquee(){
  const cv = document.getElementById("marquee");
  if (!cv) return;
  const ctx = cv.getContext("2d");
  const off = document.createElement("canvas");
  const octx = off.getContext("2d", { willReadFrequently: true });
  const TEXT = "ENKIDU RANKX";
  const ROWS = 9;
  let grid = null, cols = 0, pitch = 0, dpr = 1;
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

  function build(){
    octx.font = '700 ' + ROWS + 'px "Arial Narrow", "Helvetica Neue", Arial, sans-serif';
    cols = Math.ceil(octx.measureText(TEXT).width) + 2;
    off.width = cols; off.height = ROWS;
    octx.font = '700 ' + ROWS + 'px "Arial Narrow", "Helvetica Neue", Arial, sans-serif';
    octx.textBaseline = "alphabetic";
    octx.clearRect(0,0,cols,ROWS);
    octx.fillStyle = "#fff";
    octx.fillText(TEXT, 1, ROWS - 1.5);
    const d = octx.getImageData(0,0,cols,ROWS).data;
    grid = new Uint8Array(cols*ROWS);
    for (let i=0, p=0; i<grid.length; i++, p+=4) grid[i] = d[p+3] > 90 ? 1 : 0;

    const wrapW = cv.parentElement.clientWidth - 28;
    // cap the pitch: past ~7px the dots go blobby and the panel swallows the page
    pitch = Math.max(2, Math.min(7, Math.floor(wrapW / cols)));
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.style.width  = (cols*pitch) + "px";
    cv.style.height = (ROWS*pitch) + "px";
    cv.width  = Math.round(cols*pitch*dpr);
    cv.height = Math.round(ROWS*pitch*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  function paint(t){
    if (!grid) return;
    ctx.clearRect(0,0,cols*pitch,ROWS*pitch);
    const r = Math.max(0.9, pitch*0.36);
    for (let y=0;y<ROWS;y++){
      for (let x=0;x<cols;x++){
        const on = grid[y*cols+x];
        const cx = x*pitch + pitch/2, cy = y*pitch + pitch/2;
        let a;
        if (on){
          // slow sweep across the panel so the lit dots breathe like a real display
          const sweep = still ? 0 : Math.sin((x*0.16) - t*0.0016)*0.5 + 0.5;
          a = 0.72 + sweep*0.28;
        } else {
          a = 0.055;                      // unlit cells stay faintly visible
        }
        ctx.fillStyle = on ? "rgba(255,106,77," + a.toFixed(3) + ")"
                           : "rgba(120,140,170," + a + ")";
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.2832); ctx.fill();
      }
    }
  }

  let raf = 0;
  function loop(t){ paint(t); raf = requestAnimationFrame(loop); }
  function start(){
    build(); cancelAnimationFrame(raf);
    if (still) paint(0); else raf = requestAnimationFrame(loop);
  }
  start();
  let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(start, 120); });
})();

// ── racks ───────────────────────────────────────────────────────────
const channel = (t, n) => `
  <a class="ch" href="${t.file}">
    <span class="idx" aria-hidden="true">${String(n).padStart(2,"0")}</span>
    <span class="ch-top">
      <span class="sym" aria-hidden="true">${t.sym}</span>
      <span class="name">${t.name}</span>
    </span>
    <span class="desc">${t.desc}</span>
    <span class="meta">
      ${t.ver ? `<span class="ver">${t.ver}</span>` : ""}
      <span class="dots" aria-hidden="true"></span>
      <span>${t.date}</span>
    </span>
  </a>`;

let n = 0;
document.getElementById("racks").innerHTML = GROUPS.map(g => {
  const items = TOOLS.filter(t => t.group === g.id);
  if (!items.length) return "";
  const cells = items.map(t => channel(t, ++n)).join("");
  return `
  <details class="group" data-g="${g.id}" open>
    <summary class="grp-head">
      <span class="grp-caret" aria-hidden="true"></span>
      <span class="grp-label">${g.label}</span>
      <span class="grp-rule" aria-hidden="true"></span>
      <span class="grp-count">${String(items.length).padStart(2,"0")}</span>
    </summary>
    <nav class="rack" aria-label="${g.label}">${cells}</nav>
  </details>`;
}).join("");

// header readout: real numbers, not decoration
document.getElementById("cnt").textContent = String(TOOLS.length).padStart(2,"0");
const newest = TOOLS.map(t => t.date).filter(Boolean).sort((a,b) => {
  const p = s => s.split(".").reverse().join("");
  return p(a) < p(b) ? 1 : -1;
})[0];
document.getElementById("upd").textContent = newest || "—";
</script>
</body>
</html>
