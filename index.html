<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>enkidu rankX — tools</title>
<style>
  :root {
    --bg: #f4f2ec;
    --panel: #e9e6db;
    --text: #171815;
    --dim: #5c5850;
    --line: #d6d2c4;
    --rec: #b3261e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  main { width: 100%; max-width: 760px; margin: 0 auto; padding: 48px 20px; flex: 1; }

  header { margin-bottom: 32px; }
  h1 { font-size: 15px; font-weight: 400; letter-spacing: 0.04em; }
  h1 b { font-weight: 700; }
  .sub { color: var(--dim); font-size: 12px; margin-top: 4px; }

  /* Collapsible group (Audio / Visual) built on native <details>. */
  .group { border: none; }
  .group + .group { margin-top: 22px; }
  summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 2px;
    margin-bottom: 8px;
    color: var(--dim);
    font-size: 11px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    user-select: none;
    border-bottom: 1px solid var(--line);
  }
  summary::-webkit-details-marker { display: none; }
  summary:hover { color: var(--text); }
  summary:focus-visible { outline: none; color: var(--text); box-shadow: inset 0 0 0 1px var(--rec); }
  .grp-caret {
    width: 0; height: 0;
    border-left: 5px solid currentColor;
    border-top: 4px solid transparent;
    border-bottom: 4px solid transparent;
    transition: transform 120ms linear;
    flex-shrink: 0;
  }
  .group[open] > summary .grp-caret { transform: rotate(90deg); }
  .grp-label { font-weight: 700; }
  .grp-count { margin-left: auto; color: var(--dim); font-size: 10px; letter-spacing: 0.04em; }

  /* Fascia: 1px hairlines between channels, in both directions,
     formed by a --line background showing through a 1px grid gap. */
  .rack {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
  }

  .channel {
    background: var(--bg);
    text-decoration: none;
    color: var(--text);
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 16px 14px;
    min-height: 128px;
  }
  .channel:hover, .channel:focus-visible { background: var(--panel); outline: none; }
  .channel:focus-visible { box-shadow: inset 0 0 0 1px var(--rec); }

  .ch-head { display: flex; align-items: center; justify-content: space-between; }
  .ch { color: var(--dim); font-size: 11px; letter-spacing: 0.05em; }
  .rec {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--line);
    flex-shrink: 0;
    transition: background 120ms linear;
  }
  .channel:hover .rec, .channel:focus-visible .rec { background: var(--rec); }

  .sym {
    font-size: 26px;
    line-height: 1;
    color: var(--dim);
    transition: color 120ms linear;
  }
  .channel:hover .sym, .channel:focus-visible .sym { color: var(--text); }

  .name { font-weight: 700; font-size: 14px; margin-top: auto; }
  .desc { color: var(--dim); font-size: 11px; line-height: 1.4; }
  .meta { color: var(--dim); font-size: 10px; letter-spacing: 0.02em; }

  footer {
    width: 100%; max-width: 760px; margin: 0 auto;
    padding: 20px; color: var(--dim); font-size: 12px;
  }
  footer a { color: var(--dim); }
  footer a:hover { color: var(--text); }

  @media (max-width: 640px) {
    .rack { grid-template-columns: repeat(2, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) {
    .rec, .sym, .grp-caret { transition: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1><b>enkidu rankX</b> — tools</h1>
    <div class="sub">browser instruments · kein login, keine daten, einfach spielen</div>
  </header>
  <div id="racks"></div>
</main>
<footer>
  <a href="https://enkidu-rankx.de">enkidu-rankx.de</a> · <a href="https://sondage.bandcamp.com">bandcamp</a>
</footer>
<script>
// ── Neues Tool hinzufügen: eine Zeile ergänzen, group ("audio"/"visual"/"livefx") setzen,
//    HTML-Datei ins Repo legen. Reihenfolge/Nummerierung ergeben sich aus dem Array. ──
const TOOLS = [
  { file: "rec4D-v2_2.html",             name: "rec.4D",   ver: "v2.2", date: "03.08.2026", desc: "4-Spur-Recorder + Drums",              sym: "▥", group: "audio"  },
  { file: "rb88-v3_8.html",              name: "rb.88",    ver: "v3.8", date: "03.08.2026", desc: "Drum Machine · groove switch",         sym: "▦", group: "audio"  },
  { file: "disk-rot-v1_2.html",          name: "Disk.rot", ver: "v1.2", date: "07.08.2026", desc: "Simuliert einen ausfallenden CD-Player", sym: "◎", group: "audio"  },
  { file: "vell_chord_builder_v12.html", name: "Chords",   ver: "v12",  date: "20.07.2026", desc: "Harmonik-Werkzeug",                    sym: "♪", group: "audio"  },
  { file: "speaknspell.html",            name: "Sp&Sp",    ver: "",     date: "20.07.2026", desc: "Speak & Spell Sprachsynthese",         sym: "◉", group: "audio"  },
  { file: "maxi-ms-v3_3.html",           name: "maxi.MS",  ver: "v3.3", date: "17.08.2026", desc: "My own lil synth — MS-20 highpass + ladder, 8 voice, 2 LFO, MIDI", sym: "∿", group: "audio"  },
  { file: "rs505-v1_17.html",             name: "RS-505",   ver: "v1.17", date: "17.08.2026", desc: "Paraphonic-String-Synth · 4-Line-Ensemble", sym: "≋", group: "audio"  },
  { file: "fxcam-v1_7.html",            name: "FX·Cam",   ver: "v1.7", date: "14.08.2026", desc: "Meta · Launcher/Umschalter für die 8 Live-FX-Kamera-Apps", sym: "⊞", group: "visual" },
  { file: "heliograph_v1_5.html",        name: "Helios",   ver: "v1.5", date: "03.08.2026", desc: "Foto zu Bitumen-Heliographie",         sym: "◐", group: "visual" },
  { file: "solargraph_engine_v1_9.html", name: "PinHole",  ver: "v1.9", date: "02.08.2026", desc: "Foto zu simulierter Langzeitbelichtung", sym: "☉", group: "visual" },
  { file: "chrom3-v2_7.html",            name: "chrom.3",  ver: "v2.7", date: "12.08.2026", desc: "Kamera · Frames sequenziell R→G→B",     sym: "⧉", group: "livefx" },
  { file: "lvds1-v2_5.html",            name: "LCD.nx",   ver: "v2.5", date: "12.08.2026", desc: "Kamera · LVDS-Zeilentreiber-Glitch · Touch-Panelschaden", sym: "☰", group: "livefx" },
  { file: "buf1-v1_6.html",             name: "bu.FFer",  ver: "v1.6", date: "12.08.2026", desc: "Kamera · nichtlineare Frame-Buffer-Wiedergabe · temporaler Glitch", sym: "⧖", group: "livefx" },
  { file: "roto5-v1_3.html",            name: "roto.5",   ver: "v1.3", date: "12.08.2026", desc: "Kamera · Stilrotoskop · Sobel-Kanten in 5 Modi", sym: "⬡", group: "livefx" },
  { file: "crt4-v1_4.html",             name: "crt.4",    ver: "v1.4", date: "13.08.2026", desc: "Kamera · CRT-Monitor · Scanlines/Glitch rotieren unabhängig · 4 FX-Winkel", sym: "◳", group: "livefx" },
  { file: "trk4-v1_12.html",             name: "trk.4",    ver: "v1.12", date: "17.08.2026", desc: "Kamera · KI-Objekt-Tracker (COCO-SSD) · Personen/Tiere/Fahrzeuge · lädt Modell (Netz)", sym: "⌖", group: "livefx" },
  { file: "therm3-v1_4.html",           name: "therm.3",  ver: "v1.4", date: "12.08.2026", desc: "Kamera · Thermal-Segmentierung (MediaPipe) · Person als Heatmap in 3 Paletten · lädt Modell (Netz)", sym: "♨", group: "livefx" },
  { file: "flow-x-v1_3.html",           name: "flow.x",   ver: "v1.3", date: "12.08.2026", desc: "Kamera · generative Optical-Flow-Advektion (WebGL2) · Bewegung malt fließende Farbspuren", sym: "⇝", group: "livefx" },
  { file: "hudx-v1_4.html",            name: "hud.x",    ver: "v1.4", date: "14.08.2026", desc: "Kamera · kinetisches Tactical-HUD · selbstkomponierend, reagiert auf Bewegung · 6-Modi-Shader", sym: "⎔", group: "livefx" },
  { file: "imux-v1_1.html",            name: "imu.x",    ver: "v1.1", date: "14.08.2026", desc: "Kamera · bewegungsgetriebener Feedback-Warp (WebGL2) · Neigung/Roll/Ruck verzerren ein zerfallendes Bild", sym: "⦿", group: "livefx" },
];

const GROUPS = [
  { id: "audio",  label: "Audio"  },
  { id: "visual", label: "Visual" },
  { id: "livefx", label: "Live Cam FX" },
];

const channel = (t, n) => `
  <a class="channel" href="${t.file}">
    <span class="ch-head">
      <span class="ch">CH ${String(n).padStart(2, "0")}</span>
      <span class="rec" aria-hidden="true"></span>
    </span>
    <span class="sym" aria-hidden="true">${t.sym}</span>
    <span class="name">${t.name}</span>
    <span class="desc">${t.desc}</span>
    <span class="meta">${t.ver ? t.ver + " · " : ""}${t.date}</span>
  </a>`;

let n = 0;
document.getElementById("racks").innerHTML = GROUPS.map(g => {
  const items = TOOLS.filter(t => t.group === g.id);
  if (!items.length) return "";
  const cells = items.map(t => channel(t, ++n)).join("");
  return `
  <details class="group" open>
    <summary>
      <span class="grp-caret" aria-hidden="true"></span>
      <span class="grp-label">${g.label}</span>
      <span class="grp-count">${items.length}</span>
    </summary>
    <nav class="rack" aria-label="${g.label}">${cells}</nav>
  </details>`;
}).join("");
</script>
</body>
</html>
