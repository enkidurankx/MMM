<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#130f1f">
<title>enkidu rankX — tools</title>
<style>
  :root {
    --void:   #130f1f;
    --panel:  #1e1832;
    --panel-2:#282047;
    --edge:   #382f52;
    --edge-2: #574a80;
    --ink:    #f5f9ff;   /* 15.5:1 on panel */
    --dim:    #c2cede;   /* 10.3:1 — descriptions stay readable */
    --meta:   #93a3b8;   /*  6.4:1 — smallest type still passes AA */
    --audio:  #ffc061;
    --visual: #6ee7d0;
    --livefx: #ff8566;
    --accent: var(--livefx);
    --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    background: var(--void);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 15px; line-height:1.4;
    padding: 12px 12px 32px;
  }
  main { max-width: 1180px; margin:0 auto; }

  /* ── header ─────────────────────────────────────────────────── */
  .head {
    position:relative; border:1px solid var(--edge);
    background: var(--panel); padding:12px 12px 10px; margin-bottom:16px;
  }
  .brk { position:absolute; width:8px; height:8px; border:1px solid var(--accent); }
  .brk.tl { top:-1px; left:-1px;  border-right:0; border-bottom:0; }
  .brk.tr { top:-1px; right:-1px; border-left:0;  border-bottom:0; }
  .brk.bl { bottom:-1px; left:-1px;  border-right:0; border-top:0; }
  .brk.br { bottom:-1px; right:-1px; border-left:0;  border-top:0; }
  #marquee { display:block; margin:0 auto; }
  .head-meta {
    display:flex; justify-content:space-between; align-items:baseline;
    flex-wrap:wrap; gap:4px 12px; margin-top:10px; padding-top:9px;
    border-top:1px solid var(--edge);
    font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--meta);
  }
  .head-meta b { color:var(--ink); font-weight:600; }
  .tagline { font-size:12px; letter-spacing:.02em; color:var(--dim); text-transform:none; }

  /* ── racks ──────────────────────────────────────────────────── */
  .group { margin-bottom:18px; }
  /* Each rack tints its own fields ~9% toward its accent, so the grouping reads
     from the field itself, not just the edge bar. Checked for contrast: body text
     stays >12:1, descriptions >8:1, smallest meta type >5:1 on every tint. */
  .group[data-g="audio"]  { --accent: var(--audio);  --field:#322736; --field-hi:#42333a; }
  .group[data-g="visual"] { --accent: var(--visual); --field:#252b40; --field-hi:#2b394b; }
  .group[data-g="livefx"] { --accent: var(--livefx); --field:#322237; --field-hi:#42293a; }

  .grp-head {
    display:flex; align-items:center; gap:8px; margin-bottom:8px;
    cursor:pointer; list-style:none; user-select:none;
  }
  .grp-head::-webkit-details-marker { display:none; }
  .grp-caret {
    width:0; height:0; border-left:6px solid var(--accent);
    border-top:4px solid transparent; border-bottom:4px solid transparent;
    transition:transform .15s ease; flex:none;
  }
  .group[open] .grp-caret { transform:rotate(90deg); }
  .grp-label { font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--accent); font-weight:700; }
  .grp-rule { flex:1; height:1px; background:var(--edge); }
  .grp-count { font-size:10.5px; color:var(--meta); letter-spacing:.1em; }

  /* Dense field grid — two columns even on a phone, so a rack is a block
     you scan, not a list you scroll. */
  .rack { display:grid; gap:7px; grid-template-columns: repeat(2, minmax(0,1fr)); }
  @media (min-width: 560px)  { .rack { grid-template-columns: repeat(3, minmax(0,1fr)); } }
  @media (min-width: 860px)  { .rack { grid-template-columns: repeat(4, minmax(0,1fr)); } }
  @media (min-width: 1100px) { .rack { grid-template-columns: repeat(5, minmax(0,1fr)); } }

  /* ── field ──────────────────────────────────────────────────── */
  /* Cyberpunk folder cut: 45 degrees off the top-right corner. clip-path also cuts
     the 1px border away along that diagonal, so the cut edge is drawn back in by
     .ch::before — otherwise the corner reads as torn rather than chamfered.
     --tint is a per-tool colour (set inline, one hue per channel) and lands on the
     bottom edge + the cut, so a field is identifiable on its own, independent of
     the rack colour on the left bar. */
  .ch {
    position:relative; display:flex; flex-direction:column; min-width:0;
    background: var(--field, var(--panel)); border:1px solid var(--edge);
    border-left:3px solid var(--accent);
    border-bottom:2px solid var(--tint, var(--edge));
    padding:8px 9px 7px; text-decoration:none; color:inherit;
    transition: background .14s ease, border-color .14s ease;
    --cut: 14px;
    clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, 0 100%);
  }
  .ch::before {           /* the chamfer edge itself */
    content:""; position:absolute; top:6px; right:-3px;
    width:21px; height:2px; background: var(--tint, var(--edge-2));
    transform: rotate(45deg); transform-origin:center; pointer-events:none;
  }
  .ch:hover, .ch:focus-visible { background: var(--field-hi, var(--panel-2)); border-color: var(--edge-2); border-left-color: var(--accent); }
  .ch:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  .ch-top { display:flex; align-items:baseline; gap:6px; min-width:0; padding-right:11px; }
  .sym  { font-size:13px; color:var(--accent); line-height:1; flex:none; }
  .name { font-size:13.5px; font-weight:700; color:var(--ink); letter-spacing:.01em;
          white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .idx  { margin-left:auto; font-size:10px; color:var(--meta); letter-spacing:.06em; flex:none; }

  .desc {
    font-size:11px; line-height:1.35; color:var(--dim); margin-top:5px;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
    overflow:hidden; word-break:break-word;
  }
  .meta {
    display:flex; align-items:baseline; gap:6px; margin-top:auto; padding-top:6px;
    font-size:9.5px; letter-spacing:.08em; color:var(--meta); text-transform:uppercase;
  }
  .ver { color:var(--dim); font-weight:600; }
  .meta .sp { flex:1; }

  /* Filler field: completes the last row of a rack so the grid never ends ragged.
     Grey, inert, and not in the tab order — it reads as an empty slot, not a tool. */
  .ch.blank {
    background: #262133;   /* a filled plate (1.2:1 off the page ground), just recessed
                              below the live fields — the old near-transparent fill
                              measured 1.02:1 and read as a hole rather than a slot */
    border-color: var(--edge);
    border-left-color: #453c63;
    border-bottom-color: #453c63;
    pointer-events:none; cursor:default;
  }
  .ch.blank::before { background:#453c63; }

  footer {
    max-width:1180px; margin:22px auto 0; padding-top:12px;
    border-top:1px solid var(--edge);
    font-size:11px; letter-spacing:.06em; color:var(--meta);
    display:flex; gap:14px; flex-wrap:wrap;
  }
  footer a { color:var(--dim); text-decoration:none; border-bottom:1px solid var(--edge); }
  footer a:hover, footer a:focus-visible { color:var(--livefx); border-bottom-color:var(--livefx); }

  body::after {
    content:""; position:fixed; inset:0; pointer-events:none; z-index:50;
    background: radial-gradient(150% 95% at 50% 0%, #5446c8 0%, #322a8c 45%, #1d1a5a 100%);
    mix-blend-mode: screen; opacity:.085;
  }

  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<main>
  <section class="head">
    <span class="brk tl"></span><span class="brk tr"></span>
    <span class="brk bl"></span><span class="brk br"></span>
    <canvas id="marquee" aria-label="enkidu rankX"></canvas>
    <div class="head-meta">
      <span class="tagline">Browser-Instrumente · kein Login, keine Daten, einfach spielen</span>
      <span><b id="cnt">0</b> Tools · Stand <b id="upd">—</b></span>
    </div>
  </section>
  <div id="racks"></div>
</main>
<footer>
  <a href="https://enkidu-rankx.de">enkidu-rankx.de</a>
  <a href="https://sondage.bandcamp.com">bandcamp</a>
</footer>
<script>
const TOOLS = [
  { file: "rec4D-v2_2.html",             name: "rec.4D",   ver: "v2.2", date: "03.08.2026", desc: "4-Spur-Recorder + Drums",              sym: "▥", group: "audio"  },
  { file: "rb88-v4_8.html",              name: "rb.88",    ver: "v4.8", date: "03.08.2026", desc: "Drum Machine · groove switch",         sym: "▦", group: "audio"  },
  { file: "maxi-ms-v3_9.html",           name: "maxi.MS",  ver: "v3.9", date: "18.08.2026", desc: "My own lil synth — MS-20 highpass + ladder, 8 voice, 2 LFO, MIDI", sym: "∿", group: "audio"  },
  { file: "rs505-v1_18.html",             name: "RS-505",   ver: "v1.18", date: "18.08.2026", desc: "Paraphonic-String-Synth · 4-Line-Ensemble", sym: "≋", group: "audio"  },
  { file: "disk-rot-v1_2.html",          name: "Disk.rot", ver: "v1.2", date: "07.08.2026", desc: "Simuliert einen ausfallenden CD-Player", sym: "◎", group: "audio"  },
  { file: "speaknspell.html",            name: "Sp&Sp",    ver: "",     date: "20.07.2026", desc: "Speak & Spell Sprachsynthese",         sym: "◉", group: "audio"  },
  { file: "vell_chord_builder_v12.html", name: "Chords",   ver: "v12",  date: "20.07.2026", desc: "Harmonik-Werkzeug",                    sym: "♪", group: "audio"  },
  { file: "fxcam-v1_7.html",            name: "FX·Cam",   ver: "v1.7", date: "14.08.2026", desc: "Meta · Launcher/Umschalter für die 8 Live-FX-Kamera-Apps", sym: "⊞", group: "visual" },
  { file: "heliograph_v1_5.html",        name: "Helios",   ver: "v1.5", date: "03.08.2026", desc: "Foto zu Bitumen-Heliographie",         sym: "◐", group: "visual" },
  { file: "solargraph_engine_v1_9.html", name: "PinHole",  ver: "v1.9", date: "02.08.2026", desc: "Foto zu simulierter Langzeitbelichtung", sym: "☉", group: "visual" },
  { file: "chrom3-v2_7.html",            name: "chrom.3",  ver: "v2.7", date: "12.08.2026", desc: "Kamera · Frames sequenziell R→G→B",     sym: "⧉", group: "livefx" },
  { file: "lvds1-v2_5.html",            name: "LCD.nx",   ver: "v2.5", date: "12.08.2026", desc: "Kamera · LVDS-Zeilentreiber-Glitch · Touch-Panelschaden", sym: "☰", group: "livefx" },
  { file: "buf1-v1_6.html",             name: "bu.FFer",  ver: "v1.6", date: "12.08.2026", desc: "Kamera · nichtlineare Frame-Buffer-Wiedergabe · temporaler Glitch", sym: "⧖", group: "livefx" },
  { file: "roto5-v1_3.html",            name: "roto.5",   ver: "v1.3", date: "12.08.2026", desc: "Kamera · Stilrotoskop · Sobel-Kanten in 5 Modi", sym: "⬡", group: "livefx" },
  { file: "crt4-v1_4.html",             name: "crt.4",    ver: "v1.4", date: "13.08.2026", desc: "Kamera · CRT-Monitor · Scanlines/Glitch rotieren unabhängig · 4 FX-Winkel", sym: "◳", group: "livefx" },
  { file: "trk4-v1_20.html",             name: "trk.4",    ver: "v1.20", date: "20.08.2026", desc: "Kamera · KI-Objekt-Tracker (COCO-SSD) · Personen/Tiere/Fahrzeuge · lädt Modell (Netz)", sym: "⌖", group: "livefx" },
  { file: "therm3-v1_4.html",           name: "therm.3",  ver: "v1.4", date: "12.08.2026", desc: "Kamera · Thermal-Segmentierung (MediaPipe) · Person als Heatmap in 3 Paletten · lädt Modell (Netz)", sym: "♨", group: "livefx" },
  { file: "flow-x-v1_3.html",           name: "flow.x",   ver: "v1.3", date: "12.08.2026", desc: "Kamera · generative Optical-Flow-Advektion (WebGL2) · Bewegung malt fließende Farbspuren", sym: "⇝", group: "livefx" },
  { file: "hudx-v1_4.html",            name: "hud.x",    ver: "v1.4", date: "14.08.2026", desc: "Kamera · kinetisches Tactical-HUD · selbstkomponierend, reagiert auf Bewegung · 6-Modi-Shader", sym: "⎔", group: "livefx" },
  { file: "imux-v1_1.html",            name: "imu.x",    ver: "v1.1", date: "14.08.2026", desc: "Kamera · bewegungsgetriebener Feedback-Warp (WebGL2) · Neigung/Roll/Ruck verzerren ein zerfallendes Bild", sym: "⦿", group: "livefx" },
];

const GROUPS = [
  { id: "audio",  label: "Audio"  },
  { id: "visual", label: "Visual" },
  { id: "livefx", label: "Live Cam FX" },
];
// ── dot-matrix header ───────────────────────────────────────────────
// Title rasterised to an LED grid: the tools here are all about pixel structure,
// phosphor and scan decay, so the masthead is made of the same material.
(function marquee(){
  const cv = document.getElementById("marquee");
  if (!cv) return;
  const ctx = cv.getContext("2d");
  const off = document.createElement("canvas");
  const octx = off.getContext("2d", { willReadFrequently: true });
  const TEXT = "ENKIDU RANKX";
  const ROWS = 9;
  const FONT = '700 ' + ROWS + 'px "Arial Narrow", "Helvetica Neue", Arial, sans-serif';
  let grid = null, cols = 0, pitch = 0, dpr = 1;
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

  function build(){
    octx.font = FONT;
    cols = Math.ceil(octx.measureText(TEXT).width) + 2;
    off.width = cols; off.height = ROWS;
    octx.font = FONT; octx.textBaseline = "alphabetic";
    octx.clearRect(0,0,cols,ROWS);
    octx.fillStyle = "#fff";
    octx.fillText(TEXT, 1, ROWS - 1.5);
    const d = octx.getImageData(0,0,cols,ROWS).data;
    grid = new Uint8Array(cols*ROWS);
    for (let i=0,p=0;i<grid.length;i++,p+=4) grid[i] = d[p+3] > 90 ? 1 : 0;

    const wrapW = cv.parentElement.clientWidth - 24;
    pitch = Math.max(2, Math.min(6, Math.floor(wrapW / cols)));
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.style.width  = (cols*pitch) + "px";
    cv.style.height = (ROWS*pitch) + "px";
    cv.width  = Math.round(cols*pitch*dpr);
    cv.height = Math.round(ROWS*pitch*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function paint(t){
    if (!grid) return;
    ctx.clearRect(0,0,cols*pitch,ROWS*pitch);
    const r = Math.max(0.9, pitch*0.36);
    for (let y=0;y<ROWS;y++) for (let x=0;x<cols;x++){
      const on = grid[y*cols+x];
      const a = on ? (still ? 1 : 0.78 + (Math.sin((x*0.16) - t*0.0016)*0.5+0.5)*0.22) : 0.07;
      ctx.fillStyle = on ? "rgba(255,133,102," + a.toFixed(3) + ")"
                         : "rgba(150,170,200," + a + ")";
      ctx.beginPath(); ctx.arc(x*pitch+pitch/2, y*pitch+pitch/2, r, 0, 6.2832); ctx.fill();
    }
  }
  let raf = 0;
  function loop(t){ paint(t); raf = requestAnimationFrame(loop); }
  function start(){ build(); cancelAnimationFrame(raf); still ? paint(0) : (raf = requestAnimationFrame(loop)); }
  start();
  let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(start, 120); });
})();

// ── racks ───────────────────────────────────────────────────────────
const channel = (t, n) => `
  <a class="ch" href="${t.file}" style="--tint:hsl(${Math.round((n*137.508)%360)} 38% 56%)">
    <span class="ch-top">
      <span class="sym" aria-hidden="true">${t.sym}</span>
      <span class="name">${t.name}</span>
      <span class="idx" aria-hidden="true">${String(n).padStart(2,"0")}</span>
    </span>
    <span class="desc">${t.desc}</span>
    <span class="meta">
      ${t.ver ? `<span class="ver">${t.ver}</span>` : ""}
      <span class="sp"></span>
      <span>${t.date}</span>
    </span>
  </a>`;

let n = 0;
document.getElementById("racks").innerHTML = GROUPS.map(g => {
  const items = TOOLS.filter(t => t.group === g.id);
  if (!items.length) return "";
  const cells = items.map(t => channel(t, ++n)).join("");
  return `
  <details class="group" data-g="${g.id}" open>
    <summary class="grp-head">
      <span class="grp-caret" aria-hidden="true"></span>
      <span class="grp-label">${g.label}</span>
      <span class="grp-rule" aria-hidden="true"></span>
      <span class="grp-count">${String(items.length).padStart(2,"0")}</span>
    </summary>
    <nav class="rack" aria-label="${g.label}">${cells}</nav>
  </details>`;
}).join("");

// ── complete the last row of each rack ──────────────────────────────
// The column count comes from the breakpoint (2/3/4/5), so how many fillers a
// rack needs can only be known at runtime — and has to be recomputed whenever the
// width changes. Read the real column count off the computed grid rather than
// re-deriving the media queries in JS, so the two can never drift apart.
function padRacks(){
  document.querySelectorAll("nav.rack").forEach(rack => {
    rack.querySelectorAll(".blank").forEach(b => b.remove());
    const tpl = getComputedStyle(rack).gridTemplateColumns;
    if (!tpl || tpl === "none") return;                 // rack is collapsed — nothing to measure
    const cols = tpl.split(" ").filter(Boolean).length;
    if (cols < 2) return;
    const n = rack.querySelectorAll("a.ch").length;
    const need = (cols - (n % cols)) % cols;
    for (let i = 0; i < need; i++){
      const f = document.createElement("span");
      f.className = "ch blank";
      f.setAttribute("aria-hidden", "true");
      rack.appendChild(f);
    }
  });
}
padRacks();
let _pr; addEventListener("resize", () => { clearTimeout(_pr); _pr = setTimeout(padRacks, 120); });
document.querySelectorAll("details.group").forEach(d => d.addEventListener("toggle", padRacks));

// ── remember which racks are open ───────────────────────────────────
// Applied synchronously right after render, so a collapsed rack never flashes
// open first. Unknown/new groups default to open. Storage is best-effort:
// private mode or a blocked origin just means the defaults stand.
(function rackState(){
  const KEY = "mmm.hub.groups";
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) {}
  const groups = [...document.querySelectorAll("details.group")];
  groups.forEach(d => {
    const id = d.dataset.g;
    if (id in saved) d.open = !!saved[id];
  });
  const save = () => {
    try {
      const state = {};
      groups.forEach(d => { state[d.dataset.g] = d.open; });
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {}
  };
  groups.forEach(d => d.addEventListener("toggle", save));
})();

document.getElementById("cnt").textContent = String(TOOLS.length).padStart(2,"0");
const newest = TOOLS.map(t => t.date).filter(Boolean).sort((a,b) => {
  const p = s => s.split(".").reverse().join("");
  return p(a) < p(b) ? 1 : -1;
})[0];
document.getElementById("upd").textContent = newest || "—";
</script>
</body>
</html>
