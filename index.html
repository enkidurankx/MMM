<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>enkidu rankX — tools</title>
<style>
  :root {
    --bg: #f4f2ec;
    --panel: #e9e6db;
    --text: #171815;
    --dim: #5c5850;
    --line: #d6d2c4;
    --rec: #b3261e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  main { width: 100%; max-width: 760px; margin: 0 auto; padding: 48px 20px; flex: 1; }

  header { margin-bottom: 32px; }
  h1 { font-size: 15px; font-weight: 400; letter-spacing: 0.04em; }
  h1 b { font-weight: 700; }
  .sub { color: var(--dim); font-size: 12px; margin-top: 4px; }

  /* Fascia: 1px hairlines between channels, in both directions,
     formed by a --line background showing through a 1px grid gap. */
  .rack {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
  }

  .channel {
    background: var(--bg);
    text-decoration: none;
    color: var(--text);
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 16px 14px;
    min-height: 128px;
  }
  .channel:hover, .channel:focus-visible { background: var(--panel); outline: none; }
  .channel:focus-visible { box-shadow: inset 0 0 0 1px var(--rec); }

  .ch-head { display: flex; align-items: center; justify-content: space-between; }
  .ch { color: var(--dim); font-size: 11px; letter-spacing: 0.05em; }
  .rec {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--line);
    flex-shrink: 0;
    transition: background 120ms linear;
  }
  .channel:hover .rec, .channel:focus-visible .rec { background: var(--rec); }

  .sym {
    font-size: 26px;
    line-height: 1;
    color: var(--dim);
    transition: color 120ms linear;
  }
  .channel:hover .sym, .channel:focus-visible .sym { color: var(--text); }

  .name { font-weight: 700; font-size: 14px; margin-top: auto; }
  .desc { color: var(--dim); font-size: 11px; line-height: 1.4; }
  .meta { color: var(--dim); font-size: 10px; letter-spacing: 0.02em; }

  footer {
    width: 100%; max-width: 760px; margin: 0 auto;
    padding: 20px; color: var(--dim); font-size: 12px;
  }
  footer a { color: var(--dim); }
  footer a:hover { color: var(--text); }

  @media (max-width: 640px) {
    .rack { grid-template-columns: repeat(2, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) {
    .rec, .sym { transition: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1><b>enkidu rankX</b> — tools</h1>
    <div class="sub">browser instruments · kein login, keine daten, einfach spielen</div>
  </header>
  <nav class="rack" id="rack" aria-label="Tools"></nav>
</main>
<footer>
  <a href="https://enkidu-rankx.de">enkidu-rankx.de</a> · <a href="https://sondage.bandcamp.com">bandcamp</a>
</footer>
<script>
// ── Neues Tool hinzufügen: eine Zeile ergänzen, HTML-Datei ins Repo legen. ──
const TOOLS = [
  { file: "rec4D-v2_1.html",                 name: "rec.4D",     ver: "v2.1",  date: "31.07.2026", desc: "4-Spur-Recorder + Drums",              sym: "▥" },
  { file: "rb88-v3_1.html",                  name: "rb.88",      ver: "v3.1",  date: "30.07.2026", desc: "Drum Machine",                         sym: "▦" },
  { file: "disc-rot-v2_3.html",              name: "Disc Rot",   ver: "v2.3",  date: "31.07.2026", desc: "Simuliert einen ausfallenden CD-Player", sym: "◎" },
  { file: "vell_chord_builder_v12.html",     name: "Chords",     ver: "v12",   date: "20.07.2026", desc: "Harmonik-Werkzeug",                    sym: "♪" },
  { file: "speaknspell.html",                name: "Sp&Sp",      ver: "",      date: "20.07.2026", desc: "Speak & Spell Sprachsynthese",         sym: "◉" },
  { file: "maxi-ms-v1_6.html",               name: "maxi.MS",    ver: "v1.6",  date: "30.07.2026", desc: "MS-20/Ladder-Filter-Synth, 4-stimmig",  sym: "∿" },
  { file: "heliograph_v1_4.html",            name: "Helios",     ver: "v1.4",  date: "29.07.2026", desc: "Foto zu Bitumen-Heliographie",         sym: "◐" },
  { file: "solargraph_engine_v1_8.html",     name: "PinHole",    ver: "v1.8",  date: "29.07.2026", desc: "Foto zu simulierter Langzeitbelichtung", sym: "☉" },
];

document.getElementById("rack").innerHTML = TOOLS.map((t, i) => `
  <a class="channel" href="${t.file}">
    <span class="ch-head">
      <span class="ch">CH ${String(i + 1).padStart(2, "0")}</span>
      <span class="rec" aria-hidden="true"></span>
    </span>
    <span class="sym" aria-hidden="true">${t.sym}</span>
    <span class="name">${t.name}</span>
    <span class="desc">${t.desc}</span>
    <span class="meta">${t.ver ? t.ver + " · " : ""}${t.date}</span>
  </a>`).join("");
</script>
</body>
</html>
