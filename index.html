<style>
  :root {
    --void:   #171f1e;
    --panel:  #242e2d;
    --panel-2:#2c3937;
    --edge:   #3a4744;
    --edge-2: #52696d;
    --ink:    #e3ecf3;   /* 15.5:1 on panel */
    --dim:    #adc2d3;   /* 10.3:1 — descriptions stay readable */
    --meta:   #8ba0aa;   /*  6.4:1 — smallest type still passes AA */
    --audio:  #adc2d3;
    --visual: #86b5c0;
    --livefx: #6fa0ab;
    --offline:#9aabd6;
    --accent: var(--livefx);
    --mono: "Chakra Petch", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --display: "Orbitron", "Chakra Petch", ui-monospace, monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    background: transparent;
    color: var(--ink);
    font-family: var(--mono);
    font-size: 15px; line-height:1.4;
    padding: 12px 12px 32px;
  }
  html { background: var(--void); }
  #chip-bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
  /* let the generative chip pattern show through the panels */
  .head { background: color-mix(in srgb, var(--panel) 78%, transparent) !important; }
  .ch   { background: color-mix(in srgb, var(--panel) 80%, transparent) !important; }

  main { max-width: 1180px; margin:0 auto; }

  /* ── header ─────────────────────────────────────────────────── */
  .head {
    position:relative; border:1px solid var(--edge);
    background: var(--panel); padding:12px 12px 10px; margin-bottom:16px;
  }
  .brk { position:absolute; width:8px; height:8px; border:1px solid var(--accent); }
  .brk.tl { top:-1px; left:-1px;  border-right:0; border-bottom:0; }
  .brk.tr { top:-1px; right:-1px; border-left:0;  border-bottom:0; }
  .brk.bl { bottom:-1px; left:-1px;  border-right:0; border-top:0; }
  .brk.br { bottom:-1px; right:-1px; border-left:0;  border-top:0; }
  #marquee { display:block; margin:0; }
  .byline { font-family:var(--display); text-align:right; margin-top:0;
            font-size:10px; letter-spacing:.28em; text-transform:uppercase; color:var(--meta); }
  .head-top { display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }
  .head-right { display:flex; flex-direction:column; align-items:flex-end; gap:3px; margin-left:auto; }
  .hub-ver { font-family:var(--display); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--meta); }
  .head-meta {
    display:flex; justify-content:space-between; align-items:baseline;
    flex-wrap:wrap; gap:4px 12px; margin-top:10px; padding-top:9px;
    border-top:1px solid var(--edge);
    font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--meta);
  }
  .head-meta b { font-family:var(--display); color:var(--ink); font-weight:700; }
  .tagline { font-size:12px; letter-spacing:.02em; color:var(--dim); text-transform:none; }

  /* ── racks ──────────────────────────────────────────────────── */
  .group { margin-bottom:18px; }
  /* First attempt washed the panel with the same near-teal accent used for each
     tool's own left bar (--audio/--visual/--livefx are all pale blue-grey, only
     20-30 apart in raw hue) — diluted into the near-black page background, three
     of the four racks collapsed to the same colour (measured: 3-7 apart in RGB,
     effectively invisible). Panels below use their own, wider-spread hues (90°
     apart: amber/green/cyan/violet) instead, so the four racks are genuinely
     distinguishable — measured >15 apart in RGB at every step below, vs 3-7 before.
     --tint (each tool's own symbol/chamfer/bottom-edge colour) is untouched; only
     the rack-level palette used for --field/--field-hi/the panel wash changed.
     Contrast re-verified against these new, brighter panels: body text >9.7:1,
     descriptions >6:1 everywhere; the metadata colour dipped under 5:1 on the new
     panel fill specifically, so .grp-count switches to --dim there (still >6.4:1). */
  .group[data-g="audio"]  { --accent: var(--audio);  --field:#272b26; --field-hi:#2f3029; --panel-fill:#36352d; --panel-edge:#645542; }
  .group[data-g="visual"] { --accent: var(--visual); --field:#1f2f26; --field-hi:#233629; --panel-fill:#273d2d; --panel-edge:#3e6842; }
  .group[data-g="livefx"] { --accent: var(--livefx); --field:#1f2b2e; --field-hi:#233035; --panel-fill:#27353c; --panel-edge:#3e5568; }
  .group[data-g="offline"]{ --accent: var(--offline); --field:#27272e; --field-hi:#2f2a35; --panel-fill:#362d3c; --panel-edge:#644268; }
  .group {
    background: var(--panel-fill);
    border: 1px solid var(--panel-edge);
    padding: 10px 10px 12px;
  }
  .group .grp-count { color: var(--dim); }

  .grp-head {
    display:flex; align-items:center; gap:8px; margin-bottom:8px;
    cursor:pointer; list-style:none; user-select:none;
  }
  .grp-head::-webkit-details-marker { display:none; }
  .grp-caret {
    width:0; height:0; border-left:6px solid var(--accent);
    border-top:4px solid transparent; border-bottom:4px solid transparent;
    transition:transform .15s ease; flex:none;
  }
  .group[open] .grp-caret { transform:rotate(90deg); }
  .grp-label { font-family:var(--display); font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--accent); font-weight:700; }
  .grp-rule { flex:1; height:1px; background:var(--edge); }
  .grp-count { font-size:10.5px; color:var(--meta); letter-spacing:.1em; }

  /* Dense field grid — two columns even on a phone, so a rack is a block
     you scan, not a list you scroll. */
  .rack { display:grid; gap:7px; grid-template-columns: repeat(2, minmax(0,1fr)); }
  @media (min-width: 560px)  { .rack { grid-template-columns: repeat(3, minmax(0,1fr)); } }
  @media (min-width: 860px)  { .rack { grid-template-columns: repeat(4, minmax(0,1fr)); } }
  @media (min-width: 1100px) { .rack { grid-template-columns: repeat(5, minmax(0,1fr)); } }

  /* ── field ──────────────────────────────────────────────────── */
  /* Cyberpunk folder cut: 45 degrees off the top-right corner. clip-path also cuts
     the 1px border away along that diagonal, so the cut edge is drawn back in by
     .ch::before — otherwise the corner reads as torn rather than chamfered.
     --tint is a per-tool colour (set inline, one hue per channel) and lands on the
     bottom edge + the cut, so a field is identifiable on its own, independent of
     the rack colour on the left bar. */
  .ch {
    position:relative; display:flex; flex-direction:column; min-width:0;
    background: var(--field, var(--panel)); border:1px solid var(--edge);
    border-left:3px solid var(--accent);
    border-bottom:2px solid var(--tint, var(--edge));
    padding:8px 9px 7px; text-decoration:none; color:inherit;
    transition: background .14s ease, border-color .14s ease;
    --cut: 14px;
    clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, 0 100%);
  }
  .ch::before {           /* the chamfer edge itself */
    content:""; position:absolute; top:6px; right:-3px;
    width:21px; height:2px; background: var(--tint, var(--edge-2));
    transform: rotate(45deg); transform-origin:center; pointer-events:none;
  }
  .ch:hover, .ch:focus-visible { background: var(--field-hi, var(--panel-2)); border-color: var(--edge-2); border-left-color: var(--accent); }
  .ch:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  /* centred rather than baseline-aligned: at 26px the glyph no longer shares a
     sensible baseline with the name */
  .ch-top { display:flex; align-items:center; gap:7px; min-width:0; padding-right:11px; }
  .sym  { font-size:26px; color:var(--tint, var(--accent)); line-height:1; flex:none; }
  .name { font-family:var(--display); font-size:12.5px; font-weight:700; color:var(--ink); letter-spacing:.01em;
          white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .idx  { margin-left:auto; font-size:10px; color:var(--meta); letter-spacing:.06em; flex:none; }

  .desc {
    font-size:11px; line-height:1.35; color:var(--dim); margin-top:5px;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
    overflow:hidden; word-break:break-word;
  }
  .meta {
    display:flex; align-items:baseline; gap:6px; margin-top:auto; padding-top:6px;
    font-size:9.5px; letter-spacing:.08em; color:var(--meta); text-transform:uppercase;
  }
  .ver { color:var(--dim); font-weight:600; }
  .meta .sp { flex:1; }

  /* Filler field: completes the last row of a rack so the grid never ends ragged.
     Grey, inert, and not in the tab order — it reads as an empty slot, not a tool. */
  .ch.blank {
    background: #1e2726;   /* a filled plate (1.2:1 off the page ground), just recessed
                              below the live fields — the old near-transparent fill
                              measured 1.02:1 and read as a hole rather than a slot */
    border-color: var(--edge);
    border-left-color: #3a4744;
    border-bottom-color: #3a4744;
    pointer-events:none; cursor:default;
  }
  .ch.blank::before { background:#3a4744; }

  footer {
    max-width:1180px; margin:22px auto 0; padding-top:12px;
    border-top:1px solid var(--edge);
    font-size:11px; letter-spacing:.06em; color:var(--meta);
    display:flex; gap:14px; flex-wrap:wrap;
  }
  footer a { color:var(--dim); text-decoration:none; border-bottom:1px solid var(--edge); }
  footer a:hover, footer a:focus-visible { color:var(--livefx); border-bottom-color:var(--livefx); }

  body::after {
    content:""; position:fixed; inset:0; pointer-events:none; z-index:50;
    background: radial-gradient(150% 95% at 50% 0%, #3b707d 0%, #2b545c 45%, #17343a 100%);
    mix-blend-mode: screen; opacity:.085;
  }

  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style>

// ── dot-matrix header ───────────────────────────────────────────────
// Title rasterised to an LED grid: the tools here are all about pixel structure,
// phosphor and scan decay, so the masthead is made of the same material.
(function marquee(){
  const cv = document.getElementById("marquee");
  if (!cv) return;
  const ctx = cv.getContext("2d");
  const off = document.createElement("canvas");
  const octx = off.getContext("2d", { willReadFrequently: true });
  const TEXT = "M/M/M";
  const ROWS = 15;
  // same face as the tool names, so the masthead and the fields speak one language
  const FONT = '700 ' + ROWS + 'px Orbitron, "Chakra Petch", Arial, sans-serif';
  let grid = null, cols = 0, pitch = 0, dpr = 1;
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

  function build(){
    octx.font = FONT;
    cols = Math.ceil(octx.measureText(TEXT).width) + 2;
    off.width = cols; off.height = ROWS;
    octx.font = FONT; octx.textBaseline = "alphabetic";
    if ("letterSpacing" in octx) octx.letterSpacing = "1px";   // keep the slashes off the M's
    octx.clearRect(0,0,cols,ROWS);
    octx.fillStyle = "#fff";
    octx.fillText(TEXT, 1, ROWS - 1.5);
    const d = octx.getImageData(0,0,cols,ROWS).data;
    grid = new Uint8Array(cols*ROWS);
    for (let i=0,p=0;i<grid.length;i++,p+=4) grid[i] = d[p+3] > 90 ? 1 : 0;

    const wrapW = cv.parentElement.clientWidth - 24;
    pitch = Math.max(2, Math.min(3, Math.floor(wrapW / cols)));
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.style.width  = (cols*pitch) + "px";
    cv.style.height = (ROWS*pitch) + "px";
    cv.width  = Math.round(cols*pitch*dpr);
    cv.height = Math.round(ROWS*pitch*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function paint(t){
    if (!grid) return;
    ctx.clearRect(0,0,cols*pitch,ROWS*pitch);
    const r = Math.max(0.9, pitch*0.36);
    for (let y=0;y<ROWS;y++) for (let x=0;x<cols;x++){
      const on = grid[y*cols+x];
      const a = on ? (still ? 1 : 0.78 + (Math.sin((x*0.16) - t*0.0016)*0.5+0.5)*0.22) : 0.07;
      ctx.fillStyle = on ? "rgba(255,133,102," + a.toFixed(3) + ")"
                         : "rgba(150,170,200," + a + ")";
      ctx.beginPath(); ctx.arc(x*pitch+pitch/2, y*pitch+pitch/2, r, 0, 6.2832); ctx.fill();
    }
  }
  let raf = 0;
  function loop(t){ paint(t); raf = requestAnimationFrame(loop); }
  function start(){ build(); cancelAnimationFrame(raf); still ? paint(0) : (raf = requestAnimationFrame(loop)); }
  start();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(start);   // re-raster once Orbitron is live
  let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(start, 120); });
})();

    <span class="ch-top">

      ${t.ver ? `<span class="ver">${t.ver}</span>` : ""}
      <span class="sp"></span>
      <span>${t.date}</span>
    </span>
  </a>`;

let n = 0;
document.getElementById("racks").innerHTML = GROUPS.map(g => {
  const items = TOOLS.filter(t => t.group === g.id);
  if (!items.length) return "";
  const cells = items.map(t => channel(t, ++n)).join("");
  return `
  <details class="group" data-g="${g.id}" open>
    <summary class="grp-head">
      <span class="grp-caret" aria-hidden="true"></span>
      <span class="grp-label">${g.label}</span>
      <span class="grp-rule" aria-hidden="true"></span>
      <span class="grp-count">${String(items.length).padStart(2,"0")}</span>
    </summary>
    <nav class="rack" aria-label="${g.label}">${cells}</nav>
  </details>`;
}).join("");

// ── complete the last row of each rack ──────────────────────────────
// The column count comes from the breakpoint (2/3/4/5), so how many fillers a
// rack needs can only be known at runtime — and has to be recomputed whenever the
// width changes. Read the real column count off the computed grid rather than
// re-deriving the media queries in JS, so the two can never drift apart.
function padRacks(){
  document.querySelectorAll("nav.rack").forEach(rack => {
    rack.querySelectorAll(".blank").forEach(b => b.remove());
    const tpl = getComputedStyle(rack).gridTemplateColumns;
    if (!tpl || tpl === "none") return;                 // rack is collapsed — nothing to measure
    const cols = tpl.split(" ").filter(Boolean).length;
    if (cols < 2) return;
    const n = rack.querySelectorAll("a.ch").length;
    const need = (cols - (n % cols)) % cols;
    for (let i = 0; i < need; i++){
      const f = document.createElement("span");
      f.className = "ch blank";
      f.setAttribute("aria-hidden", "true");
      rack.appendChild(f);
    }
  });
}
padRacks();
let _pr; addEventListener("resize", () => { clearTimeout(_pr); _pr = setTimeout(padRacks, 120); });
document.querySelectorAll("details.group").forEach(d => d.addEventListener("toggle", padRacks));

// ── remember which racks are open ───────────────────────────────────
// Applied synchronously right after render, so a collapsed rack never flashes
// open first. Unknown/new groups default to open. Storage is best-effort:
// private mode or a blocked origin just means the defaults stand.
(function rackState(){
  const KEY = "mmm.hub.groups";
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) {}
  const groups = [...document.querySelectorAll("details.group")];
  groups.forEach(d => {
    const id = d.dataset.g;
    if (id in saved) d.open = !!saved[id];
  });
  const save = () => {
    try {
      const state = {};
      groups.forEach(d => { state[d.dataset.g] = d.open; });
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {}
  };
  groups.forEach(d => d.addEventListener("toggle", save));
})();

document.getElementById("cnt").textContent = String(TOOLS.length).padStart(2,"0");
const newest = TOOLS.map(t => t.date).filter(Boolean).sort((a,b) => {
  const p = s => s.split(".").reverse().join("");
  return p(a) < p(b) ? 1 : -1;
})[0];
document.getElementById("upd").textContent = newest || "—";
</script>
<script>
(function() {
  const container = document.getElementById('chip-bg');
  if (!container) return;
  const ns = 'http://www.w3.org/2000/svg';
  const rand = () => Math.random();
  const randInt = (min, max) => Math.floor(rand() * (max - min + 1)) + min;
  const rr = (min, max) => min + rand() * (max - min);

  // Recoloured to the hub palette (teal/slate) instead of the original neutral greys
  const C = {
    bg: 'transparent',
    grid: 'rgba(58,71,68,0.16)',
    gridMed: 'rgba(82,105,109,0.22)',
    border: 'rgba(134,181,192,0.28)',
    trace: 'rgba(111,160,171,0.32)',
    traceHi: 'rgba(173,194,211,0.48)',
    traceLo: 'rgba(139,160,170,0.18)',
    pad: 'rgba(134,181,192,0.38)',
    via: 'rgba(111,160,171,0.46)',
    label: 'rgba(139,160,170,0.30)'
  };

  function draw() {
    container.innerHTML = '';
    const W = window.innerWidth;
    const H = window.innerHeight;
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('xmlns', ns);
    svg.setAttribute('width', W);
    svg.setAttribute('height', H);
    svg.style.display = 'block';

    const step = Math.max(8, Math.floor(Math.min(W, H) / 100));
    for (let x = 0; x <= W; x += step) {
      const l = document.createElementNS(ns, 'line');
      l.setAttribute('x1', x); l.setAttribute('y1', 0);
      l.setAttribute('x2', x); l.setAttribute('y2', H);
      l.setAttribute('stroke', C.grid); l.setAttribute('stroke-width', '0.5');
      svg.appendChild(l);
    }
    for (let y = 0; y <= H; y += step) {
      const l = document.createElementNS(ns, 'line');
      l.setAttribute('x1', 0); l.setAttribute('y1', y);
      l.setAttribute('x2', W); l.setAttribute('y2', y);
      l.setAttribute('stroke', C.grid); l.setAttribute('stroke-width', '0.5');
      svg.appendChild(l);
    }
    const mStep = step * 4;
    for (let x = 0; x <= W; x += mStep) {
      const l = document.createElementNS(ns, 'line');
      l.setAttribute('x1', x); l.setAttribute('y1', 0);
      l.setAttribute('x2', x); l.setAttribute('y2', H);
      l.setAttribute('stroke', C.gridMed); l.setAttribute('stroke-width', '0.8');
      svg.appendChild(l);
    }
    for (let y = 0; y <= H; y += mStep) {
      const l = document.createElementNS(ns, 'line');
      l.setAttribute('x1', 0); l.setAttribute('y1', y);
      l.setAttribute('x2', W); l.setAttribute('y2', y);
      l.setAttribute('stroke', C.gridMed); l.setAttribute('stroke-width', '0.8');
      svg.appendChild(l);
    }

    // no die border / corner markers — keeps the pattern reading as an endless field
    const m = Math.min(W, H) * 0.04;
    const dw = W - m * 2, dh = H - m * 2;

    const density = (W * H) / 10000;

    const tCount = Math.floor(density * rr(6, 12));
    for (let i = 0; i < tCount; i++) {
      const horiz = rand() > 0.45;
      const x = m + rand() * dw, y = m + rand() * dh;
      const len = rr(20, horiz ? dw * 0.7 : dh * 0.7);
      const w = rr(0.3, 1.2);
      const col = rand() > 0.6 ? C.traceHi : (rand() > 0.4 ? C.trace : C.traceLo);
      const op = rr(0.25, 0.55);
      const l = document.createElementNS(ns, 'line');
      if (horiz) { l.setAttribute('x1', x); l.setAttribute('y1', y); l.setAttribute('x2', x+len); l.setAttribute('y2', y); }
      else { l.setAttribute('x1', x); l.setAttribute('y1', y); l.setAttribute('x2', x); l.setAttribute('y2', y+len); }
      l.setAttribute('stroke', col); l.setAttribute('stroke-width', w);
      l.setAttribute('stroke-opacity', op); l.setAttribute('stroke-linecap', 'round');
      svg.appendChild(l);
      if (rand() > 0.75) {
        const bl = rr(8, 30);
        const bend = document.createElementNS(ns, 'line');
        if (horiz) { bend.setAttribute('x1', x+len); bend.setAttribute('y1', y); bend.setAttribute('x2', x+len); bend.setAttribute('y2', y + (rand()>0.5?bl:-bl)); }
        else { bend.setAttribute('x1', x); bend.setAttribute('y1', y+len); bend.setAttribute('x2', x + (rand()>0.5?bl:-bl)); bend.setAttribute('y2', y+len); }
        bend.setAttribute('stroke', col); bend.setAttribute('stroke-width', w);
        bend.setAttribute('stroke-opacity', op); bend.setAttribute('stroke-linecap', 'round');
        svg.appendChild(bend);
      }
    }

    const zCount = Math.floor(density * rr(0.5, 1.0));
    for (let i = 0; i < zCount; i++) {
      const sx = m + rand()*dw*0.9, sy = m + rand()*dh*0.9;
      const segW = rr(3,10), segH = rr(2,8), segs = randInt(4,10), w = rr(0.5,1.2);
      let pts = sx+','+sy, cx=sx, cy=sy;
      for (let s=0;s<segs;s++){ cx+=segW; pts+=' '+cx+','+cy; cy += (s%2===0?segH:-segH); pts+=' '+cx+','+cy; }
      const p = document.createElementNS(ns, 'polyline');
      p.setAttribute('points', pts); p.setAttribute('stroke', C.traceHi); p.setAttribute('stroke-width', w);
      p.setAttribute('stroke-opacity', rr(0.3,0.5)); p.setAttribute('fill','none');
      p.setAttribute('stroke-linecap','round'); p.setAttribute('stroke-linejoin','round');
      svg.appendChild(p);
    }

    const pCount = Math.floor(density * rr(0.4, 0.8));
    for (let i = 0; i < pCount; i++) {
      const px = m + rand()*dw*0.9, py = m + rand()*dh*0.9;
      const isRow = rand() > 0.5, cnt = randInt(3,8), pw = rr(3,6), ph = rr(2,5), gap = pw + rr(2,5);
      for (let k=0;k<cnt;k++){
        const x = isRow ? px+k*gap : px, y = isRow ? py : py+k*gap;
        const r = document.createElementNS(ns, 'rect');
        r.setAttribute('x', x); r.setAttribute('y', y); r.setAttribute('width', pw); r.setAttribute('height', ph);
        r.setAttribute('fill','none'); r.setAttribute('stroke', C.pad); r.setAttribute('stroke-width','0.6');
        r.setAttribute('stroke-opacity', rr(0.35,0.65));
        svg.appendChild(r);
      }
    }

    const vCount = Math.floor(density * rr(4, 8));
    for (let i = 0; i < vCount; i++) {
      const vx = m + rand()*dw, vy = m + rand()*dh, vr = rr(0.8,2.2);
      const c = document.createElementNS(ns, 'circle');
      c.setAttribute('cx', vx); c.setAttribute('cy', vy); c.setAttribute('r', vr);
      c.setAttribute('fill', C.via); c.setAttribute('fill-opacity', rr(0.3,0.55));
      svg.appendChild(c);
    }

    const bCount = Math.floor(density * rr(0.5, 1.0));
    for (let i = 0; i < bCount; i++) {
      const bx = m + rand()*dw*0.85, by = m + rand()*dh*0.85;
      const bw = rr(20, Math.min(dw*0.12,80)), bh = rr(15, Math.min(dh*0.10,50));
      const r = document.createElementNS(ns, 'rect');
      r.setAttribute('x', bx); r.setAttribute('y', by); r.setAttribute('width', bw); r.setAttribute('height', bh);
      r.setAttribute('fill','none'); r.setAttribute('stroke', C.border); r.setAttribute('stroke-width','1');
      r.setAttribute('stroke-opacity','0.45');
      svg.appendChild(r);
      const lines = randInt(1,3);
      for (let j=0;j<lines;j++){
        const ly = by + (bh/(lines+1))*(j+1);
        const l = document.createElementNS(ns, 'line');
        l.setAttribute('x1', bx+2); l.setAttribute('y1', ly); l.setAttribute('x2', bx+bw-2); l.setAttribute('y2', ly);
        l.setAttribute('stroke', C.traceLo); l.setAttribute('stroke-width','0.5');
        svg.appendChild(l);
      }
      if (rand() > 0.4) {
        const names = ['ALU','CACHE','CTRL','MUX','REG','IO','CLK','MEM','FIFO','ARB'];
        const t = document.createElementNS(ns, 'text');
        t.setAttribute('x', bx+4); t.setAttribute('y', by+10);
        t.setAttribute('fill', C.label); t.setAttribute('font-family','monospace'); t.setAttribute('font-size','7');
        t.textContent = names[randInt(0,names.length-1)];
        svg.appendChild(t);
      }
    }

    const rCount = Math.floor(density * rr(0.15, 0.35));
    for (let i = 0; i < rCount; i++) {
      const cx = m + dw*rr(0.15,0.85), cy = m + dh*rr(0.15,0.85);
      const rings = randInt(2,4);
      for (let r=0;r<rings;r++){
        const rad = rr(10,16) + r*rr(5,10);
        const c = document.createElementNS(ns, 'circle');
        c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', rad);
        c.setAttribute('fill','none'); c.setAttribute('stroke', C.traceLo); c.setAttribute('stroke-width','0.6');
        c.setAttribute('stroke-opacity', rr(0.18,0.32));
        svg.appendChild(c);
      }
    }

    const dCount = Math.floor(density * rr(0.2, 0.45));
    for (let i = 0; i < dCount; i++) {
      const sx = m + rand()*dw*0.9, sy = m + rand()*dh*0.9;
      const sw = rr(12,40), sh = rr(10,30), dstep = 6;
      for (let dx=0; dx<sw; dx+=dstep) for (let dy=0; dy<sh; dy+=dstep) {
        const c = document.createElementNS(ns, 'circle');
        c.setAttribute('cx', sx+dx); c.setAttribute('cy', sy+dy); c.setAttribute('r', 0.7);
        c.setAttribute('fill', C.via); c.setAttribute('fill-opacity', rr(0.25,0.45));
        svg.appendChild(c);
      }
      const r = document.createElementNS(ns, 'rect');
      r.setAttribute('x', sx); r.setAttribute('y', sy); r.setAttribute('width', sw); r.setAttribute('height', sh);
      r.setAttribute('fill','none'); r.setAttribute('stroke', C.traceLo); r.setAttribute('stroke-width','0.5');
      svg.appendChild(r);
    }

    const cCount = Math.floor(density * rr(0.2, 0.4));
    for (let i = 0; i < cCount; i++) {
      const cx = m + rand()*dw, cy = m + rand()*dh, s = rr(4,10);
      const h = document.createElementNS(ns, 'line');
      h.setAttribute('x1', cx-s); h.setAttribute('y1', cy); h.setAttribute('x2', cx+s); h.setAttribute('y2', cy);
      h.setAttribute('stroke', C.traceHi); h.setAttribute('stroke-width','0.8');
      svg.appendChild(h);
      const v = document.createElementNS(ns, 'line');
      v.setAttribute('x1', cx); v.setAttribute('y1', cy-s); v.setAttribute('x2', cx); v.setAttribute('y2', cy+s);
      v.setAttribute('stroke', C.traceHi); v.setAttribute('stroke-width','0.8');
      svg.appendChild(v);
    }

    const labels = ['VDD','VSS','CLK','DATA[7:0]','ADDR[15:0]','RESET','ENABLE','CORE_0','L1_CACHE','PLL','IO_PAD','SCAN'];
    const txtCount = Math.floor(density * rr(0.3, 0.6));
    for (let i = 0; i < txtCount; i++) {
      const t = document.createElementNS(ns, 'text');
      const tx = m + rand()*dw*0.95, ty = m + rand()*dh*0.95;
      t.setAttribute('x', tx); t.setAttribute('y', ty);
      t.setAttribute('fill', C.label); t.setAttribute('font-family','monospace'); t.setAttribute('font-size', randInt(6,9));
      if (rand() > 0.7) t.setAttribute('transform', 'rotate(90,'+tx+','+ty+')');
      t.textContent = labels[randInt(0,labels.length-1)];
      svg.appendChild(t);
    }

    const defs = document.createElementNS(ns, 'defs');
    const vig = document.createElementNS(ns, 'radialGradient');
    vig.setAttribute('id','chipvig'); vig.setAttribute('cx','50%'); vig.setAttribute('cy','50%'); vig.setAttribute('r','75%');
    const s1 = document.createElementNS(ns,'stop'); s1.setAttribute('offset','0%'); s1.setAttribute('stop-color','transparent');
    const s2 = document.createElementNS(ns,'stop'); s2.setAttribute('offset','100%'); s2.setAttribute('stop-color','rgba(0,0,0,0.4)');
    vig.appendChild(s1); vig.appendChild(s2); defs.appendChild(vig); svg.appendChild(defs);
    const vr = document.createElementNS(ns, 'rect');
    vr.setAttribute('width', W); vr.setAttribute('height', H); vr.setAttribute('fill','url(#chipvig)');
    svg.appendChild(vr);

    container.appendChild(svg);
  }

  let to;
  window.addEventListener('resize', function() { clearTimeout(to); to = setTimeout(draw, 150); });
  draw();
})();
</script>
</body>
</html>
