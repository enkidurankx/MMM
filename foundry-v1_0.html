    L.push('Rng.prototype.int=function(a,b){return Math.floor(this.range(a,b+1));};');
    L.push('Rng.prototype.chance=function(p){return this.next()<p;};');
    L.push('Rng.prototype.pick=function(arr){return arr[Math.floor(this.next()*arr.length)];};');
    L.push('function hslToRgb(h,s,l){function f(n){var k=(n+h*12)%12;var a=s*Math.min(l,1-l);return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))));}return[f(0),f(8),f(4)];}');
    L.push(MIX_RUNTIME);
    L.push(CAM_RUNTIME);
    L.push(BLOOM_RUNTIME);
    L.push(RASTER_RUNTIME);
    L.push('var NS="http://www.w3.org/2000/svg";');
    L.push('var KS={' + order.map(function (id) {
      return JSON.stringify(id) + ':' + BG.KERNELS[id].fn.toString();
    }).join(',') + '};');
    L.push('function draw(){var W=window.innerWidth,H=window.innerHeight,host=document.getElementById("bg");host.innerHTML="";' +
      'var panX=Math.max(-0.45,Math.min(0.45,PARAMS.panX||0))*W,panY=Math.max(-0.45,Math.min(0.45,PARAMS.panY||0))*H;');
    L.push('var svg=document.createElementNS(NS,"svg");svg.setAttribute("xmlns",NS);svg.setAttribute("width",W);svg.setAttribute("height",H);' +
      'var panT=svg;if(panX||panY){panT=document.createElementNS(NS,"g");panT.setAttribute("transform","translate("+panX.toFixed(1)+" "+panY.toFixed(1)+")");svg.appendChild(panT);}' +
      'var out={mode:"svg",W:W,H:H,root:svg,el:function(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);panT.appendChild(e);return e;}};');
    L.push('ORDER.forEach(function(id){if(SEL.indexOf(id)<0||!KS[id])return;var p=DEFS[id];p._pal=PAL;KS[id](new Rng(subSeed(SEED,id)),W,H,p,out);});');
    L.push('var bgc=document.createElementNS(NS,"rect");bgc.setAttribute("width",W);bgc.setAttribute("height",H);bgc.setAttribute("fill",BGCOL);svg.insertBefore(bgc,svg.firstChild);');
    L.push('if(VIGNETTE){var defs=document.createElementNS(NS,"defs");var rad=document.createElementNS(NS,"radialGradient");rad.setAttribute("id","vig");rad.setAttribute("cx","50%");rad.setAttribute("cy","50%");rad.setAttribute("r","75%");' +
      'var s1=document.createElementNS(NS,"stop");s1.setAttribute("offset","0%");s1.setAttribute("stop-color","rgba(0,0,0,0)");' +
      'var s2=document.createElementNS(NS,"stop");s2.setAttribute("offset","100%");s2.setAttribute("stop-color","rgba(0,0,0,0.5)");' +
      'rad.appendChild(s1);rad.appendChild(s2);defs.appendChild(rad);svg.appendChild(defs);' +
      'var vr=document.createElementNS(NS,"rect");vr.setAttribute("width",W);vr.setAttribute("height",H);vr.setAttribute("fill","url(#vig)");svg.appendChild(vr);}');
    L.push('if(GLITCH){var xml=new XMLSerializer().serializeToString(svg);var url=URL.createObjectURL(new Blob([xml],{type:"image/svg+xml;charset=utf-8"}));var im=new Image();' +
      'im.onload=function(){var cv=document.createElement("canvas");cv.width=W;cv.height=H;var ctx=cv.getContext("2d",{alpha:false});ctx.fillStyle=BGCOL;ctx.fillRect(0,0,W,H);ctx.drawImage(im,0,0,W,H);applyPost(ctx,new Rng(subSeed(SEED,"glitch")),W,H,GLAM);URL.revokeObjectURL(url);if(BLOOM>0.01)postBloom(cv,ctx,{bloom:BLOOM},W,H);host.innerHTML="";host.appendChild(cv);};' +
      'im.onerror=function(){URL.revokeObjectURL(url);};im.src=url;return;}');
    L.push('if(BLOOM>0.01){rasterPost(svg,{bloom:BLOOM},W,H,function(cv2){host.innerHTML="";host.appendChild(cv2);});return;}');
    L.push('host.appendChild(svg);');
    L.push('}');
    L.push('var to;window.addEventListener("resize",function(){clearTimeout(to);to=setTimeout(draw,200);});');
    cameraLines().forEach(function (l) { L.push(l); });
    L.push('draw();');
    const runtime = L.join('\n');

    const html = '<!DOCTYPE html>\n<html lang="en">\n<head>\n'
      + '<meta charset="UTF-8">\n'
      + '<meta name="viewport" content="width=device-width, initial-scale=1.0">\n'
      + '<title>Foundry — Mix (' + BG.seedCode(seed) + ')</title>\n'
      + '<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;background:' + pal.bg + ';overflow:hidden}'
      + '#bg{position:fixed;top:0;left:0;width:100vw;height:100vh}#bg>svg,#bg>canvas{display:block}</style>\n'
      + '</head>\n<body>\n<div id="bg"></div>\n<script>\n'
      + runtime + '\n<' + '/script>\n</body>\n</html>\n';
    return new Blob([html], { type: 'text/html;charset=utf-8' });
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Foundry UI — gallery, detail view, seed + knob controls, export, URL state. */
(function (global) {
  'use strict';
  const BG = global.BG;
  const doc = global.document;

  const state = {
    view: 'gallery',
    style: 'tech',
    seed: BG.randomSeed(),
    params: {}
  };
  const gallerySeeds = {};
  const main = doc.getElementById('main');
  const header = doc.getElementById('top');
  let previewHost = null;
  let previewStage = null;
  let rafPending = false;

  function el(tag, cls, text) {
    const e = doc.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function styleIds() { return Object.keys(BG.KERNELS); }

  function effectiveParams(styleId) {
    if (styleId === 'mix') return BG.composeMixParams(state.params);
    return BG.composeParams(styleId, state.params);
  }

  function stateExtra() {
    return state.style === 'mix' ? { mix: state.params.mix || '' } : undefined;
  }

  function flash(btn, text) {
    const old = btn.textContent;
    btn.textContent = text;
    setTimeout(function () { btn.textContent = old; }, 1400);
  }

  /* ---------- header ---------- */
  function renderHeader() {
    header.innerHTML = '';
    const brand = el('div', 'brand');
    brand.appendChild(el('span', 'brand-name', 'FOUNDRY'));
    brand.appendChild(el('span', 'brand-sub', 'generative backgrounds'));
    header.appendChild(brand);

    if (state.view === 'detail') {
      const back = el('button', 'btn', '← Gallery');
      back.title = 'Back to the gallery';
      back.addEventListener('click', function () {
        openGallery();
      });
      header.appendChild(back);
      const dice = el('button', 'btn btn-icon', '⟳');
      dice.title = 'New random seed';
      dice.addEventListener('click', function () {
        state.seed = BG.randomSeed();
        openDetail();
      });
      header.appendChild(dice);
    } else {
      const dice = el('button', 'btn btn-icon', '⟳');
      dice.title = 'Reroll all cards';
      dice.addEventListener('click', function () {
        styleIds().forEach(function (id) { gallerySeeds[id] = BG.randomSeed(); });
        openGallery();
      });
      header.appendChild(dice);
    }
  }

  /* ---------- rendering helpers ---------- */
  let renderToken = 0;

  function mountPreview(host, styleId, seed, params) {
    const w = Math.max(50, host.clientWidth);
    const h = Math.max(50, host.clientHeight);
    host.innerHTML = '';
    const token = ++renderToken;
    /* post params: bloom comes from the effective params, palette for the bg */
    const pp = Object.assign({}, params);
    pp.palette = pp.palette || (state.params && state.params.palette) || 'graphite';
    pp._pal = BG.PALETTES[pp.palette] || BG.PALETTES.graphite;
    if (pp.bloom == null) pp.bloom = 0.35;
    function mk(w2, h2) {
      const c = doc.createElement('canvas');
      c.width = w2; c.height = h2;
      return c;
    }

    if (styleId === 'mix') {
      const selected = BG.parseMix(params && params.mix) ||
        BG.parseMix(state.params.mix) ||
        BG.mixFromSeed(seed, 3);
      const svg = BG.renderMixSvg(selected, seed, params, w, h);
      host.appendChild(svg);
      const gl = selected.indexOf('glitch') >= 0;
      const wantRaster = gl || (pp.bloom > 0.01 && !BG._draft);
      if (!wantRaster) return;
      if (gl) {
        BG.glitchCanvas(svg, seed, params, w, h).then(function (canvas) {
          if (token !== renderToken) return;
          if (pp.bloom > 0.01) {
            const c2 = canvas.getContext('2d', { alpha: false });
            BG.post(canvas, c2, pp, w, h, mk);
          }
          canvas.style.width = w + 'px';
          canvas.style.height = h + 'px';
          if (svg.parentNode === host) host.replaceChild(canvas, svg);
        }).catch(function () {});
      } else {
        BG.rasterPost(svg, pp, w, h).then(function (canvas) {
          if (token !== renderToken) return;
          canvas.style.width = w + 'px';
          canvas.style.height = h + 'px';
          if (svg.parentNode === host) host.replaceChild(canvas, svg);
        }).catch(function () {});
      }
      return;
    }

    const node = BG.render(styleId, seed, params, w, h);
    if (node.tagName && String(node.tagName).toLowerCase() === 'canvas') {
      node.style.width = w + 'px';
      node.style.height = h + 'px';
      host.appendChild(node);
      return;
    }
    host.appendChild(node);
    /* SVG styles get bloom via async rasterization + post pass */
    if (pp.bloom > 0.01 && !BG._draft) {
      BG.rasterPost(node, pp, w, h).then(function (canvas) {
        if (token !== renderToken) return;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        if (node.parentNode === host) host.replaceChild(canvas, node);
      }).catch(function () {});
    }
  }

  /* ---------- gallery ---------- */
  function openGallery() {
    state.view = 'gallery';
    renderHeader();
    main.innerHTML = '';
    const grid = el('div', 'grid');
    main.appendChild(grid);   // MMM-Korrektur: vor dem Zeichnen einhängen

    styleIds().forEach(function (id) {
      if (gallerySeeds[id] == null) gallerySeeds[id] = BG.randomSeed();
      const style = BG.KERNELS[id];

      const card = el('div', 'card');
      const host = el('div', 'card-preview');
      const bar = el('div', 'card-bar');
      bar.appendChild(el('span', 'card-name', style.label));
      const dice = el('button', 'btn btn-mini', '⟳');
      dice.title = 'New random seed for this style';
      dice.addEventListener('click', function (ev) {
        ev.stopPropagation();
        gallerySeeds[id] = BG.randomSeed();
        mountPreview(host, id, gallerySeeds[id], {});
      });
      bar.appendChild(dice);
      card.appendChild(host);
      card.appendChild(bar);
      card.addEventListener('click', function () {
        state.style = id;
        state.seed = gallerySeeds[id];
        state.params = {};
        openDetail();
      });
      grid.appendChild(card);
      mountPreview(host, id, gallerySeeds[id], {});
    });

    /* mix card: layers several styles into one composition */
    const mixState = { seed: BG.randomSeed() };
    const mixCard = el('div', 'card');
    const mixHost = el('div', 'card-preview');
    const mixBar = el('div', 'card-bar');
    mixBar.appendChild(el('span', 'card-name', 'Mix'));
    const mixDice = el('button', 'btn btn-mini', '⟳');
    mixDice.title = 'New random mix';
    mixDice.addEventListener('click', function (ev) {
      ev.stopPropagation();
      mixState.seed = BG.randomSeed();
      mountPreview(mixHost, 'mix', mixState.seed, {});
    });
    mixBar.appendChild(mixDice);
    mixCard.appendChild(mixHost);
    mixCard.appendChild(mixBar);
    mixCard.addEventListener('click', function () {
      state.style = 'mix';
      state.seed = mixState.seed;
      state.params = { mix: BG.mixFromSeed(mixState.seed, 3).join(',') };
      openDetail();
    });
    grid.appendChild(mixCard);
    mountPreview(mixHost, 'mix', mixState.seed, {});

    main.appendChild(grid);
    main.appendChild(el('p', 'hint', 'Tap a card to open it — Mix layers several styles. ⟳ gives a fresh take; every render is reproducible from its seed.'));
  }

  /* ---------- detail ---------- */
  function openDetail() {
    state.view = 'detail';
    renderHeader();
    main.innerHTML = '';
    const style = state.style === 'mix' ? { label: 'Mix' } : BG.KERNELS[state.style];

    const wrap = el('div', 'detail');

    previewHost = el('div', 'preview');
    previewHost.title = 'Drag to orbit · pinch to zoom · tap for a new seed';
    /* stable gesture layer above the render — the classic map-app split: the
     * pixels below can be torn down and rebuilt at will, the hit layer above
     * never changes, so a touch can never be orphaned by a re-render */
    const stage = el('div', 'preview-stage');
    previewHost.appendChild(stage);
    previewStage = stage;
    const hit = el('div', 'preview-hit');
    hit.title = previewHost.title;
    previewHost.appendChild(hit);
    hit.style.touchAction = 'none';
    hit.style.userSelect = 'none';
    hit.style.webkitUserSelect = 'none';
    hit.style.webkitTouchCallout = 'none';
    /* gestures via Touch Events (the browser maintains e.touches for us — the
     * mechanism every gesture library builds on) + mouse via pointer events */
    let gMode = 0; /* 0 idle · 1 orbit · 2 pinch · 3 mouse orbit */
    let sx = 0, sy = 0, rot0 = 0, tilt0 = 0, moved = false;
    let d0 = 0, z0 = 1, c0x = 0, c0y = 0, p0x = 0, p0y = 0;
    function setZoomPan(z, px, py) {
      state.params.zoom = Math.max(0.5, Math.min(4, z));
      if (state.params.zoom > 1.02) {
        state.params.panX = Math.max(-0.45, Math.min(0.45, px));
        state.params.panY = Math.max(-0.45, Math.min(0.45, py));
      } else {
        state.params.panX = 0; state.params.panY = 0;
      }
      rerenderPreview();
    }
    hit.addEventListener('touchstart', function (e) {
      e.preventDefault();
      draftOn();
      moved = false;
      if (e.touches.length === 1) {
        gMode = 1;
        sx = e.touches[0].clientX; sy = e.touches[0].clientY;
        const eff = effectiveParams(state.style);
        rot0 = eff.rot; tilt0 = eff.tilt;
      } else if (e.touches.length >= 2) {
        gMode = 2;
        const a = e.touches[0], b = e.touches[1];
        d0 = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
        c0x = (a.clientX + b.clientX) / 2; c0y = (a.clientY + b.clientY) / 2;
        const eff = effectiveParams(state.style);
        z0 = eff.zoom; p0x = Number(eff.panX) || 0; p0y = Number(eff.panY) || 0;
      }
    }, { passive: false });
    hit.addEventListener('touchmove', function (e) {
      e.preventDefault();
      if (gMode === 1 && e.touches.length === 1) {
        const dx = e.touches[0].clientX - sx, dy = e.touches[0].clientY - sy;
        if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
        state.params.rot = ((rot0 + dx * 0.5) % 360 + 360) % 360;
        state.params.tilt = Math.max(12, Math.min(88, tilt0 + dy * 0.3));
        rerenderPreview();
      } else if (gMode === 2 && e.touches.length >= 2) {
        const a = e.touches[0], b = e.touches[1];
        const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
        const cx = (a.clientX + b.clientX) / 2, cy = (a.clientY + b.clientY) / 2;
        if (d0 > 4) {
          moved = true;
          setZoomPan(z0 * d / d0,
            p0x + (cx - c0x) / hit.clientWidth,
            p0y + (cy - c0y) / hit.clientHeight);
        }
      }
    }, { passive: false });
    function endTouch(e) {
      if (gMode === 0 || gMode === 3) return;
      e.preventDefault();
      if (e.touches.length === 1) { /* pinch ended, one finger left → orbit */
        gMode = 1;
        sx = e.touches[0].clientX; sy = e.touches[0].clientY;
        rot0 = state.params.rot || rot0;
        tilt0 = state.params.tilt || tilt0;
        return;
      }
      if (e.touches.length === 0) {
        gMode = 0;
        draftOff();
        if (!moved) { state.seed = BG.randomSeed(); rerenderPreview(); }
      }
    }
    hit.addEventListener('touchend', endTouch, { passive: false });
    hit.addEventListener('touchcancel', endTouch, { passive: false });
    hit.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    hit.addEventListener('gesturechange', function (e) { e.preventDefault(); });
    hit.addEventListener('pointerdown', function (ev) {
      if (ev.pointerType !== 'mouse') return; /* touch is handled above */
      ev.preventDefault();
      draftOn();
      moved = false;
      gMode = 3;
      sx = ev.clientX; sy = ev.clientY;
      const eff = effectiveParams(state.style);
      rot0 = eff.rot; tilt0 = eff.tilt;
    });
    window.addEventListener('pointermove', function (e) {
      if (gMode !== 3 || e.pointerType !== 'mouse') return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
      state.params.rot = ((rot0 + dx * 0.5) % 360 + 360) % 360;
      state.params.tilt = Math.max(12, Math.min(88, tilt0 + dy * 0.3));
      rerenderPreview();
    });
    window.addEventListener('pointerup', function () {
      if (gMode !== 3) return;
      gMode = 0;
      draftOff();
      if (!moved) { state.seed = BG.randomSeed(); rerenderPreview(); }
    });
    hit.addEventListener('wheel', function (e) {
      e.preventDefault();
      const eff = effectiveParams(state.style);
      setZoomPan(eff.zoom * (e.deltaY > 0 ? 0.92 : 1.09),
        Number(eff.panX) || 0, Number(eff.panY) || 0);
    }, { passive: false });
    wrap.appendChild(previewHost);

    /* seed row */
    const seedRow = el('div', 'seed-row');
    seedRow.appendChild(el('span', 'chip chip-style', style.label));
    const seedChip = el('button', 'chip seed-chip', 'SEED ' + BG.seedCode(state.seed));
    seedChip.title = 'Tap to enter a seed';
    seedChip.addEventListener('click', function () {
      const input = global.prompt('Seed (letter code like BQXFZM, or a number; blank = random):', BG.seedCode(state.seed));
      if (input === null) return;
      const parsed = BG.parseSeed(input);
      state.seed = parsed == null ? BG.randomSeed() : parsed;
      openDetail();
    });
    seedRow.appendChild(seedChip);

    const linkBtn = el('button', 'chip', '⧉ Copy link');
    linkBtn.addEventListener('click', function () {
      BG.writeState(state.style, state.seed, state.params, stateExtra());
      const url = global.location.href;
      if (global.navigator.clipboard && global.navigator.clipboard.writeText) {
        global.navigator.clipboard.writeText(url).then(
          function () { flash(linkBtn, '✓ Copied'); },
          function () { global.prompt('Copy this link:', url); }
        );
      } else {
        global.prompt('Copy this link:', url);
      }
    });
    seedRow.appendChild(linkBtn);
    if (state.style === 'mix') {
      const newMix = el('button', 'chip', '⚄ New mix');
      newMix.title = 'Pick a different random combination';
      newMix.addEventListener('click', function () {
        state.params.mix = BG.mixFromSeed(state.seed, 2 + (state.seed % 3)).join(',');
        rerenderPreview();
      });
      seedRow.appendChild(newMix);
    }
    wrap.appendChild(seedRow);

    /* knobs */
    wrap.appendChild(state.style === 'mix' ? buildMixPanel() : buildStylePanel());

    /* export */
    const exportBox = el('div', 'panel export-panel');
    exportBox.appendChild(el('h3', 'panel-title', 'Export'));

    const sizeRow = el('div', 'row');
    const sizeSel = el('select', 'input select');
    [
      ['1080x2340', 'Phone 1080×2340'],
      ['1440x3200', 'Phone 1440×3200'],
      ['1920x1080', 'Desktop 1920×1080'],
      ['2560x1440', 'Desktop 2560×1440'],
      ['3840x2160', '4K 3840×2160'],
      ['2048x2048', 'Square 2048×2048'],
      ['custom', 'Custom…']
    ].forEach(function (s) {
      const opt = el('option');
      opt.value = s[0];
      opt.textContent = s[1];
      sizeSel.appendChild(opt);
    });
    sizeRow.appendChild(sizeSel);

    const customW = el('input', 'input num');
    customW.type = 'number'; customW.value = '1080'; customW.min = '64'; customW.max = '8192';
    const customH = el('input', 'input num');
    customH.type = 'number'; customH.value = '2340'; customH.min = '64'; customH.max = '8192';
    customW.style.display = 'none';
    customH.style.display = 'none';
    sizeSel.addEventListener('change', function () {
      const show = sizeSel.value === 'custom';
      customW.style.display = show ? '' : 'none';
      customH.style.display = show ? '' : 'none';
    });
    sizeRow.appendChild(customW);
    sizeRow.appendChild(customH);
    exportBox.appendChild(sizeRow);

    const pngBtn = el('button', 'btn btn-primary', '⬇ PNG');
    pngBtn.addEventListener('click', function () {
      let W, H;
      if (sizeSel.value === 'custom') {
        W = Math.min(8192, Math.max(64, parseInt(customW.value, 10) || 1080));
        H = Math.min(8192, Math.max(64, parseInt(customH.value, 10) || 2340));
      } else {
        const parts = sizeSel.value.split('x');
        W = parseInt(parts[0], 10);
        H = parseInt(parts[1], 10);
      }
      pngBtn.disabled = true;
      pngBtn.textContent = 'Rendering…';
      const renderPng = state.style === 'mix'
        ? BG.exportMixPng(BG.parseMix(state.params.mix) || BG.mixFromSeed(state.seed, 3), state.seed, state.params, W, H)
        : BG.exportPng(state.style, state.seed, state.params, W, H);
      renderPng.then(function (blob) {
        BG.downloadBlob(blob, 'foundry-' + state.style + '-' + BG.seedCode(state.seed) + '-' + W + 'x' + H + '.png');
        pngBtn.textContent = '⬇ PNG';
        pngBtn.disabled = false;
      }).catch(function () {
        pngBtn.textContent = '✗ Failed';
        setTimeout(function () { pngBtn.textContent = '⬇ PNG'; pngBtn.disabled = false; }, 1600);
      });
    });
    exportBox.appendChild(pngBtn);

    const htmlBtn = el('button', 'btn', '⬇ HTML');
    htmlBtn.addEventListener('click', function () {
      const blob = state.style === 'mix'
        ? BG.exportMixHtml(BG.parseMix(state.params.mix) || BG.mixFromSeed(state.seed, 3), state.seed, state.params)
        : BG.exportHtml(state.style, state.seed, state.params);
      BG.downloadBlob(blob, 'foundry-' + state.style + '-' + BG.seedCode(state.seed) + '.html');
      flash(htmlBtn, '✓ Saved');
    });
    exportBox.appendChild(htmlBtn);

    exportBox.appendChild(el('p', 'hint',
      'PNG = exact still at the chosen size (large sizes take a moment on the Pi). ' +
      'HTML = a live standalone file like your references: same composition from the same seed, redrawn on resize.'));
    wrap.appendChild(exportBox);

    main.appendChild(wrap);
    BG.writeState(state.style, state.seed, state.params, stateExtra());
    mountPreview(previewStage, state.style, state.seed, effectiveParams(state.style));
  }

  function buildStylePanel() {
    const panel = el('div', 'panel');
    panel.appendChild(el('h3', 'panel-title', 'Controls'));
    BG.allParams(state.style).forEach(function (spec) {
      panel.appendChild(buildControl(spec));
    });
    return panel;
  }

  function buildMixPanel() {
    const panel = el('div', 'panel');
    panel.appendChild(el('h3', 'panel-title', 'Mix layers'));
    const sel = BG.parseMix(state.params.mix) || BG.mixFromSeed(state.seed, 3);
    BG.MIX_ORDER.concat(['glitch']).forEach(function (id) {
      const row = el('div', 'row control control-check');
      const cb = el('input');
      cb.type = 'checkbox';
      cb.id = 'mix-' + id;
      cb.checked = sel.indexOf(id) >= 0;
      cb.addEventListener('change', function () {
        const cur = BG.parseMix(state.params.mix) || BG.mixFromSeed(state.seed, 3);
        const set = cur.slice();
        const idx = set.indexOf(id);
        if (cb.checked && idx < 0) set.push(id);
        if (!cb.checked && idx >= 0) set.splice(idx, 1);
        state.params.mix = set.join(',');
        draftOff();
        rerenderPreview();
      });
      row.appendChild(cb);
      const lab = el('label', 'control-label', id === 'glitch' ? 'Glitch post-fx' : BG.KERNELS[id].label);
      lab.htmlFor = cb.id;
      row.appendChild(lab);
      panel.appendChild(row);
    });
    BG.GLOBAL_PARAMS.forEach(function (spec) {
      panel.appendChild(buildControl(spec));
    });
    panel.appendChild(buildControl({ key: 'glitch', label: 'Glitch amount', min: 0, max: 2, step: 0.05, def: 1 }));
    return panel;
  }

  function buildControl(spec) {
    const eff = effectiveParams(state.style);
    const row = el('div', 'row control');

    if (spec.type === 'select') {
      row.appendChild(el('label', 'control-label', spec.label));
      const sel = el('select', 'input select');
      Object.keys(BG.PALETTES).forEach(function (key) {
        const opt = el('option');
        opt.value = key;
        opt.textContent = BG.PALETTES[key].label;
        if (key === eff.palette) opt.selected = true;
        sel.appendChild(opt);
      });
      sel.addEventListener('change', function () {
        state.params.palette = sel.value;
        draftOff();
        rerenderPreview();
      });
      row.appendChild(sel);
      return row;
    }

    if (spec.type === 'check') {
      row.className = 'row control control-check';
      const cb = el('input');
      cb.type = 'checkbox';
      cb.id = 'ctl-' + spec.key;
      cb.checked = eff[spec.key] == null ? !!BG.KERNELS[state.style].vignette : !!eff[spec.key];
      cb.addEventListener('change', function () {
        state.params[spec.key] = cb.checked;
        draftOff();
        rerenderPreview();
      });
      row.appendChild(cb);
      const lab = el('label', 'control-label', spec.label);
      lab.htmlFor = cb.id;
      row.appendChild(lab);
      return row;
    }

    row.appendChild(el('label', 'control-label', spec.label));
    const input = el('input', 'input range');
    input.type = 'range';
    input.min = String(spec.min);
    input.max = String(spec.max);
    input.step = String(spec.step);
    input.value = String(eff[spec.key]);
    const val = el('span', 'control-value', input.value);
    input.addEventListener('input', function () {
      state.params[spec.key] = parseFloat(input.value);
      val.textContent = input.value;
      draftOn();
      rerenderPreview();
    });
    input.addEventListener('change', function () {
      state.params[spec.key] = parseFloat(input.value);
      draftOff();
      rerenderPreview();
    });
    row.appendChild(input);
    row.appendChild(val);
    return row;
  }

  /* draft mode: while a slider is being scrubbed, heavy kernels render a
   * cheaper preview (p._draft); the final value on release gets full quality */
  let draftTimer = null;
  function draftOn() {
    BG._draft = true;
    clearTimeout(draftTimer);
    draftTimer = setTimeout(function () { BG._draft = false; }, 900);
  }
  function draftOff() {
    BG._draft = false;
    clearTimeout(draftTimer);
  }

  function rerenderPreview() {
    if (!previewHost || state.view !== 'detail') return;
    BG.writeState(state.style, state.seed, state.params, stateExtra());
    const chip = doc.querySelector('.seed-chip');
    if (chip) chip.textContent = 'SEED ' + BG.seedCode(state.seed);
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(function () {
      rafPending = false;
      if (!previewHost || state.view !== 'detail') return;
      mountPreview(previewStage, state.style, state.seed, effectiveParams(state.style));
    });
  }

  /* ---------- resize (guide lesson #8: debounced redraw) ---------- */
  let rt;
  global.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () {
      if (state.view === 'detail') rerenderPreview();
      else openGallery();
    }, 200);
  });

  /* ---------- boot ---------- */
  (function boot() {
    const loaded = BG.readState();
    if (loaded.style) {
      state.style = loaded.style;
      if (loaded.seed != null) state.seed = loaded.seed;
      state.params = loaded.params;
      openDetail();
    } else {
      openGallery();
    }
  })();
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
</html>
