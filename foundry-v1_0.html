<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Foundry — generative backgrounds</title>
<style>
/* Foundry UI — dark, phone-first, monospace accents to match the house style */
:root {
  --bg: #050505;
  --panel: #101010;
  --line: #232323;
  --text: #c9c9c9;
  --dim: #7a7a7a;
  --accent: #9ad1ff;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif;
}
body { min-height: 100vh; display: flex; flex-direction: column; }

#top {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 5;
  background: rgba(5, 5, 5, 0.92);
  backdrop-filter: blur(6px);
}
.brand { display: flex; flex-direction: column; margin-right: auto; }
.brand-name {
  font: 700 15px/1.2 ui-monospace, 'JetBrains Mono', monospace;
  letter-spacing: 3px; color: #e8e8e8;
}
.brand-sub { font-size: 10px; color: var(--dim); letter-spacing: 1px; }

.btn {
  background: #141414; color: var(--text);
  border: 1px solid var(--line); border-radius: 8px;
  padding: 7px 12px; font-size: 13px; cursor: pointer;
}
.btn:active { transform: translateY(1px); }
.btn-icon { width: 38px; text-align: center; font-size: 16px; padding: 7px 0; }
.btn-primary { background: #16242f; border-color: #2c4256; color: #cfe8ff; }
.btn-mini {
  padding: 2px 8px; font-size: 12px; border-radius: 6px;
  background: rgba(20, 20, 20, 0.85);
}

#main { flex: 1; width: 100%; max-width: 780px; margin: 0 auto; padding: 14px; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 12px;
}
.card {
  border: 1px solid var(--line); border-radius: 12px;
  overflow: hidden; background: #000; cursor: pointer;
}
.card-preview { height: 240px; position: relative; }
.card-preview > svg, .card-preview > canvas { display: block; }
.card-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 10px; background: var(--panel); border-top: 1px solid var(--line);
}
.card-name {
  font: 600 12px/1 ui-monospace, monospace;
  letter-spacing: 1px; color: var(--text);
}
.hint { color: var(--dim); font-size: 12px; margin: 10px 2px; }

.detail { display: flex; flex-direction: column; gap: 12px; }
.preview {
  height: 54vh; min-height: 320px;
  border: 1px solid var(--line); border-radius: 12px;
  overflow: hidden; background: #000;
  cursor: crosshair; position: relative; touch-action: none;
}
.preview-stage { position: absolute; inset: 0; }
.preview-stage > svg, .preview-stage > canvas { display: block; }
/* stable gesture layer: sits above the render, is never re-rendered, so an
 * active touch is never orphaned when the image below is redrawn */
.preview-hit {
  position: absolute; inset: 0; z-index: 2;
  touch-action: none; cursor: crosshair;
}

.seed-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip {
  background: #141414; border: 1px solid var(--line); color: var(--text);
  border-radius: 999px; padding: 6px 12px;
  font: 12px ui-monospace, monospace; letter-spacing: 1px; cursor: pointer;
}
.chip-style { background: #101820; border-color: #223242; color: #bcd6ea; cursor: default; }

.panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 14px;
  display: flex; flex-direction: column; gap: 10px;
}
.panel-title {
  margin: 0;
  font: 600 12px ui-monospace, monospace; letter-spacing: 2px;
  color: var(--dim); text-transform: uppercase;
}
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.control-label { min-width: 92px; color: var(--dim); font-size: 13px; }
.control-value {
  min-width: 44px; text-align: right;
  font: 12px ui-monospace, monospace; color: var(--text);
}
.input {
  background: #0c0c0c; border: 1px solid var(--line); color: var(--text);
  border-radius: 8px; padding: 6px 8px;
}
.control-check input[type="checkbox"] {
  appearance: auto; -webkit-appearance: checkbox;
  width: 22px; height: 22px;
  accent-color: var(--accent);
  margin: 0; flex: 0 0 auto;
}
.control-check .control-label { min-width: 0; font-size: 13px; cursor: pointer; }
.control-check { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: #0c0c0c; }
.select { flex: 1; }
.range { flex: 1; accent-color: var(--accent); }
.num { width: 92px; }
.export-panel .btn { flex: 1; }

@media (min-width: 640px) {
  .card-preview { height: 300px; }
}

</style>
</head>
<body>
<header id="top"></header>
<main id="main"></main>
<noscript>Foundry needs JavaScript to generate backgrounds.</noscript>
<script>
/* Foundry — seeded RNG (xorshift32) + seed code helpers.
 * Every kernel draws from this, so any render can be reproduced from its seed. */
(function (global) {
  'use strict';

  function Rng(seed) {
    const s0 = (seed >>> 0) || 0x9E3779B9;
    let s = s0;
    this.seed0 = s0;
    this.next = function () {
      s ^= s << 13; s >>>= 0;
      s ^= s >>> 17;
      s ^= s << 5;  s >>>= 0;
      return s / 4294967296;
    };
  }
  Rng.prototype.range = function (a, b) { return a + this.next() * (b - a); };
  Rng.prototype.int = function (a, b) { return Math.floor(this.range(a, b + 1)); };
  Rng.prototype.chance = function (p) { return this.next() < p; };
  Rng.prototype.pick = function (arr) { return arr[Math.floor(this.next() * arr.length)]; };
  /* independent sub-stream for a named section, so one section can grow or
   * shrink (e.g. more traces) without reshuffling every other section */
  Rng.prototype.derive = function (tag) {
    return new Rng(BG.subSeed(this.seed0, tag));
  };

  const BG = global.BG = global.BG || {};
  BG.Rng = Rng;

  /* deterministic hash-mix of a seed and a tag */
  BG.subSeed = function (seed, tag) {
    let h = 2166136261;
    const str = String(tag);
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return (((seed >>> 0) ^ (h >>> 0)) >>> 0) || 0x9E3779B9;
  };

  BG.randomSeed = function () {
    return ((Date.now() ^ (Math.random() * 0xFFFFFFFF)) >>> 0) || 0x9E3779B9;
  };
  /* Letters-only base-26 code: never all-digits, so it can never be
   * confused with decimal input — perfect round-trip. */
  const SEED_ALPHA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  BG.seedCode = function (seed) {
    let s = (seed >>> 0) || 0x9E3779B9;
    let out = '';
    while (s > 0) {
      out = SEED_ALPHA[s % 26] + out;
      s = Math.floor(s / 26);
    }
    return out || 'A';
  };
  BG.parseSeed = function (text) {
    if (text == null) return null;
    const t = String(text).trim();
    if (!t) return null;
    if (/^[A-Za-z]+$/.test(t)) {
      let v = 0;
      for (let i = 0; i < t.length; i++) {
        v = v * 26 + (t.charCodeAt(i) & 31) - 1;
      }
      return (v >>> 0) || 0x9E3779B9;
    }
    if (/^-?\d+$/.test(t)) return (parseInt(t, 10) >>> 0) || 0x9E3779B9;
    const v = parseInt(t, 36);
    return Number.isFinite(v) ? ((v >>> 0) || 0x9E3779B9) : null;
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Foundry — central palette (guide lesson #6): kernels always ask for
 * colors via BG.gray(level, alpha); one object controls every tint. */
(function (global) {
  'use strict';
  const BG = global.BG = global.BG || {};

  function hslToRgb(h, s, l) {
    function f(n) {
      const k = (n + h * 12) % 12;
      const a = s * Math.min(l, 1 - l);
      return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1))));
    }
    return [f(0), f(8), f(4)];
  }

  BG.PALETTES = {
    graphite:    { label: 'Graphite',    hue: -1,  sat: 0,    bg: '#000000' },
    ultramarine: { label: 'Ultramarine', hue: 225, sat: 0.75, bg: '#020308' },
    cyan:        { label: 'Cyan',        hue: 190, sat: 0.85, bg: '#000507' },
    green:       { label: 'Phosphor',    hue: 140, sat: 0.70, bg: '#000402' },
    amber:       { label: 'Amber',       hue: 38,  sat: 0.90, bg: '#060300' },
    crimson:     { label: 'Crimson',     hue: 350, sat: 0.80, bg: '#060000' }
  };

  /* gray level g (0–255) + alpha → css color in the palette's tint */
  BG.gray = function (pal, g, a) {
    const v = Math.max(0, Math.min(255, g)) | 0;
    if (!pal || pal.hue < 0) return 'rgba(' + v + ',' + v + ',' + v + ',' + a + ')';
    const rgb = hslToRgb(pal.hue / 360, pal.sat, v / 255);
    return 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + a + ')';
  };

  BG.bgColor = function (pal) { return (pal && pal.bg) || '#000000'; };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Foundry camera — shared orbit camera with perspective projection + fog.
 * Used by every kernel: build once with BG.Cam(p, W, H, worldR), then project
 * world-space points. Pure math: no DOM, no RNG — deterministic and safe to
 * embed in exported files.
 * World axes: x → right, y → into the scene, z → up. Orbit target: origin.
 * Reads the global camera params from `p`:
 *   rot  — orbit yaw, degrees (drag horizontally)
 *   tilt — camera elevation, degrees (drag vertically, 12 = low, 88 = top)
 *   zoom — dolly, 0.5 (far) … 2.5 (close)
 *   fog  — aerial haze strength 0..1 (distance fade toward haze gray)
 * `worldR` is the radius of the kernel's world content disc, used for
 * framing so every style fills the frame the same way at zoom 1. */
(function (global) {
  'use strict';
  const BG = global.BG = global.BG || {};

  BG.Cam = function (p, W, H, worldR) {
    const rot = ((Number.isFinite(p.rot) ? p.rot : 30) % 360) * Math.PI / 180;
    const tilt = Math.min(88, Math.max(12, Number.isFinite(p.tilt) ? p.tilt : 38)) * Math.PI / 180;
    const zoom = Math.min(4, Math.max(0.5, Number.isFinite(p.zoom) ? p.zoom : 1));
    const fog = Math.min(1, Math.max(0, Number.isFinite(p.fog) ? p.fog : 0.35));
    const R = Math.max(50, worldR || 700);

    const sinT = Math.sin(tilt), cosT = Math.cos(tilt);
    const sinR = Math.sin(rot), cosR = Math.cos(rot);
    const f = 1.1 * Math.min(W, H);   /* focal length, px */
    const D = 2.6 * R / zoom;         /* camera distance — dolly zoom */
    const cx = W / 2, cy = H / 2;
    const near = D * 0.3, far = D + 2.2 * R + 1;
    const span = far - near;
    const FOG_G = 64;                 /* haze gray the distance fades toward */

    /* project a world point → [sx, sy, scale, depth01]
     *   sx, sy — screen position (y down)
     *   scale  — px per world unit at this depth (size attenuation)
     *   depth01— 0 near … 1 far, feeds the fog helpers */
    function project(x, y, z) {
      const rx = x * cosR - y * sinR;
      const ry = x * sinR + y * cosR;
      const depth = ry * cosT - z * sinT + D;
      const s = f / Math.max(1, depth);
      const d01 = (depth - near) / span;
      return [cx + rx * s, cy - (ry * sinT + z * cosT) * s, s, Math.min(1, Math.max(0, d01))];
    }

    function fogT(d01) { return Math.min(0.88, Math.max(0, d01) * fogK(d01)); }
    function fogK() { return fog * 1.15; }
    /* fade alpha with depth (things vanish into the haze) */
    function fogA(a, d01) { return a * (1 - fogT(d01) * 0.85); }
    /* mix a gray value toward the haze color with depth */
    function fogG(g, d01) { const t = fogT(d01) * 0.8; return g + (FOG_G - g) * t; }

    return {
      project: project, fogT: fogT, fogA: fogA, fogG: fogG,
      W: W, H: H, rot: rot, tilt: tilt, zoom: zoom, fog: fog,
      D: D, f: f, sinT: sinT, cosT: cosT, sinR: sinR, cosR: cosR
    };
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Foundry post-fx — cheap mip-chain bloom (screen-space glow).
 * Standard technique from real-time rendering: threshold the bright areas at
 * 1/4 and 1/8 resolution, then composite the upscaled passes back additively
 * ('lighter' blending) — the bilinear upscale provides the blur for free, so
 * the whole chain is ~5 small drawImage calls and one tiny getImageData.
 * Mobile-friendly by design. Uses only p.bloom. */
(function (global) {
  'use strict';
  const BG = global.BG = global.BG || {};

  BG.post = function (canvas, ctx, p, W, H, mk) {
    const bloom = Math.min(1, Math.max(0, Number(p && p.bloom) || 0));
    if (bloom <= 0.01 || W < 16 || H < 16) return;

    /* 1/4-res bright pass */
    const bw = Math.max(2, W >> 2), bh = Math.max(2, H >> 2);
    const a = mk(bw, bh);
    const actx = a.getContext('2d');
    actx.drawImage(canvas, 0, 0, bw, bh);
    const img = actx.getImageData(0, 0, bw, bh);
    const d = img.data;
    const thr = 96, soft = 90, gain = 0.55 + 0.45 * bloom;
    for (let i = 0; i < d.length; i += 4) {
      const l = d[i] * 0.3 + d[i + 1] * 0.5 + d[i + 2] * 0.2;
      const k = l > thr ? 1 : (l > thr - soft ? (l - (thr - soft)) / soft : 0);
      const b = k * 255 * gain;
      d[i] = b; d[i + 1] = b; d[i + 2] = b; d[i + 3] = 255;
    }
    actx.putImageData(img, 0, 0);

    /* 1/8-res mip for the wide, soft halo */
    const cw = Math.max(2, W >> 3), ch = Math.max(2, H >> 3);
    const c = mk(cw, ch);
    c.getContext('2d').drawImage(a, 0, 0, cw, ch);

    /* additive composite, upscaled (bilinear stretch = free blur) */
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.6 * bloom;
    ctx.drawImage(a, 0, 0, W, H);
    ctx.globalAlpha = 0.55 * bloom;
    ctx.drawImage(c, 0, 0, W, H);
    ctx.restore();
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Foundry kernel: "Tech Arcs"
 * Port of tech-background: concentric arc systems with hairline striations,
 * radial spokes, tangential component blocks; plus a field of straight traces
 * with parallels and vias, and a sparse bright foreground accent layer.
 * 3D build (v2): systems are no longer flat paint — each arc family can stack
 * into 2–3 tapered tiers connected by vertical struts with a beacon mast on
 * top; upright "gates" (rings standing in a vertical plane on legs) and a
 * field of antenna masts rise off the board; ~a quarter of the traces run on
 * an elevated deck with drop lines to the ground. Everything is projected
 * through the shared orbit camera (BG.Cam); ground/hover circles are sampled
 * as polylines so they stay correct under any tilt; opacities fade into the
 * haze with depth.
 * Stability rule: trace/accent/gate/mast pools are density-independent;
 * Density only decides how many of the fixed pool render (prefix), each with
 * its own derived RNG — so turning the knob never moves a survivor. The
 * camera never touches the RNG. */
(function (global) {
  'use strict';
  const BG = global.BG = global.BG || {};

  function techKernel(rng, W, H, p, out) {
    const pal = p._pal;
    const col = function (g, a) { return BG.gray(pal, g, a); };
    const st = p.stroke;
    const draft = !!p._draft;
    let cov = Math.min(1, Math.max(0.02, p.density / 2)); /* slider 0.25–2 → 0.125–1 */
    if (draft) cov *= 0.35;
    const base1 = Math.min(900, (W * H) / 2500);

    /* --- world plane + shared camera --- */
    const WORLD = 1040;
    const cam = BG.Cam(p, W, H, 800);
    const s0 = cam.project(0, 0, 0)[2];

    /* sample a circle of radius r at height z as a projected polyline.
     * upright=false → horizontal ring (ground/hover plates);
     * upright=true  → vertical ring standing on its bottom point (gates). */
    function arcPts(cxw, cyw, r, a0, a1, n, z, upright, phi) {
      const cu = upright ? Math.cos(phi || 0) : 1;
      const cv = upright ? Math.sin(phi || 0) : 0;
      let s = '';
      for (let k = 0; k <= n; k++) {
        const ang = a0 + (a1 - a0) * k / n;
        const px = upright ? cxw + r * Math.cos(ang) * cu : cxw + r * Math.cos(ang);
        const py = upright ? cyw + r * Math.cos(ang) * cv : cyw + r * Math.sin(ang);
        const pz = upright ? z + r + r * Math.sin(ang) : z;
        const pr = cam.project(px, py, pz);
        s += (k ? ' ' : '') + (Math.round(pr[0] * 10) / 10) + ',' + (Math.round(pr[1] * 10) / 10);
      }
      return s;
    }
    function midDepth(cxw, cyw, r, aMid, z, upright, phi) {
      const ang = aMid;
      const cu = upright ? Math.cos(phi || 0) : 1;
      const cv = upright ? Math.sin(phi || 0) : 0;
      const px = upright ? cxw + r * Math.cos(ang) * cu : cxw + r * Math.cos(ang);
      const py = upright ? cyw + r * Math.cos(ang) * cv : cyw + r * Math.sin(ang);
      const pz = upright ? z + r + r * Math.sin(ang) : z;
      return cam.project(px, py, pz)[3];
    }
    function line3(x1, y1, z1, x2, y2, z2, g, a, sw, dash) {
      const p1 = cam.project(x1, y1, z1), p2 = cam.project(x2, y2, z2);
      const attrs = {
        x1: p1[0].toFixed(1), y1: p1[1].toFixed(1),
        x2: p2[0].toFixed(1), y2: p2[1].toFixed(1),
        stroke: col(g, cam.fogA(a, (p1[3] + p2[3]) / 2)),
        'stroke-width': sw.toFixed(2)
      };
      if (dash) attrs['stroke-dasharray'] = '2,5';
      out.el('line', attrs);
    }

    /* --- background: arc systems (count owned by its own slider) --- */
    const numSystems = Math.max(1, Math.round(p.systems));
    const beacons = []; /* mast tips from the systems loop — cable anchors */
    for (let s = 0; s < numSystems; s++) {
      const cx = rng.range(-WORLD, WORLD);
      const cy = rng.range(-WORLD, WORLD);
      const maxR = WORLD * rng.range(0.15, 0.8);
      const baseOp = rng.range(0.14, 0.35);
      const baseSw = rng.range(0.15, 0.45) * st;
      const startAngle = rng.range(0, Math.PI * 2);
      const arcSpan = rng.range(Math.PI * 0.3, Math.PI * 2.5);

      /* footprint shape: flat disc, straight cylinder, or square ziggurat */
      const shapeRoll = rng.next();
      const shape = shapeRoll < 0.45 ? 'disc' : shapeRoll < 0.72 ? 'cyl' : 'cube';
      const ringPts = function (r, zL, n) {
        if (shape === 'cube') {
          let s = '';
          for (let k = 0; k <= 4; k++) {
            const a2 = startAngle + Math.PI / 4 + (k % 4) * Math.PI / 2;
            const pr = cam.project(cx + Math.cos(a2) * r, cy + Math.sin(a2) * r, zL);
            s += (k ? ' ' : '') + pr[0].toFixed(1) + ',' + pr[1].toFixed(1);
          }
          return s;
        }
        return arcPts(cx, cy, r, startAngle, startAngle + (shape === 'cyl' ? Math.PI * 2 : arcSpan), n || 14, zL);
      };

      /* vertical build: 1–3 tiers; cylinders keep radius, discs taper */
      const tiers = rng.chance(0.62) ? rng.int(2, 3) : 1;
      const tierH = rng.range(40, 80);
      const taper = rng.range(0.55, 0.8);
      const numArcs = rng.int(30, 54);
      const perTier = Math.max(4, Math.floor(numArcs / tiers));
      const strutCount = rng.int(4, 8) + (shape === 'cyl' ? 5 : 0);
      const rims = [];

      for (let L = 0; L < tiers; L++) {
        const zL = L * tierH;
        const scaleL = shape === 'cyl' ? 1 : (tiers === 1 ? 1 : 1 - (1 - taper) * (L / (tiers - 1)));
        const rimR = maxR * scaleL;
        rims.push({ r: rimR, z: zL + tierH });
        const innerFrac = 0.03 + (1 - scaleL) * 0.12;

        for (let a = 0; a < perTier; a++) {
          const r = rimR * (0.03 + (a / perTier) * 0.97);
          const t = a / perTier;
          const op = baseOp * (0.5 + t * 0.5);
          const sw = baseSw * (0.35 + t * 0.45);
          const aMid = startAngle + (shape === 'cube' ? Math.PI / 4 : arcSpan / 2);
          const dM = midDepth(cx, cy, r, aMid, zL);

          out.el('polyline', {
            points: ringPts(r, zL, 14),
            fill: 'none',
            stroke: col(160, cam.fogA(op, dM)),
            'stroke-width': sw.toFixed(2)
          });

          /* hairline striations filling the gap to the previous ring */
          if (a > 0) {
            const prevR = rimR * (0.03 + ((a - 1) / perTier) * 0.97);
            const gap = r - prevR;
            const numStriations = Math.min(8, Math.max(2, Math.floor(gap / 3)));
            for (let k = 1; k < numStriations; k++) {
              const sr = prevR + gap * (k / numStriations);
              out.el('polyline', {
                points: ringPts(sr, zL, 8),
                fill: 'none',
                stroke: col(100, cam.fogA(op * 0.45, dM)),
                'stroke-width': (sw * 0.25).toFixed(2)
              });
            }
          }

          /* tangential component blocks with optional leader lines */
          if (rng.chance(0.4)) {
            const numBlocks = rng.int(1, 3);
            for (let b = 0; b < numBlocks; b++) {
              /* cubes carry their blocks on the edge midpoints */
              const angle = shape === 'cube'
                ? startAngle + Math.PI / 2 * rng.int(0, 3)
                : startAngle + arcSpan * rng.range(0.05, 0.95);
              const br2 = shape === 'cube' ? r * 0.72 : r;
              const bx = cx + br2 * Math.cos(angle);
              const by = cy + br2 * Math.sin(angle);
              const bp = cam.project(bx, by, zL);
              const scl = bp[2] / s0;
              const bw = rng.range(3, 12) * 2, bh = rng.range(1.5, 5) * 2;
              /* screen-space tangent direction for the block rotation */
              const ta = angle + Math.PI / 2;
              const t1 = cam.project(bx - Math.cos(ta), by - Math.sin(ta), zL);
              const t2 = cam.project(bx + Math.cos(ta), by + Math.sin(ta), zL);
              const rotDeg = Math.atan2(t2[1] - t1[1], t2[0] - t1[0]) * 180 / Math.PI;
              out.el('rect', {
                x: (bp[0] - bw * scl / 2).toFixed(1),
                y: (bp[1] - bh * scl / 2).toFixed(1),
                width: (bw * scl).toFixed(1),
                height: (bh * scl).toFixed(1),
                fill: col(160, cam.fogA(op * 0.5, bp[3])),
                stroke: col(160, cam.fogA(op, bp[3])),
                'stroke-width': (sw * 0.35).toFixed(2),
                transform: 'rotate(' + rotDeg.toFixed(1) + ' ' + bp[0].toFixed(1) + ' ' + bp[1].toFixed(1) + ')'
              });
              if (rng.chance(0.5)) {
                const lLen = rng.range(20, 80);
                const lAngle = angle + (rng.chance(0.5) ? Math.PI / 2 : -Math.PI / 2);
                const lp = cam.project(bx + lLen * Math.cos(lAngle), by + lLen * Math.sin(lAngle), zL);
                out.el('line', {
                  x1: bp[0].toFixed(1), y1: bp[1].toFixed(1),
                  x2: lp[0].toFixed(1), y2: lp[1].toFixed(1),
                  stroke: col(160, cam.fogA(op * 0.6, bp[3])),
                  'stroke-width': (sw * 0.25).toFixed(2)
                });
              }
            }
          }

          /* radial spokes — squares shoot theirs to corners + edge mids */
          if (rng.chance(0.65)) {
            const numRadials = shape === 'cube' ? 8 : rng.int(8, 24);
            const innerR = rimR * 0.02;
            for (let k = 0; k < numRadials; k++) {
              const rAngle = shape === 'cube'
                ? startAngle + Math.PI / 4 + k * Math.PI / 4
                : startAngle + arcSpan * (k / numRadials);
              const p1 = cam.project(cx + innerR * Math.cos(rAngle), cy + innerR * Math.sin(rAngle), zL);
              const p2 = cam.project(cx + r * Math.cos(rAngle), cy + r * Math.sin(rAngle), zL);
              out.el('line', {
                x1: p1[0].toFixed(1), y1: p1[1].toFixed(1),
                x2: p2[0].toFixed(1), y2: p2[1].toFixed(1),
                stroke: col(100, cam.fogA(op * 0.5, (p1[3] + p2[3]) / 2)),
                'stroke-width': (sw * 0.3).toFixed(2)
              });
            }
          }
        }
      }

      /* vertical structure: struts lift each tier rim to the next */
      for (let L = 1; L < tiers; L++) {
        const lo = rims[L - 1], hi = rims[L];
        for (let k = 0; k < strutCount; k++) {
          const ang = shape === 'cube'
            ? startAngle + Math.PI / 4 + k * Math.PI / 4
            : startAngle + arcSpan * (k / strutCount);
          line3(cx + lo.r * Math.cos(ang), cy + lo.r * Math.sin(ang), lo.z,
            cx + hi.r * Math.cos(ang), cy + hi.r * Math.sin(ang), hi.z,
            150, baseOp * 0.75, baseSw * 0.5);
        }
      }

      /* ground legs + beacon mast on the top tier */
      const top = rims[rims.length - 1];
      for (let k = 0; k < strutCount; k++) {
        const ang = shape === 'cube'
          ? startAngle + Math.PI / 4 + k * Math.PI / 4
          : startAngle + arcSpan * (k / strutCount) + Math.PI / strutCount;
        line3(cx + top.r * Math.cos(ang), cy + top.r * Math.sin(ang), top.z,
          cx + top.r * 1.12 * Math.cos(ang), cy + top.r * 1.12 * Math.sin(ang), 0,
          110, baseOp * 0.45, baseSw * 0.3);
      }
      if (rng.chance(0.55)) {
        const mastTop = top.z + rng.range(40, 130);
        line3(cx, cy, top.z, cx, cy, mastTop, 190, baseOp * 0.9, baseSw * 0.55);
        const bp = cam.project(cx, cy, mastTop);
        out.el('circle', {
          cx: bp[0].toFixed(1), cy: bp[1].toFixed(1),
          r: Math.max(1.2, 3.2 * (bp[2] / s0)).toFixed(1),
          fill: col(220, cam.fogA(Math.min(0.85, baseOp * 2.4), bp[3]))
        });
        beacons.push({ x: cx, y: cy, z: mastTop });
        /* beacon light column: faint dashed rise above the lamp */
        const colTop = mastTop + rng.range(50, 110);
        line3(cx, cy, mastTop, cx, cy, colTop, 205, baseOp * 0.5, baseSw * 0.4, true);
      }
      /* rim greebles: short vertical ticks along the top rim */
      if (tiers > 1 && rng.chance(0.55)) {
        const ticks = strutCount * 2;
        for (let k = 0; k < ticks; k++) {
          const ang = startAngle + arcSpan * (k / ticks) + Math.PI / ticks;
          line3(cx + top.r * Math.cos(ang), cy + top.r * Math.sin(ang), top.z,
            cx + top.r * Math.cos(ang), cy + top.r * Math.sin(ang), top.z + 5,
            160, baseOp * 0.6, baseSw * 0.35);
        }
      }
    }

    /* --- middle: straight traces with parallels and vias --- */
    const DECK = 56; /* elevated circuit layer height */
    const traceCount = Math.floor(base1 * 0.85 * 2 * cov);
    for (let i = 0; i < traceCount; i++) {
      const tr = rng.derive('tr' + i); /* per-trace stream: position is fixed forever */
      const op = tr.range(0.12, 0.35);
      const sw = tr.range(0.15, 0.55) * st;
      const angle = tr.range(0, Math.PI * 2);
      const len = tr.range(120, 2200);
      const x1 = tr.range(-WORLD * 1.3, WORLD * 1.3);
      const y1 = tr.range(-WORLD * 1.3, WORLD * 1.3);
      const x2 = x1 + len * Math.cos(angle);
      const y2 = y1 + len * Math.sin(angle);
      const onDeck = tr.chance(0.26);
      const z = onDeck ? DECK : 0;
      const g = onDeck ? 130 : 160;
      const p1 = cam.project(x1, y1, z), p2 = cam.project(x2, y2, z);
      out.el('line', {
        x1: p1[0].toFixed(1), y1: p1[1].toFixed(1),
        x2: p2[0].toFixed(1), y2: p2[1].toFixed(1),
        stroke: col(g, cam.fogA(op, (p1[3] + p2[3]) / 2)), 'stroke-width': sw.toFixed(2)
      });
      if (onDeck) { /* drop lines pin the elevated trace to the board */
        line3(x1, y1, z, x1, y1, 0, 110, op * 0.55, sw * 0.35);
        line3(x2, y2, z, x2, y2, 0, 110, op * 0.55, sw * 0.35);
      }

      if (tr.chance(0.6)) {
        const numPara = tr.int(2, 5);
        const gap = tr.range(4, 16);
        for (let k = 1; k <= numPara; k++) {
          const ox = gap * k * Math.cos(angle + Math.PI / 2);
          const oy = gap * k * Math.sin(angle + Math.PI / 2);
          const q1 = cam.project(x1 + ox, y1 + oy, z), q2 = cam.project(x2 + ox, y2 + oy, z);
          out.el('line', {
            x1: q1[0].toFixed(1), y1: q1[1].toFixed(1),
            x2: q2[0].toFixed(1), y2: q2[1].toFixed(1),
            stroke: col(100, cam.fogA(op * 0.4, (q1[3] + q2[3]) / 2)), 'stroke-width': (sw * 0.3).toFixed(2)
          });
        }
      }

      if (tr.chance(0.35)) {
        const viaT = tr.range(0.2, 0.8);
        const vp = cam.project(x1 + len * viaT * Math.cos(angle), y1 + len * viaT * Math.sin(angle), z);
        out.el('circle', {
          cx: vp[0].toFixed(1),
          cy: vp[1].toFixed(1),
          r: (sw * 2 * (vp[2] / s0)).toFixed(1),
          fill: col(200, cam.fogA(op * 0.9, vp[3]))
        });
      }
    }

    /* --- upright structures: flat rings, standing cylinders, box frames --- */
    const gateCount = Math.max(1, Math.floor(base1 * 0.036 * 2 * cov));
    for (let i = 0; i < gateCount; i++) {
      const gt = rng.derive('gate' + i);
      const shapeRoll = gt.next();
      const gShape = shapeRoll < 0.5 ? 'ring' : shapeRoll < 0.75 ? 'cyl' : 'cube';
      const gx = gt.range(-760, 760), gy = gt.range(-560, 560);
      const gr = gt.range(105, 235);
      const phi = gt.range(0, Math.PI);
      const op = gt.range(0.3, 0.55);
      const sw = gt.range(0.35, 0.7) * st;
      const cu = Math.cos(phi), sv = Math.sin(phi);
      const dCtr = cam.project(gx, gy, gShape === 'ring' ? gr : 60)[3];

      if (gShape === 'ring') {
        out.el('polyline', {
          points: arcPts(gx, gy, gr, 0, Math.PI * 2, 22, 0, true, phi),
          fill: 'none', stroke: col(190, cam.fogA(op, dCtr)),
          'stroke-width': sw.toFixed(2)
        });
        /* inner echo ring + node dots at the quarters */
        out.el('polyline', {
          points: arcPts(gx, gy, gr * 0.86, 0, Math.PI * 2, 16, 0, true, phi),
          fill: 'none', stroke: col(120, cam.fogA(op * 0.5, dCtr)),
          'stroke-width': (sw * 0.3).toFixed(2)
        });
        for (let k = 0; k < 4; k++) {
          const ang = k * Math.PI / 2;
          const nx = gx + gr * Math.cos(ang) * cu;
          const ny = gy + gr * Math.cos(ang) * sv;
          const nz = gr + gr * Math.sin(ang);
          const np = cam.project(nx, ny, nz);
          out.el('circle', {
            cx: np[0].toFixed(1), cy: np[1].toFixed(1),
            r: Math.max(1, 2.6 * (np[2] / s0)).toFixed(1),
            fill: col(210, cam.fogA(op, np[3]))
          });
        }
        /* legs: bottom of the ring + the two side quarters pinned to ground */
        const legAng = [Math.PI / 2, Math.PI, 0];
        for (let k = 0; k < legAng.length; k++) {
          const ang = legAng[k];
          const nx = gx + gr * Math.cos(ang) * cu;
          const ny = gy + gr * Math.cos(ang) * sv;
          const nz = Math.max(0, gr + gr * Math.sin(ang));
          line3(nx, ny, nz, nx, ny, 0, 120, op * 0.5, sw * 0.4);
        }
      } else if (gShape === 'cyl') {
        /* standing cylinder: base + top circles, silhouette rails, band */
        const gh = gt.range(60, 150);
        out.el('polyline', {
          points: arcPts(gx, gy, gr, 0, Math.PI * 2, 22, 0),
          fill: 'none', stroke: col(185, cam.fogA(op, dCtr)), 'stroke-width': sw.toFixed(2)
        });
        out.el('polyline', {
          points: arcPts(gx, gy, gr, 0, Math.PI * 2, 22, gh),
          fill: 'none', stroke: col(200, cam.fogA(op, dCtr)), 'stroke-width': sw.toFixed(2)
        });
        out.el('polyline', {
          points: arcPts(gx, gy, gr * 0.8, 0, Math.PI * 2, 16, gh * 0.5),
          fill: 'none', stroke: col(130, cam.fogA(op * 0.5, dCtr)), 'stroke-width': (sw * 0.3).toFixed(2)
        });
        [-1, 1].forEach(function (s) {
          const rx = gx + gr * Math.cos(phi + s * Math.PI / 2);
          const ry = gy + gr * Math.sin(phi + s * Math.PI / 2);
          line3(rx, ry, 0, rx, ry, gh, 170, op * 0.7, sw * 0.6);
        });
        for (let k = 0; k < 4; k++) {
          const ang = k * Math.PI / 2;
          const np = cam.project(gx + gr * Math.cos(ang), gy + gr * Math.sin(ang), gh);
          out.el('circle', {
            cx: np[0].toFixed(1), cy: np[1].toFixed(1),
            r: Math.max(1, 2.4 * (np[2] / s0)).toFixed(1),
            fill: col(215, cam.fogA(op, np[3]))
          });
        }
      } else {
        /* standing box frame: 12 edges + mid band + corner nodes */
        const gw = gt.range(44, 88), gd = gt.range(44, 88), gh = gt.range(70, 160);
        const corners = [];
        [-1, 1].forEach(function (sx) {
          [-1, 1].forEach(function (sz) {
            [0, gh].forEach(function (z) {
              corners.push({
                x: gx + (sx * gw / 2) * cu - (sz * gd / 2) * sv,
                y: gy + (sx * gw / 2) * sv + (sz * gd / 2) * cu,
                z: z
              });
            });
          });
        });
        /* corner order: (sx,sz) blocks of [z=0, z=h] — idx(sx,sz,bot) */
        const idx = function (sx, sz, bot) {
          return ((sx + 1) / 2) * 4 + ((sz + 1) / 2) * 2 + (bot ? 0 : 1);
        };
        const S = [-1, 1];
        for (let sx = 0; sx < 2; sx++) {
          for (let sz = 0; sz < 2; sz++) {
            /* bottom edge, top edge, vertical */
            [0, 1].forEach(function (bot) {
              const a = corners[idx(S[sx], S[sz], bot === 0)];
              const b = corners[idx(S[sx], S[sz === 0 ? 1 : 0], bot === 0)];
              line3(a.x, a.y, a.z, b.x, b.y, b.z, 190, op, sw);
            });
            const v0 = corners[idx(S[sx], S[sz], true)], v1 = corners[idx(S[sx], S[sz], false)];
            line3(v0.x, v0.y, v0.z, v1.x, v1.y, v1.z, 200, op * 1.1, sw);
          }
        }
        /* mid band: rectangle outline at half height */
        const band = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
        let bstr = '';
        for (let e = 0; e <= 4; e++) {
          const pk = band[e % 4];
          const c0 = corners[idx(pk[0], pk[1], true)], c1 = corners[idx(pk[0], pk[1], false)];
          const mx2 = c0.x + (c1.x - c0.x) * 0.5, my2 = c0.y + (c1.y - c0.y) * 0.5;
          const pr = cam.project(mx2, my2, gh * 0.5);
          bstr += (e ? ' ' : '') + pr[0].toFixed(1) + ',' + pr[1].toFixed(1);
        }
        out.el('polyline', {
          points: bstr, fill: 'none',
          stroke: col(140, cam.fogA(op * 0.45, dCtr)), 'stroke-width': (sw * 0.4).toFixed(2)
        });
        corners.filter(function (c, i2) { return i2 % 2 === 1; }).forEach(function (c) {
          const np = cam.project(c.x, c.y, c.z);
          out.el('circle', {
            cx: np[0].toFixed(1), cy: np[1].toFixed(1),
            r: Math.max(1, 2.4 * (np[2] / s0)).toFixed(1),
            fill: col(215, cam.fogA(op, np[3]))
          });
        });
      }
    }

    /* --- antenna masts: leaning poles or 4-legged lattice trusses --- */
    const mastCount = Math.floor(base1 * 0.10 * 2 * cov);
    for (let i = 0; i < mastCount; i++) {
      const mt = rng.derive('mast' + i);
      const truss = mt.next() < 0.4;
      const mx = mt.range(-860, 860), my = mt.range(-640, 640);
      const mh = mt.range(80, 290);
      const op = mt.range(0.25, 0.5);
      const sw = mt.range(0.25, 0.5) * st;
      const lean = mt.range(-0.08, 0.08);
      const tipX = mx + mh * lean, tipY = my + mh * lean * 0.6;
      const braces = mt.int(2, 4);
      if (truss) {
        /* lattice tower: 4 tapering corner legs + square rungs */
        const b0 = mt.range(8, 14), b1 = mt.range(2, 4);
        const legA = [];
        for (let k = 0; k < 4; k++) {
          const a2 = Math.PI / 4 + k * Math.PI / 2;
          legA.push([Math.cos(a2), Math.sin(a2)]);
        }
        legA.forEach(function (c) {
          line3(mx + c[0] * b0, my + c[1] * b0, 0,
            tipX + c[0] * b1, tipY + c[1] * b1, mh, 165, op, sw * 0.7);
        });
        for (let k = 1; k <= braces; k++) {
          const f = k / (braces + 1);
          const hz = mh * f;
          const bb = b0 + (b1 - b0) * f;
          const cx2 = mx + (tipX - mx) * f, cy2 = my + (tipY - my) * f;
          let rstr = '';
          for (let k2 = 0; k2 <= 4; k2++) {
            const c = legA[k2 % 4];
            const pr = cam.project(cx2 + c[0] * bb, cy2 + c[1] * bb, hz);
            rstr += (k2 ? ' ' : '') + pr[0].toFixed(1) + ',' + pr[1].toFixed(1);
          }
          out.el('polyline', {
            points: rstr, fill: 'none',
            stroke: col(140, cam.fogA(op * 0.6, cam.project(cx2, cy2, hz)[3])),
            'stroke-width': (sw * 0.45).toFixed(2)
          });
        }
      } else {
        line3(mx, my, 0, tipX, tipY, mh, 170, op, sw);
        for (let k = 1; k <= braces; k++) {
          const hz = mh * (k / (braces + 1));
          const bx = mx + (tipX - mx) * (k / (braces + 1));
          const by = my + (tipY - my) * (k / (braces + 1));
          const arm = mh * 0.09 * (1 - k / (braces + 1) * 0.5);
          line3(bx - arm, by, hz, bx + arm, by, hz, 140, op * 0.7, sw * 0.5);
        }
      }
      const tp = cam.project(tipX, tipY, mh);
      out.el('circle', {
        cx: tp[0].toFixed(1), cy: tp[1].toFixed(1),
        r: Math.max(1, 2.4 * (tp[2] / s0)).toFixed(1),
        fill: col(215, cam.fogA(op * 1.6, tp[3]))
      });
      /* radar dish on some masts: small arc in a vertical plane */
      if (mt.chance(0.4)) {
        const phi = mt.range(0, Math.PI * 2);
        const dr = mt.range(10, 18);
        const dishZ = mh * mt.range(0.55, 0.8);
        const cu = Math.cos(phi), cv = Math.sin(phi);
        let dstr = '';
        for (let s2 = 0; s2 <= 6; s2++) {
          const a2 = -0.85 + 1.7 * s2 / 6;
          const pr = cam.project(mx + Math.cos(a2) * dr * cu, my + Math.cos(a2) * dr * cv, dishZ + Math.sin(a2) * dr * 0.8);
          dstr += (s2 ? ' ' : '') + pr[0].toFixed(1) + ',' + pr[1].toFixed(1);
        }
        out.el('polyline', {
          points: dstr, fill: 'none',
          stroke: col(180, cam.fogA(op * 0.9, tp[3])),
          'stroke-width': (sw * 0.5).toFixed(2)
        });
        line3(mx, my, dishZ - 6, mx, my, dishZ, 150, op * 0.6, sw * 0.4);
      }
    }

    /* --- suspension cables: sagging lines between structure tops. Pairs
     * are computed over the FULL anchor pool (density-independent geometry,
     * nearest-neighbour math); Density only gates how many cables render,
     * and only when both endpoint structures are present. --- */
    (function cables() {
      const anchors = [];
      const gMax = Math.floor(base1 * 0.036 * 2);
      for (let i = 0; i < gMax; i++) {
        const gt = rng.derive('gate' + i);
        const shapeRoll = gt.next();
        const gShape = shapeRoll < 0.5 ? 'ring' : shapeRoll < 0.75 ? 'cyl' : 'cube';
        const gx = gt.range(-760, 760), gy = gt.range(-560, 560), gr = gt.range(105, 235);
        gt.range(0, Math.PI); gt.range(0.3, 0.55); gt.range(0.35, 0.7); /* phi, op, sw */
        let topZ = 2 * gr;
        if (gShape === 'cyl') topZ = gt.range(60, 150);
        else if (gShape === 'cube') { gt.range(44, 88); gt.range(44, 88); topZ = gt.range(70, 160); }
        anchors.push({ id: 'g' + i, x: gx, y: gy, z: topZ, drawn: i < gateCount });
      }
      const mMax = Math.floor(base1 * 0.10 * 2);
      for (let i = 0; i < mMax; i++) {
        const mt = rng.derive('mast' + i);
        mt.next(); /* truss roll */
        const mx = mt.range(-860, 860), my = mt.range(-640, 640), mh = mt.range(80, 290);
        mt.range(0.25, 0.5); mt.range(0.25, 0.5); /* op, sw — keep stream order */
        const lean = mt.range(-0.08, 0.08);
        anchors.push({ id: 'm' + i, x: mx + mh * lean, y: my + mh * lean * 0.6, z: mh, drawn: i < mastCount });
      }
      beacons.forEach(function (b, i) {
        anchors.push({ id: 'b' + i, x: b.x, y: b.y, z: b.z, drawn: true });
      });
      const pairs = [];
      anchors.forEach(function (a, i) {
        let best = -1, bestD = 780;
        anchors.forEach(function (b, j) {
          if (j === i) return;
          const d = Math.hypot(a.x - b.x, a.y - b.y, (a.z - b.z) * 0.7);
          if (d < bestD) { bestD = d; best = j; }
        });
        if (best >= 0 && i < best) pairs.push([i, best, bestD]);
      });
      const cableCount = Math.floor(pairs.length * cov);
      for (let k = 0; k < cableCount; k++) {
        const a = anchors[pairs[k][0]], b = anchors[pairs[k][1]];
        if (!a.drawn || !b.drawn) continue;
        const cr = rng.derive('cbl_' + a.id + '_' + b.id);
        const sag = pairs[k][2] * 0.1 * cr.range(0.6, 1.3);
        let str = '';
        let dC = 0;
        for (let s = 0; s <= 12; s++) {
          const t = s / 12;
          const wx = a.x + (b.x - a.x) * t;
          const wy = a.y + (b.y - a.y) * t;
          const wz = a.z + (b.z - a.z) * t - sag * Math.sin(Math.PI * t);
          const pr = cam.project(wx, wy, wz);
          if (s === 6) dC = pr[3];
          str += (s ? ' ' : '') + pr[0].toFixed(1) + ',' + pr[1].toFixed(1);
        }
        out.el('polyline', {
          points: str, fill: 'none',
          stroke: col(150, cam.fogA(0.42, dC)),
          'stroke-width': (0.4 * st).toFixed(2)
        });
        [a, b].forEach(function (end) {
          const ep = cam.project(end.x, end.y, end.z);
          out.el('circle', {
            cx: ep[0].toFixed(1), cy: ep[1].toFixed(1), r: '1.3',
            fill: col(190, cam.fogA(0.5, ep[3]))
          });
        });
        /* traffic riding the cable */
        const dotN = cr.int(1, 2);
        for (let d2 = 0; d2 < dotN; d2++) {
          const t = cr.range(0.25, 0.75);
          const wx = a.x + (b.x - a.x) * t;

          const wz = a.z + (b.z - a.z) * t - sag * Math.sin(Math.PI * t);

    /* --- gantry crane: two legs, top beam, trolley cable with hook --- */

      });

          (hp[0] + 2).toFixed(1) + ',' + hp[1].toFixed(1) + ' ' +
          hp[0].toFixed(1) + ',' + (hp[1] + 3.5).toFixed(1),

      const hw = hr.range(16, 34), hh = hr.range(10, 22);
      const hop = hr.range(0.3, 0.55);
      const vert = hr.chance(0.5); /* divider orientation varies */
      const c0 = cam.project(hx - hw / 2, hy - hh / 2, hz);
      const c1 = cam.project(hx + hw / 2, hy + hh / 2, hz);
      const scl = c0[2] / s0;
      out.el('rect', {
        x: c0[0].toFixed(1), y: c0[1].toFixed(1),
        width: (hw * scl).toFixed(1), height: (hh * scl).toFixed(1),

        stroke: col(200, cam.fogA(hop, (c0[3] + c1[3]) / 2)),

          x2: midX.toFixed(1), y2: (c1[1] - 2).toFixed(1),

        const midY = (c0[1] + c1[1]) / 2;
        out.el('line', {
          x1: (c0[0] + 2).toFixed(1), y1: midY.toFixed(1),
          x2: (c1[0] - 2).toFixed(1), y2: midY.toFixed(1),
          stroke: col(170, cam.fogA(hop * 0.6, c0[3])), 'stroke-width': (0.35 * st).toFixed(2)
        });
      }

      const br = Math.max(2, 3 * scl);
      out.el('polyline', {
        points:
          c0[0].toFixed(1) + ',' + (c0[1] + br).toFixed(1) + ' ' +
          c0[0].toFixed(1) + ',' + c0[1].toFixed(1) + ' ' +
          (c0[0] + br).toFixed(1) + ',' + c0[1].toFixed(1),
        fill: 'none', stroke: col(230, cam.fogA(hop, c0[3])), 'stroke-width': (0.7 * st).toFixed(2)
      });
      out.el('polyline', {
        points:
          (c1[0] - br).toFixed(1) + ',' + c1[1].toFixed(1) + ' ' +
          c1[0].toFixed(1) + ',' + c1[1].toFixed(1) + ' ' +
          c1[0].toFixed(1) + ',' + (c1[1] - br).toFixed(1),
        fill: 'none', stroke: col(230, cam.fogA(hop, c1[3])), 'stroke-width': (0.7 * st).toFixed(2)

  }

  BG.KERNELS = BG.KERNELS || {};
  BG.KERNELS.tech = {

<script>
/* Foundry kernel: "Chip Blueprint" (die shot)
 * Looks like the inside of a chip die: the board is partitioned by a seeded
 * floorplan into functional cells — repeated CPU cores (fine vertical cell
 * grids), cache arrays (striped rows with bank breaks), logic blocks, bus
 * fabric channels (parallel line bundles), memory dot arrays and spare
 * cells — plus a bump pad ring around the die border, corner alignment
 * targets, and a light scattering of blueprint decoration (traces,
 * serpentines, vias, crosshairs, IC labels) on top.
 * 3D: cells are extruded to different heights (cores tall, cache slab,
 * logic medium, fabric/memory near-flat) with visible corner walls; bus
 * bundles run above the wafer on via drops; some traces ride elevated
 * metal layers; pads and die corners carry stub posts. The die is a
 * 1500 × 1050 world-unit board on the z = 0 ground plane, projected through
 * the shared orbit camera (BG.Cam) — orbit/tilt the whole board, sizes
 * attenuate with depth, ink fades into the haze.
 * Stability rule: the floorplan is owned by one derived stream (identical at
 * every Density), cell texture lines and pad-ring pads are prefix-gated by
 * Density (survivors never move), and the scattered pools keep per-element
 * derived streams. The camera never touches the RNG. */
(function (global) {
  'use strict';
  const BG = global.BG = global.BG || {};

  function chipKernel(rng, W, H, p, out) {
    const pal = p._pal;
    const st = p.stroke;
    const draft = !!p._draft;
    let cov = Math.min(1, Math.max(0.02, p.density / 2)); /* slider 0.25–2 → 0.125–1 */
    if (draft) cov *= 0.35;
    /* fine textures (stripes, grids, dots) follow a lifted curve so the
     * default view stays rich; scattered pools keep the full range */
    const tcov = 0.4 + 0.6 * cov;

    /* --- world board + shared camera --- */
    const BW = 1500, BH = 1050;
    const cam = BG.Cam(p, W, H, 620);
    const s0 = cam.project(0, 0, 0)[2];
    function PJ(x, y) { return cam.project(x - BW / 2, y - BH / 2, 0); }
    function PZ(x, y, z) { return cam.project(x - BW / 2, y - BH / 2, z); }
    function fx(v) { return String(Math.round(v * 10) / 10); }
    /* project a world-axis-aligned rect (x0,y0)-(x1,y1) at height z to a polygon */
    function rectPts(x0, y0, x1, y1, z) {
      const a = PZ(x0, y0, z), b = PZ(x1, y0, z), c = PZ(x1, y1, z), d = PZ(x0, y1, z);
      return fx(a[0]) + ',' + fx(a[1]) + ' ' + fx(b[0]) + ',' + fx(b[1]) + ' '
        + fx(c[0]) + ',' + fx(c[1]) + ' ' + fx(d[0]) + ',' + fx(d[1]);
    }

    const C = { g: 200, gMed: 200, border: 200, trace: 200, traceHi: 255, traceLo: 150, pad: 200, via: 180, label: 180 };

    /* fine + medium engineering grid (world lines through the camera) */
    const step = Math.max(16, Math.floor(BH / 100));
    if (p.grid) {
      for (let x = 0; x <= BW; x += step) {
        const d = PJ(x, BH / 2)[3];
        const a = PJ(x, 0), b = PJ(x, BH);
        out.el('line', { x1: fx(a[0]), y1: fx(a[1]), x2: fx(b[0]), y2: fx(b[1]), stroke: BG.gray(pal, cam.fogG(C.g, d), cam.fogA(0.08, d)), 'stroke-width': (0.5 * st).toFixed(2) });
      }
      for (let y = 0; y <= BH; y += step) {
        const d = PJ(BW / 2, y)[3];
        const a = PJ(0, y), b = PJ(BW, y);
        out.el('line', { x1: fx(a[0]), y1: fx(a[1]), x2: fx(b[0]), y2: fx(b[1]), stroke: BG.gray(pal, cam.fogG(C.gMed, d), cam.fogA(0.16, d)), 'stroke-width': (0.5 * st).toFixed(2) });
      }
      const mStep = step * 4;
      for (let x = 0; x <= BW; x += mStep) {
        const d = PJ(x, BH / 2)[3];
        const a = PJ(x, 0), b = PJ(x, BH);
        out.el('line', { x1: fx(a[0]), y1: fx(a[1]), x2: fx(b[0]), y2: fx(b[1]), stroke: BG.gray(pal, cam.fogG(C.gMed, d), cam.fogA(0.16, d)), 'stroke-width': (0.8 * st).toFixed(2) });
      }
      for (let y = 0; y <= BH; y += mStep) {
        const d = PJ(BW / 2, y)[3];
        const a = PJ(0, y), b = PJ(BW, y);
        out.el('line', { x1: fx(a[0]), y1: fx(a[1]), x2: fx(b[0]), y2: fx(b[1]), stroke: BG.gray(pal, cam.fogG(C.gMed, d), cam.fogA(0.16, d)), 'stroke-width': (0.8 * st).toFixed(2) });
      }
    }

    /* die area: border rect + corner alignment targets */
    const m = BH * 0.04;
    const dw = BW - m * 2;
    const dh = BH - m * 2;
    out.el('polygon', {
      points: rectPts(m, m, m + dw, m + dh, 0),
      fill: 'none', stroke: BG.gray(pal, cam.fogG(C.border, 0.4), cam.fogA(0.30, 0.4)), 'stroke-width': (1.5 * st).toFixed(2)
    });
    [[m, m], [m + dw, m], [m, m + dh], [m + dw, m + dh]].forEach(function (c, ci) {
      const cp = PJ(c[0], c[1]);
      out.el('circle', {
        cx: fx(cp[0]), cy: fx(cp[1]), r: (14 * cp[2] / s0).toFixed(1),
        fill: 'none', stroke: BG.gray(pal, cam.fogG(C.border, cp[3]), cam.fogA(0.30, cp[3])), 'stroke-width': (1 * st).toFixed(2)
      });
      if (ci % 2 === 0) { /* alignment cross in two corners */
        out.el('line', {
          x1: fx(cp[0] - 7 * cp[2] / s0), y1: fx(cp[1]), x2: fx(cp[0] + 7 * cp[2] / s0), y2: fx(cp[1]),
          stroke: BG.gray(pal, cam.fogG(C.traceHi, cp[3]), cam.fogA(0.5, cp[3])), 'stroke-width': (0.7 * st).toFixed(2)
        });
        out.el('line', {
          x1: fx(cp[0]), y1: fx(cp[1] - 7 * cp[2] / s0), x2: fx(cp[0]), y2: fx(cp[1] + 7 * cp[2] / s0),
          stroke: BG.gray(pal, cam.fogG(C.traceHi, cp[3]), cam.fogA(0.5, cp[3])), 'stroke-width': (0.7 * st).toFixed(2)
        });
      }
    });

    /* --- die floorplan: seeded partition into functional cells --- */
    const plan = rng.derive('chip-plan');
    const GAP = 12;
    const colCount = plan.int(4, 6);
    const colFr = [], rowFr = [], colGapX = [], rowGapYs = [];
    let colSum = 0;
    for (let c = 0; c < colCount; c++) { const wgt = plan.range(0.7, 1.5); colFr.push(wgt); colSum += wgt; }
    const rowCounts = [];
    let rowSum = 0;
    for (let c = 0; c < colCount; c++) {
      const rc = plan.int(2, 4);
      rowCounts.push(rc);
      const fr = [];
      let rs = 0;
      for (let r2 = 0; r2 < rc; r2++) { const wgt = plan.range(0.6, 1.4); fr.push(wgt); rs += wgt; }
      rowFr.push({ fr: fr, sum: rs });
    }
    const cells = [];
    let cx0 = m;
    for (let c = 0; c < colCount; c++) {
      const cw = (dw - GAP * (colCount - 1)) * colFr[c] / colSum;
      let cy0 = m;
      rowGapYs[c] = [];
      for (let r2 = 0; r2 < rowCounts[c]; r2++) {
        const ch = (dh - GAP * (rowCounts[c] - 1)) * rowFr[c].fr[r2] / rowFr[c].sum;
        const roll = plan.next();
        cells.push({
          x: cx0, y: cy0, w: cw, h: ch, col: c, row: r2,
          type: roll < 0.16 ? 'core' : roll < 0.36 ? 'cache' : roll < 0.62 ? 'logic'
            : roll < 0.76 ? 'fabric' : roll < 0.9 ? 'mem' : 'spare'
        });
        cy0 += ch + GAP;
        if (r2 < rowCounts[c] - 1) rowGapYs[c].push(cy0 - GAP / 2);
      }
      cx0 += cw + GAP;
      if (c < colCount - 1) colGapX.push(cx0 - GAP / 2);
    }
    /* guarantee the die reads as a die: at least one core + one cache */
    if (!cells.some(function (c) { return c.type === 'core'; })) cells[0].type = 'core';
    if (!cells.some(function (c) { return c.type === 'cache'; })) cells[cells.length - 1].type = 'cache';
    let coreIdx = 0;
    const cellNames = { core: 'CORE', cache: 'L2 CACHE', logic: 'CTRL', fabric: 'FABRIC', mem: 'MEM', spare: 'SPARE' };

    /* extrusion heights per cell type: cores are tall dies, cache is a
     * shallow slab, logic medium, fabric/memory near-flat */
    const CELL_Z = { core: 15, cache: 7, logic: 10, fabric: 2.5, mem: 5, spare: 0 };

    cells.forEach(function (cell) {
      const zTop = CELL_Z[cell.type] || 0;
      const dCell = PJ(cell.x + cell.w / 2, cell.y + cell.h / 2)[3];
      /* base footprint on the wafer */
      out.el('polygon', {
        points: rectPts(cell.x, cell.y, cell.x + cell.w, cell.y + cell.h, 0),
        fill: 'none', stroke: BG.gray(pal, cam.fogG(C.border, dCell), cam.fogA(0.32, dCell)),
        'stroke-width': (0.8 * st).toFixed(2)
      });
      if (zTop > 0) {
        /* extruded block: top face + four corner walls */
        out.el('polygon', {
          points: rectPts(cell.x, cell.y, cell.x + cell.w, cell.y + cell.h, zTop),
          fill: 'none', stroke: BG.gray(pal, cam.fogG(C.border, dCell), cam.fogA(0.5, dCell)),
          'stroke-width': (1.1 * st).toFixed(2)
        });
        const corners = [
          [cell.x, cell.y], [cell.x + cell.w, cell.y],
          [cell.x + cell.w, cell.y + cell.h], [cell.x, cell.y + cell.h]
        ];
        corners.forEach(function (cnr) {
          const a = PZ(cnr[0], cnr[1], 0), b = PZ(cnr[0], cnr[1], zTop);
          out.el('line', {
            x1: fx(a[0]), y1: fx(a[1]), x2: fx(b[0]), y2: fx(b[1]),
            stroke: BG.gray(pal, cam.fogG(C.border, (a[3] + b[3]) / 2), cam.fogA(0.35, (a[3] + b[3]) / 2)),
            'stroke-width': (0.7 * st).toFixed(2)
          });
        });
      }
      const labelCell = function (txt) {
        if (!p.labels) return;
        const tp = PZ(cell.x + 8, cell.y + 19, zTop);
        const t = out.el('text', {
          x: fx(tp[0]), y: fx(tp[1]),
          fill: BG.gray(pal, cam.fogG(C.label, tp[3]), cam.fogA(0.45, tp[3])),
          'font-family': 'monospace', 'font-size': '7'
        });
        t.textContent = txt;
      };

      if (cell.type === 'core') {
        /* fine vertical cell grid + horizontal channel lines on the top face */
        const pitch = 2.8;
        const nV = Math.floor(cell.w / pitch);
        for (let k = 0; k < nV; k++) {
          if (k >= nV * tcov) break;
          const lx = cell.x + 3 + k * pitch;
          const a = PZ(lx, cell.y + 3, zTop), b = PZ(lx, cell.y + cell.h - 3, zTop);
          out.el('line', {
            x1: fx(a[0]), y1: fx(a[1]), x2: fx(b[0]), y2: fx(b[1]),
            stroke: BG.gray(pal, cam.fogG(C.traceLo, (a[3] + b[3]) / 2), cam.fogA(0.22, (a[3] + b[3]) / 2)),
            'stroke-width': (0.4 * st).toFixed(2)
          });
        }
        for (let j = 0; j < 3; j++) {
          const ly = cell.y + cell.h * (0.3 + j * 0.2);
          const a = PZ(cell.x + 3, ly, zTop), b = PZ(cell.x + cell.w - 3, ly, zTop);
          out.el('line', {
            x1: fx(a[0]), y1: fx(a[1]), x2: fx(b[0]), y2: fx(b[1]),
            stroke: BG.gray(pal, cam.fogG(C.trace, (a[3] + b[3]) / 2), cam.fogA(0.3, (a[3] + b[3]) / 2)),
            'stroke-width': (0.6 * st).toFixed(2)
          });
        }
        /* micro row layer: second texture direction at whisper weight */
        const nH = Math.floor((cell.h - 6) / 6.5);
        for (let k = 0; k < nH; k++) {
          if (k >= nH * tcov) break;
          const ly = cell.y + 3 + k * 8;
          const a = PZ(cell.x + 3, ly, zTop), b = PZ(cell.x + cell.w - 3, ly, zTop);
          out.el('line', {
            x1: fx(a[0]), y1: fx(a[1]), x2: fx(b[0]), y2: fx(b[1]),
            stroke: BG.gray(pal, cam.fogG(C.traceLo, (a[3] + b[3]) / 2), cam.fogA(0.1, (a[3] + b[3]) / 2)),
            'stroke-width': (0.3 * st).toFixed(2)
          });
        }
        /* execution block: inset rect + tick row */
        const iw = cell.w * 0.3, ih = cell.h * 0.22;
        const ix = cell.x + cell.w * 0.56, iy = cell.y + cell.h * 0.52;
        out.el('polygon', {
          points: rectPts(ix, iy, ix + iw, iy + ih, zTop),
          fill: 'none', stroke: BG.gray(pal, cam.fogG(C.traceHi, dCell), cam.fogA(0.4, dCell)),
          'stroke-width': (0.6 * st).toFixed(2)
        });
        for (let tk = 0; tk < 4; tk++) {
          const tx = ix + iw * (0.15 + tk * 0.22);
          const a = PZ(tx, iy, zTop), b = PZ(tx, iy + ih, zTop);
          out.el('line', {
            x1: fx(a[0]), y1: fx(a[1]), x2: fx(b[0]), y2: fx(b[1]),
            stroke: BG.gray(pal, cam.fogG(C.traceHi, dCell), cam.fogA(0.3, dCell)),
            'stroke-width': (0.4 * st).toFixed(2)
          });
        }

      } else if (cell.type === 'cache') {
        /* striped rows with bank breaks — the classic array look */
        const pitch = 2.6;

        const bankW = 58;
        const nB = Math.max(1, Math.floor((cell.w - 6) / bankW));
        for (let k = 0; k < nR; k++) {
          if (k >= nR * tcov) break;
          const ly = cell.y + 3 + k * pitch;
          for (let bk = 0; bk < nB; bk++) {
            const x0 = cell.x + 3 + bk * bankW;
            const x1 = Math.min(cell.x + cell.w - 3, x0 + bankW - 6);
            if (x1 - x0 < 4) continue;
            const a = PZ(x0, ly, zTop), b = PZ(x1, ly, zTop);
            out.el('line', {
              x1: fx(a[0]), y1: fx(a[1]), x2: fx(b[0]), y2: fx(b[1]),
              stroke: BG.gray(pal, cam.fogG(C.traceLo, (a[3] + b[3]) / 2), cam.fogA(0.2, (a[3] + b[3]) / 2)),
              'stroke-width': (0.35 * st).toFixed(2)
            });
          }
        }
        /* bank separator walls */
        for (let bk = 1; bk < nB; bk++) {
          const bx = cell.x + 3 + bk * bankW - 3;
          if (bx >= cell.x + cell.w - 4) break;
          const a = PZ(bx, cell.y + 3, zTop), b = PZ(bx, cell.y + cell.h - 3, zTop);
          out.el('line', {
            x1: fx(a[0]), y1: fx(a[1]), x2: fx(b[0]), y2: fx(b[1]),
            stroke: BG.gray(pal, cam.fogG(C.trace, (a[3] + b[3]) / 2), cam.fogA(0.35, (a[3] + b[3]) / 2)),
            'stroke-width': (0.7 * st).toFixed(2)
          });
        }
        /* bank labels */
        if (p.labels) {
          for (let bk = 0; bk < nB; bk++) {
            const bp = PZ(cell.x + 3 + bk * bankW + 3, cell.y + cell.h - 5, zTop);
            const t = out.el('text', {
              x: fx(bp[0]), y: fx(bp[1]),
              fill: BG.gray(pal, cam.fogG(C.label, bp[3]), cam.fogA(0.4, bp[3])),
              'font-family': 'monospace', 'font-size': '6'
            });
            t.textContent = 'B' + bk;
          }
        }
        labelCell('L2 CACHE');
      } else if (cell.type === 'fabric') {
        /* bus bundles crossing the cell, raised above the wafer with drops */
        const horiz = cell.w >= cell.h;
        const nBun = Math.floor(5 * tcov) + 1;
        for (let bk = 0; bk < nBun; bk++) {
          const brr = rng.derive('chip-fb' + cell.col + '_' + cell.row + '_' + bk);
          const lines = brr.int(6, 10);
          const bpitch = 3.6;
          const pos = brr.range(0.15, 0.85);
          const bz = 5 + brr.range(0, 6);
          for (let j = 0; j < lines; j++) {
            if (j >= lines * tcov) break;
            const off = (pos - 0.5) * (horiz ? cell.h : cell.w) + j * bpitch;
            let a, b;
            if (horiz) {
              a = PZ(cell.x + 4, cell.y + cell.h / 2 + off, bz);
              b = PZ(cell.x + cell.w - 4, cell.y + cell.h / 2 + off, bz);
            } else {
              a = PZ(cell.x + cell.w / 2 + off, cell.y + 4, bz);
              b = PZ(cell.x + cell.w / 2 + off, cell.y + cell.h - 4, bz);
            }
            out.el('line', {
              x1: fx(a[0]), y1: fx(a[1]), x2: fx(b[0]), y2: fx(b[1]),
              stroke: BG.gray(pal, cam.fogG(C.trace, (a[3] + b[3]) / 2), cam.fogA(0.32, (a[3] + b[3]) / 2)),
              'stroke-width': (0.55 * st).toFixed(2)
            });
            if (j === 0) { /* bundle end drops: via down to the wafer */
              const d1 = PZ(horiz ? cell.x + 4 : cell.x + cell.w / 2 + off, horiz ? cell.y + cell.h / 2 + off : cell.y + 4, 0);
              const d2 = PZ(horiz ? cell.x + cell.w - 4 : cell.x + cell.w / 2 + off, horiz ? cell.y + cell.h / 2 + off : cell.y + cell.h - 4, 0);
              out.el('line', {
                x1: fx(a[0]), y1: fx(a[1]), x2: fx(d1[0]), y2: fx(d1[1]),
                stroke: BG.gray(pal, cam.fogG(C.via, (a[3] + d1[3]) / 2), cam.fogA(0.3, (a[3] + d1[3]) / 2)),
                'stroke-width': (0.45 * st).toFixed(2)
              });
              out.el('line', {
                x1: fx(b[0]), y1: fx(b[1]), x2: fx(d2[0]), y2: fx(d2[1]),
                stroke: BG.gray(pal, cam.fogG(C.via, (b[3] + d2[3]) / 2), cam.fogA(0.3, (b[3] + d2[3]) / 2)),
                'stroke-width': (0.45 * st).toFixed(2)
              });
            }
          }
          /* direction chevron at the bundle midpoint */
          if (brr.chance(0.6)) {
            const midT = brr.range(0.35, 0.65);
            let ch;
            if (horiz) {
              const mx2 = cell.x + cell.w * midT;
              const my2 = cell.y + cell.h * pos;
              ch = [[mx2 - 5, my2 - 4], [mx2, my2], [mx2 - 5, my2 + 4]];
            } else {
              const mx2 = cell.x + cell.w * pos;
              const my2 = cell.y + cell.h * midT;
              ch = [[mx2 - 4, my2 - 5], [mx2, my2], [mx2 + 4, my2 - 5]];
            }
            let cstr = '';
            for (let k2 = 0; k2 < ch.length; k2++) {
              const pr = PZ(ch[k2][0], ch[k2][1], bz + 2);
              cstr += (k2 ? ' ' : '') + fx(pr[0]) + ',' + fx(pr[1]);
            }
            out.el('polyline', {
              points: cstr, fill: 'none',
              stroke: BG.gray(pal, cam.fogG(C.traceHi, dCell), cam.fogA(0.5, dCell)),
              'stroke-width': (0.6 * st).toFixed(2)
            });
          }
        }
        /* crossbar: bundles on the short axis too — the fabric accesses
         * every side, like a real NoC switch box */
        const nCross = Math.floor(2.5 * tcov) + 1;
        for (let bx = 0; bx < nCross; bx++) {
          const fxr = rng.derive('chip-fx' + cell.col + '_' + cell.row + '_' + bx);
          const lines = fxr.int(3, 6);
          const cpitch = 3.6;
          const cpos = fxr.range(0.15, 0.85);
          const cbz = 6 + fxr.range(0, 6);
          for (let j = 0; j < lines; j++) {
            if (j >= lines * tcov) break;
            const off = (cpos - 0.5) * (horiz ? cell.w : cell.h) + j * cpitch;
            let a, b;
            if (horiz) {
              a = PZ(cell.x + cell.w / 2 + off, cell.y + 4, cbz);
              b = PZ(cell.x + cell.w / 2 + off, cell.y + cell.h - 4, cbz);
            } else {
              a = PZ(cell.x + 4, cell.y + cell.h / 2 + off, cbz);
              b = PZ(cell.x + cell.w - 4, cell.y + cell.h / 2 + off, cbz);
            }
            out.el('line', {
              x1: fx(a[0]), y1: fx(a[1]), x2: fx(b[0]), y2: fx(b[1]),
              stroke: BG.gray(pal, cam.fogG(C.trace, (a[3] + b[3]) / 2), cam.fogA(0.28, (a[3] + b[3]) / 2)),
              'stroke-width': (0.45 * st).toFixed(2)
            });
          }
        }
        labelCell('FABRIC');
      } else if (cell.type === 'mem') {
        /* memory macro: dot grid on its slab, row gating */
        const dstep = 7;
        const nX = Math.floor((cell.w - 8) / dstep), nY = Math.floor((cell.h - 8) / dstep);
        for (let iy = 0; iy < nY; iy++) {
          if (iy >= nY * tcov) break;
          for (let ix = 0; ix < nX; ix++) {
            const dp = PZ(cell.x + 5 + ix * dstep, cell.y + 5 + iy * dstep, zTop);
            out.el('circle', {
              cx: fx(dp[0]), cy: fx(dp[1]), r: (1.3 * dp[2] / s0).toFixed(2),
              fill: BG.gray(pal, cam.fogG(C.via, dp[3]), cam.fogA(0.35, dp[3]))
            });
          }
        }
        labelCell('MEM');
      } else if (cell.type === 'logic') {
        const lines = 2 + (cell.row + cell.col) % 3;
        for (let j = 0; j < lines; j++) {
          if (j >= lines * tcov) break;
          const ly = cell.y + cell.h * (0.3 + j * 0.18);
          const a = PZ(cell.x + 4, ly, zTop), b = PZ(cell.x + cell.w - 4, ly, zTop);
          out.el('line', {
            x1: fx(a[0]), y1: fx(a[1]), x2: fx(b[0]), y2: fx(b[1]),
            stroke: BG.gray(pal, cam.fogG(C.traceLo, (a[3] + b[3]) / 2), cam.fogA(0.22, (a[3] + b[3]) / 2)),
            'stroke-width': (0.5 * st).toFixed(2)
          });
        }
        /* pin stubs on all four sides, with contact dots at the tips */
        const nSide = Math.round((3 + (cell.row + cell.col) % 3) * 1.6);
        for (let side = 0; side < 4; side++) {
          const n = nSide;
          for (let k2 = 0; k2 < n; k2++) {
            if (k2 >= n * tcov) break;
            const f = (k2 + 0.5) / n;
            let a, b;
            if (side === 0) { /* top */
              a = PZ(cell.x + cell.w * f, cell.y, zTop);
              b = PZ(cell.x + cell.w * f, cell.y - 8, zTop);
            } else if (side === 1) { /* right */
              a = PZ(cell.x + cell.w, cell.y + cell.h * f, zTop);
              b = PZ(cell.x + cell.w + 8, cell.y + cell.h * f, zTop);
            } else if (side === 2) { /* bottom */
              a = PZ(cell.x + cell.w * f, cell.y + cell.h, zTop);
              b = PZ(cell.x + cell.w * f, cell.y + cell.h + 8, zTop);
            } else { /* left */
              a = PZ(cell.x, cell.y + cell.h * f, zTop);
              b = PZ(cell.x - 8, cell.y + cell.h * f, zTop);
            }
            out.el('line', {
              x1: fx(a[0]), y1: fx(a[1]), x2: fx(b[0]), y2: fx(b[1]),
              stroke: BG.gray(pal, cam.fogG(C.trace, (a[3] + b[3]) / 2), cam.fogA(0.3, (a[3] + b[3]) / 2)),
              'stroke-width': (0.5 * st).toFixed(2)
            });
            out.el('circle', {
              cx: fx(b[0]), cy: fx(b[1]), r: (1.2 * b[2] / s0).toFixed(2),
              fill: BG.gray(pal, cam.fogG(C.via, b[3]), cam.fogA(0.4, b[3]))
            });
          }
        }
        labelCell(cellNames.logic + '_' + cell.col + '' + cell.row);
      } else {
        /* spare: tie-off crosshair */
        const cx = cell.x + cell.w / 2, cy = cell.y + cell.h / 2;
        const s = Math.min(cell.w, cell.h) * 0.18;
        const h1 = PZ(cx - s, cy, 0), h2 = PZ(cx + s, cy, 0);
        out.el('line', {
          x1: fx(h1[0]), y1: fx(h1[1]), x2: fx(h2[0]), y2: fx(h2[1]),
          stroke: BG.gray(pal, cam.fogG(C.traceHi, h1[3]), cam.fogA(0.3, h1[3])),
          'stroke-width': (0.6 * st).toFixed(2)
        });
      }
    });

    /* --- routing corridors: wires living in the gaps between cells --- */
    colGapX.forEach(function (gx, g) {
      const cg = rng.derive('chip-cg' + g);
      const nW = cg.int(3, 5);
      for (let j = 0; j < nW; j++) {
        const off = (j - (nW - 1) / 2) * 2.2;
        const a = PZ(gx + off, m + 4, 1.5), b = PZ(gx + off, m + dh - 4, 1.5);
        out.el('line', {
          x1: fx(a[0]), y1: fx(a[1]), x2: fx(b[0]), y2: fx(b[1]),
          stroke: BG.gray(pal, cam.fogG(C.traceLo, (a[3] + b[3]) / 2), cam.fogA(0.28, (a[3] + b[3]) / 2)),
          'stroke-width': (0.4 * st).toFixed(2)
        });
      }
      /* junction studs where the corridor crosses row gaps */
      const jy = rowGapYs[g].concat(rowGapYs[g + 1] || []);
      jy.forEach(function (yy) {
        const jp = PZ(gx, yy, 3);
        out.el('circle', {
          cx: fx(jp[0]), cy: fx(jp[1]), r: (1.5 * jp[2] / s0).toFixed(2),
          fill: BG.gray(pal, cam.fogG(C.via, jp[3]), cam.fogA(0.45, jp[3]))
        });
      });
      /* edge contacts: the corridor reaches the die border top + bottom */
      [m + 4, m + dh - 4].forEach(function (ey) {
        const ep = PZ(gx, ey, 3);
        out.el('circle', {
          cx: fx(ep[0]), cy: fx(ep[1]), r: (1.6 * ep[2] / s0).toFixed(2),
          fill: BG.gray(pal, cam.fogG(C.traceHi, ep[3]), cam.fogA(0.5, ep[3]))
        });
      });
    });
    for (let c = 0; c < colCount; c++) {
      const colL = cells.filter(function (cl) { return cl.col === c; })[0];
      const colR = c < colCount - 1 ? cells.filter(function (cl) { return cl.col === c + 1; })[0] : null;
      rowGapYs[c].forEach(function (gy, r2) {
        const rg = rng.derive('chip-rg' + c + '_' + r2);
        for (let j = 0; j < 2; j++) {
          const off = j * 2.4 - 1.2;
          const a = PZ(colL.x + 4, gy + off, 1.5), b = PZ(colL.x + colL.w - 4, gy + off, 1.5);
          out.el('line', {
            x1: fx(a[0]), y1: fx(a[1]), x2: fx(b[0]), y2: fx(b[1]),
            stroke: BG.gray(pal, cam.fogG(C.traceLo, (a[3] + b[3]) / 2), cam.fogA(0.25, (a[3] + b[3]) / 2)),
            'stroke-width': (0.4 * st).toFixed(2)
          });
          /* jumper carries the wire across the column gap so horizontal
           * runs continue into the next column */
          if (colR) {
            const ja = PZ(colL.x + colL.w, gy + off, 1.5);
            const jb = PZ(colR.x, gy + off, 1.5);
            out.el('line', {
              x1: fx(ja[0]), y1: fx(ja[1]), x2: fx(jb[0]), y2: fx(jb[1]),
              stroke: BG.gray(pal, cam.fogG(C.traceLo, (ja[3] + jb[3]) / 2), cam.fogA(0.25, (ja[3] + jb[3]) / 2)),
              'stroke-width': (0.4 * st).toFixed(2)
            });
          }
        }
        if (rg.chance(0.5)) { /* mid-run via */
          const mv = PZ(colL.x + colL.w * rg.range(0.3, 0.7), gy, 3);
          out.el('circle', {
            cx: fx(mv[0]), cy: fx(mv[1]), r: (1.4 * mv[2] / s0).toFixed(2),
            fill: BG.gray(pal, cam.fogG(C.via, mv[3]), cam.fogA(0.4, mv[3]))
          });
        }
        /* die-edge contacts: horizontal runs reach the left/right borders */
        if (c === 0 || c === colCount - 1) {
          const ex = c === 0 ? m : m + dw;
          const ep = PZ(ex, gy, 3);
          out.el('circle', {
            cx: fx(ep[0]), cy: fx(ep[1]), r: (1.6 * ep[2] / s0).toFixed(2),
            fill: BG.gray(pal, cam.fogG(C.traceHi, ep[3]), cam.fogA(0.5, ep[3]))
          });
        }
      });
    }

    /* --- wafer margin: alignment crosses + dotted guide lines --- */
    (function margins() {
      const markStep = 90;
      let mi = 0;
      for (let x = m; x <= m + dw; x += markStep) {
        [[x, m * 0.5], [x, BH - m * 0.5]].forEach(function (mp) {
          if (mi++ >= 60 * cov) return;
          const c0 = PZ(mp[0] - 5, mp[1], 0), c1 = PZ(mp[0] + 5, mp[1], 0);
          const d0 = PZ(mp[0], mp[1] - 5, 0), d1 = PZ(mp[0], mp[1] + 5, 0);
          const colM = BG.gray(pal, cam.fogG(C.traceLo, c0[3]), cam.fogA(0.22, c0[3]));
          out.el('line', { x1: fx(c0[0]), y1: fx(c0[1]), x2: fx(c1[0]), y2: fx(c1[1]), stroke: colM, 'stroke-width': (0.5 * st).toFixed(2) });
          out.el('line', { x1: fx(d0[0]), y1: fx(d0[1]), x2: fx(d1[0]), y2: fx(d1[1]), stroke: colM, 'stroke-width': (0.5 * st).toFixed(2) });
        });
      }
      let mi2 = 0;
      for (let y = m * 2; y <= BH - m * 2; y += markStep) {
        [[m * 0.5, y], [BW - m * 0.5, y]].forEach(function (mp) {
          if (mi2++ >= 40 * cov) return;
          const c0 = PZ(mp[0] - 5, mp[1], 0), c1 = PZ(mp[0] + 5, mp[1], 0);
          const d0 = PZ(mp[0], mp[1] - 5, 0), d1 = PZ(mp[0], mp[1] + 5, 0);
          const colM = BG.gray(pal, cam.fogG(C.traceLo, c0[3]), cam.fogA(0.22, c0[3]));
          out.el('line', { x1: fx(c0[0]), y1: fx(c0[1]), x2: fx(c1[0]), y2: fx(c1[1]), stroke: colM, 'stroke-width': (0.5 * st).toFixed(2) });
          out.el('line', { x1: fx(d0[0]), y1: fx(d0[1]), x2: fx(d1[0]), y2: fx(d1[1]), stroke: colM, 'stroke-width': (0.5 * st).toFixed(2) });
        });
      }
      [[0, m * 0.5, BW, m * 0.5], [0, BH - m * 0.5, BW, BH - m * 0.5],
       [m * 0.5, 0, m * 0.5, BH], [BW - m * 0.5, 0, BW - m * 0.5, BH]].forEach(function (ln) {
        const a = PZ(ln[0], ln[1], 0), b = PZ(ln[2], ln[3], 0);
        out.el('line', {
          x1: fx(a[0]), y1: fx(a[1]), x2: fx(b[0]), y2: fx(b[1]),
          stroke: BG.gray(pal, cam.fogG(C.traceLo, (a[3] + b[3]) / 2), cam.fogA(0.14, (a[3] + b[3]) / 2)),
          'stroke-width': (0.5 * st).toFixed(2), 'stroke-dasharray': '2,6'
        });
      });
    })();

    /* --- bump pad ring around the die border (prefix-gated, raised) --- */
    if (!draft) {
      const pitch = 14, padS = 6;
      const nPX = Math.floor(dw / pitch), nPZ2 = Math.floor(dh / pitch);
      const totalPads = 2 * (nPX + nPZ2);
      let padIdx = 0;
      const padAt = function (px, py) {
        const myIdx = padIdx++;
        if (myIdx >= totalPads * cov) return;
        const dP = PZ(px, py, 5)[3];
        out.el('polygon', {
          points: rectPts(px - padS / 2, py - padS / 2, px + padS / 2, py + padS / 2, 5),
          fill: 'none', stroke: BG.gray(pal, cam.fogG(C.pad, dP), cam.fogA(0.5, dP)),
          'stroke-width': (0.55 * st).toFixed(2)
        });
        if (myIdx % 3 === 0) { /* stub post under every third pad */
          const a = PZ(px, py, 0), b = PZ(px, py, 5);
          out.el('line', {
            x1: fx(a[0]), y1: fx(a[1]), x2: fx(b[0]), y2: fx(b[1]),
            stroke: BG.gray(pal, cam.fogG(C.pad, (a[3] + b[3]) / 2), cam.fogA(0.3, (a[3] + b[3]) / 2)),
            'stroke-width': (0.45 * st).toFixed(2)
          });
        }
      };
      for (let k = 0; k < nPX; k++) { padAt(m + (k + 0.5) * (dw / nPX), m); padAt(m + (k + 0.5) * (dw / nPX), m + dh); }
      for (let k = 0; k < nPZ2; k++) { padAt(m, m + (k + 0.5) * (dh / nPZ2)); padAt(m + dw, m + (k + 0.5) * (dh / nPZ2)); }
    }

    /* --- die corner posts + dimension ruler --- */
    [[m, m], [m + dw, m], [m, m + dh], [m + dw, m + dh]].forEach(function (cnr) {
      const a = PZ(cnr[0], cnr[1], 0), b = PZ(cnr[0], cnr[1], 22);
      out.el('line', {
        x1: fx(a[0]), y1: fx(a[1]), x2: fx(b[0]), y2: fx(b[1]),
        stroke: BG.gray(pal, cam.fogG(C.border, (a[3] + b[3]) / 2), cam.fogA(0.5, (a[3] + b[3]) / 2)),
        'stroke-width': (0.9 * st).toFixed(2)
      });
      out.el('circle', {
        cx: fx(b[0]), cy: fx(b[1]), r: (1.6 * b[2] / s0).toFixed(2),
        fill: BG.gray(pal, cam.fogG(C.traceHi, b[3]), cam.fogA(0.6, b[3]))
      });
    });
    (function ruler() {
      const ry = m * 0.5;
      const dR = PZ(m + dw / 2, ry, 0)[3];
      const a = PZ(m, ry, 0), b = PZ(m + dw, ry, 0);
      out.el('line', {
        x1: fx(a[0]), y1: fx(a[1]), x2: fx(b[0]), y2: fx(b[1]),
        stroke: BG.gray(pal, cam.fogG(C.traceLo, dR), cam.fogA(0.3, dR)),
        'stroke-width': (0.5 * st).toFixed(2)
      });
      for (let k = 0; k <= 10; k++) {
        const tk = m + dw * k / 10;
        const tLen = (k % 5 === 0) ? 8 : 4;
        const p1 = PZ(tk, ry, 0), p2 = PZ(tk, ry - tLen, 0);
        out.el('line', {
          x1: fx(p1[0]), y1: fx(p1[1]), x2: fx(p2[0]), y2: fx(p2[1]),
          stroke: BG.gray(pal, cam.fogG(C.traceLo, dR), cam.fogA(0.3, dR)),
          'stroke-width': (0.5 * st).toFixed(2)
        });
      }
      if (p.labels) {
        const tp = PZ(m + dw / 2, ry - 14, 0);
        const t = out.el('text', {
          x: fx(tp[0]), y: fx(tp[1]),
          fill: BG.gray(pal, cam.fogG(C.label, tp[3]), cam.fogA(0.4, tp[3])),
          'font-family': 'monospace', 'font-size': '7',
          'text-anchor': 'middle'
        });
        t.textContent = 'DIE 15.0 × 10.5 mm';
      }
    })();

    /* section size multipliers: drawn once from the main stream, so they do
     * not depend on Density (pools stay fixed, Density only gates prefix) */
    const tMul = rng.range(5.5, 8.5), zMul = rng.range(0.5, 0.85), pMul = rng.range(0.3, 0.5);
    const vMul = rng.range(3, 5), bMul = rng.range(0.5, 1), rMul = rng.range(0.08, 0.2);
    const dMul = rng.range(0.08, 0.18), cMul = rng.range(0.2, 0.35), xMul = rng.range(0.4, 0.65);

    /* scattered traces with optional right-angle bend (blueprint clutter) */
    const areaD = (BW * BH) / 40000;
    const tCount = Math.floor(areaD * tMul * 2 * cov);
    for (let i = 0; i < tCount; i++) {
      const tr = rng.derive('chip-t' + i);
      const horiz = !tr.chance(0.45);
      const x = m + tr.next() * dw;
      const y = m + tr.next() * dh;
      const len = tr.range(40, (horiz ? dw : dh) * 0.7);
      const w = tr.range(0.3, 1.2) * st;
      const roll = tr.next();
      const lineCol = roll > 0.6 ? C.traceHi : (roll > 0.24 ? C.trace : C.traceLo);
      const op = tr.range(0.25, 0.55);
      /* some traces run on elevated metal layers with via drops at the ends */
      const raised = tr.chance(0.35);
      const tz = raised ? tr.range(4, 10) : 0;
      function emitLine(wx0, wy0, wx1, wy1) {
        const a = PZ(wx0, wy0, tz), b = PZ(wx1, wy1, tz);
        out.el('line', {
          x1: fx(a[0]), y1: fx(a[1]), x2: fx(b[0]), y2: fx(b[1]),
          stroke: BG.gray(pal, cam.fogG(lineCol, (a[3] + b[3]) / 2), cam.fogA(op, (a[3] + b[3]) / 2)),
          'stroke-width': w.toFixed(2), 'stroke-linecap': 'round'
        });
      }
      if (horiz) emitLine(x, y, x + len, y);
      else emitLine(x, y, x, y + len);

      const bend = tr.chance(0.25);
      let bendX = null, bendY = null;
      if (bend) {
        const bl = tr.range(16, 60);
        const dir = tr.chance(0.5) ? bl : -bl;
        if (horiz) { emitLine(x + len, y, x + len, y + dir); bendX = x + len; bendY = y + dir; }
        else { emitLine(x, y + len, x + dir, y + len); bendX = x + dir; bendY = y + len; }
      }
      if (raised) { /* via drops at both trace ends */
        const ends = [[x, y], bend ? [bendX, bendY] : (horiz ? [x + len, y] : [x, y + len])];
        ends.forEach(function (ep) {
          const a = PZ(ep[0], ep[1], tz), b = PZ(ep[0], ep[1], 0);
          out.el('line', {
            x1: fx(a[0]), y1: fx(a[1]), x2: fx(b[0]), y2: fx(b[1]),
            stroke: BG.gray(pal, cam.fogG(C.via, (a[3] + b[3]) / 2), cam.fogA(0.35, (a[3] + b[3]) / 2)),
            'stroke-width': (0.45 * st).toFixed(2)

          out.el('circle', {
            cx: fx(b[0]), cy: fx(b[1]), r: (1.4 * b[2] / s0).toFixed(2),
            fill: BG.gray(pal, cam.fogG(C.via, b[3]), cam.fogA(0.4, b[3]))

      }

    const kMul = rng.range(0.5, 0.8);

    for (let i = 0; i < kCount; i++) {
      const kr = rng.derive('chip-k' + i);
      const cell = cells[kr.int(0, cells.length - 1)];
      const onTop = kr.chance(0.5);
      const frac = kr.range(0.15, 0.85);

      const b = PZ(px - vy * capW / 2, py - vx * capW / 2, zt + 3);
      const a2 = PZ(px + vy * capW / 2, py + vx * capW / 2, zt + 8);
      const b2 = PZ(px - vy * capW / 2, py - vx * capW / 2, zt + 8);
      const dK = (a[3] + b[3]) / 2;
      const colK = BG.gray(pal, cam.fogG(C.via, dK), cam.fogA(0.45, dK));
      out.el('line', { x1: fx(a[0]), y1: fx(a[1]), x2: fx(b[0]), y2: fx(b[1]), stroke: colK, 'stroke-width': (0.7 * st).toFixed(2) });
      out.el('line', { x1: fx(a2[0]), y1: fx(a2[1]), x2: fx(b2[0]), y2: fx(b2[1]), stroke: colK, 'stroke-width': (0.7 * st).toFixed(2) });
    }

    /* serpentines */
    const zCount = Math.floor(areaD * zMul * 2 * cov);
    for (let i = 0; i < zCount; i++) {
      const zr = rng.derive('chip-z' + i);
      let cx = m + zr.next() * dw * 0.9;
      let cy = m + zr.next() * dh * 0.9;
      const segW = zr.range(6, 19), segH = zr.range(4, 15);
      const segs = zr.int(4, 10);
      const w = zr.range(0.5, 1.2) * st;
      const wpts = [[cx, cy]];
      for (let s = 0; s < segs; s++) {
        cx += segW; wpts.push([cx, cy]);
        cy += (s % 2 === 0 ? segH : -segH); wpts.push([cx, cy]);
      }
      let ptsStr = '';
      let dSum = 0;
      for (let k = 0; k < wpts.length; k++) {
        const pr = PJ(wpts[k][0], wpts[k][1]);
        dSum += pr[3];
        ptsStr += (k ? ' ' : '') + fx(pr[0]) + ',' + fx(pr[1]);
      }
      out.el('polyline', {
        points: ptsStr, stroke: BG.gray(pal, cam.fogG(C.traceHi, dSum / wpts.length), cam.fogA(zr.range(0.3, 0.5), dSum / wpts.length)),
        'stroke-width': w.toFixed(2), fill: 'none',
        'stroke-linecap': 'round', 'stroke-linejoin': 'round'
