<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>chrom.3</title>
<style>
  /* chrom.3 v2.5 — streamlined FX-Cam shell (matches crt.4 / roto.5 / LCD.nx). Was the orange
     Braun-T skin; now the minimal dark shell, orange accent. Markup + JS untouched; CSS only. */
  :root{
    --bg:#08090b; --panel:#101216; --line:#23262d; --ink:#e8e8ea; --dim:#6b7178;
    --accent:#c8351a; --rec:#ff3b30; --led:#c8351a; --r:#ff2a2a; --g:#25e05a; --b:#3a7bff;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;overscroll-behavior:none}
  body{display:flex;flex-direction:column}
  #stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
  #view{max-width:100%;max-height:100%;display:block;background:#000;touch-action:none}
  video{display:none}
  #lcd2{position:absolute;inset:0;pointer-events:none;mix-blend-mode:normal;opacity:0;z-index:4;background-repeat:no-repeat}
  #lcd{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:0;z-index:5;background-repeat:repeat}
  #lcd.b{mix-blend-mode:lighten}
  #hud{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;gap:13px;padding:9px 13px;
       font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--led);
       text-shadow:0 0 6px rgba(200,53,26,.45);pointer-events:none;user-select:none;background:linear-gradient(rgba(0,0,0,.6),transparent)}
  #hud .tag{font-weight:600}
  #chan{display:flex;gap:6px;margin-left:auto;align-items:center}
  #chan i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .05s,box-shadow .05s}
  #chan i.r.on{background:var(--r);box-shadow:0 0 6px var(--r)}
  #chan i.g.on{background:var(--g);box-shadow:0 0 6px var(--g)}
  #chan i.b.on{background:var(--b);box-shadow:0 0 6px var(--b)}
  #fpsread{margin-left:auto}
  #rec-dot{display:none;align-items:center;gap:7px;color:var(--rec)}
  #rec-dot.live{display:flex}
  #rec-dot .bulb{width:7px;height:7px;border-radius:50%;background:var(--rec);animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:.12}}
  #start{position:absolute;inset:0;z-index:40;background:radial-gradient(120% 90% at 50% 40%,#15171c,#000 70%);
         display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;padding:24px}
  #start h1{margin:0;font-family:var(--mono);font-size:34px;letter-spacing:.06em;font-weight:500}
  #start h1 .d{color:var(--dim)}
  #start .rgb{display:flex;gap:5px;margin-top:8px;justify-content:center}
  #start .rgb span{width:32px;height:3px;border-radius:0}
  #start .rgb .r{background:var(--r)}#start .rgb .g{background:var(--g)}#start .rgb .b{background:var(--b)}
  #start p{margin:0;max-width:340px;font-size:12.5px;line-height:1.7;color:var(--dim)}
  #go{appearance:none;border:none;border-radius:3px;background:var(--accent);color:#fff;font-weight:600;
      font-size:12px;letter-spacing:.2em;text-transform:uppercase;padding:15px 32px;cursor:pointer}
  #go:active{transform:translateY(1px)}
  #err{color:var(--rec);font-family:var(--mono);font-size:12px;min-height:1em;max-width:320px;line-height:1.5}
  #fsbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:56;align-items:center;gap:9px;
         padding:12px 13px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.9) 50%)}
  #fsbar .rd{display:none;align-items:center;gap:6px;color:var(--rec);font-family:var(--mono);font-size:11px;flex-shrink:0}
  #fsbar.live .rd{display:flex}
  #fsbar .rd .bulb{width:8px;height:8px;border-radius:50%;background:var(--rec);animation:blink 1s steps(1) infinite}
  #bar{display:flex;flex-direction:column;gap:13px;padding:14px 14px calc(14px + env(safe-area-inset-bottom));
       background:var(--panel);border-top:1px solid var(--line)}
  .dialgrid{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 12px}
  .actionrow{display:flex;align-items:center;gap:9px}
  .lineopt{display:flex;align-items:center;justify-content:center;gap:6px;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  .lineopt .seg{appearance:none;font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.1em;border:1px solid var(--line);border-radius:3px;background:var(--panel);color:var(--dim);padding:6px 12px;cursor:pointer}
  .lineopt .seg.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .dialwrap{display:flex;flex-direction:column;align-items:center;gap:6px;user-select:none;width:62px}
  .dial{width:56px;height:56px;border-radius:50%;position:relative;cursor:ns-resize;touch-action:none;
        background:conic-gradient(from 225deg,var(--ring,var(--accent)) var(--pct,0deg),#000 0 270deg,transparent 0)}
  .dial::after{content:"";position:absolute;inset:4px;border-radius:50%;background:#cfcbc2;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
  .ptr{position:absolute;left:50%;top:50%;z-index:2;width:2px;height:20px;background:#1b1a18;
       transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(var(--ang,0deg))}
  .dialval{position:absolute;inset:0;z-index:2;display:flex;align-items:flex-end;justify-content:center;padding-bottom:9px;
           font-family:var(--mono);font-size:12px;font-weight:600;color:#1b1a18;pointer-events:none}
  .dialwrap label{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:center}
  button.ctl{appearance:none;font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
    border:none;border-radius:3px;background:#cfcbc2;color:#1b1a18;height:46px;cursor:pointer;white-space:nowrap;flex-shrink:0}
  button.ctl:active{transform:translateY(1px)}
  button.ctl:disabled{opacity:.35;cursor:default}
  #flip,#cam,#full,#fsExit,#fsFlip,#fsCam{width:46px;padding:0;font-size:15px;background:#2b2e35;color:#e8e8ea}
  #rec,#fsRec{flex:1;background:var(--accent);color:#fff}
  #rec.live,#fsRec.live{background:var(--rec);color:#fff}
  #cam.off,#fsCam.off{background:#2b2e35;color:var(--accent)}
  body.imgfull #bar,body.imgfull #hud{display:none}
  body.imgfull #stage{position:fixed;inset:0;z-index:50}
  body.imgfull #view{max-width:100vw;max-height:100vh}
  body.imgfull #fsbar{display:flex}
  #toast{position:absolute;left:12px;right:12px;bottom:12px;z-index:30;display:none;padding:11px 13px;border-radius:3px;
         background:rgba(0,0,0,.9);border-left:3px solid var(--accent);color:var(--accent);
         font-family:var(--mono);font-size:12px;line-height:1.5;text-align:center}
  #toast.show{display:block}
  #clips{position:absolute;left:12px;right:12px;bottom:12px;z-index:20;display:flex;flex-direction:column;gap:7px;max-height:30vh;overflow:auto}
  .clip{display:flex;align-items:center;gap:12px;background:rgba(207,203,194,.97);border-radius:3px;padding:9px 12px}
  .clip .meta{font-family:var(--mono);font-size:10.5px;color:#6e6a62;line-height:1.4}
  .clip .meta b{color:#1b1a18}
  .clip a{margin-left:auto;color:#fff;text-decoration:none;border-radius:3px;background:var(--accent);
          padding:7px 13px;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
  .clip a{color:#fff}
  .clip .x{color:#8a857c;cursor:pointer;font-size:16px;padding:2px 4px}
</style>
</head>
<body>

<div id="stage">
  <canvas id="view"></canvas>
  <div id="lcd2"></div>
  <div id="lcd"></div>
  <video id="cam-v" playsinline muted></video>

  <div id="hud">
    <span class="tag">chrom.3</span>
    <span id="fpsread">–– fps</span>
    <span id="rec-dot"><span class="bulb"></span><span id="rectime">0:00</span></span>
    <div id="chan"><i class="r"></i><i class="g"></i><i class="b"></i></div>
  </div>

  <div id="clips"></div>
  <div id="toast"></div>

  <div id="start">
    <div>
      <h1>chrom<span class="d">.</span>3</h1>
      <div class="rgb"><span class="r"></span><span class="g"></span><span class="b"></span></div>
    </div>
    <button id="go">Start camera</button>
    <div id="err"></div>
  </div>
</div>

<div id="fsbar">
  <button id="fsFlip" class="ctl" title="Switch camera">⟲</button>
  <button id="fsCam"  class="ctl" title="Camera on/off">⏻</button>
  <button id="fsExit" class="ctl" title="Exit fullscreen">✕</button>
  <span class="rd"><span class="bulb"></span><span id="fsTime">0:00</span></span>
  <button id="fsRec"  class="ctl">Record</button>
</div>

<div id="bar">
  <div class="dialgrid">
    <div class="dialwrap"><div class="dial" id="fpsDial"><div class="ptr"></div><div class="dialval">55</div></div><label>frame rate</label></div>
    <div class="dialwrap"><div class="dial" id="softDial"><div class="ptr"></div><div class="dialval">100</div></div><label>blend %</label></div>
    <div class="dialwrap"><div class="dial" id="briDial"><div class="ptr"></div><div class="dialval">175</div></div><label>brightness</label></div>
    <div class="dialwrap"><div class="dial" id="conDial"><div class="ptr"></div><div class="dialval">130</div></div><label>contrast</label></div>
    <div class="dialwrap"><div class="dial" id="qtyDial"><div class="ptr"></div><div class="dialval">0</div></div><label>glitch qty</label></div>
    <div class="dialwrap"><div class="dial" id="freqDial"><div class="ptr"></div><div class="dialval">0</div></div><label>glitch freq</label></div>
    <div class="dialwrap"><div class="dial" id="lineDial"><div class="ptr"></div><div class="dialval">0</div></div><label>lines</label></div>
  </div>
  <div class="lineopt">
    <span>line axis</span>
    <button class="seg on" data-o="both">H+V</button>
    <button class="seg" data-o="h">H</button>
    <button class="seg" data-o="v">V</button>
  </div>
  <div class="actionrow">
    <button id="flip" class="ctl" title="Switch camera" disabled>⟲</button>
    <button id="cam"  class="ctl" title="Camera on/off" disabled>⏻</button>
    <button id="full" class="ctl" title="Fullscreen" disabled>⤢</button>
    <button id="rec"  class="ctl" disabled>Record</button>
  </div>
</div>

<script>
(() => {
  const cam   = document.getElementById('cam-v');
  const canvas= document.getElementById('view');
  const ctx   = canvas.getContext('2d', { alpha:false });
  const lcd   = document.getElementById('lcd');
  const lcd2  = document.getElementById('lcd2');
  const stage = document.getElementById('stage');
  const start = document.getElementById('start');
  const goBtn = document.getElementById('go');
  const errEl = document.getElementById('err');
  const recBtn= document.getElementById('rec');
  const flipBtn=document.getElementById('flip');
  const camBtn = document.getElementById('cam');
  const fullBtn= document.getElementById('full');
  const fsExit = document.getElementById('fsExit');
  const fsFlip = document.getElementById('fsFlip');
  const fsCam  = document.getElementById('fsCam');
  const fsRec  = document.getElementById('fsRec');
  const fsBar  = document.getElementById('fsbar');
  const fsTime = document.getElementById('fsTime');
  const fpsRead=document.getElementById('fpsread');
  const chanEl = document.getElementById('chan').querySelectorAll('i');
  const recDot = document.getElementById('rec-dot');
  const recTime= document.getElementById('rectime');
  const clipsEl= document.getElementById('clips');
  const toastEl= document.getElementById('toast');
  let toastT = null;
  function showToast(msg, ms = 4200){
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), ms);
  }

  const buf  = document.createElement('canvas');
  const bctx = buf.getContext('2d', { alpha:false });
  const acc  = document.createElement('canvas');
  const accx = acc.getContext('2d', { alpha:false });

  const FPS_MIN = 5, FPS_MAX = 60;
  const CHANNELS = ['#ff0000','#00ff00','#0000ff'];
  const RING     = ['var(--r)','var(--g)','var(--b)'];
  const GLYPHS = ['█','▓','▒','░','▀','▄','▌','▐','▖','▗','▘','▝','▙','▟','▚','▞','▛','▜',
                  '■','□','▪','▫','─','│','┼','╬','═','║','╱','╲','╳','#','/','\\','|','+','='];

  let targetFps = 55, softness = 100, glitchQty = 0, glitchFreq = 0, brightness = 175, contrast = 130, lineAmt = 0;
  let lineMode = 'both';   // 'both' | 'h' | 'v'
  let facing = 'environment';
  let stream = null, running = false, camOn = false, channel = 0, lastTick = 0;

  const rnd  = Math.random;
  const rint = n => (rnd() * n) | 0;
  const pick = a => a[(rnd() * a.length) | 0];

  /* ---------- persistent settings (dial positions, per app) ---------- */
  const PKEY='mmm.chrom3.settings';
  let PST={}; try{ PST=JSON.parse(localStorage.getItem(PKEY)||'{}')||{}; }catch(e){}
  const PREG=[]; let _pt=0;
  function pflush(){ const o={}; for(const r of PREG) o[r.k]=r.get();
    try{ localStorage.setItem(PKEY, JSON.stringify(o)); }catch(e){} }
  function psave(){ clearTimeout(_pt); _pt=setTimeout(pflush,300); }
  addEventListener('pointerup', psave, true);
  addEventListener('wheel', psave, {passive:true});
  addEventListener('pagehide', pflush);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') pflush(); });

  /* ---------- reusable knob ---------- */
  function makeKnob(dial, min, max, sens, get, set){
    const val = dial.querySelector('.dialval');
    function paint(){
      const t = (get() - min) / (max - min);
      dial.style.setProperty('--ang', (-135 + t*270) + 'deg');
      dial.style.setProperty('--pct', (t*270) + 'deg');
      val.textContent = get();
    }
    const clamp = x => Math.max(min, Math.min(max, Math.round(x)));
    PREG.push({ k: dial.id, get });                        // persistence registry
    { const sv0 = PST[dial.id];                            // restore after init (deferred: side effects safe)
      if (typeof sv0 === 'number' && isFinite(sv0)) setTimeout(() => { set(clamp(sv0)); paint(); }, 0); }
    let sy = 0, sv = 0;
    dial.addEventListener('pointerdown', e => { dial.setPointerCapture(e.pointerId); sy = e.clientY; sv = get(); });
    dial.addEventListener('pointermove', e => {
      if (!dial.hasPointerCapture(e.pointerId)) return;
      set(clamp(sv + (sy - e.clientY) * sens)); paint();
    });
    dial.addEventListener('wheel', e => { e.preventDefault(); set(clamp(get() - Math.sign(e.deltaY))); paint(); }, {passive:false});
    return paint;
  }

  const fpsDial = document.getElementById('fpsDial');
  const paintFps  = makeKnob(fpsDial, FPS_MIN, FPS_MAX, 0.2, () => targetFps, v => { targetFps = v; fpsRead.textContent = v + ' fps'; });
  const paintSoft = makeKnob(document.getElementById('softDial'), 0, 200, 0.8, () => softness,   v => { softness   = v; });
  const paintBri  = makeKnob(document.getElementById('briDial'),  50, 300, 1.0, () => brightness, v => { brightness = v; });
  const paintCon  = makeKnob(document.getElementById('conDial'),  50, 200, 0.6, () => contrast,   v => { contrast   = v; });
  const paintQty  = makeKnob(document.getElementById('qtyDial'),  0, 100, 0.5, () => glitchQty,  v => { glitchQty  = v; });
  const paintFreq = makeKnob(document.getElementById('freqDial'), 0, 50, 0.5, () => glitchFreq, v => { glitchFreq = v; });
  const paintLine = makeKnob(document.getElementById('lineDial'), 0, 15, 0.12, () => lineAmt,    v => { lineAmt    = v; if (v) rebuildLcd(); });
  for (const id of ['softDial','briDial','conDial','qtyDial','freqDial','lineDial'])
    document.getElementById(id).style.setProperty('--ring', '#9a9aa2');
  fpsRead.textContent = targetFps + ' fps';
  paintFps(); paintSoft(); paintBri(); paintCon(); paintQty(); paintFreq(); paintLine();

  const segBtns = document.querySelectorAll('.lineopt .seg');
  segBtns.forEach(b => b.addEventListener('click', () => {
    lineMode = b.dataset.o;
    segBtns.forEach(x => x.classList.toggle('on', x === b));
    rebuildLcd();
  }));

  /* =======================================================================
     CSS LCD-shatter overlay (glitch layer 2)  —  pure-CSS render, driven by
     several independent random clocks nested inside each other so it never
     settles into an obvious loop. Not captured by the canvas recorder.
     ======================================================================= */
  const LINE_DIAL_MAX = 15;
  const LPAL    = ['#ff2a2a','#25e05a','#3a7bff','#00e5ff','#ff2ad4','#ffe23a','#ffffff','#ff8a1e'];
  const BLEEDCOL= ['#ff2ad4','#7a3cff','#00e5ff','#25e05a','#3a7bff','#ff7a1e'];   // crystal discolouration
  let lcdParts = [], lcdPos = [], bleedParts = [];
  const lcdOn = () => lineAmt > 0;
  const f = () => lineAmt / LINE_DIAL_MAX;                     // 0..1 across the (now 0..15) dial
  const nBundles = () => Math.max(1, Math.round(1 + f() * 3)); // 1..4
  const off = () => `${(rnd()*80-40)|0}px ${(rnd()*80-40)|0}px`;

  // one bundle of thin coloured lines at a strict right angle (vert = 90deg column, else 0deg row)
  function genBundle(vert){
    const ang = vert ? 90 : 0;
    const reg = rnd();
    const gap = reg < 0.4 ? 2 + rnd()*4 : reg < 0.75 ? 5 + rnd()*11 : 13 + rnd()*30;   // tight/med/loose
    const segs = 3 + rint(7);
    let stops = [], p = 0;
    for (let i = 0; i < segs; i++){
      const g = gap * (0.4 + rnd()*1.2);
      const w = 1 + (rnd() < 0.8 ? rnd()*2 : rnd()*5);
      stops.push(`transparent ${p.toFixed(1)}px ${(p+g).toFixed(1)}px`); p += g;
      const c = pick(LPAL);
      stops.push(`${c} ${p.toFixed(1)}px ${(p+w).toFixed(1)}px`); p += w;
    }
    stops.push(`transparent ${p.toFixed(1)}px ${(p+gap).toFixed(1)}px`);
    return `repeating-linear-gradient(${ang}deg,${stops.join(',')})`;
  }
  // broad faint colour block (the orange / magenta / white regions), right-angled
  function genBand(vert){
    const a = vert ? 90 : 0, c = pick(LPAL);
    const x = rint(70), w = 8 + rint(46), al = pick(['14','1f','2b']);
    return `linear-gradient(${a}deg,transparent ${x}%,${c}${al} ${x}%,${c}${al} ${x+w}%,transparent ${x+w}%)`;
  }
  // fine faint lines used to weave the cross-axis of the mesh
  function genStreak(vert){
    const a = vert ? 90 : 0, gap = 2 + rnd()*7, w = 1 + rnd()*2;
    return `repeating-linear-gradient(${a}deg,transparent 0 ${gap.toFixed(1)}px,#ffffff14 ${gap.toFixed(1)}px ${(gap+w).toFixed(1)}px)`;
  }
  // crystal-layer discolouration: soft radial blooms — dark "ink" spread + coloured haloes
  function genBleed(){
    const parts = [], nb = 1 + rint(3);
    for (let i = 0; i < nb; i++){
      const px = rint(100), py = rint(100), rx = 14 + rint(46), ry = 14 + rint(46);
      if (rnd() < 0.55)
        parts.push(`radial-gradient(${rx}% ${ry}% at ${px}% ${py}%,rgba(0,0,0,.75) 0%,rgba(0,0,0,.32) 45%,transparent 72%)`);
      else {
        const c = pick(BLEEDCOL);
        parts.push(`radial-gradient(${rx}% ${ry}% at ${px}% ${py}%,${c}66 0%,${c}22 40%,transparent 70%)`);
      }
    }
    return parts;
  }
  function applyLcd(){ lcd.style.backgroundImage = lcdParts.join(','); lcd.style.backgroundPosition = lcdPos.join(','); }
  function rebuildBleed(){ bleedParts = genBleed(); lcd2.style.backgroundImage = bleedParts.join(','); }
  function rebuildLcd(){
    const n = nBundles();
    lcdParts = []; lcdPos = [];
    for (let i = 0; i < n; i++){
      const vert = lineMode === 'v' ? true : lineMode === 'h' ? false : (i % 2 === 0);   // both -> alternate axes
      lcdParts.push(genBundle(vert)); lcdPos.push(off());
    }
    if (lineMode === 'both'){                                   // weave the mesh: both cross-axes present
      lcdParts.push(genStreak(true));  lcdPos.push('0 0');
      lcdParts.push(genStreak(false)); lcdPos.push('0 0');
    } else if (rnd() < 0.4){ lcdParts.push(genStreak(lineMode === 'v')); lcdPos.push('0 0'); }
    if (rnd() < 0.5){ lcdParts.push(genBand(lineMode === 'h' ? false : rnd() < 0.5)); lcdPos.push(off()); }
    lcd.classList.toggle('b', rnd() < 0.4);                     // additive crossings: screen <-> lighten
    applyLcd();
    if (!bleedParts.length || rnd() < 0.5) rebuildBleed();     // blooms drift slowly, not every reshuffle
  }
  function clock(fn, lo, hi){ (function t(){ fn(); setTimeout(t, lo + Math.random()*(hi-lo)); })(); }
  // fast: jitter positions of a random subset -> live shimmer / scan
  clock(() => { if (!lcdOn() || !lcdParts.length) return;
    for (let i = 0; i < lcdPos.length; i++) if (rnd() < 0.5) lcdPos[i] = off();
    applyLcd();
  }, 55, 150);
  // medium: regenerate one bundle -> structural churn
  clock(() => { if (!lcdOn() || !lcdParts.length) return;
    const i = rint(lcdParts.length);
    lcdParts[i] = rnd() < 0.85 ? genBundle(lineMode === 'v' ? true : lineMode === 'h' ? false : rnd() < 0.5)
                               : genBand(rnd() < 0.5);
    applyLcd();
  }, 260, 820);
  // slow / burst: full reshuffle, occasional brief flash
  clock(() => { if (!lcdOn()) return;
    rebuildLcd();
    if (rnd() < 0.12){ lcd.style.opacity = Math.min(0.6, f() * 0.5 + 0.2); }
  }, 1300, 4200);
  // opacity clock: track the dial (restrained), with independent flicker on top
  clock(() => {
    lcd.style.opacity  = lcdOn() ? Math.max(0, Math.min(0.55, f() * 0.5 * (0.8 + rnd()*0.4))) : 0;
    lcd2.style.opacity = lcdOn() ? Math.max(0, Math.min(0.6,  f() * 0.55)) : 0;
  }, 70, 210);

  /* ---------- camera ---------- */
  async function openCamera(){
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{ facingMode:{ ideal:facing }, width:{ideal:1280}, height:{ideal:720}, frameRate:{ideal:60} }
    });
    cam.srcObject = stream;
    await cam.play();
    sizeCanvas();
  }
  function sizeCanvas(){
    const MAX = 1280;
    let vw = cam.videoWidth || 1280, vh = cam.videoHeight || 720;
    const s = Math.min(1, MAX / Math.max(vw, vh));
    const w = Math.round(vw * s), h = Math.round(vh * s);
    canvas.width = buf.width = acc.width = w;
    canvas.height= buf.height= acc.height= h;
  }

  /* ---------- glitch layer 1: inverting character-blocks (canvas; recorded) ----------
     Structural + rhythmic diversity, with randomness layered at several scales:
     per-frame mode, 1-3 cluster centres, size regimes, and run / stack / grid shapes. */
  function drawGlitches(){
    const W = buf.width, H = buf.height, base = Math.max(9, Math.round(W / 48));
    let stamps = 1 + rint(Math.max(1, Math.round(glitchQty / 100 * 30)));
    if (rnd() < 0.12) stamps = Math.round(stamps * (1.5 + rnd()));       // burst
    const scatter = rnd() < 0.35;
    const centres = []; const nc = 1 + rint(3);
    for (let i = 0; i < nc; i++) centres.push([rnd()*W, rnd()*H]);
    bctx.save();
    bctx.globalCompositeOperation = 'difference';
    bctx.fillStyle = '#ffffff';
    bctx.textBaseline = 'top';
    for (let i = 0; i < stamps; i++){
      const rg = rnd();                                                  // size regime
      const sz = rg < 0.6 ? base*(0.5 + rnd()*1.2) : rg < 0.9 ? base*(1.5 + rnd()*2) : base*(3 + rnd()*4);
      bctx.font = sz + 'px monospace';
      bctx.globalAlpha = 0.42 + rnd()*0.46;
      let x, y;
      if (scatter){ x = rnd()*W; y = rnd()*H; }
      else { const c = centres[rint(centres.length)], spr = 0.05 + rnd()*0.32; x = c[0] + (rnd()-0.5)*W*spr; y = c[1] + (rnd()-0.5)*H*spr; }
      const shape = rnd();
      if (shape < 0.58){                                                 // horizontal run 2..7
        const len = 2 + rint(6); let s = '';
        for (let k = 0; k < len; k++) s += GLYPHS[rint(GLYPHS.length)];
        bctx.fillText(s, clamp(x, W - sz*len*0.6), clamp(y, H - sz));
      } else if (shape < 0.82){                                          // vertical stack
        const len = 2 + rint(5);
        for (let k = 0; k < len; k++) bctx.fillText(GLYPHS[rint(GLYPHS.length)], clamp(x, W - sz), clamp(y + k*sz*0.95, H - sz));
      } else {                                                           // block grid
        const cols = 2 + rint(4), rows = 2 + rint(3);
        for (let r = 0; r < rows; r++){ let s = '';
          for (let c = 0; c < cols; c++) s += GLYPHS[rint(GLYPHS.length)];
          bctx.fillText(s, clamp(x, W - sz*cols*0.6), clamp(y + r*sz*0.95, H - sz));
        }
      }
    }
    bctx.restore();
  }
  const clamp = (v, hi) => Math.max(0, Math.min(hi, v));

  /* ---------- render loop ---------- */
  function loop(now){
    if (!running) return;
    requestAnimationFrame(loop);
    const interval = 1000 / targetFps;
    if (now - lastTick < interval) return;
    lastTick = now - ((now - lastTick) % interval);

    bctx.globalCompositeOperation = 'source-over';
    bctx.globalAlpha = 1;
    bctx.drawImage(cam, 0, 0, buf.width, buf.height);
    bctx.globalCompositeOperation = 'multiply';
    bctx.fillStyle = CHANNELS[channel];
    bctx.fillRect(0, 0, buf.width, buf.height);
    bctx.globalCompositeOperation = 'source-over';

    // rhythmic modulation: dial × nested oscillation, plus rare spontaneous bursts
    const t = now * 0.001;
    const wave = 0.5 + 0.5 * Math.sin(t*0.7 + Math.sin(t*0.13)*2.2);
    let p = (glitchFreq / 100) * (0.35 + 0.9*wave);
    if (rnd() < 0.03) p = 1;
    if (glitchFreq > 0 && glitchQty > 0 && rnd() < p) drawGlitches();

    // 0..100 unchanged (1.0 -> 0.08); 100..200 extends toward full persistence
    accx.globalAlpha = Math.max(0.006, softness <= 100 ? 1 - (softness/100)*0.92 : 0.08*(1 - (softness-100)/100));
    accx.drawImage(buf, 0, 0, acc.width, acc.height);
    accx.globalAlpha = 1;

    ctx.filter = `brightness(${brightness/100}) contrast(${contrast/100})`;
    ctx.drawImage(acc, 0, 0, canvas.width, canvas.height);
    ctx.filter = 'none';

    chanEl.forEach((el,i) => el.classList.toggle('on', i === channel));
    fpsDial.style.setProperty('--ring', RING[channel]);
    channel = (channel + 1) % 3;
  }

  /* ---------- recording ---------- */
  let recorder = null, chunks = [], recStart = 0, recTimer = null, recMime = '';
  function pickMime(){
    const c = ['video/mp4;codecs=h264','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
    for (const m of c) if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
    return '';
  }
  function startRec(){
    if (!window.MediaRecorder || !canvas.captureStream){
      showToast("This browser can't record video. Use your phone's screen recorder — it also captures the shatter lines."); return;
    }
    let out;
    try { out = canvas.captureStream(); }
    catch(e){ showToast("Recording isn't available in this browser — try your phone's screen recorder."); return; }
    recMime = pickMime();
    chunks = [];
    const opts = recMime ? { mimeType: recMime, videoBitsPerSecond: 12000000 } : { videoBitsPerSecond: 12000000 };
    try { recorder = new MediaRecorder(out, opts); }
    catch(e){
      try { recorder = new MediaRecorder(out); }                 // retry with no options
      catch(e2){ showToast("This browser can't encode video. Use your phone's screen recorder instead."); return; }
    }
    recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = finalizeRec;
    try { recorder.start(); }
    catch(e){ showToast("Couldn't start the recording."); return; }
    recStart = Date.now();
    recBtn.classList.add('live'); recBtn.textContent = 'Stop';
    fsRec.classList.add('live');  fsRec.textContent  = 'Stop';
    recDot.classList.add('live'); fsBar.classList.add('live');
    recTimer = setInterval(() => {
      const s = Math.floor((Date.now()-recStart)/1000);
      recTime.textContent = fsTime.textContent = Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
    }, 500);
  }
  function stopRec(){
    if (recorder && recorder.state !== 'inactive') recorder.stop();
    clearInterval(recTimer);
    recBtn.classList.remove('live'); recBtn.textContent = 'Record';
    fsRec.classList.remove('live');  fsRec.textContent  = 'Record';
    recDot.classList.remove('live'); fsBar.classList.remove('live');
    recTime.textContent = fsTime.textContent = '0:00';
  }
  function finalizeRec(){
    const mt   = (recorder && recorder.mimeType) || recMime || 'video/webm';
    const type = mt.split(';')[0];
    const ext  = type.includes('mp4') ? 'mp4' : 'webm';
    const blob = new Blob(chunks, { type });
    if (!blob.size){ showToast("Nothing was captured — recording may be blocked here. Try your screen recorder."); return; }
    const url  = URL.createObjectURL(blob);
    const d = new Date(), p = n => String(n).padStart(2,'0');
    // yymmdd-hhmmss — sorts chronologically by plain filename order
    const stamp = p(d.getFullYear()%100)+p(d.getMonth()+1)+p(d.getDate())
                + '-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());
    const name = `chrom3_${stamp}.${ext}`;
    const mb = (blob.size/1048576).toFixed(1);
    const row = document.createElement('div');
    row.className = 'clip';
    row.innerHTML = `<div class="meta"><b>${name}</b><br>${mb} MB · ${targetFps} fps · blend ${softness}% · glitch ${glitchQty}/${glitchFreq} · lines ${lineAmt}${lineAmt ? ' '+lineMode.toUpperCase() : ''}(css) · B${brightness}/C${contrast}</div>
                     <a download="${name}" href="${url}">Save</a>
                     <span class="x" title="Discard">✕</span>`;
    row.querySelector('.x').onclick = () => { URL.revokeObjectURL(url); row.remove(); };
    clipsEl.prepend(row);
  }
  recBtn.addEventListener('click', () => {
    if (recorder && recorder.state === 'recording') stopRec(); else startRec();
  });
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && camOn){ e.preventDefault(); recBtn.click(); }
  });

  /* ---------- camera on/off ---------- */
  async function setCam(on){
    if (on){
      try { await openCamera(); } catch(err){ flashErr('Could not start camera.'); return; }
      camOn = true; running = true;
      camBtn.classList.remove('off'); fsCam.classList.remove('off');
      lastTick = performance.now();
      requestAnimationFrame(loop);
    } else {
      camOn = false; running = false;
      if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
      camBtn.classList.add('off'); fsCam.classList.add('off');
      ctx.filter = 'none'; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
  }
  camBtn.addEventListener('click', () => setCam(!camOn));
  flipBtn.addEventListener('click', async () => {
    if (!camOn) return;
    facing = facing === 'environment' ? 'user' : 'environment';
    try { await openCamera(); } catch(err){ flashErr('Could not switch camera.'); }
  });

  /* ---------- fullscreen image ---------- */
  // Fullscreen the document root, not #stage: the control overlays are body
  // children, and native fullscreen only paints the fullscreened element's subtree.
  function enterFull(){
    document.body.classList.add('imgfull');
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});
  }
  function exitFullscreen(){
    document.body.classList.remove('imgfull');
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});
  }
  fullBtn.addEventListener('click', () => document.body.classList.contains('imgfull') ? exitFullscreen() : enterFull());
  fsExit.addEventListener('click', exitFullscreen);
  fsRec.addEventListener('click', () => recBtn.click());
  fsCam.addEventListener('click', () => camBtn.click());
  fsFlip.addEventListener('click', () => flipBtn.click());
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) document.body.classList.remove('imgfull'); });

  /* ---------- start ---------- */
  function flashErr(m){ errEl.textContent = m; }
  goBtn.addEventListener('click', async () => {
    goBtn.disabled = true; flashErr('');
    try {
      await openCamera();
      camOn = true; running = true;
      recBtn.disabled = flipBtn.disabled = camBtn.disabled = fullBtn.disabled = false;
      start.style.display = 'none';
      lastTick = performance.now();
      requestAnimationFrame(loop);
    } catch(err){
      goBtn.disabled = false;
      flashErr(err && err.name === 'NotAllowedError'
        ? 'Camera permission denied. Allow access and try again.'
        : 'No camera available, or access blocked. Open over https:// or from the device.');
    }
  });
  window.addEventListener('resize', () => { if (running) sizeCanvas(); });
})();
</script>
</body>
</html>
