<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>trk.4</title>
<style>
  /* ---- SKIN CONTRACT: a reskin only needs to redefine these vars + restyle the
     selectors below. JS never sets layout/colour — it only writes --ang/--pct/--ring
     on .dial and toggles classes (.live .off .on .imgfull .show). ---- */
  :root{
    --bg:#080806; --panel:#12100a; --line:#2e2a1c; --ink:#e8e4d8; --dim:#6f6a58;
    --accent:#ffb000; --led:#ffb000;
    --r:#ff2a2a; --g:#25e05a; --b:#3a7bff;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;overscroll-behavior:none}
  body{display:flex;flex-direction:column}
  #stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
  #view{max-width:100%;max-height:100%;display:block;background:#000}
  video{display:none}
  /* optional CSS-layer overlays for display-only effects (blend-mode/gradients). NOT recorded. */
  #lcd2{position:absolute;inset:0;pointer-events:none;mix-blend-mode:normal;opacity:0;z-index:4;background-repeat:no-repeat}
  #lcd{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:0;z-index:5;background-repeat:repeat}
  #hud{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;gap:13px;padding:9px 13px;
       font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--led);
       text-shadow:0 0 6px rgba(255,176,0,.45);pointer-events:none;user-select:none;background:linear-gradient(rgba(0,0,0,.6),transparent)}
  #styleread{color:var(--led)}
  #trkcount{margin-left:auto;color:#00ffcc;text-shadow:0 0 6px rgba(0,255,204,.5)}
  #trkcount.load{color:var(--accent);text-shadow:0 0 6px rgba(255,176,0,.5);animation:blink 1s steps(1) infinite}
  #chan{display:none;gap:6px;margin-left:auto}
  #chan i{width:7px;height:7px;border-radius:50%;background:#222}
  #chan i.r.on{background:var(--r)}#chan i.g.on{background:var(--g)}#chan i.b.on{background:var(--b)}
  #rec-dot{display:none;align-items:center;gap:7px;color:var(--accent)}
  #rec-dot.live{display:flex}
  #rec-dot .bulb{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:.12}}
  #start{position:absolute;inset:0;z-index:40;background:radial-gradient(120% 90% at 50% 40%,#17171b,#000 70%);
         display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;padding:24px}
  #start h1{margin:0;font-family:var(--mono);font-size:32px;letter-spacing:.04em;font-weight:500}
  #start p{margin:0;max-width:340px;font-size:12.5px;line-height:1.7;color:var(--dim)}
  #go{appearance:none;border:none;border-radius:3px;background:var(--accent);color:#150800;font-weight:600;
      font-size:12px;letter-spacing:.2em;text-transform:uppercase;padding:15px 32px;cursor:pointer}
  #go:active{transform:translateY(1px)}
  #err{color:var(--accent);font-family:var(--mono);font-size:12px;min-height:1em;max-width:320px;line-height:1.5}
  #fsbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:56;align-items:center;gap:9px;
         padding:12px 13px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.9) 50%)}
  #fsbar .rd{display:none;align-items:center;gap:6px;color:var(--accent);font-family:var(--mono);font-size:11px;flex-shrink:0}
  #fsbar.live .rd{display:flex}
  #fsbar .rd .bulb{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:blink 1s steps(1) infinite}
  #bar{display:flex;flex-direction:column;gap:13px;padding:14px 14px calc(14px + env(safe-area-inset-bottom));
       background:var(--panel);border-top:1px solid var(--line)}
  .dialgrid{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 12px}
  .actionrow{display:flex;align-items:center;gap:9px}
  .dialwrap{display:flex;flex-direction:column;align-items:center;gap:6px;user-select:none;width:62px}
  .dial{width:56px;height:56px;border-radius:50%;position:relative;cursor:ns-resize;touch-action:none;
        background:conic-gradient(from 225deg,var(--ring,var(--accent)) var(--pct,0deg),#000 0 270deg,transparent 0)}
  .dial::after{content:"";position:absolute;inset:4px;border-radius:50%;background:#cfcbc2;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
  .ptr{position:absolute;left:50%;top:50%;z-index:2;width:2px;height:20px;background:#1b1a18;
       transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(var(--ang,0deg))}
  .dialval{position:absolute;inset:0;z-index:2;display:flex;align-items:flex-end;justify-content:center;padding-bottom:9px;
           font-family:var(--mono);font-size:12px;font-weight:600;color:#1b1a18;pointer-events:none}
  .dialwrap label{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:center}
  button.ctl{appearance:none;font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
    border:none;border-radius:3px;background:#cfcbc2;color:#1b1a18;height:46px;cursor:pointer;white-space:nowrap;flex-shrink:0}
  button.ctl:active{transform:translateY(1px)}
  button.ctl:disabled{opacity:.35;cursor:default}
  #flip,#cam,#full,#fsExit,#fsFlip,#fsCam{width:46px;padding:0;font-size:15px;background:#33323a;color:#e8e8ea}
  #rec,#fsRec{flex:1;background:var(--accent);color:#150800}
  #rec.live,#fsRec.live{background:#ff2a2a;color:#fff}
  #cam.off,#fsCam.off{background:#33323a;color:var(--accent)}
  body.imgfull #bar,body.imgfull #hud{display:none}
  body.imgfull #stage{position:fixed;inset:0;z-index:50}
  body.imgfull #view{max-width:100vw;max-height:100vh}
  body.imgfull #fsbar{display:flex}
  #toast{position:absolute;left:12px;right:12px;bottom:12px;z-index:30;display:none;padding:11px 13px;border-radius:3px;
         background:rgba(0,0,0,.9);border-left:3px solid var(--accent);color:var(--accent);
         font-family:var(--mono);font-size:12px;line-height:1.5;text-align:center}
  #toast.show{display:block}
  #clips{position:absolute;left:12px;right:12px;bottom:12px;z-index:20;display:flex;flex-direction:column;gap:7px;max-height:30vh;overflow:auto}
  .clip{display:flex;align-items:center;gap:12px;background:rgba(207,203,194,.97);border-radius:3px;padding:9px 12px}
  .clip .meta{font-family:var(--mono);font-size:10.5px;color:#6e6a62;line-height:1.4}
  .clip .meta b{color:#1b1a18}
  .clip a{margin-left:auto;color:#fff;text-decoration:none;border-radius:3px;background:var(--accent);
          padding:7px 13px;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
  .clip .x{color:#8a857c;cursor:pointer;font-size:16px;padding:2px 4px}
</style>
<!-- ML deps (CDN) — NOT self-contained: needs network to load the detector.
     defer = non-blocking, so the app paints immediately and shows a loading state. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script defer src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.10.0/dist/tf-core.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-cpu@4.10.0/dist/tf-backend-cpu.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.10.0/dist/tf-backend-webgl.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgpu@4.10.0/dist/tf-backend-webgpu.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.10.0/dist/tf-converter.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
</head>
<body>
<div id="stage">
  <canvas id="view"></canvas>
  <div id="lcd2"></div>
  <div id="lcd"></div>
  <video id="cam-v" playsinline muted></video>
  <div id="hud">
    <span class="tag">trk.4</span>
    <span id="fpsread">–– fps</span>
    <span id="styleread">H+A</span>
    <span id="rec-dot"><span class="bulb"></span><span id="rectime">0:00</span></span>
    <span id="trkcount">0 ▸</span>
    <div id="chan"><i class="r"></i><i class="g"></i><i class="b"></i></div>
  </div>
  <div id="clips"></div>
  <div id="toast"></div>
  <div id="start">
    <h1>trk<span style="color:var(--dim)">.</span>4</h1>
    <p>Live object tracker. On-device COCO-SSD draws boxes over people, animals and vehicles. Pick a target set and record silent clips. First load fetches the model — needs a network connection.</p>
    <button id="go">Start camera</button>
    <div id="err"></div>
  </div>
</div>
<div id="fsbar">
  <button id="fsExit" class="ctl">✕</button>
  <button id="fsFlip" class="ctl">⟲</button>
  <button id="fsCam"  class="ctl">⏻</button>
  <span class="rd"><span class="bulb"></span><span id="fsTime">0:00</span></span>
  <button id="fsRec"  class="ctl">Record</button>
</div>
<div id="bar">
  <div class="dialgrid" id="dials"></div>   <!-- dials injected from CONTROLS below -->
  <div class="actionrow">
    <button id="flip" class="ctl" disabled>⟲</button>
    <button id="cam"  class="ctl" disabled>⏻</button>
    <button id="full" class="ctl" disabled>⤢</button>
    <button id="rec"  class="ctl" disabled>Record</button>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cam=$('cam-v'), canvas=$('view'), ctx=canvas.getContext('2d',{alpha:false});
  const start=$('start'), goBtn=$('go'), errEl=$('err'), toastEl=$('toast');
  const recBtn=$('rec'), flipBtn=$('flip'), camBtn=$('cam'), fullBtn=$('full');
  const fsRec=$('fsRec'), fsCam=$('fsCam'), fsFlip=$('fsFlip'), fsExit=$('fsExit'), fsBar=$('fsbar'), fsTime=$('fsTime');
  const fpsRead=$('fpsread'), chanEl=$('chan').querySelectorAll('i'), recDot=$('rec-dot'), recTime=$('rectime'), clipsEl=$('clips');
  const buf=document.createElement('canvas'), bctx=buf.getContext('2d',{alpha:false});   // processed frame
  const acc=document.createElement('canvas'), accx=acc.getContext('2d',{alpha:false});   // blend accumulator
  const rnd=Math.random, rint=n=>(rnd()*n)|0;

  // ---- STATE: shell dials are standard tone/timing; effect dials get appended ----
  const S = { fps:55, blend:0, bright:100, contrast:100, target:2, conf:40, line:3 };   // shell + effect params

  // ================= CONTROLS: declare every dial once, here =================
  // {key, label, min, max, sens}  — key indexes into S. Shell + effect dials share this list.
  const CONTROLS = [
    { key:'fps',      label:'frame rate', min:5,  max:60,  sens:0.2 },
    { key:'blend',    label:'blend %',    min:0,  max:200, sens:0.8 },
    { key:'target',   label:'target',     min:0,  max:3,   sens:0.03, hud:'styleread', fmt:v=>FX.TARGETS[v] },
    { key:'conf',     label:'confidence', min:20, max:90,  sens:0.3,  fmt:v=>v+'%' },
    { key:'line',     label:'box',        min:1,  max:8,   sens:0.05 },
    { key:'bright',   label:'brightness', min:50, max:300, sens:1.0 },
    { key:'contrast', label:'contrast',   min:50, max:200, sens:0.6 },
  ];

  // ================= EFFECT: the one thing you rewrite per app =================
  // Draw the processed frame into the buffer (bctx / w×h). `t` is ms. Read S.<key> for dials.
  // Runs every tick BEFORE blend + tone-post. Example: sequential RGB channel isolation.
  // Object tracker (COCO-SSD via TFJS, loaded from CDN). 2D overlay — no shader.
  // Inference runs in its own async loop; render filters the latest predictions by the
  // live dial values, so changing target/confidence updates instantly.
  const BOX='#00ffcc';
  const TARGETS=['HUM','ANI','H+A','VEH'];
  const DICT={
    HUM:['person'],
    ANI:['dog','cat','bird','horse','sheep','cow','bear','elephant','zebra','giraffe'],
    VEH:['bicycle','car','motorcycle','airplane','bus','train','truck','boat'],
  };
  DICT['H+A']=[...DICT.HUM,...DICT.ANI];
  const trkCount=$('trkcount');

  const FX = {
    name:'trk.4',
    TARGETS,
    targetName(){ return TARGETS[S.target]||'H+A'; },
    model:null, loading:false, failed:false, inferRunning:false, preds:[], libWait:0, backend:'', _lt:0, _fps:0,
    _load(){
      FX.loading=true;
      setDet('◌ loading model', true);
      toast('Loading detector — the first run downloads the model (a few MB).', 6000);
      (async()=>{
        try{
          let backend='';
          for(const b of ['webgl','webgpu']){                  // webgl first: reliable + fast readback for coco-ssd
            try{ await tf.setBackend(b); await tf.ready(); backend=tf.getBackend(); if(backend===b) break; }catch(e){}
          }
          if(!backend){ try{ await tf.ready(); backend=tf.getBackend(); }catch(e){} }   // may end up 'cpu'
          FX.backend=backend||'?';
          FX.model=await cocoSsd.load({ base:'lite_mobilenet_v2' });
          setDet('▸ '+FX.backend, false);
          toast(FX.backend==='cpu' ? 'Running on CPU — no GPU access, detection will be slow.'
                                   : 'Tracker ready on '+FX.backend.toUpperCase()+'.', 5000);
        }catch(err){ FX.failed=true; setDet('no model', false); console.error(err);
          toast('Detector unavailable — camera runs without boxes.'); }
        finally{ FX.loading=false; }
      })();
    },
    _infer(){
      FX.inferRunning=true;
      const dc=document.createElement('canvas'), dcx=dc.getContext('2d');   // downscaled detect source
      (async()=>{
        while(camOn && FX.model){
          const t0=performance.now();
          if(cam.videoWidth>0 && cam.readyState>=2){
            const s=Math.min(1, 640/Math.max(cam.videoWidth,cam.videoHeight));
            const dw=Math.round(cam.videoWidth*s), dh=Math.round(cam.videoHeight*s);
            if(dc.width!==dw||dc.height!==dh){ dc.width=dw; dc.height=dh; }
            dcx.drawImage(cam,0,0,dw,dh);
            try{
              const raw=await FX.model.detect(dc, 20, 0.2), inv=1/s;   // rescale bboxes back to native px
              FX.preds=raw.map(p=>({ class:p.class, score:p.score,
                bbox:[p.bbox[0]*inv, p.bbox[1]*inv, p.bbox[2]*inv, p.bbox[3]*inv] }));
            }catch(e){ /* drop a frame */ }
          }
          // Throttle: guarantee idle GPU time between detections so the camera render stays smooth.
          // Detection runs ~5–9 Hz; the video keeps its full frame rate.
          await new Promise(r=>setTimeout(r, Math.max(80, 120-(performance.now()-t0))));
        }
        FX.inferRunning=false; FX.preds=[];
      })();
    },
    frame(bctx, w, h, t){
      bctx.drawImage(cam,0,0,w,h);
      if(FX.model && !FX.inferRunning) FX._infer();

      const allow=DICT[FX.targetName()], minScore=S.conf/100;
      const sx=w/(cam.videoWidth||w), sy=h/(cam.videoHeight||h);
      bctx.lineWidth=S.line; bctx.strokeStyle=BOX;
      bctx.font='bold 14px ui-monospace,monospace'; bctx.textBaseline='alphabetic';
      let n=0;
      for(const p of FX.preds){
        if(p.score<minScore || allow.indexOf(p.class)<0) continue;
        n++;
        const x=p.bbox[0]*sx, y=p.bbox[1]*sy, bw=p.bbox[2]*sx, bh=p.bbox[3]*sy;
        bctx.strokeRect(x,y,bw,bh);
        const tag=`${p.class.toUpperCase()} ${Math.round(p.score*100)}%`;
        const tw=bctx.measureText(tag).width+12, th=22, ty=y>th?y-th:y;
        bctx.fillStyle=BOX; bctx.fillRect(x,ty,tw,th);
        bctx.fillStyle='#000'; bctx.fillText(tag, x+6, ty+15);
        bctx.fillStyle=BOX;
      }
      if(FX.model) setDet(n+' ▸', false);
      // measured render fps — the honest achieved rate (the dial still sets the target/cap)
      if(FX._lt){ const dt=t-FX._lt; if(dt>0) FX._fps = FX._fps ? FX._fps*0.9+(1000/dt)*0.1 : 1000/dt; }
      FX._lt=t;
      if(fpsRead) fpsRead.textContent=Math.round(FX._fps||0)+' fps';
    },
  };

  // ---- detector status: HUD #trkcount (always) + start-screen line (before camera) ----
  function setDet(text, loading){
    if(trkCount){ trkCount.textContent=text; trkCount.classList.toggle('load', !!loading); }
    if(errEl && start && start.style.display!=='none') errEl.textContent = (loading||FX.failed) ? text : '';
  }
  // Preload the model the moment the deferred CDN libs land — overlaps the start screen so
  // it isn't a dead wait after the camera opens. This poller runs before those libs arrive.
  (function waitForLibs(){
    if(FX.model||FX.loading||FX.failed) return;
    if(window.cocoSsd && window.tf){ FX._load(); return; }
    FX.libWait+=200;
    if(FX.libWait>25000){ FX.failed=true; setDet('no model (offline?)', false);
      toast('Detector libraries did not load — check your connection.'); return; }
    setDet('◌ loading libraries', true);
    setTimeout(waitForLibs, 200);
  })();
  // ===========================================================================

  // ---- knob factory: pointer-drag + wheel; drives --ang/--pct; writes S[key] ----
  function makeKnob(dial, c){
    const val=dial.querySelector('.dialval');
    const show=v=> c.fmt ? c.fmt(v) : v;
    const paint=()=>{ const v=S[c.key], t=(v-c.min)/(c.max-c.min);
      dial.style.setProperty('--ang',(-135+t*270)+'deg'); dial.style.setProperty('--pct',(t*270)+'deg'); val.textContent=show(v);
      if(c.key==='fps') fpsRead.textContent=v+' fps';
      if(c.hud){ const h=$(c.hud); if(h) h.textContent=show(v); } };
    const clamp=x=>Math.max(c.min,Math.min(c.max,Math.round(x)));
    let sy=0,sv=0;
    dial.addEventListener('pointerdown',e=>{dial.setPointerCapture(e.pointerId);sy=e.clientY;sv=S[c.key];});
    dial.addEventListener('pointermove',e=>{ if(!dial.hasPointerCapture(e.pointerId))return; S[c.key]=clamp(sv+(sy-e.clientY)*c.sens); paint(); });
    dial.addEventListener('wheel',e=>{e.preventDefault();S[c.key]=clamp(S[c.key]-Math.sign(e.deltaY));paint();},{passive:false});
    paint();
  }
  // build the dial DOM from CONTROLS
  const dialsWrap=$('dials');
  for(const c of CONTROLS){
    const w=document.createElement('div'); w.className='dialwrap';
    w.innerHTML=`<div class="dial"><div class="ptr"></div><div class="dialval">0</div></div><label>${c.label}</label>`;
    dialsWrap.appendChild(w); makeKnob(w.querySelector('.dial'), c);
  }

  // ---- camera ----
  let facing='environment', stream=null, running=false, camOn=false, lastTick=0;
  async function openCamera(){
    if(stream) stream.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({audio:false,
      video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:60}}});
    cam.srcObject=stream; await cam.play(); sizeCanvas();
  }
  function sizeCanvas(){
    const MAX=1280; let vw=cam.videoWidth||1280, vh=cam.videoHeight||720;
    const s=Math.min(1,MAX/Math.max(vw,vh)), w=Math.round(vw*s), h=Math.round(vh*s);
    canvas.width=buf.width=acc.width=w; canvas.height=buf.height=acc.height=h;
  }

  // ---- render loop: cam -> FX.frame(buf) -> blend(acc) -> tone-post -> canvas ----
  function loop(now){
    if(!running) return; requestAnimationFrame(loop);
    const interval=1000/S.fps; if(now-lastTick<interval) return;
    lastTick=now-((now-lastTick)%interval);
    FX.frame(bctx, buf.width, buf.height, now);                       // your effect
    // temporal blend (persistence). 0..100 = 1.0..0.08 ; 100..200 -> near-freeze
    accx.globalAlpha=Math.max(0.006, S.blend<=100 ? 1-(S.blend/100)*0.92 : 0.08*(1-(S.blend-100)/100));
    accx.drawImage(buf,0,0,acc.width,acc.height); accx.globalAlpha=1;
    ctx.filter=`brightness(${S.bright/100}) contrast(${S.contrast/100})`;   // tone post (recorded)
    ctx.drawImage(acc,0,0,canvas.width,canvas.height); ctx.filter='none';
  }

  // ---- recording: robust, with visible failure ----
  let recorder=null, chunks=[], recStart=0, recTimer=null, recMime='';
  function pickMime(){ for(const m of ['video/mp4;codecs=h264','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'])
      if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m)) return m; return ''; }
  function toast(m,ms=4200){ toastEl.textContent=m; toastEl.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>toastEl.classList.remove('show'),ms); }
  function startRec(){
    if(!window.MediaRecorder||!canvas.captureStream){ toast("This browser can't record. Use your phone's screen recorder."); return; }
    let out; try{ out=canvas.captureStream(); }catch(e){ toast("Recording unavailable — try your screen recorder."); return; }
    recMime=pickMime(); chunks=[];
    const opts=recMime?{mimeType:recMime,videoBitsPerSecond:12000000}:{videoBitsPerSecond:12000000};
    try{ recorder=new MediaRecorder(out,opts); }catch(e){ try{ recorder=new MediaRecorder(out); }catch(e2){ toast("Can't encode video here — use your screen recorder."); return; } }
    recorder.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
    recorder.onstop=finalizeRec;
    try{ recorder.start(); }catch(e){ toast("Couldn't start recording."); return; }
    recStart=Date.now(); recBtn.classList.add('live'); recBtn.textContent='Stop';
    fsRec.classList.add('live'); fsRec.textContent='Stop'; recDot.classList.add('live'); fsBar.classList.add('live');
    recTimer=setInterval(()=>{ const s=Math.floor((Date.now()-recStart)/1000);
      recTime.textContent=fsTime.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); },500);
  }
  function stopRec(){ if(recorder&&recorder.state!=='inactive') recorder.stop(); clearInterval(recTimer);
    recBtn.classList.remove('live'); recBtn.textContent='Record'; fsRec.classList.remove('live'); fsRec.textContent='Record';
    recDot.classList.remove('live'); fsBar.classList.remove('live'); recTime.textContent=fsTime.textContent='0:00'; }
  function finalizeRec(){
    const mt=(recorder&&recorder.mimeType)||recMime||'video/webm', type=mt.split(';')[0], ext=type.includes('mp4')?'mp4':'webm';
    const blob=new Blob(chunks,{type}); if(!blob.size){ toast("Nothing captured — try your screen recorder."); return; }
    const url=URL.createObjectURL(blob), d=new Date(), p=n=>String(n).padStart(2,'0');
    const stamp=p(d.getFullYear()%100)+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());
    const name=`${FX.name.replace(/\W+/g,'')}_${stamp}.${ext}`, mb=(blob.size/1048576).toFixed(1);
    const row=document.createElement('div'); row.className='clip';
    row.innerHTML=`<div class="meta"><b>${name}</b><br>${mb} MB · ${S.fps} fps · ${FX.targetName()} · conf ${S.conf}% · blend ${S.blend}</div>
      <a download="${name}" href="${url}">Save</a><span class="x">✕</span>`;
    row.querySelector('.x').onclick=()=>{ URL.revokeObjectURL(url); row.remove(); };
    clipsEl.prepend(row);
  }
  recBtn.addEventListener('click',()=>{ recorder&&recorder.state==='recording'?stopRec():startRec(); });
  document.addEventListener('keydown',e=>{ if(e.code==='Space'&&camOn){ e.preventDefault(); recBtn.click(); } });

  // ---- camera on/off, flip, fullscreen ----
  async function setCam(on){
    if(on){ try{ await openCamera(); }catch(e){ toast('Could not start camera.'); return; }
      camOn=true; running=true; camBtn.classList.remove('off'); fsCam.classList.remove('off'); lastTick=performance.now(); requestAnimationFrame(loop); }
    else{ camOn=false; running=false; if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
      camBtn.classList.add('off'); fsCam.classList.add('off'); ctx.filter='none'; ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height); }
  }
  camBtn.addEventListener('click',()=>setCam(!camOn));
  fsCam.addEventListener('click',()=>camBtn.click());
  const doFlip=async()=>{ if(!camOn)return; facing=facing==='environment'?'user':'environment'; try{ await openCamera(); }catch(e){ toast('Could not switch camera.'); } };
  flipBtn.addEventListener('click',doFlip); fsFlip.addEventListener('click',doFlip);
  // Fullscreen the ROOT (not #stage) so the overlay controls render in native fullscreen.
  const enterFull=()=>{ document.body.classList.add('imgfull'); if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{}); };
  const exitFull=()=>{ document.body.classList.remove('imgfull'); if(document.fullscreenElement&&document.exitFullscreen) document.exitFullscreen().catch(()=>{}); };
  fullBtn.addEventListener('click',()=>document.body.classList.contains('imgfull')?exitFull():enterFull());
  fsExit.addEventListener('click',exitFull);
  document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement) document.body.classList.remove('imgfull'); });

  // ---- start (gesture required; app is silent/passive until tapped) ----
  goBtn.addEventListener('click',async()=>{
    goBtn.disabled=true; errEl.textContent='';
    try{ await openCamera(); camOn=true; running=true;
      recBtn.disabled=flipBtn.disabled=camBtn.disabled=fullBtn.disabled=false;
      start.style.display='none'; lastTick=performance.now(); requestAnimationFrame(loop);
    }catch(e){ goBtn.disabled=false; errEl.textContent = e&&e.name==='NotAllowedError'
      ? 'Camera permission denied.' : 'No camera, or blocked. Open over https:// on the device.'; }
  });
  window.addEventListener('resize',()=>{ if(running) sizeCanvas(); });
})();
</script>
</body>
