<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FFFFFF">
<title>FOCUS</title>
<style>
:root{
  /* Gehäuse und Panels: Tiefe entsteht aus Helligkeitsdifferenz, nicht aus Schatten */
  --chassis:#EBEDF0;      /* Gerätegehäuse — Seitengrund */
  --panel:#FFFFFF;        /* aufgesetzte Flächen */
  --panel-2:#F5F6F8;      /* zurückgesetzte Flächen, Druckzustand */
  --line:#DCDFE5;         /* Haarlinie */
  --line-2:#C6CAD3;       /* betonte Kante */
  --ink:#15171C;          /* 16.1:1 auf Panel */
  --ink-2:#585F6E;        /* 6.4:1 */
  --ink-3:#868D9C;        /* 3.4:1 — nur ab 15px oder für Icons */
  /* Signalfarben: tragen Bedeutung, sind keine Dekoration. Alle ≥4.5:1 auf Weiß */
  --sig-red:#CC2418;      /* dringend + wichtig */
  --sig-amber:#9A5400;    /* dringend + unwichtig */
  --sig-blue:#0F52BF;     /* nicht dringend + wichtig */
  --sig-grey:#697083;     /* nicht dringend + unwichtig */
  --accent:#5533CC;       /* Primäraktion — Violett bleibt die Identität */
  --accent-soft:#EEEAFB;
  --ok:#0C7A45;
  --r-panel:12px; --r-card:8px; --r-chip:5px;
  --nav-h:62px; --top-h:54px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
/* Ohne das startet langes Druecken auf einer Karte die Textauswahl,
   der Browser feuert touchcancel und das Ziehen bricht ab. */
body,.task-card,.today-card,.q-tasks,.quadrant{
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
html,body{height:100%;background:var(--chassis);color:var(--ink);
  font-family:-apple-system,'SF Pro Text','Segoe UI','Helvetica Neue',Arial,sans-serif;
  font-size:14px;line-height:1.42;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;
  touch-action:manipulation;-webkit-appearance:none;appearance:none;outline:none;padding:0;text-align:left}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
#app{display:flex;flex-direction:column;height:100dvh;max-width:430px;margin:0 auto;
  background:var(--chassis);position:relative}

/* ── Kopfleiste ───────────────────────────────────────────── */
.topbar{height:var(--top-h);display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--line)}
.topbar-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:680;letter-spacing:-.01em}
.topbar-logo{width:22px;height:22px;border:2px solid var(--accent);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--accent)}
.topbar-sub{font-size:11px;color:var(--ink-3);margin-top:1px}
.ver-chip{font-size:9.5px;font-weight:700;letter-spacing:.03em;color:var(--accent);
  background:var(--accent-soft);border-radius:4px;padding:2px 5px;margin-left:2px;
  font-variant-numeric:tabular-nums;align-self:center}
.topbar-icons{display:flex;gap:8px}
.topbar-icons button{width:34px;height:34px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:var(--r-card);display:flex;align-items:center;justify-content:center;font-size:15px}
.topbar-icons button:active{background:var(--line);border-color:var(--line-2)}

.screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(var(--nav-h) + 10px);display:none}
.screen.active{display:block}

/* ── Fußleiste ────────────────────────────────────────────── */
.nav{height:var(--nav-h);background:var(--panel);border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-around;padding:0 4px;flex-shrink:0;position:relative}
.nav .nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;height:100%;color:var(--ink-3);font-size:10px;letter-spacing:.01em}
.nav .nav-tab.active{color:var(--accent);font-weight:600}
.nav .nav-tab .ni{font-size:19px;line-height:1}
.nav .nav-fab{flex:0 0 56px;width:56px;height:56px;padding:0;align-self:center;margin-top:-20px;
  display:flex;align-items:center;justify-content:center;border-radius:50%;
  background:var(--accent);
  /* Aussparung in der Leiste statt Schlagschatten — das Bauteil sitzt in der Blende */
  box-shadow:0 0 0 5px var(--panel), 0 0 0 6px var(--line), 0 4px 10px rgba(30,20,70,.18);
  transition:transform .13s cubic-bezier(.3,.7,.4,1), box-shadow .13s ease}
.nav .nav-fab i{position:relative;display:block;width:19px;height:19px}
.nav .nav-fab i::before,.nav .nav-fab i::after{content:"";position:absolute;left:50%;top:50%;
  background:#fff;border-radius:1px}
.nav .nav-fab i::before{width:19px;height:2.5px;transform:translate(-50%,-50%)}
.nav .nav-fab i::after{width:2.5px;height:19px;transform:translate(-50%,-50%)}
.nav .nav-fab:active{transform:scale(.93);
  box-shadow:0 0 0 5px var(--panel), 0 0 0 6px var(--line), 0 1px 4px rgba(30,20,70,.16)}
@media (prefers-reduced-motion:reduce){.nav .nav-fab{transition:none}}

/* ── What Now ─────────────────────────────────────────────── */
.what-now-btn{display:flex;align-items:center;justify-content:space-between;gap:12px;
  width:calc(100% - 24px);margin:12px 12px 10px;padding:13px 16px;
  background:var(--accent);border-radius:var(--r-panel);color:#fff}
.what-now-btn:active{background:#4526AD}
.wn-label{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.82)}
.wn-sub{font-size:13px;font-weight:500;margin-top:3px;color:#fff}
.wn-arrow{font-size:19px;color:rgba(255,255,255,.7)}

/* ── Matrix ───────────────────────────────────────────────── */
.matrix-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px 12px}
.quadrant{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-panel);
  min-height:158px;overflow:hidden;display:flex;flex-direction:column;
  transition:border-color .18s, box-shadow .18s}
.quadrant.drag-over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
/* Signalstreifen an der Oberkante statt getönter Fläche — Gerätelogik */
.q-hd{padding:10px 11px 9px;border-bottom:1px solid var(--line);border-top:2px solid transparent}
.q-hd-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.q-icon{font-size:13px;line-height:1}
.q-badge{min-width:19px;height:18px;border-radius:9px;background:var(--panel-2);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:var(--ink-2);padding:0 5px;font-variant-numeric:tabular-nums}
.q-label{font-size:9px;font-weight:700;letter-spacing:.055em;text-transform:uppercase;line-height:1.3}
.q-tasks{padding:7px;display:flex;flex-direction:column;gap:5px;flex:1}
.task-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);
  padding:8px 9px 8px 24px;touch-action:none;display:block;width:100%;position:relative}
.tc-grip{position:absolute;left:2px;top:0;bottom:0;width:20px;display:flex;align-items:center;
  justify-content:center;color:#B6BCC8;touch-action:none;border-radius:5px}
.tc-grip:active{color:var(--accent);background:var(--accent-soft)}
.task-card:active{background:var(--panel-2)}
.task-card.dragging{opacity:.35}
.task-card.ghost{position:fixed;pointer-events:none;z-index:1000;width:158px;
  background:var(--panel);border:1px solid var(--accent);border-radius:var(--r-card);padding:8px 9px;
  box-shadow:0 10px 24px rgba(20,20,50,.22);transform:rotate(1.5deg)}
.tc-title{font-size:12px;font-weight:520;color:var(--ink);line-height:1.3}
.tc-meta{font-size:10px;color:var(--ink-3);margin-top:5px;display:flex;gap:5px;align-items:center}
.tc-meta>span:not(.cat-mark){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.q-action-btn{margin:0 7px 7px;padding:7px;border-radius:var(--r-chip);text-align:center;
  font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;width:calc(100% - 14px)}
.q-action-btn:active{filter:brightness(.92)}
.empty-q{text-align:center;padding:15px 8px;color:var(--ink-3);font-size:11px}

.q1 .q-hd{border-top-color:var(--sig-red)} .q1 .q-icon,.q1 .q-label{color:var(--sig-red)}
.q1 .q-action-btn{background:var(--sig-red);color:#fff} .q1 .tc-dot{background:var(--sig-red)}
.q2 .q-hd{border-top-color:var(--sig-amber)} .q2 .q-icon,.q2 .q-label{color:var(--sig-amber)}
.q2 .q-action-btn{background:var(--sig-amber);color:#fff} .q2 .tc-dot{background:var(--sig-amber)}
.q3 .q-hd{border-top-color:var(--sig-blue)} .q3 .q-icon,.q3 .q-label{color:var(--sig-blue)}
.q3 .q-action-btn{background:var(--sig-blue);color:#fff} .q3 .tc-dot{background:var(--sig-blue)}
.q4 .q-hd{border-top-color:var(--line-2)} .q4 .q-icon,.q4 .q-label{color:var(--sig-grey)}
.q4 .q-action-btn{background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line-2)}
.q4 .tc-dot{background:var(--sig-grey)}

/* ── Heute ────────────────────────────────────────────────── */
.screen-pad{padding:12px}
.sec-label{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-2);padding:8px 0 7px;margin-bottom:6px;border-bottom:1px solid var(--line-2)}
.today-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);
  padding:12px 13px;margin-bottom:6px;display:flex;align-items:center;gap:12px;width:100%}
.today-card:active{background:var(--panel-2)}
.today-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.today-info{flex:1;min-width:0}
.today-title{font-size:14px;font-weight:540}
.today-meta{font-size:11px;color:var(--ink-3);margin-top:2px}
.start-btn{padding:7px 13px;background:var(--accent);border-radius:var(--r-chip);
  font-size:11px;font-weight:700;letter-spacing:.03em;color:#fff;white-space:nowrap}
.start-btn:active{background:#4526AD}

/* ── Formular ─────────────────────────────────────────────── */
#screen-add .topbar-local{display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
#screen-add .topbar-local h2{font-size:16px;font-weight:680;letter-spacing:-.01em}
#screen-add .topbar-local .back{font-size:14px;color:var(--accent);font-weight:520}
#screen-add .topbar-local .save{font-size:14px;font-weight:700;color:var(--accent)}
#screen-add .topbar-local .save.off{color:var(--ink-3);pointer-events:none}
.ff,.ff-title{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:56px;
  width:100%;background:var(--panel);border-bottom:1px solid var(--line);text-align:left}
.ff:active{background:var(--panel-2)}
.ff-icon{font-size:16px;width:22px;text-align:center;flex-shrink:0;opacity:.75}
.ff-body{flex:1;min-width:0}
.ff-label{font-size:10px;color:var(--ink-3);margin-bottom:3px;letter-spacing:.02em}
.ff-val{font-size:14px;color:var(--ink);font-weight:500}
.ff-val.dim{color:var(--ink-3);font-weight:400}
.ff-arrow{font-size:15px;color:var(--ink-3)}
.ff-title input,.ff-title textarea{flex:1;background:transparent;border:none;outline:none;
  color:var(--ink);font-family:inherit;font-size:15px;resize:none}
.ff-title input::placeholder,.ff-title textarea::placeholder{color:var(--ink-3)}
.ff-title textarea{font-size:14px;padding:4px 0}
.qp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px}
.qp-btn{padding:12px 8px;border-radius:var(--r-card);border:1px solid var(--line);
  background:var(--panel);text-align:center;width:100%;transition:border-color .14s,background .14s}
.qp-btn:active{background:var(--panel-2)}
.qp-icon{font-size:18px;margin-bottom:6px;line-height:1}
.qp-lbl{font-size:10px;font-weight:600;line-height:1.32;color:var(--ink-2)}
.qp-btn.sel1{border-color:var(--sig-red);box-shadow:inset 0 0 0 1px var(--sig-red)}
.qp-btn.sel1 .qp-lbl{color:var(--sig-red)}
.qp-btn.sel2{border-color:var(--sig-amber);box-shadow:inset 0 0 0 1px var(--sig-amber)}
.qp-btn.sel2 .qp-lbl{color:var(--sig-amber)}
.qp-btn.sel3{border-color:var(--sig-blue);box-shadow:inset 0 0 0 1px var(--sig-blue)}
.qp-btn.sel3 .qp-lbl{color:var(--sig-blue)}
.qp-btn.sel4{border-color:var(--line-2);box-shadow:inset 0 0 0 1px var(--line-2);background:var(--panel-2)}

/* ── Bottom Sheet ─────────────────────────────────────────── */
.sheet-backdrop{position:fixed;inset:0;background:rgba(22,24,32,.42);z-index:100;
  opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;bottom:0;left:50%;transform:translate(-50%,100%);width:100%;max-width:430px;
  background:var(--panel);border-radius:16px 16px 0 0;padding:14px 16px 30px;z-index:101;
  max-height:82dvh;overflow-y:auto;box-shadow:0 -6px 28px rgba(20,20,50,.16);
  transition:transform .26s cubic-bezier(.32,.72,0,1)}
.sheet-backdrop.open .sheet{transform:translate(-50%,0)}
.sheet-handle{width:34px;height:4px;background:var(--line-2);border-radius:2px;margin:0 auto 16px}
.sheet-title{font-size:16px;font-weight:680;margin-bottom:14px;letter-spacing:-.01em}
.sheet-opt{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);
  margin-bottom:6px;font-size:14px;width:100%;transition:background .12s,border-color .12s}
.sheet-opt:active{background:var(--panel-2)}
.sheet-opt.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.sheet-opt.sel::after{content:"✓";font-weight:700}
.sheet-cancel{margin-top:8px;padding:13px;text-align:center;font-size:14px;
  color:var(--ink-2);width:100%;font-weight:520}
.sheet-cancel:active{color:var(--ink)}

/* ── Aufgaben-Detail ──────────────────────────────────────── */
.detail-title{font-size:20px;font-weight:680;margin-bottom:6px;letter-spacing:-.015em;line-height:1.25}
.detail-badge{display:inline-block;padding:4px 10px;border-radius:var(--r-chip);
  font-size:10px;font-weight:700;letter-spacing:.05em;margin-bottom:14px;text-transform:uppercase}
.detail-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.detail-row-icon{font-size:15px;width:22px;opacity:.75}
.detail-row-label{font-size:12px;color:var(--ink-3);width:82px;flex-shrink:0}
.detail-row-val{font-size:13px;color:var(--ink);flex:1;font-weight:500}
.detail-actions{display:flex;gap:8px;margin-top:12px}
.detail-action{flex:1;min-width:0;padding:11px 6px;border-radius:var(--r-card);text-align:center;
  font-size:12px;font-weight:640;border:1px solid var(--line);background:var(--panel);color:var(--ink-2)}
.detail-action:active{background:var(--panel-2)}
.detail-action.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.detail-action.primary:active{background:#4526AD}
.detail-action.danger{color:var(--sig-red);border-color:#F0C5C1}

/* ── What Now Sheet ───────────────────────────────────────── */
.wn-hero{text-align:center;padding:6px 16px 18px}
.wn-hero h1{font-size:25px;font-weight:730;letter-spacing:-.025em}
.wn-hero p{color:var(--ink-2);margin-top:6px;font-size:13px}
.wn-card{margin:0 0 16px;background:var(--panel);border-radius:var(--r-panel);border:1px solid var(--line-2)}
.wn-card-inner{padding:20px}
.wn-qbadge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;
  font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}
.wn-qbadge.urgent{background:#FCEBE9;color:var(--sig-red);border:1px solid #F3C8C3}
.wn-qbadge.plan{background:#E8F0FD;color:var(--sig-blue);border:1px solid #C3D6F5}
.wn-task-title{font-size:21px;font-weight:700;line-height:1.22;margin-bottom:10px;letter-spacing:-.02em}
.wn-meta{display:flex;gap:12px;margin-bottom:20px;color:var(--ink-2);font-size:13px}
.big-btn{display:block;width:100%;padding:15px;border-radius:10px;font-size:16px;font-weight:730;
  letter-spacing:.03em;text-align:center;border:none;transition:transform .12s,filter .12s}
.big-btn:active{transform:scale(.985);filter:brightness(.93)}
.btn-red{background:var(--sig-red);color:#fff}
.btn-purple{background:var(--accent);color:#fff}
.wn-others{padding:0}
.wn-others-label{font-size:11px;color:var(--ink-3);margin-bottom:8px;letter-spacing:.02em}
.wn-other{display:flex;align-items:center;justify-content:space-between;padding:12px 13px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);
  margin-bottom:5px;width:100%;text-align:left}
.wn-other:active{background:var(--panel-2)}
.wn-other-title{font-size:13px;font-weight:540}
.wn-other-meta{font-size:11px;color:var(--ink-3);margin-top:2px}

/* ── Rescue ───────────────────────────────────────────────── */
.rescue-box{text-align:center;padding:6px 16px 18px}
.rescue-count{font-size:44px;font-weight:760;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.rescue-sub{font-size:14px;color:var(--ink-2);margin-top:8px}
.rescue-item{display:flex;align-items:center;gap:13px;padding:13px;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r-card);margin-bottom:5px}
.rescue-num{width:27px;height:27px;border-radius:50%;background:var(--accent-soft);
  border:1px solid #D4C9F5;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;flex-shrink:0;color:var(--accent);font-variant-numeric:tabular-nums}
.rescue-info{flex:1;min-width:0}
.rescue-title{font-size:14px;font-weight:540}
.rescue-meta{font-size:11px;color:var(--ink-3);margin-top:2px}
.rescue-start{padding:7px 12px;background:var(--accent);color:#fff;border-radius:var(--r-chip);
  font-size:11px;font-weight:700;white-space:nowrap}
.rescue-start:active{background:#4526AD}
.rescue-more{margin:4px 0;padding:12px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:var(--r-card);text-align:center;font-size:12px;color:var(--ink-2);width:100%;font-weight:520}

/* ── Brain Dump ───────────────────────────────────────────── */
.brain-wrap{padding:0}
.brain-ta{width:100%;min-height:190px;background:var(--panel-2);border:1px solid var(--line-2);
  border-radius:var(--r-panel);padding:14px;color:var(--ink);font-size:14px;font-family:inherit;
  line-height:1.65;resize:none;outline:none;transition:border-color .15s,background .15s}
.brain-ta:focus{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft)}
.brain-count{text-align:right;font-size:10px;color:var(--ink-3);margin-top:5px;font-variant-numeric:tabular-nums}
.brain-create{display:block;width:100%;padding:14px;background:var(--accent);border-radius:var(--r-card);
  text-align:center;font-size:14px;font-weight:700;color:#fff;margin-top:8px}
.brain-create:active{background:#4526AD}
.brain-prev-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r-card);margin-bottom:5px}
.brain-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0}

/* ── One Thing (Spec §16) ─────────────────────────────────── */
.onething{position:fixed;inset:0;background:var(--panel);z-index:140;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:36px 28px;
  opacity:0;pointer-events:none;transition:opacity .25s}
.onething.open{opacity:1;pointer-events:auto}
.ot-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;
  background:var(--panel-2);border:1px solid var(--line);display:flex;align-items:center;
  justify-content:center;font-size:15px;color:var(--ink-2)}
.ot-close:active{background:var(--line)}
.ot-eyebrow{font-size:10px;font-weight:700;letter-spacing:.15em;color:var(--ink-3);
  text-transform:uppercase;margin-bottom:26px}
.ot-icon{font-size:40px;margin-bottom:12px;line-height:1}
.ot-jetzt{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.ot-title{font-size:26px;font-weight:730;line-height:1.18;margin-bottom:18px;letter-spacing:-.025em}
.ot-meta{display:flex;gap:18px;justify-content:center;margin-bottom:28px;color:var(--ink-2);font-size:14px}
.ot-next{margin-top:24px;padding:13px 15px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:var(--r-panel);text-align:left;width:100%}
.ot-next-lbl{font-size:10px;color:var(--ink-3);margin-bottom:5px;letter-spacing:.03em}
.ot-next-title{font-size:13px;font-weight:540;color:var(--ink-2)}
.ot-hint{font-size:11px;color:var(--ink-3);margin-top:16px}

/* ── Timer ────────────────────────────────────────────────── */
.timer-screen{position:fixed;inset:0;background:var(--panel);z-index:150;display:flex;
  flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:38px 28px;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.timer-screen.open{transform:translateY(0)}
.timer-task{font-size:18px;font-weight:640;margin-bottom:38px;letter-spacing:-.015em}
/* Tabellarische Ziffern, damit die Anzeige beim Zählen nicht springt */
.timer-time{font-size:64px;font-weight:250;letter-spacing:-.035em;font-variant-numeric:tabular-nums;
  margin-bottom:38px;color:var(--ink)}
.timer-btns{display:flex;gap:12px;width:100%}
.timer-btn{flex:1;padding:15px;border-radius:var(--r-card);font-size:14px;font-weight:680;text-align:center;border:none}
.timer-btn:active{filter:brightness(.94)}
.timer-pause-btn{background:var(--panel-2);border:1px solid var(--line-2)!important;color:var(--ink)}
.timer-done-btn{background:var(--ok);color:#fff}

/* ── Erledigt ─────────────────────────────────────────────── */
.done-screen{position:fixed;inset:0;background:var(--panel);z-index:200;display:flex;
  flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:38px 28px;
  opacity:0;pointer-events:none;transition:opacity .3s}
.done-screen.open{opacity:1;pointer-events:auto}
.done-check{font-size:54px;margin-bottom:14px;color:var(--ok);line-height:1}
.done-lbl{font-size:13px;font-weight:700;letter-spacing:.13em;color:var(--ok);text-transform:uppercase}
.done-task{font-size:21px;font-weight:640;margin-top:10px;margin-bottom:28px;color:var(--ink-2);letter-spacing:-.015em}
.done-next-card{background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-panel);
  padding:16px;text-align:left;margin-bottom:10px;width:100%;display:block}
.done-next-card:active{background:var(--panel-2);border-color:var(--accent)}
.done-next-title{font-size:16px;font-weight:620}
.done-next-meta{font-size:12px;color:var(--ink-3);margin-top:4px}
.done-return{padding:12px;text-align:center;font-size:13px;color:var(--ink-2);width:100%;font-weight:520}
.done-return:active{color:var(--ink)}

/* ── Planer ───────────────────────────────────────────────── */
.cal-hd{padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between}
.cal-hd h2{font-size:16px;font-weight:680;letter-spacing:-.01em}
.cal-nav{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);font-weight:540}
.cal-arrow{font-size:17px;color:var(--ink-2);padding:4px 8px;border-radius:var(--r-chip)}
.cal-arrow:active{background:var(--panel-2)}
.cal-grid-wrap{padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.cal-wdays{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px}
.cal-wday{text-align:center;font-size:10px;font-weight:640;color:var(--ink-3);padding:4px 0;letter-spacing:.03em}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:50%;font-size:13px;position:relative;background:transparent;border:none;
  color:var(--ink);font-variant-numeric:tabular-nums}
.cal-day:active{background:var(--panel-2)}
.cal-day.today{background:var(--accent);color:#fff;font-weight:700}
.cal-day.selday:not(.today){background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent);font-weight:600}
.cal-day.othermonth{color:#BFC4CE}
.cal-dot{width:4px;height:4px;border-radius:50%;background:var(--sig-red);position:absolute;bottom:5px}
.cal-day.today .cal-dot{background:#fff}
.cal-events{padding:4px 16px 16px}
.cal-ev-date{font-size:11px;font-weight:700;color:var(--ink-2);letter-spacing:.07em;
  text-transform:uppercase;margin:12px 0 6px}
.cal-ev{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.cal-ev-dur{font-size:11px;color:var(--ink-3);width:40px;flex-shrink:0;padding-top:2px;font-variant-numeric:tabular-nums}
.cal-ev-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
.cal-ev-info{flex:1;min-width:0}
.cal-ev-title{font-size:13px;font-weight:540}
.cal-ev-cat{margin-top:4px}

/* ── Mehr ─────────────────────────────────────────────────── */
.mehr-sec{padding:0 16px;background:var(--panel);margin-bottom:10px;border-bottom:1px solid var(--line);
  border-top:1px solid var(--line)}
.mehr-sec-lbl{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);padding:12px 0 6px}
.mehr-item{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);
  width:100%;text-align:left;background:transparent}
.mehr-item:last-child{border-bottom:none}
.mehr-item:active{opacity:.6}
.mehr-icon{font-size:18px;width:26px;text-align:center;opacity:.8}
.mehr-info{flex:1;min-width:0}
.mehr-title{font-size:14px;font-weight:520}
.mehr-sub{font-size:11px;color:var(--ink-3);margin-top:2px}
.mehr-arrow{font-size:14px;color:var(--ink-3)}

.ico{display:block;flex-shrink:0}
.ff-icon,.detail-row-icon,.mehr-icon,.q-icon,.qp-icon,.ni,.topbar-icons button,.ot-icon,.done-check{
  display:flex;align-items:center;justify-content:center}
.qp-icon{margin-bottom:7px}
#qp1 .qp-icon{color:var(--sig-red)} #qp2 .qp-icon{color:var(--sig-amber)}
#qp3 .qp-icon{color:var(--sig-blue)} #qp4 .qp-icon{color:var(--sig-grey)}
.wn-qbadge .ico,.wn-meta .ico{display:inline-block;vertical-align:-2px}
.wn-meta>span{display:inline-flex;align-items:center;gap:5px}
.detail-action .ico{display:inline-block;vertical-align:-2px;margin-right:3px}
.rescue-box .ico{margin:0 auto}
/* Formularsymbole: eine Familie, daher eine Farbe — das Violett der Primaeraktion */
.ff-icon,.detail-row-icon{color:var(--accent)}
.ff-icon{opacity:1}
/* Mehr-Ansicht: Symbole tragen die Bedeutung ihrer Zeile */
.mehr-icon{color:var(--accent)}
#mehr-rescue .mehr-icon{color:var(--sig-red)}
#mehr-archiv .mehr-icon{color:var(--ink-2)}
#mehr-sort .mehr-icon{color:var(--accent)}
#mehr-reset .mehr-icon{color:var(--sig-red)}
/* Kopfleiste */
#ic-buoy{color:var(--sig-red)} #ic-brain{color:var(--accent)}
.topbar-icons button{background:var(--panel)}
/* Kategorie-Chips: getoente Flaeche statt Signalfarbe — andere Ebene als die Quadranten */
.cat-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 7px 2px 5px;
  border-radius:var(--r-chip);font-size:11px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.cat-mark{display:inline-flex;align-items:center;justify-content:center;
  flex:0 0 18px;width:18px;height:18px;border-radius:4px;align-self:center}
.sheet-opt .cat-chip{font-size:13px;padding:3px 9px 3px 6px}
.cal-ev-cat .cat-chip{font-size:10px}
.q-icon .ico{margin-bottom:0}
.drag-handle{display:flex;align-items:center;justify-content:center;flex:0 0 30px;
  height:44px;margin:-10px 2px -10px -8px;color:#AAB0BC;touch-action:none;cursor:grab;
  border-radius:6px}
.drag-handle:active{color:var(--accent);background:var(--accent-soft)}
.today-card.dragging{opacity:.35}
.today-card.ghost{position:fixed;pointer-events:none;z-index:1000;width:330px;
  background:var(--panel);border:1px solid var(--accent);border-radius:var(--r-card);
  box-shadow:0 10px 26px rgba(20,20,50,.22);transform:rotate(.8deg)}
.drop-line{height:0;border-top:2px solid var(--accent);margin:1px 0;border-radius:2px;
  position:relative}
.drop-line::before{content:"";position:absolute;left:-1px;top:-4px;width:6px;height:6px;
  border-radius:50%;background:var(--accent)}
.q-manual{display:inline-flex;align-items:center;gap:3px;font-size:8.5px;font-weight:700;
  letter-spacing:.05em;color:var(--accent);text-transform:uppercase}
.reorder-hint{font-size:10.5px;color:var(--ink-3);padding:2px 0 8px}
.overdue-tag{color:var(--sig-red);font-size:10px;font-weight:800}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:2px}
::selection{background:var(--accent-soft);color:var(--accent)}

</style>
</head>
<body>
<div id="app">
  <div class="topbar" id="topbar">
    <div>
      <div class="topbar-title"><div class="topbar-logo">◎</div>FOCUS<span class="ver-chip" id="ver-chip"></span></div>
      <div class="topbar-sub">Weniger Kopfchaos. Mehr machen.</div>
    </div>
    <div class="topbar-icons">
      <button onclick="openSheet('rescue')" aria-label="Rescue Mode" id="ic-buoy"></button>
      <button onclick="openSheet('braindump')" aria-label="Brain Dump" id="ic-brain"></button>
    </div>
  </div>

  <!-- MATRIX -->
  <div class="screen active" id="screen-matrix">
    <button class="what-now-btn" onclick="openSheet('whatnow')">
      <div><div class="wn-label">What Now?</div><div class="wn-sub">Nächste beste Aufgabe finden</div></div>
      <div class="wn-arrow">›</div>
    </button>
    <div class="matrix-grid" id="matrix-grid"></div>
  </div>

  <!-- HEUTE -->
  <div class="screen" id="screen-heute">
    <div class="screen-pad" id="today-content"></div>
  </div>

  <!-- ADD -->
  <div class="screen" id="screen-add">
    <div class="topbar-local">
      <button class="back" onclick="navTo('matrix')">‹ Zurück</button>
      <h2>Neue Aufgabe</h2>
      <button class="save off" id="save-btn" onclick="saveTask()">Speichern</button>
    </div>
    <div class="ff-title">
      <div class="ff-icon" data-ico="pencil"></div>
      <input type="text" id="task-title-input" placeholder="Was muss erledigt werden?" oninput="onTitleInput()">
    </div>
    <button class="ff" onclick="openModal('deadline')">
      <div class="ff-icon" data-ico="calendar"></div><div class="ff-body"><div class="ff-label">Deadline</div><div class="ff-val dim" id="field-deadline">Kein Datum</div></div><div class="ff-arrow">›</div>
    </button>
    <button class="ff" onclick="openModal('repeat')">
      <div class="ff-icon" data-ico="repeat"></div><div class="ff-body"><div class="ff-label">Wiederholung</div><div class="ff-val dim" id="field-repeat">Keine</div></div><div class="ff-arrow">›</div>
    </button>
    <button class="ff" onclick="openModal('duration')">
      <div class="ff-icon" data-ico="clock"></div><div class="ff-body"><div class="ff-label">Dauer (geschätzt)</div><div class="ff-val dim" id="field-duration">–</div></div><div class="ff-arrow">›</div>
    </button>
    <button class="ff" onclick="openModal('category')">
      <div class="ff-icon" data-ico="tag"></div><div class="ff-body"><div class="ff-label">Kategorie</div><div class="ff-val dim" id="field-category">Keine</div></div><div class="ff-arrow">›</div>
    </button>
    <button class="ff" onclick="openModal('importance')">
      <div class="ff-icon" data-ico="star"></div><div class="ff-body"><div class="ff-label">Wichtigkeit</div><div class="ff-val" id="field-importance">Wichtig</div></div><div class="ff-arrow">›</div>
    </button>
    <div style="padding:12px 16px 6px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--ink-3)">IN WELCHES FELD?</div>
    <div class="qp-grid">
      <button class="qp-btn" id="qp1" onclick="selectQP(1)"><div class="qp-icon" data-ico="bolt"></div><div class="qp-lbl">Dringend + Wichtig</div></button>
      <button class="qp-btn" id="qp2" onclick="selectQP(2)"><div class="qp-icon" data-ico="diamond"></div><div class="qp-lbl">Dringend + Unwichtig</div></button>
      <button class="qp-btn" id="qp3" onclick="selectQP(3)"><div class="qp-icon" data-ico="target"></div><div class="qp-lbl">Nicht dringend + Wichtig</div></button>
      <button class="qp-btn" id="qp4" onclick="selectQP(4)"><div class="qp-icon" data-ico="dot"></div><div class="qp-lbl">Nicht dringend + Unwichtig</div></button>
    </div>
    <div class="ff-title" style="align-items:flex-start;padding-top:14px">
      <div class="ff-icon" data-ico="note"></div>
      <textarea id="task-notes" placeholder="Notiz (optional)" rows="2"></textarea>
    </div>
  </div>

  <!-- PLANNER -->
  <div class="screen" id="screen-planner">
    <div class="cal-hd">
      <h2>Planer</h2>
      <div class="cal-nav">
        <button class="cal-arrow" onclick="changeMonth(-1)">‹</button>
        <span id="cal-month-label"></span>
        <button class="cal-arrow" onclick="changeMonth(1)">›</button>
      </div>
    </div>
    <div class="cal-grid-wrap">
      <div class="cal-wdays">
        <div class="cal-wday">Mo</div><div class="cal-wday">Di</div><div class="cal-wday">Mi</div>
        <div class="cal-wday">Do</div><div class="cal-wday">Fr</div><div class="cal-wday">Sa</div><div class="cal-wday">So</div>
      </div>
      <div class="cal-days" id="cal-days"></div>
    </div>
    <div class="cal-events" id="cal-events"></div>
  </div>

  <!-- MEHR -->
  <div class="screen" id="screen-mehr">
    <div class="mehr-sec">
      <div class="mehr-sec-lbl">Modi</div>
      <button class="mehr-item" onclick="openSheet('whatnow')"><div class="mehr-icon" data-ico="bolt"></div><div class="mehr-info"><div class="mehr-title">What Now?</div><div class="mehr-sub">Beste nächste Aufgabe</div></div><div class="mehr-arrow">›</div></button>
      <button class="mehr-item" id="mehr-rescue" onclick="openSheet('rescue')"><div class="mehr-icon" data-ico="buoy"></div><div class="mehr-info"><div class="mehr-title">Rescue Mode</div><div class="mehr-sub">Schritt für Schritt</div></div><div class="mehr-arrow">›</div></button>
      <button class="mehr-item" onclick="openSheet('braindump')"><div class="mehr-icon" data-ico="brain"></div><div class="mehr-info"><div class="mehr-title">Brain Dump</div><div class="mehr-sub">Alles rausschreiben</div></div><div class="mehr-arrow">›</div></button>
    </div>
    <div class="mehr-sec">
      <div class="mehr-sec-lbl">Aufgaben</div>
      <button class="mehr-item" id="mehr-sort" onclick="resetOrder(null);alert('Automatische Sortierung wiederhergestellt.')"><div class="mehr-icon" data-ico="grip"></div><div class="mehr-info"><div class="mehr-title">Sortierung zurücksetzen</div><div class="mehr-sub">Handsortierung verwerfen, wieder nach Dringlichkeit</div></div><div class="mehr-arrow">›</div></button>
      <button class="mehr-item" id="mehr-archiv" onclick="alert('Archiv – kommt bald')"><div class="mehr-icon" data-ico="archive"></div><div class="mehr-info"><div class="mehr-title">Archiv</div><div class="mehr-sub">Erledigte Aufgaben</div></div><div class="mehr-arrow">›</div></button>
    </div>
    <div class="mehr-sec">
      <div class="mehr-sec-lbl">Einstellungen</div>
      <button class="mehr-item" onclick="if(confirm('Alle Daten löschen?')){tasks=[];saveTasks();renderMatrix();}" id="mehr-reset"><div class="mehr-icon" data-ico="trash"></div><div class="mehr-info"><div class="mehr-title">Daten zurücksetzen</div></div><div class="mehr-arrow">›</div></button>
    </div>
    <div id="app-footer" style="padding:24px 16px;text-align:center;color:var(--ink-3);font-size:11px;line-height:1.7"></div>
  </div>

  <nav class="nav">
    <button id="nav-matrix" class="nav-tab active" onclick="navTo('matrix')"><div class="ni" data-ico="grid"></div>Matrix</button>
    <button id="nav-heute" class="nav-tab" onclick="navTo('heute')"><div class="ni" data-ico="circle"></div>Heute</button>
    <button class="nav-fab" onclick="navTo('add')" aria-label="Neue Aufgabe"><i aria-hidden="true"></i></button>
    <button id="nav-planner" class="nav-tab" onclick="navTo('planner')"><div class="ni" data-ico="calendar"></div>Planer</button>
    <button id="nav-mehr" class="nav-tab" onclick="navTo('mehr')"><div class="ni" data-ico="dots"></div>Mehr</button>
  </nav>
</div>

<!-- SINGLE BOTTOM SHEET (alles läuft durch ein Sheet) -->
<div class="sheet-backdrop" id="sheet-backdrop" onclick="closeSheet(event)">
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div id="sheet-content"></div>
  </div>
</div>


<!-- ONE THING (Spec §16) -->
<div class="onething" id="onething">
  <button class="ot-close" onclick="closeOneThing()">✕</button>
  <div class="ot-eyebrow">Nur eine Sache</div>
  <div class="ot-icon" id="ot-icon"></div>
  <div class="ot-jetzt" id="ot-jetzt">Jetzt</div>
  <div class="ot-title" id="ot-title"></div>
  <div class="ot-meta" id="ot-meta"></div>
  <button class="big-btn btn-purple" id="ot-start" style="max-width:300px">START</button>
  <div id="ot-next-wrap" style="width:100%;max-width:300px"></div>
  <div class="ot-hint">Ein Schritt nach dem anderen. Du schaffst das.</div>
</div>

<!-- TIMER -->
<div class="timer-screen" id="timer-screen">
  <div style="width:100%;text-align:left;margin-bottom:auto">
    <button onclick="closeTimer()" style="font-size:13px;color:var(--ink-3);touch-action:manipulation">✕ Abbrechen</button>
  </div>
  <div class="timer-task" id="timer-task-name"></div>
  <div class="timer-time" id="timer-display">00:00</div>
  <div class="timer-btns">
    <button class="timer-btn timer-pause-btn" id="timer-pause-btn" onclick="togglePause()">Pause</button>
    <button class="timer-btn timer-done-btn" onclick="doneFromTimer()">✓ Fertig</button>
  </div>
  <div style="margin-top:auto;padding-bottom:8px;font-size:11px;color:var(--ink-3)">Kein Druck. Du schaffst das.</div>
</div>

<!-- DONE -->
<div class="done-screen" id="done-screen">
  <div class="done-check" data-ico="check" data-size="52"></div>
  <div class="done-lbl">Erledigt</div>
  <div class="done-task" id="done-task-name"></div>
  <div style="width:100%" id="done-next"></div>
</div>

<script>

const ICON={
 home:'<path d="M3.6 10.4 12 3.6l8.4 6.8V20a1.3 1.3 0 0 1-1.3 1.3h-4.5v-6.1H9.4v6.1H4.9A1.3 1.3 0 0 1 3.6 20Z"/>',

 pulse:'<path d="M20.6 12.4h-4l-2.4 5.6-4-11.2-2.4 5.6h-4.4"/>',
 folder:'<path d="M3.2 6.6a1.6 1.6 0 0 1 1.6-1.6h4l2 2.6h7.4a1.6 1.6 0 0 1 1.6 1.6v8.6a1.6 1.6 0 0 1-1.6 1.6H4.8a1.6 1.6 0 0 1-1.6-1.6Z"/>',

const catOf = n => CAT[n] || {i:'folder', c:'#697083', t:'#F1F2F5'};
// Chip mit Symbol und Namen — zum Lesen
function catChip(n){ if(!n) return ''; const k=catOf(n);

const APP_DATE='11.09.2026';
const STORE = 'focus_v3';
let tasks = [];
try { tasks = JSON.parse(localStorage.getItem(STORE)||'[]'); } catch(e){}

const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const daysLeft = t => { if(!t.deadline) return null; const dl=new Date(t.deadline); dl.setHours(0,0,0,0); return Math.round((dl-today())/86400000); };
const isOverdue = t => { const d=daysLeft(t); return d!==null && d<0; };
const isToday = t => daysLeft(t)===0;
const isUrgent = t => { const d=daysLeft(t); return d!==null && d<=3; };
const getQ = t => { const u=isUrgent(t)||isOverdue(t); return t.important?(u?1:3):(u?2:4); };
const score = t => {
  let s=[100,50,40,5][getQ(t)-1];
  if(isOverdue(t)) s+=50;
  const d=daysLeft(t);
  if(d===0) s+=40; else if(d===1) s+=25; else if(d!==null&&d<=3) s+=15;
  if(t.dur&&t.dur<10) s+=10; else if(t.dur&&t.dur<20) s+=5;
  return s;
};
const saveTasks = () => localStorage.setItem(STORE, JSON.stringify(tasks));
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmtDur = m => (m==null||!isFinite(m))?'':(m<60?m+' min':Math.floor(m/60)+'h'+(m%60?' '+(m%60)+'min':''));
const fmtDL = t => {
  const d=daysLeft(t);
  if(d===null) return '';
  if(d<0) return Math.abs(d)+'d überfällig';
  if(d===0) return 'Heute'; if(d===1) return 'Morgen';
  if(d<=7) return 'in '+d+' Tagen';
  return new Date(t.deadline).toLocaleDateString('de-DE',{day:'numeric',month:'short'});
};
// Handsortierung (ord) schlaegt die Automatik — aber nur innerhalb desselben
// Quadranten. Quadrantenuebergreifend entscheidet weiterhin der Score, damit
// eine handsortierte Bagatelle nie vor einer ueberfaelligen Aufgabe landet.
const cmp=(a,b)=>{
  if(getQ(a)===getQ(b)){
    if(a.ord!=null&&b.ord!=null&&a.ord!==b.ord) return a.ord-b.ord;
    if(a.ord!=null&&b.ord==null) return -1;
    if(a.ord==null&&b.ord!=null) return 1;
  }
  return score(b)-score(a);
};
const isManual=q=>tasks.some(t=>t.status==='active'&&getQ(t)===q&&t.ord!=null);
// Quadrant in Handsortierung ueberfuehren: aktuelle Reihenfolge festschreiben
function materialize(q){
  tasks.filter(t=>t.status==='active'&&getQ(t)===q).sort(cmp)
       .forEach((t,i)=>t.ord=i);
}
function renumber(q){
  tasks.filter(t=>t.status==='active'&&getQ(t)===q).sort(cmp)
       .forEach((t,i)=>t.ord=i);
}
function resetOrder(q){
  tasks.filter(t=>t.status==='active'&&(q==null||getQ(t)===q)).forEach(t=>t.ord=null);
  saveTasks();renderMatrix();if(currentScreen==='heute')renderToday();
}

// DRAG
let dragTask=null, ghostEl=null, dragOverQ=null, dropIdx=null, dropHost=null;

// Ermittelt anhand der Zeigerposition, an welcher Stelle eingefuegt wird,
// und zeichnet die Marke zwischen die Karten.
function showDropLine(container, y, cardSel){
  clearDropLine();
  const cards=[...container.querySelectorAll(cardSel)].filter(c=>!c.classList.contains('dragging'));
  let idx=cards.length;
  for(let i=0;i<cards.length;i++){
    const r=cards[i].getBoundingClientRect();
    if(y < r.top + r.height/2){ idx=i; break; }
  }
  const line=document.createElement('div');
  line.className='drop-line';
  if(idx<cards.length) container.insertBefore(line,cards[idx]);
  else container.appendChild(line);
  dropIdx=idx; dropHost=container;
  return idx;
}
function clearDropLine(){document.querySelectorAll('.drop-line').forEach(l=>l.remove());}
// Bricht der Browser die Geste ab (Auswahl, Anruf, Seitenwechsel),
// muss der Zustand zurueckgesetzt werden, sonst bleibt eine Karte haengen.
function abortDrag(){
  removeGhost();clearDropLine();
  document.querySelectorAll('.dragging').forEach(c=>c.classList.remove('dragging'));
  document.querySelectorAll('.quadrant').forEach(q=>q.classList.remove('drag-over'));
  dragTask=null;dragOverQ=null;dropIdx=null;
}

function setupDrag(card){
  card.setAttribute('draggable','true');
  card.addEventListener('dragstart',e=>{dragTask=tasks.find(t=>t.id===card.dataset.id);card.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
  card.addEventListener('dragend',()=>{card.classList.remove('dragging');clearDropLine();dragTask=null;});
  card.addEventListener('dragover',e=>{
    e.preventDefault();
    const host=card.closest('.q-tasks');
    if(host) showDropLine(host,e.clientY,'.task-card');
  });
  let lp=null,isDrag=false,sx,sy;
  card.addEventListener('touchstart',e=>{
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;
    lp=setTimeout(()=>{isDrag=true;dragTask=tasks.find(t=>t.id===card.dataset.id);
      card.classList.add('dragging');makeGhost(card,e.touches[0]);
      navigator.vibrate&&navigator.vibrate(25);},400);
  },{passive:true});
  card.addEventListener('touchmove',e=>{
    if(!isDrag){if(Math.abs(e.touches[0].clientX-sx)>10||Math.abs(e.touches[0].clientY-sy)>10)clearTimeout(lp);return;}
    e.preventDefault();
    const t=e.touches[0];
    moveGhost(t);
    document.querySelectorAll('.quadrant').forEach(q=>q.classList.remove('drag-over'));
    const el=document.elementFromPoint(t.clientX,t.clientY);
    const q=el&&el.closest('.quadrant');
    if(q){
      q.classList.add('drag-over');
      dragOverQ=+q.dataset.q;
      showDropLine(q.querySelector('.q-tasks'), t.clientY, '.task-card');
    } else { dragOverQ=null; clearDropLine(); dropIdx=null; }
  },{passive:false});
  card.addEventListener('touchcancel',()=>{clearTimeout(lp);if(isDrag){abortDrag();isDrag=false;}});
  card.addEventListener('touchend',()=>{
    clearTimeout(lp);
    if(isDrag){
      removeGhost();card.classList.remove('dragging');
      document.querySelectorAll('.quadrant').forEach(q=>q.classList.remove('drag-over'));
      const idx=dropIdx; clearDropLine();
      if(dragOverQ)handleDrop(dragOverQ,idx);
      isDrag=false;dragTask=null;dragOverQ=null;dropIdx=null;
    }
  });
}
// Ziehen per Anfasser in der Heute-Liste. Sortiert innerhalb des Abschnitts,
// in dem die Karte liegt — Abschnitte (Ueberfaellig/Heute/Optional) bleiben getrennt.
function setupListDrag(handle){
  const card=handle.closest('.today-card');
  let isDrag=false,lp=null,sx,sy;
  const start=t=>{
    isDrag=true;dragTask=tasks.find(x=>x.id===card.dataset.id);
    card.classList.add('dragging');makeGhost(card,t,card.getBoundingClientRect().width);
    navigator.vibrate&&navigator.vibrate(25);
  };
  handle.addEventListener('touchstart',e=>{
    e.stopPropagation();
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;
    lp=setTimeout(()=>start(e.touches[0]),180);
  },{passive:true});
  handle.addEventListener('touchmove',e=>{
    if(!isDrag){if(Math.abs(e.touches[0].clientY-sy)>8)clearTimeout(lp);return;}
    e.preventDefault();e.stopPropagation();
    const t=e.touches[0];moveGhost(t);
    showDropLine(document.getElementById('today-content'),t.clientY,'.today-card');
  },{passive:false});
  handle.addEventListener('touchcancel',()=>{clearTimeout(lp);if(isDrag){abortDrag();isDrag=false;}});
  handle.addEventListener('touchend',e=>{
    clearTimeout(lp);
    if(isDrag){
      e.preventDefault();e.stopPropagation();
      removeGhost();card.classList.remove('dragging');
      const idx=dropIdx;clearDropLine();
      if(idx!=null)applyListOrder(idx);
      isDrag=false;dragTask=null;dropIdx=null;
    }
  });
  handle.addEventListener('click',e=>{e.stopPropagation();});
}

// Uebernimmt die sichtbare Reihenfolge der Heute-Liste in die Handsortierung
function applyListOrder(idx){
  if(!dragTask)return;
  const q=getQ(dragTask);
  if(!isManual(q))materialize(q);
  const visible=[...document.querySelectorAll('#today-content .today-card')]
    .map(c=>c.dataset.id).filter(id=>id!==dragTask.id);
  visible.splice(Math.min(idx,visible.length),0,dragTask.id);
  // Nur Aufgaben desselben Quadranten neu nummerieren
  const same=visible.map(id=>tasks.find(t=>t.id===id)).filter(t=>t&&getQ(t)===q);
  same.forEach((t,i)=>t.ord=i);
  saveTasks();renderToday();renderMatrix();
}

function makeGhost(card,t,w){ghostEl=card.cloneNode(true);ghostEl.classList.add('ghost');ghostEl.classList.remove('task-card');if(w)ghostEl.style.width=w+'px';
  ghostEl.style.cssText+=`;left:${t.clientX-(w?w/2:80)}px;top:${t.clientY-26}px`;document.body.appendChild(ghostEl);}
function moveGhost(t){if(ghostEl){ghostEl.style.left=(t.clientX-80)+'px';ghostEl.style.top=(t.clientY-30)+'px';}}
function removeGhost(){if(ghostEl){ghostEl.remove();ghostEl=null;}}
function handleDrop(tq,idx){
  if(!dragTask)return;
  const fromQ=getQ(dragTask);
  // Quadrant wechseln: Wichtigkeit und ggf. Faelligkeit anpassen
  if(tq!==fromQ){
    if(tq===1||tq===3)dragTask.important=true;
    if(tq===2||tq===4)dragTask.important=false;
    if((tq===1||tq===2)&&!isUrgent(dragTask))dragTask.deadline=today().toISOString();
    else if((tq===3||tq===4)&&isUrgent(dragTask)){const d=new Date(today());d.setDate(d.getDate()+7);dragTask.deadline=d.toISOString();}
    if(fromQ!==tq&&isManual(fromQ)){dragTask.ord=null;renumber(fromQ);}
  }
  // Position innerhalb des Zielquadranten festlegen
  if(idx!=null){
    if(!isManual(tq)) materialize(tq);          // Automatik einfrieren
    const list=tasks.filter(t=>t.status==='active'&&getQ(t)===tq&&t.id!==dragTask.id).sort(cmp);
    list.splice(Math.min(idx,list.length),0,dragTask);
    list.forEach((t,i)=>t.ord=i);
  }
  saveTasks();renderMatrix();if(currentScreen==='heute')renderToday();
}

// HEUTE
function renderToday(){
  const active=tasks.filter(t=>t.status==='active').sort(cmp);
  const overdue=active.filter(isOverdue);
  const tod=active.filter(t=>isToday(t)&&!isOverdue(t));
  const opt=active.filter(t=>!isOverdue(t)&&!isToday(t)&&t.important).slice(0,3);
  let h='';
  if(overdue.length) h+=`<div class="sec-label" style="color:var(--sig-red);display:flex;align-items:center;gap:5px">${ico('bolt',11)} ÜBERFÄLLIG</div>`+overdue.map(t=>todayCard(t,qColors[getQ(t)])).join('');
  if(tod.length) h+=`<div class="sec-label" style="margin-top:12px">HEUTE</div>`+tod.map(t=>todayCard(t,qColors[getQ(t)])).join('');
  if(opt.length) h+=`<div class="sec-label" style="margin-top:12px">OPTIONAL</div>`+opt.map(t=>todayCard(t,'var(--ink-3)')).join('');
  if(h){
    const anyManual=[1,2,3,4].some(isManual);
    h=`<div class="reorder-hint">${ico('grip',12)} Am Griff ziehen, um die Reihenfolge zu ändern.`
      +(anyManual?` <button onclick="resetOrder(null)" style="color:var(--accent);font-weight:600">Automatik wiederherstellen</button>`:'')
      +`</div>`+h;
  }
  if(!h) h=`<div style="text-align:center;padding:40px 20px;color:var(--ink-3)"><div style="font-size:40px;margin-bottom:12px">✓</div>Alles erledigt für heute.</div>`;
  const host=document.getElementById('today-content');
  host.innerHTML=h;
  host.querySelectorAll('.drag-handle').forEach(setupListDrag);
}
function todayCard(t,color){

    <button class="start-btn" onclick="event.stopPropagation();startTask('${t.id}')">START</button>
  </div>`;
}

}
function setFieldDisplay(id,val,dim){const el=document.getElementById('field-'+id);el.textContent=val;el.className=dim?'ff-val dim':'ff-val';}
function onTitleInput(){const v=document.getElementById('task-title-input').value.trim();document.getElementById('save-btn').className=v?'save':'save off';}
function selectQP(n){selQP=n;nw.important=(n===1||n===3);if((n===1||n===2)&&!nw.deadline){nw.deadline=today().toISOString();setFieldDisplay('deadline','Heute',false);}updateQP();}
function updateQP(){[1,2,3,4].forEach(n=>{document.getElementById('qp'+n).className='qp-btn'+(selQP===n?' sel'+n:'');});}
function saveTask(){
  const title=document.getElementById('task-title-input').value.trim();
  if(!title)return;
  const notes=document.getElementById('task-notes').value.trim();
  if(editId){
    const t=tasks.find(x=>x.id===editId);
    if(t) Object.assign(t,{title,important:nw.important!==false,deadline:nw.deadline||null,dur:nw.dur||null,cat:nw.cat||null,rec:nw.rec||null,notes});
  } else {
    tasks.push({id:Date.now()+'',title,important:nw.important!==false,deadline:nw.deadline||null,dur:nw.dur||null,cat:nw.cat||null,notes,status:'active',rec:nw.rec||null,created:new Date().toISOString(),completed:null});
  }
  editId=null; saveTasks(); navTo('matrix');
}


function editTask(id){
  const t=tasks.find(x=>x.id===id); if(!t) return;
  closeSheet(); navTo('add');
  editId=id;
  document.querySelector('#screen-add .topbar-local h2').textContent='Aufgabe bearbeiten';
  nw={important:t.important,deadline:t.deadline,dur:t.dur,cat:t.cat,rec:t.rec};
  document.getElementById('task-title-input').value=t.title;
  document.getElementById('task-notes').value=t.notes||'';
  setFieldDisplay('deadline',t.deadline?fmtDL(t):'Kein Datum',!t.deadline);
  setFieldDisplay('repeat',t.rec||'Keine',!t.rec);
  setFieldDisplay('duration',t.dur?fmtDur(t.dur):'–',!t.dur);
  setFieldDisplay('category',t.cat||'Keine',!t.cat);
  setFieldDisplay('importance',t.important?'Wichtig':'Nicht wichtig',false);
  selQP=getQ(t); updateQP();
  document.getElementById('save-btn').className='save';
}

// MODAL (field picker)
const DL_OPTS=[{l:'Kein Datum',v:null},{l:'Heute',v:0},{l:'Morgen',v:1},{l:'In 3 Tagen',v:3},{l:'Diese Woche',v:5},{l:'Nächste Woche',v:7},{l:'In 14 Tagen',v:14},{l:'In einem Monat',v:30}];
const REC_OPTS=['Keine','Täglich','Werktags','Wöchentlich','Alle 2 Wochen','Monatlich','Jährlich'];
const DUR_OPTS=[null,5,10,15,20,30,45,60,90,120];
const CAT_OPTS=['Keine','Privat','Arbeit','Finanzen','Musik','Projekt','Haushalt','Gesundheit'];

let _opts=[];
function openModal(type){
  _opts=[];
  let h='<div class="sheet-title">';
  const row=(label,selected,fn)=>{
    const i=_opts.push(fn)-1;
    return `<button class="sheet-opt${selected?' sel':''}" onclick="_opts[${i}]()">${label}</button>`;
  };
  if(type==='deadline'){
    h+='Deadline</div>';
    h+=DL_OPTS.map(o=>{
      const dl=o.v!==null?(()=>{const d=new Date(today());d.setDate(d.getDate()+o.v);return d.toISOString();})():null;
      const sel=(!nw.deadline&&o.v===null)||(nw.deadline===dl);
      return row(o.l,sel,()=>setDL(dl,o.l));
    }).join('');
  } else if(type==='repeat'){
    h+='Wiederholung</div>';
    h+=REC_OPTS.map((o,i)=>{
      const v=i===0?null:o.toLowerCase().replace(/ /g,'_');
      return row(o,(!nw.rec&&i===0)||(nw.rec===v),()=>setRec(v,o));
    }).join('');
  } else if(type==='duration'){
    h+='Dauer</div>';
    h+=DUR_OPTS.map(d=>{
      const l=d===null?'–':fmtDur(d);
      return row(l,nw.dur===d,()=>setDur(d,l));
    }).join('');
  } else if(type==='category'){
    h+='Kategorie</div>';
    h+=CAT_OPTS.map(cat=>{
      const v=cat==='Keine'?null:cat;
      return row(cat==='Keine'?'Keine':catChip(cat),(cat==='Keine'&&!nw.cat)||(nw.cat===v),()=>setCat(v,cat));
    }).join('');
  } else if(type==='importance'){
    h+='Wichtigkeit</div>';
    h+=[['Wichtig',true],['Nicht wichtig',false]].map(([l,v])=>
      row(l,nw.important===v,()=>setImp(v,l))).join('');
  }
  h+=`<button class="sheet-cancel" onclick="closeSheet()">Abbrechen</button>`;
  openSheet('_modal',h);
}
function setDL(v,l){nw.deadline=v;setFieldDisplay('deadline',l,!v);closeSheet();}
function setRec(v,l){nw.rec=v;setFieldDisplay('repeat',l,!v);closeSheet();}
function setDur(v,l){nw.dur=v;setFieldDisplay('duration',l,!v);closeSheet();}
function setCat(v,l){nw.cat=v;setFieldDisplay('category',l,!v);
  const ic=document.querySelector('[data-ico="tag"]');
  if(ic){const k=v?catOf(v):null;
    ic.innerHTML=ico(k?k.i:'tag',18); ic.style.color=k?k.c:'var(--accent)';}
  closeSheet();}
function setImp(v,l){nw.important=v;setFieldDisplay('importance',l,false);closeSheet();}

// SHEET ENGINE
let sheetOpen=false;
function openSheet(type, html){
  const bd=document.getElementById('sheet-backdrop');
  const sc=document.getElementById('sheet-content');
  if(type==='_modal'){ sc.innerHTML=html; bd.classList.add('open'); return; }
  if(type==='whatnow') sc.innerHTML=renderWhatNow();
  else if(type==='rescue') sc.innerHTML=renderRescue();
  else if(type==='braindump') sc.innerHTML=renderBrainDump();
  else if(type==='taskdetail') sc.innerHTML=html;
  else if(type==='snooze') sc.innerHTML=html;
  bd.classList.add('open');
  sheetOpen=true;
}
function closeSheet(e){
  if(e&&e.target!==document.getElementById('sheet-backdrop'))return;
  document.getElementById('sheet-backdrop').classList.remove('open');
  sheetOpen=false;
}

// WHAT NOW
function renderWhatNow(){
  const active=tasks.filter(t=>t.status==='active').sort(cmp);
  if(!active.length) return '<div style="text-align:center;padding:24px;color:var(--ink-2)"><div style="font-size:40px;margin-bottom:12px">✓</div>Keine offenen Aufgaben.</div>';
  const best=active[0]; const others=active.slice(1,4); const q=getQ(best);
  const badge=q<=2?`<div class="wn-qbadge urgent">${ico('bolt',11)} Jetzt</div>`:`<div class="wn-qbadge plan">${ico('target',11)} Geplant</div>`;
  return `<div class="wn-hero"><h1>What Now?</h1><p>Wir finden für dich die nächste beste Aufgabe.</p></div>
  <div class="wn-card"><div class="wn-card-inner">
    ${badge}
    <div class="wn-task-title">${esc(best.title)}</div>
    <div class="wn-meta">${[best.dur?ico('clock',14)+' '+fmtDur(best.dur):'',best.deadline?ico('calendar',14)+' '+fmtDL(best):''].filter(Boolean).join('<span style="margin:0 2px">·</span>')}</div>
    <button class="big-btn ${q<=2?'btn-red':'btn-purple'}" onclick="startTask('${best.id}');closeSheet()">START</button>
  </div></div>
  ${others.length?`<div class="wn-others"><div class="wn-others-label">Andere Vorschläge</div>${others.map(t=>`<button class="wn-other" onclick="startTask('${t.id}');closeSheet()"><div><div class="wn-other-title">${esc(t.title)}</div><div class="wn-other-meta">${[t.dur?fmtDur(t.dur):'',fmtDL(t)].filter(Boolean).join(' · ')}</div></div><span style="color:var(--ink-3)">›</span></button>`).join('')}</div>`:''}`;
}

// RESCUE
function renderRescue(){
  const active=tasks.filter(t=>t.status==='active').sort(cmp);
  const top=active.slice(0,3);
  return `<div class="rescue-box">
    ${ico('buoy',36)}
    <div class="rescue-count">${active.length}</div>
    <div class="rescue-sub">Aufgaben offen.<br>Wir machen das jetzt einfach.</div>
  </div>
  <div style="padding:0 0 8px">
    ${top.map((t,i)=>`<div class="rescue-item"><div class="rescue-num">${i+1}</div><div class="rescue-info"><div class="rescue-title">${esc(t.title)}</div><div class="rescue-meta">${t.dur?fmtDur(t.dur):''}</div></div><button class="rescue-start" onclick="startTask('${t.id}');closeSheet()">START</button></div>`).join('')}
    ${active.length>3?`<button class="rescue-more" onclick="document.getElementById('rescue-rest').style.display='block';this.style.display='none'">Alle anzeigen (${active.length})</button><div id="rescue-rest" style="display:none">${active.slice(3).map((t,i)=>`<div class="rescue-item"><div class="rescue-num">${i+4}</div><div class="rescue-info"><div class="rescue-title">${esc(t.title)}</div><div class="rescue-meta">${t.dur?fmtDur(t.dur):''}</div></div><button class="rescue-start" onclick="startTask('${t.id}');closeSheet()">START</button></div>`).join('')}</div>`:''}
  </div>`;
}

// BRAIN DUMP
function renderBrainDump(){
  return `<h2 style="font-size:18px;font-weight:700;margin-bottom:6px">Brain Dump</h2>
  <p style="font-size:13px;color:var(--ink-2);margin-bottom:14px">Was musst du gerade alles machen?</p>
  <div class="brain-wrap" style="padding:0">
    <textarea class="brain-ta" id="brain-ta" placeholder="Rechnung bezahlen&#10;Album fertig machen&#10;Mutter anrufen&#10;..." oninput="updateBrain()"></textarea>
    <div class="brain-count"><span id="brain-cnt">0</span>/1000</div>
    <button class="brain-create" onclick="createBrainTasks()">Aufgaben erstellen</button>
    <div id="brain-prev" style="margin-top:12px"></div>
  </div>`;
}
function updateBrain(){
  const v=document.getElementById('brain-ta').value;
  document.getElementById('brain-cnt').textContent=v.length;
  const lines=v.split('\n').map(l=>l.trim()).filter(Boolean);
  document.getElementById('brain-prev').innerHTML=lines.length?lines.map(l=>`<div class="brain-prev-item"><div class="brain-dot"></div><div style="font-size:13px">${esc(l)}</div></div>`).join(''):'';
}
function createBrainTasks(){
  const v=document.getElementById('brain-ta').value;
  const lines=v.split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lines.length)return;
  lines.forEach(l=>tasks.push({id:Date.now()+''+Math.random().toString(36).slice(2,5),title:l,important:true,deadline:null,dur:null,cat:null,notes:'',status:'active',rec:null,created:new Date().toISOString(),completed:null}));
  saveTasks();closeSheet();renderMatrix();
}

// TASK DETAIL
function openTaskDetail(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  const q=getQ(t);
  const h=`<div class="detail-title">${esc(t.title)}</div>
  <div class="detail-badge" style="background:${qTint[q]};color:${qColors[q]};border:1px solid ${qEdge[q]}">${['','Dringend + Wichtig','Dringend + Unwichtig','Nicht dringend + Wichtig','Nicht dringend + Unwichtig'][q]}</div>
  ${t.deadline?`<div class="detail-row"><div class="detail-row-icon">${ico('calendar',15)}</div><div class="detail-row-label">Deadline</div><div class="detail-row-val">${fmtDL(t)}</div></div>`:''}
  ${t.dur?`<div class="detail-row"><div class="detail-row-icon">${ico('clock',15)}</div><div class="detail-row-label">Dauer</div><div class="detail-row-val">${fmtDur(t.dur)}</div></div>`:''}
  ${t.rec?`<div class="detail-row"><div class="detail-row-icon">${ico('repeat',15)}</div><div class="detail-row-label">Wiederholung</div><div class="detail-row-val">${t.rec}</div></div>`:''}
  ${t.cat?`<div class="detail-row"><div class="detail-row-icon" style="color:${catOf(t.cat).c}">${ico(catOf(t.cat).i,15)}</div><div class="detail-row-label">Kategorie</div><div class="detail-row-val">${catChip(t.cat)}</div></div>`:''}
  ${t.notes?`<div class="detail-row"><div class="detail-row-icon">${ico('note',15)}</div><div class="detail-row-label">Notiz</div><div class="detail-row-val">${esc(t.notes)}</div></div>`:''}
  <div class="detail-actions">
    <button class="detail-action primary" onclick="startTask('${t.id}');closeSheet()">${ico('play',12)} Start</button>
    <button class="detail-action" onclick="completeTask('${t.id}');closeSheet()">✓ Fertig</button>
  </div>
  <div class="detail-actions">
    <button class="detail-action" onclick="editTask('${t.id}')">${ico('pencil',12)} Bearbeiten</button>
    <button class="detail-action" onclick="openSnooze('${t.id}')">${ico('moon',12)} Snooze</button>
    <button class="detail-action danger" onclick="deleteTask('${t.id}')">${ico('trash',12)}</button>
  </div>`;
  openSheet('taskdetail',h);
}
function deleteTask(id){if(!confirm('Löschen?'))return;tasks=tasks.filter(t=>t.id!==id);saveTasks();closeSheet();renderMatrix();if(currentScreen==='heute')renderToday();}
function openSnooze(id){
  _opts=[];
  const S=[['Heute Abend',0],['Morgen',1],['In 2 Tagen',2],['Nächste Woche',7]];
  const rows=S.map(([l,d])=>{
    const x=new Date(today());x.setDate(x.getDate()+d);
    const iso=x.toISOString();
    const i=_opts.push(()=>applySnooze(id,iso))-1;
    return `<button class="sheet-opt" onclick="_opts[${i}]()">${l}</button>`;
  }).join('');
  openSheet('snooze',`<div class="sheet-title">Snooze</div>${rows}<button class="sheet-cancel" onclick="closeSheet()">Abbrechen</button>`);
}
function applySnooze(id,dl){const t=tasks.find(x=>x.id===id);if(t){t.deadline=dl;saveTasks();renderMatrix();}closeSheet();}

// START / TIMER
let timerTask=null,timerSec=0,timerInt=null,timerRunning=false,otTask=null;

// Spec §16: START öffnet erst den reduzierten One-Thing-Screen
function startTask(id){
  const t=tasks.find(x=>x.id===id); if(!t) return;
  otTask=t; const q=getQ(t);
  document.getElementById('ot-icon').innerHTML=ico(q<=2?'bolt':'target',40);
  document.getElementById('ot-icon').style.color=qColors[q];
  const jz=document.getElementById('ot-jetzt');
  jz.textContent=q<=2?'Jetzt':'Als nächstes';
  jz.style.color=qColors[q];
  document.getElementById('ot-title').textContent=t.title;
  document.getElementById('ot-meta').innerHTML=[
    t.dur?ico('clock',14)+' '+fmtDur(t.dur):'', t.deadline?ico('calendar',14)+' '+fmtDL(t):''
  ].filter(Boolean).map(s=>`<span>${s}</span>`).join('');
  document.getElementById('ot-start').onclick=()=>openTimer(t);
  const nx=tasks.filter(x=>x.status==='active'&&x.id!==t.id).sort(cmp)[0];
  document.getElementById('ot-next-wrap').innerHTML = nx
    ? `<div class="ot-next"><div class="ot-next-lbl">Danach</div><div class="ot-next-title">${esc(nx.title)}</div><div class="ot-next-lbl" style="margin:3px 0 0">${[fmtDur(nx.dur),fmtDL(nx)].filter(Boolean).join(' · ')}</div></div>`
    : '';
  document.getElementById('onething').classList.add('open');
}
function closeOneThing(){document.getElementById('onething').classList.remove('open');otTask=null;}

function openTimer(t){
  closeOneThing();
  timerTask=t;timerSec=0;timerRunning=true;
  document.getElementById('timer-task-name').textContent=t.title;
  document.getElementById('timer-display').textContent='00:00';
  document.getElementById('timer-pause-btn').textContent='Pause';
  document.getElementById('timer-screen').classList.add('open');
  clearInterval(timerInt);
  timerInt=setInterval(()=>{if(timerRunning){timerSec++;const m=String(Math.floor(timerSec/60)).padStart(2,'0');const s=String(timerSec%60).padStart(2,'0');document.getElementById('timer-display').textContent=m+':'+s;}},1000);
}
function closeTimer(){clearInterval(timerInt);timerRunning=false;document.getElementById('timer-screen').classList.remove('open');timerTask=null;}
function togglePause(){timerRunning=!timerRunning;document.getElementById('timer-pause-btn').textContent=timerRunning?'Pause':'Weiter';}
function doneFromTimer(){clearInterval(timerInt);document.getElementById('timer-screen').classList.remove('open');if(timerTask)completeTask(timerTask.id);}
function completeTask(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  t.status='completed';t.completed=new Date().toISOString();
  if(t.rec){const nt={...t,id:Date.now()+'',status:'active',completed:null,created:new Date().toISOString()};const d=new Date(today());if(t.rec==='täglich')d.setDate(d.getDate()+1);else if(t.rec==='wöchentlich'||t.rec==='weekly')d.setDate(d.getDate()+7);else if(t.rec==='monatlich')d.setMonth(d.getMonth()+1);else d.setDate(d.getDate()+7);nt.deadline=d.toISOString();tasks.push(nt);}
  saveTasks();showDone(t);
}
function showDone(t){
  document.getElementById('done-task-name').textContent=t.title;
  const next=tasks.filter(x=>x.status==='active').sort(cmp)[0];
  document.getElementById('done-next').innerHTML=next?`<div style="font-size:11px;color:var(--ink-3);margin-bottom:8px">WHAT NEXT?</div><button class="done-next-card" onclick="startTask('${next.id}');closeDone()"><div class="done-next-title">${esc(next.title)}</div><div class="done-next-meta">${[next.dur?fmtDur(next.dur):'',fmtDL(next)].filter(Boolean).join(' · ')}</div></button>`:'';
  document.getElementById('done-next').innerHTML+=`<button class="done-return" onclick="closeDone()">Zurück zur Matrix</button>`;
  document.getElementById('done-screen').classList.add('open');
  renderMatrix();if(currentScreen==='heute')renderToday();
}
function closeDone(){document.getElementById('done-screen').classList.remove('open');closeOneThing();}

// CALENDAR
let calY,calM,calD;
{const n=today();calY=n.getFullYear();calM=n.getMonth();calD=n.getDate();}
const MONTHS=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
function renderCal(){
  document.getElementById('cal-month-label').textContent=MONTHS[calM]+' '+calY;
  const first=new Date(calY,calM,1);
  let dow=first.getDay();dow=dow===0?6:dow-1;
  const dim=new Date(calY,calM+1,0).getDate();
  const prev=new Date(calY,calM,0).getDate();
  const n=today();const isTM=calY===n.getFullYear()&&calM===n.getMonth();
  const mt=tasks.filter(t=>{if(!t.deadline||t.status!=='active')return false;const d=new Date(t.deadline);return d.getFullYear()===calY&&d.getMonth()===calM;});
  const hasDot=new Set(mt.map(t=>new Date(t.deadline).getDate()));
  let h='';
  for(let i=0;i<dow;i++) h+=`<button class="cal-day othermonth" disabled>${prev-dow+i+1}</button>`;
  for(let d=1;d<=dim;d++){
    const iT=isTM&&d===n.getDate();const iS=d===calD&&!iT;
    h+=`<button class="cal-day${iT?' today':''}${iS?' selday':''}" onclick="selCalDay(${d})">${d}${hasDot.has(d)?'<div class="cal-dot"></div>':''}</button>`;
  }
  const rem=(dow+dim)%7;if(rem)for(let i=1;i<=7-rem;i++) h+=`<button class="cal-day othermonth" disabled>${i}</button>`;
  document.getElementById('cal-days').innerHTML=h;
  renderCalEvents();
}
function selCalDay(d){calD=d;renderCal();}
function changeMonth(dir){calM+=dir;if(calM<0){calM=11;calY--;}if(calM>11){calM=0;calY++;}renderCal();}
function renderCalEvents(){
  const sel=new Date(calY,calM,calD);sel.setHours(0,0,0,0);
  const dt=tasks.filter(t=>{if(!t.deadline||t.status!=='active')return false;const d=new Date(t.deadline);d.setHours(0,0,0,0);return d.getTime()===sel.getTime();}).sort(cmp);
  const el=document.getElementById('cal-events');
  el.innerHTML=`<div class="cal-ev-date">${calD}. ${MONTHS[calM]}</div>`+(dt.length?dt.map(t=>`<div class="cal-ev"><div class="cal-ev-dur">${t.dur?fmtDur(t.dur):''}</div><div class="cal-ev-dot" style="background:${qColors[getQ(t)]}"></div><div class="cal-ev-info"><div class="cal-ev-title">${esc(t.title)}</div>${t.cat?`<div class="cal-ev-cat">${catChip(t.cat)}</div>`:''}</div></div>`).join(''):'<div style="color:var(--ink-3);font-size:12px;padding:10px 0">Keine Aufgaben.</div>');
}

document.querySelectorAll('[data-ico]').forEach(el=>{

document.getElementById('ic-brain').innerHTML=ico('brain',16);

document.getElementById('app-footer').innerHTML=
