  <!-- ================= GPU ENGINE ================= -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // --- 1. SYSTEM-MODI (32 ARCHITEKTUREN) ---
    const SYSTEM_MODES = [
      "CANTILEVER_SHEAR_ARRAY",     
      "RHIZOME_OFFSET_CLUSTERS",    
      "STEPPED_OBLIQUE_TERRACES",   
      "ECCENTRIC_SKEW_AXES",        
      "ASYMMETRIC_PORTAL_SUSPENSION",
      "CYBERNETIC_SPINAL_CHASSIS",
      "CIRCUIT_BUS_EXCHANGER",
      "TECTONIC_HEAT_SINK",
      "TOKAMAK_MAGNETIC_CONFINEMENT",
      "HYPERBOLIC_COOLING_TOWER",
      "NEUROMORPHIC_SYNAPSE_ARRAY",
      "ORBITAL_MASS_DRIVER_CANYON",
      "CRYOGENIC_MANIFOLD_EXPANSION",
      "RADIOLARIA_BIO_LATTICE",
      "CHITIN_EXOSKELETON_SHEAR",
      "NEURO_VASCULAR_CORE",
      "EXO_PNEUMATIC_MUSCLE_CORE",
      "GRAVITATIONAL_GRAVITY_ANOMALY",
      "DYSON_SWARM_COLLECTOR_MAST",
      "BIOMORPHIC_CORAL_STRATA",
      "MEGACITY_SUB_STATION_CHASM",
      "CRYPTO_DATA_VAULT_MONOLITH",
      "MYCORRHIZAL_SYNTHETIC_ROOTS",
      "KINETIC_GYRO_STABILIZER",
      "OPTICAL_INTERFEROMETER_ARRAY",
      "LEBBEUS_ECCENTRIC_ANCHORAGE",
      "NIHEI_GRAVITON_EMITTER_CHAMBER",
      "HAECKEL_DIATOM_SILICA_CAGE",
      "SYNTHETIC_CHORDA_TENDON_GANTRY",
      "HIGH_VOLTAGE_TESLA_CONVERTER",
      "SUBTERRANEAN_VENTILATION_BLOWHOLE",
      "CRYPTO_GENOMIC_HELIX_LATTICE"
    ];

    const PALETTES = [
      {
        bg: "#010103",
        rail: 0x00e5ff,      // Cyan
        gantry: 0xffb703,    // Amber
        tension: 0xff0055,   // Magenta
        strata: 0xffffff,    // Gloss Weiß
        sub: 0x39ff14,       // Giftgrün
        dots: 0x80ffea       // Helles Cyan
      },
      {
        bg: "#020305",
        rail: 0x00ffcc,
        gantry: 0xfb8500,
        tension: 0x70e000,
        strata: 0x8ecae6,
        sub: 0xff006e,
        dots: 0xffffff
      },
      {
        bg: "#020104",
        rail: 0x4cc9f0,
        gantry: 0xf72585,
        tension: 0xfee440,
        strata: 0xe0aaff,
        sub: 0x06d6a0,
        dots: 0xffbe0b
      },
      {
        bg: "#010202",
        rail: 0x38b000,
        gantry: 0xccff33,
        tension: 0x00f5d4,
        strata: 0xffffff,
        sub: 0x70e000,
        dots: 0xaaffaa
      },
      {
        bg: "#030204",
        rail: 0xe63946,
        gantry: 0xf1faee,
        tension: 0xa8dadc,
        strata: 0x457b9d,
        sub: 0x1d3557,
        dots: 0xffd166
      }
    ];

    const state = {
      seed: Math.floor(Math.random() * 999999),
      mode: "",
      tokens: [],
      palette: PALETTES[0],
      autoRotate: true,
      vertexCount: 0,
      isRecording: false
    };

    function noise3D(x, y, z, scale) {
      return Math.sin(x * scale) * Math.cos(y * scale) * Math.sin(z * scale);
    }

    class Random {
      constructor(s) { this.s = s % 2147483647; if(this.s<=0) this.s+=2147483646; }
      next() { return (this.s = (this.s * 16807) % 2147483647) / 2147483647; }
      range(min, max) { return min + this.next() * (max - min); }
      rangeInt(min, max) { return Math.floor(this.range(min, max + 1)); }
      choice(arr) { return arr[Math.floor(this.next() * arr.length)]; }
    }

    // --- 2. THREE.JS ENGINE SETUP ---
    const container = document.getElementById('canvas-container');

    const scene = new THREE.Scene();
    
    // Präzise lineare Nebelstaffelung: Nahbereich voll präsent, Ferne weicht homogen zurück
    scene.fog = new THREE.Fog(0x010103, 40, 350);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 4000);
    camera.position.set(240, 160, 280);

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, powerPreference: "high-performance" });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; 
    controls.dampingFactor = 0.05;
    controls.minDistance = 30;
    controls.maxDistance = 1400;
    controls.autoRotate = state.autoRotate;
    controls.autoRotateSpeed = 0.5;

    controls.addEventListener('start', () => {
      if (state.autoRotate && !state.isRecording) {
        state.autoRotate = false;
        controls.autoRotate = false;
        updateOrbitUI();
      }
    });

    const renderScene = new RenderPass(scene, camera);
    
    // Kraftvoller Bloom-Effekt für intensiven Neon-Glow
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(container.clientWidth / 2, container.clientHeight / 2),
      2.25,  // Hohe Strahlkraft
      0.82,  // Breiter Glow-Radius
      0.03   // Niedriger Schwellenwert für satten Glanz
    );

    const composer = new EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    const worldGroup = new THREE.Group();
    scene.add(worldGroup);

    // --- 3. SYSTEM-GRAMMATIK (MIT ECHTER LINIENDICKE & HOHEM DETAIL) ---

    class MasterArchitect {
      constructor(rng, palette) {
        this.rng = rng;
        this.pal = palette;
        this.collectedAnchors = [];
      }

      // Echte Linienstärke via orthogonalem 4-Strang-Vektorprofil
      addSegments(pts, color, opacity = 1.0, thick = true) {
        if (!pts || pts.length === 0) return;
        
        let renderPts = pts;
        if (thick && pts.length >= 2) {
          const thickPts = [];
          const d = 0.42; // Dicke-Versatz in Welt-Einheiten
          
          for (let i = 0; i < pts.length; i += 2) {
            const p1 = pts[i];
            const p2 = pts[i + 1];
            if (!p2) continue;

            const dir = p2.clone().sub(p1);
            const len = dir.length();
            if (len < 0.001) continue;

            const t = dir.multiplyScalar(1 / len);
            const up = Math.abs(t.y) > 0.85 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
            const n = new THREE.Vector3().crossVectors(t, up).normalize().multiplyScalar(d);
            const b = new THREE.Vector3().crossVectors(t, n).normalize().multiplyScalar(d);

            // Kern + 3 räumliche Mantel-Stränge = Rundum dicke Linie aus jedem Blickwinkel
            thickPts.push(p1, p2);
            thickPts.push(p1.clone().add(n), p2.clone().add(n));
            thickPts.push(p1.clone().sub(n), p2.clone().sub(n));
            thickPts.push(p1.clone().add(b), p2.clone().add(b));
          }
          renderPts = thickPts;
        }

        const geo = new THREE.BufferGeometry().setFromPoints(renderPts);
        const mat = new THREE.LineBasicMaterial({
          color: color,
          transparent: opacity < 1.0,
          opacity: opacity,
          blending: THREE.AdditiveBlending,
          fog: true,
          depthWrite: false
        });
        const mesh = new THREE.LineSegments(geo, mat);
        worldGroup.add(mesh);
        state.vertexCount += renderPts.length;
      }

      addPointSwarm(pts, color, size = 3.0, opacity = 0.9) {
        if (pts.length === 0) return;
        const geo = new THREE.BufferGeometry().setFromPoints(pts);
        const mat = new THREE.PointsMaterial({
          color: color,
          size: size,
          transparent: true,
          opacity: opacity,
          blending: THREE.AdditiveBlending,
          fog: true
        });
        const mesh = new THREE.Points(geo, mat);
        worldGroup.add(mesh);
        state.vertexCount += pts.length;
      }

      addWireShape(geo, pos, rot, color, scale = 1) {
        const edges = new THREE.EdgesGeometry(geo);
        const posAttr = edges.attributes.position;
        const pts = [];
        const m = new THREE.Matrix4();
        const rMat = new THREE.Matrix4().makeRotationFromEuler(rot || new THREE.Euler());
        const tMat = new THREE.Matrix4().makeTranslation(pos.x, pos.y, pos.z);
        const sMat = new THREE.Matrix4().makeScale(scale, scale, scale);
        m.multiply(tMat).multiply(rMat).multiply(sMat);

        for (let i = 0; i < posAttr.count; i += 2) {
          const p1 = new THREE.Vector3().fromBufferAttribute(posAttr, i).applyMatrix4(m);
          const p2 = new THREE.Vector3().fromBufferAttribute(posAttr, i + 1).applyMatrix4(m);
          pts.push(p1, p2);
        }
        this.addSegments(pts, color, 0.9, true);
        this.collectedAnchors.push(pos.clone());
      }

      getTransformedVertices(geo, pos, rot, scale = 1) {
        const posAttr = geo.attributes.position;
        const pts = [];
        const m = new THREE.Matrix4();
        const rMat = new THREE.Matrix4().makeRotationFromEuler(rot || new THREE.Euler());
        const tMat = new THREE.Matrix4().makeTranslation(pos.x, pos.y, pos.z);
        const sMat = new THREE.Matrix4().makeScale(scale, scale, scale);
        m.multiply(tMat).multiply(rMat).multiply(sMat);

        for (let i = 0; i < posAttr.count; i++) {
          const v = new THREE.Vector3().fromBufferAttribute(posAttr, i).applyMatrix4(m);
          if (!pts.some(p => p.distanceTo(v) < 0.1)) {
            pts.push(v);
          }
        }
        this.collectedAnchors.push(...pts);
        return pts;
      }

      addConduitBundle(p1, p2, strands, color, noise = 1.5) {
        const pts = [];
        for (let s = 0; s < strands; s++) {
          const offset = new THREE.Vector3(
            this.rng.range(-noise, noise),
            this.rng.range(-noise, noise),
            this.rng.range(-noise, noise)
          );
          pts.push(p1.clone().add(offset), p2.clone().add(offset));
        }
        this.addSegments(pts, color, 0.85, true);
      }

      // PERFEKT RUNDE GANTRY-RINGE (Standard: 96 Segmente)
      addOrthogonalGantryRing(center, tangent, radius, segments = 96, color, tickMarks = true) {
        const pts = [];
        const numSegs = Math.max(segments, 96);
        const up = Math.abs(tangent.y) > 0.9 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
        const normal = new THREE.Vector3().crossVectors(tangent, up).normalize();
        const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();

        let prev = null;
        for (let i = 0; i <= numSegs; i++) {
          const theta = (i / numSegs) * Math.PI * 2;
          const pos = center.clone()
            .add(normal.clone().multiplyScalar(Math.cos(theta) * radius))
            .add(binormal.clone().multiplyScalar(Math.sin(theta) * radius));

          if (prev) pts.push(prev, pos);
          prev = pos;

          if (tickMarks && i % 8 === 0) {
            const outer = pos.clone().add(
              normal.clone().multiplyScalar(Math.cos(theta) * 7)
              .add(binormal.clone().multiplyScalar(Math.sin(theta) * 7))
            );
            pts.push(pos, outer);
          }
        }
        this.addSegments(pts, color, 0.9, true);
        this.collectedAnchors.push(center.clone());
      }

      addSpaceTruss(p1, p2, width, bays, color) {
        const pts = [];
        const dir = p2.clone().sub(p1);
        const tangent = dir.clone().normalize();
        const up = Math.abs(tangent.y) > 0.9 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
        const n = new THREE.Vector3().crossVectors(tangent, up).normalize().multiplyScalar(width / 2);
        const b = new THREE.Vector3().crossVectors(tangent, n).normalize().multiplyScalar(width / 2);

        const cornersA = [
          p1.clone().add(n).add(b), p1.clone().add(n).sub(b),
          p1.clone().sub(n).sub(b), p1.clone().sub(n).add(b)
        ];
        const cornersB = [
          p2.clone().add(n).add(b), p2.clone().add(n).sub(b),
          p2.clone().sub(n).sub(b), p2.clone().sub(n).add(b)
        ];

        for (let i = 0; i < 4; i++) pts.push(cornersA[i], cornersB[i]);

        for (let bay = 0; bay < bays; bay++) {
          const t1 = bay / bays, t2 = (bay + 1) / bays;
          for (let i = 0; i < 4; i++) {
            const nextI = (i + 1) % 4;
            const pA1 = new THREE.Vector3().lerpVectors(cornersA[i], cornersB[i], t1);
            const pA2 = new THREE.Vector3().lerpVectors(cornersA[i], cornersB[i], t2);
            const pB1 = new THREE.Vector3().lerpVectors(cornersA[nextI], cornersB[nextI], t1);
            const pB2 = new THREE.Vector3().lerpVectors(cornersA[nextI], cornersB[nextI], t2);
            pts.push(pA1, pB1, pA1, pB2);
          }
        }
        this.addSegments(pts, color, 0.8, true);
        this.collectedAnchors.push(p1.clone(), p2.clone());
      }

      addOscilloscopeWaveform(origin, length, freq, amp, color) {
        const pts = [];
        const steps = 96; // Seidenweich geschwungen
        let prev = origin.clone().add(new THREE.Vector3(-length/2, 0, 0));
        for (let i = 1; i <= steps; i++) {
          const t = i / steps;
          const x = (t - 0.5) * length;
          const y = Math.sin(t * Math.PI * 2 * freq) * amp + Math.cos(t * Math.PI * 4 * freq) * (amp * 0.3);
          const curr = origin.clone().add(new THREE.Vector3(x, y, 0));
          pts.push(prev, curr);
          prev = curr;
        }
        this.addSegments(pts, color, 0.9, true);
      }

      addElectrostaticArcs(p1, p2, segments, jitter, color) {
        const pts = [];
        let prev = p1.clone();
        for (let i = 1; i <= segments; i++) {
          const t = i / segments;
          const curr = new THREE.Vector3().lerpVectors(p1, p2, t);
          if (i < segments) {
            curr.add(new THREE.Vector3(
              this.rng.range(-jitter, jitter),
              this.rng.range(-jitter, jitter),
              this.rng.range(-jitter, jitter)
            ));
          }
          pts.push(prev, curr);
          prev = curr;
        }
        this.addSegments(pts, color, 1.0, true);
      }

      addCalibrationBarcode(origin, width, lines, color) {
        const pts = [];
        for (let i = 0; i < lines; i++) {
          const x = (i / (lines - 1) - 0.5) * width;
          const h = (i % 3 === 0) ? 14 : (i % 2 === 0 ? 8 : 4);
          pts.push(
            origin.clone().add(new THREE.Vector3(x, -h/2, 0)),
            origin.clone().add(new THREE.Vector3(x, h/2, 0))
          );
        }
        this.addSegments(pts, color, 0.8, true);
      }

      addHelicalDNAStrand(pStart, pEnd, radius, turns, rungs, color) {
        const pts = [];
        const dir = pEnd.clone().sub(pStart);
        const tangent = dir.clone().normalize();
        const up = Math.abs(tangent.y) > 0.9 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
        const norm = new THREE.Vector3().crossVectors(tangent, up).normalize();
        const binorm = new THREE.Vector3().crossVectors(tangent, norm).normalize();

        const steps = turns * 40; // Glatte Spirale
        let prevA = null, prevB = null;

        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const angle = t * Math.PI * 2 * turns;
          const center = new THREE.Vector3().lerpVectors(pStart, pEnd, t);
          const pA = center.clone().add(norm.clone().multiplyScalar(Math.cos(angle) * radius)).add(binorm.clone().multiplyScalar(Math.sin(angle) * radius));
          const pB = center.clone().add(norm.clone().multiplyScalar(Math.cos(angle + Math.PI) * radius)).add(binorm.clone().multiplyScalar(Math.sin(angle + Math.PI) * radius));

          if (prevA) pts.push(prevA, pA);
          if (prevB) pts.push(prevB, pB);
          prevA = pA; prevB = pB;

          if (i % Math.floor(steps / rungs) === 0) {
            pts.push(pA, pB);
          }
        }
        this.addSegments(pts, color, 0.9, true);

      addPulleySuspension(anchor1, anchor2, pulleyPos, color) {

      addGyroGimbalRings(center, maxRadius, rings, color) {
        for (let r = 0; r < rings; r++) {
          const rad = maxRadius - (r * (maxRadius / (rings + 1)));
          const axis = (r % 3 === 0) ? new THREE.Vector3(1, 0, 0) : (r % 3 === 1 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(0, 0, 1));
          this.addOrthogonalGantryRing(center, axis, rad, 96, color, true);
          const p1 = center.clone().add(axis.clone().multiplyScalar(rad));
          const p2 = center.clone().add(axis.clone().multiplyScalar(-rad));
          this.addSegments([p1, p1.clone().add(new THREE.Vector3(4, 4, 4)), p2, p2.clone().sub(new THREE.Vector3(4, 4, 4))], this.pal.strata, 0.95, true);

      addFiberOpticBraid(p1, p2, radius, strands, color) {
        const pts = [];
        const dir = p2.clone().sub(p1);
        const tangent = dir.clone().normalize();
        const up = Math.abs(tangent.y) > 0.9 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
        const norm = new THREE.Vector3().crossVectors(tangent, up).normalize();
        const binorm = new THREE.Vector3().crossVectors(tangent, norm).normalize();

        const steps = 80; // Fein gewundene Braid
        for (let s = 0; s < strands; s++) {
          const phase = (s / strands) * Math.PI * 2;
          let prev = null;
          for (let i = 0; i <= steps; i++) {
            const t = i / steps;
            const theta = t * Math.PI * 6 + phase;
            const pos = new THREE.Vector3().lerpVectors(p1, p2, t)
              .add(norm.clone().multiplyScalar(Math.cos(theta) * radius))
              .add(binorm.clone().multiplyScalar(Math.sin(theta) * radius));
            if (prev) pts.push(prev, pos);
            prev = pos;
          }
        }
        this.addSegments(pts, color, 0.9, true);
      }

      addInterferenceFringes(center, size, lineCount, rotAngle, color) {
        const pts = [];
        const rot = new THREE.Euler(0, rotAngle, 0);
        for (let i = 0; i < lineCount; i++) {
          const t = (i / (lineCount - 1) - 0.5) * size;
          const p1 = new THREE.Vector3(t, -size / 2, 0).applyEuler(rot).add(center);
          const p2 = new THREE.Vector3(t, size / 2, 0).applyEuler(rot).add(center);
          pts.push(p1, p2);

        this.addSegments(pts, color, 0.6, true);

      addFlangedPipeline(pStart, pCorner, pEnd, radius, color) {

        const curve = new THREE.QuadraticBezierCurve3(pStart, pCorner, pEnd);
        const steps = 36;
        let prev = pStart.clone();
        for (let i = 1; i <= steps; i++) {
          const curr = curve.getPoint(i / steps);
          pts.push(prev, curr);
          if (i % 6 === 0) {
            const tangent = curve.getTangent(i / steps);
            this.addOrthogonalGantryRing(curr, tangent, radius, 48, this.pal.gantry, false);

        this.addSegments(pts, color, 0.9, true);

      addHeatsinkFinArray(origin, normal, count, width, height, spacing, color) {
        const pts = [];
        const up = Math.abs(normal.y) > 0.9 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
        const tangent = new THREE.Vector3().crossVectors(normal, up).normalize();
        const bitangent = new THREE.Vector3().crossVectors(normal, tangent).normalize();

        for (let i = 0; i < count; i++) {
          const center = origin.clone().add(normal.clone().multiplyScalar((i - count/2) * spacing));
          const p1 = center.clone().add(tangent.clone().multiplyScalar(-width/2)).add(bitangent.clone().multiplyScalar(-height/2));
          const p2 = center.clone().add(tangent.clone().multiplyScalar(width/2)).add(bitangent.clone().multiplyScalar(-height/2));
          const p3 = center.clone().add(tangent.clone().multiplyScalar(width/2)).add(bitangent.clone().multiplyScalar(height/2));
          const p4 = center.clone().add(tangent.clone().multiplyScalar(-width/2)).add(bitangent.clone().multiplyScalar(height/2));
          pts.push(p1, p2, p2, p3, p3, p4, p4, p1);

            const curR = pos.clone().add(normal.clone().multiplyScalar(-Math.sin(angle) * ribW)).add(binormal.clone().multiplyScalar(Math.cos(angle) * ribW * 0.5));
            if (prevL) pts.push(prevL, curL);
            if (prevR) pts.push(prevR, curR);

          }

    function clearScene() {
      while(worldGroup.children.length > 0){ 
        const child = worldGroup.children[0];
        worldGroup.remove(child); 
        if (child.geometry) child.geometry.dispose();
        if (child.material) child.material.dispose();
      }
      state.vertexCount = 0;
      state.tokens = [];
    }

        case "NEUROMORPHIC_SYNAPSE_ARRAY": architect.buildNeuromorphicArraySystem(); break;
        case "EXO_PNEUMATIC_MUSCLE_CORE": architect.buildPneumaticMuscleSystem(); break;
        case "ORBITAL_MASS_DRIVER_CANYON": architect.buildMassDriverSystem(); break;
        case "CRYOGENIC_MANIFOLD_EXPANSION": architect.buildCryogenicManifoldSystem(); break;
        case "CYBERNETIC_SPINAL_CHASSIS": architect.buildSpinalChassisSystem(); break;
        case "CIRCUIT_BUS_EXCHANGER": architect.buildCircuitBusSystem(); break;
        case "RADIOLARIA_BIO_LATTICE": architect.buildRadiolariaLatticeSystem(); break;
        case "CHITIN_EXOSKELETON_SHEAR": architect.buildChitinShearSystem(); break;
        case "NEURO_VASCULAR_CORE": architect.buildNeuroVascularSystem(); break;
        case "TECTONIC_HEAT_SINK": architect.buildTectonicHeatSinkSystem(); break;
        case "CANTILEVER_SHEAR_ARRAY": architect.buildCantileverShearSystem(); break;
        case "RHIZOME_OFFSET_CLUSTERS": architect.buildRhizomeClustersSystem(); break;
        case "STEPPED_OBLIQUE_TERRACES": architect.buildSteppedTerracesSystem(); break;
        case "ECCENTRIC_SKEW_AXES": architect.buildEccentricSkewAxesSystem(); break;
        case "ASYMMETRIC_PORTAL_SUSPENSION": architect.buildAsymmetricPortalSystem(); break;
      }

      architect.injectGlobalMicroCosmos();

      document.getElementById("lblSeed").innerText = `#${state.seed}`;
      document.getElementById("lblLayout").innerText = state.mode.replace(/_/g, " ");
      document.getElementById("lblTokens").innerText = state.tokens.join(" × ");
      document.getElementById("lblVerts").innerText = (state.vertexCount).toLocaleString('de-DE');

      const camDist = rng.range(280, 360);
      const camLat = rng.range(0, Math.PI * 2);
      const camLon = rng.range(Math.PI / 6, Math.PI / 2.6);

      camera.position.set(
        Math.cos(camLat) * Math.cos(camLon) * camDist,
        Math.sin(camLon) * camDist,
        Math.sin(camLat) * Math.cos(camLon) * camDist
      );

      controls.target.set(0, 0, 0);
      state.autoRotate = true;
      controls.autoRotate = true;
      updateOrbitUI();
    }

    // --- 5. RENDER LOOP ---
    function animate() {
      if (!state.isRecording) {
        requestAnimationFrame(animate);
        controls.update(); 
        composer.render();
      }
    }

    // --- 6. VIDEO EXPORT ---
    async function startDeterministicExport() {
      if (state.isRecording) return;
      state.isRecording = true;

      const btnDesk = document.getElementById("btnRecordDesk");
      const btnMob = document.getElementById("btnRecordMob");
      const btnMutate = document.getElementById("btnMutate");
      
      const origW = container.clientWidth;
      const origH = container.clientHeight;

      // 720p, not 1080p: smaller files, and this is what "HD" means here.
      const hdW = 1280, hdH = 720;
      camera.aspect = hdW / hdH;
      camera.updateProjectionMatrix();
      renderer.setSize(hdW, hdH);
      composer.setSize(hdW, hdH);

      const fps = 25;
      const durationSec = 60;
      const totalFrames = fps * durationSec;
      let currentFrame = 0;

      // A full 360°, so the last exported frame sits one frame short of the
      // first and the clip loops without a jump. Camera zoom/pan/tilt stay
      // exactly as set - only the object itself turns.
      const startRotY = worldGroup.rotation.y;
      const wasAutoRotate = controls.autoRotate;
      controls.autoRotate = false;

      let stream;
      try {
        stream = renderer.domElement.captureStream(0);
      } catch (err) {
        state.isRecording = false;
        return;
      }

      const track = stream.getVideoTracks()[0];
      // Prefer MP4/H.264 (hardware-encoded where available); WebM only as a
      // fallback for browsers that don't offer MediaRecorder MP4 output.
      const mimeCandidates = [
        'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
        'video/mp4;codecs=avc1',
        'video/mp4',
        'video/webm;codecs=vp9',
        'video/webm;codecs=vp8'
      ];
      let mimeType = mimeCandidates.find(m => MediaRecorder.isTypeSupported(m)) || mimeCandidates[mimeCandidates.length - 1];
      const ext = mimeType.startsWith('video/mp4') ? 'mp4' : 'webm';

      let mediaRecorder;
      try {
        // 720p needs far less than the old 1080p bitrate; 8 Mbps is plenty.
        mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType, videoBitsPerSecond: 8_000_000 });
      } catch(err) {
        state.isRecording = false;
        return;
      }

      const chunks = [];
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const blob = new Blob(chunks, { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `SYSTEM_HEAVY_${state.mode}_${state.seed}.${ext}`;
        a.click();
        URL.revokeObjectURL(url);

        state.isRecording = false;
        camera.aspect = origW / origH;
        camera.updateProjectionMatrix();
        renderer.setSize(origW, origH);
        composer.setSize(origW, origH);

        btnDesk.innerHTML = "RENDER HD [60s]";
        btnMob.innerHTML = "RNDR<br>60s";
        btnMutate.disabled = false;
        btnMutate.style.opacity = "1";
        worldGroup.rotation.y = startRotY;   // snap back exactly, no float drift
        controls.autoRotate = wasAutoRotate;
        animate();
      };

      mediaRecorder.start();
      btnMutate.disabled = true;
      btnMutate.style.opacity = "0.5";

      function renderNextFrame() {
        if (currentFrame >= totalFrames) {
          mediaRecorder.stop();
          return;
        }

        worldGroup.rotation.y = startRotY + (currentFrame / totalFrames) * Math.PI * 2;
        composer.render();
        try { track.requestFrame(); } catch (err) {}
        currentFrame++;

        if (currentFrame % 5 === 0) {
          const pct = Math.round((currentFrame / totalFrames) * 100);
          btnDesk.innerHTML = `RENDERN... ${pct}%`;
          btnMob.innerHTML = `RNDR<br>${pct}%`;
        }

        requestAnimationFrame(renderNextFrame);
      }

      setTimeout(() => { requestAnimationFrame(renderNextFrame); }, 100);
    }

    // --- 7. EVENT HANDLER ---
    function randomize() {
      if (state.isRecording) return;
      state.seed = Math.floor(Math.random() * 999999);
      buildWorld();
    }

    function toggleOrbit() {
      if (state.isRecording) return;
      state.autoRotate = !state.autoRotate;
      controls.autoRotate = state.autoRotate;
      updateOrbitUI();
    }

    function updateOrbitUI() {
      const txt = state.autoRotate ? "AN" : "AUS";
      const col = state.autoRotate ? "text-teal-300" : "text-amber-500";
      document.querySelectorAll(".orbit-label").forEach(el => {
        el.innerText = txt;
        el.className = `orbit-label font-bold ${col}`;
      });
    }

    document.getElementById("btnMutate").addEventListener("click", randomize);
    document.getElementById("btnOrbitDesk").addEventListener("click", toggleOrbit);
    document.getElementById("btnOrbitMob").addEventListener("click", toggleOrbit);
    document.getElementById("btnRecordDesk").addEventListener("click", startDeterministicExport);
    document.getElementById("btnRecordMob").addEventListener("click", startDeterministicExport);
    
    const exportFn = () => {
      const link = document.createElement("a");
      link.download = `SYSTEM_HEAVY_${state.mode}_${state.seed}.png`;
      link.href = renderer.domElement.toDataURL("image/png");
      link.click();
    };
    document.getElementById("btnExportDesk").addEventListener("click", exportFn);
    document.getElementById("btnExportMob").addEventListener("click", exportFn);

    window.addEventListener("keydown", (e) => {
      if(e.code === "Space" || e.key === "r") { e.preventDefault(); randomize(); }
    });

    window.addEventListener("resize", () => {
      if (state.isRecording) return;
      const nw = container.clientWidth;
      const nh = container.clientHeight;
      camera.aspect = nw / nh;
      camera.updateProjectionMatrix();
      renderer.setSize(nw, nh);
      composer.setSize(nw, nh);
    });

    buildWorld();
    animate();

  </script>
</body>
</html>
