<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>chrom.3</title>
<style>
  :root{
    --bg:#070708; --panel:#101013; --line:#26262b; --ink:#e8e8ea; --dim:#6a6a72;
    --r:#ff2a2a; --g:#25e05a; --b:#3a7bff;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--mono);overflow:hidden;overscroll-behavior:none}
  body{display:flex;flex-direction:column}

  #stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000}
  #view{max-width:100%;max-height:100%;display:block;background:#000}
  video{display:none}

  #hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:14px;
       padding:10px 14px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
       pointer-events:none;user-select:none}
  #hud .tag{color:var(--ink)}
  #chan{display:flex;gap:5px;margin-left:auto;align-items:center}
  #chan i{width:9px;height:9px;border-radius:50%;background:#222;transition:background .05s}
  #chan i.r.on{background:var(--r)} #chan i.g.on{background:var(--g)} #chan i.b.on{background:var(--b)}
  #rec-dot{display:none;align-items:center;gap:7px;color:var(--r)}
  #rec-dot.live{display:flex}
  #rec-dot .bulb{width:9px;height:9px;border-radius:50%;background:var(--r);animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:.15}}

  #start{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,#111 0,#000 70%);
         display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center;padding:24px}
  #start h1{margin:0;font-size:34px;letter-spacing:.02em;font-weight:600}
  #start h1 .d{color:var(--dim)}
  #start .rgb{display:flex;gap:6px;margin-top:2px}
  #start .rgb span{width:34px;height:4px;border-radius:2px}
  #start .rgb .r{background:var(--r)}#start .rgb .g{background:var(--g)}#start .rgb .b{background:var(--b)}
  #start p{margin:0;max-width:330px;font-size:12.5px;line-height:1.7;color:var(--dim);letter-spacing:.03em}
  #go{appearance:none;border:1px solid var(--line);background:#141418;color:var(--ink);
      font-family:var(--mono);font-size:13px;letter-spacing:.22em;text-transform:uppercase;
      padding:16px 34px;border-radius:2px;cursor:pointer}
  #go:active{background:#1c1c22}
  #err{color:var(--r);font-size:12px;max-width:320px;line-height:1.6;min-height:1em}

  #bar{display:flex;align-items:center;gap:14px;padding:14px 16px calc(14px + env(safe-area-inset-bottom));
       background:var(--panel);border-top:1px solid var(--line)}

  .dialwrap{display:flex;flex-direction:column;align-items:center;gap:4px;user-select:none;flex-shrink:0}
  .dial{width:66px;height:66px;border-radius:50%;position:relative;cursor:ns-resize;touch-action:none;
        background:
          radial-gradient(circle at 50% 50%,#141418 0 54%,transparent 55%),
          conic-gradient(from 225deg,var(--ring,#4a4a52) var(--pct,0deg),#202026 0 270deg,transparent 0);
        border:1px solid var(--line)}
  .dial::after{content:"";position:absolute;inset:7px;border-radius:50%;border:1px solid #1b1b20}
  .ptr{position:absolute;left:50%;top:50%;width:2px;height:25px;background:var(--ink);
       transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(var(--ang,0deg));border-radius:1px}
  .dialval{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
           font-size:17px;font-weight:600;pointer-events:none}
  .dialwrap label{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}

  .spacer{flex:1;min-width:6px}

  button.ctl{appearance:none;border:1px solid var(--line);background:#141418;color:var(--ink);
    font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    padding:0 14px;height:48px;border-radius:2px;cursor:pointer;white-space:nowrap;flex-shrink:0}
  button.ctl:active{background:#1c1c22}
  button.ctl:disabled{opacity:.35;cursor:default}
  #rec{border-color:#3a1414;color:#ff6a6a;min-width:84px}
  #rec.live{background:var(--r);border-color:var(--r);color:#0a0000}
  #flip{width:46px;padding:0}

  #clips{position:absolute;left:14px;right:14px;bottom:calc(100% + 10px);display:flex;flex-direction:column;gap:8px;
         max-height:36vh;overflow:auto}
  .clip{display:flex;align-items:center;gap:12px;background:rgba(16,16,19,.94);border:1px solid var(--line);
        border-radius:3px;padding:9px 12px;backdrop-filter:blur(6px)}
  .clip .meta{font-size:11px;color:var(--dim);letter-spacing:.05em;line-height:1.4}
  .clip .meta b{color:var(--ink);font-weight:600}
  .clip a{margin-left:auto;color:var(--ink);text-decoration:none;border:1px solid var(--line);
          padding:7px 13px;border-radius:2px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase}
  .clip a:active{background:#1c1c22}
  .clip .x{color:var(--dim);cursor:pointer;font-size:16px;padding:2px 4px;line-height:1}
</style>
</head>
<body>

<div id="stage">
  <canvas id="view"></canvas>
  <video id="cam" playsinline muted></video>

  <div id="hud">
    <span class="tag">chrom.3</span>
    <span id="fpsread">–– fps</span>
    <span id="rec-dot"><span class="bulb"></span><span id="rectime">0:00</span></span>
    <div id="chan"><i class="r"></i><i class="g"></i><i class="b"></i></div>
  </div>

  <div id="clips"></div>

  <div id="start">
    <div>
      <h1>chrom<span class="d">.</span>3</h1>
      <div class="rgb"><span class="r"></span><span class="g"></span><span class="b"></span></div>
    </div>
    <p>Sequential RGB frame tint. Each frame is reduced to one colour channel, cycling red → green → blue. Frame rate sets the strobe; blend cross-fades the frames for a softer, less jittery result.</p>
    <button id="go">Start camera</button>
    <div id="err"></div>
  </div>
</div>

<div id="bar">
  <div class="dialwrap">
    <div class="dial" id="fpsDial"><div class="ptr"></div><div class="dialval" id="fpsVal">30</div></div>
    <label>frame rate</label>
  </div>
  <div class="dialwrap">
    <div class="dial" id="softDial"><div class="ptr"></div><div class="dialval" id="softVal">0</div></div>
    <label>blend %</label>
  </div>
  <div class="spacer"></div>
  <button id="flip" class="ctl" title="Switch camera" disabled>⟲</button>
  <button id="rec" class="ctl" disabled>Record</button>
</div>

<script>
(() => {
  const cam   = document.getElementById('cam');
  const canvas= document.getElementById('view');
  const ctx   = canvas.getContext('2d', { alpha:false });
  const start = document.getElementById('start');
  const goBtn = document.getElementById('go');
  const errEl = document.getElementById('err');
  const recBtn= document.getElementById('rec');
  const flipBtn=document.getElementById('flip');
  const fpsRead=document.getElementById('fpsread');
  const chanEl = document.getElementById('chan').querySelectorAll('i');
  const recDot = document.getElementById('rec-dot');
  const recTime= document.getElementById('rectime');
  const clipsEl= document.getElementById('clips');

  // offscreen buffer: the current tinted frame is built here, then blended onto the visible canvas
  const buf  = document.createElement('canvas');
  const bctx = buf.getContext('2d', { alpha:false });

  const FPS_MIN = 5, FPS_MAX = 60;
  const CHANNELS = ['#ff0000','#00ff00','#0000ff'];   // pure R, G, B for channel isolation
  const RING = ['var(--r)','var(--g)','var(--b)'];

  let targetFps = 30;
  let softness  = 0;      // 0..100  blend amount
  let facing = 'environment';
  let stream = null, running = false, channel = 0, lastTick = 0;

  /* ---------- reusable knob ---------- */
  function makeKnob(dial, min, max, sens, get, set){
    const val = dial.querySelector('.dialval');
    function paint(){
      const t = (get() - min) / (max - min);
      dial.style.setProperty('--ang', (-135 + t*270) + 'deg');
      dial.style.setProperty('--pct', (t*270) + 'deg');
      val.textContent = get();
    }
    const clamp = x => Math.max(min, Math.min(max, Math.round(x)));
    let sy = 0, sv = 0;
    dial.addEventListener('pointerdown', e => { dial.setPointerCapture(e.pointerId); sy = e.clientY; sv = get(); });
    dial.addEventListener('pointermove', e => {
      if (!dial.hasPointerCapture(e.pointerId)) return;
      set(clamp(sv + (sy - e.clientY) * sens)); paint();
    });
    dial.addEventListener('wheel', e => { e.preventDefault(); set(clamp(get() - Math.sign(e.deltaY))); paint(); }, {passive:false});
    return paint;
  }

  const fpsDial  = document.getElementById('fpsDial');
  const softDial = document.getElementById('softDial');
  const paintFps  = makeKnob(fpsDial,  FPS_MIN, FPS_MAX, 0.2,
                    () => targetFps, v => { targetFps = v; fpsRead.textContent = v + ' fps'; });
  const paintSoft = makeKnob(softDial, 0, 100, 0.5,
                    () => softness,  v => { softness = v; });
  softDial.style.setProperty('--ring', '#9a9aa2');    // neutral ring; fps ring cycles with the channel
  fpsRead.textContent = targetFps + ' fps';
  paintFps(); paintSoft();

  /* ---------- camera ---------- */
  async function openCamera(){
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{ facingMode:{ ideal:facing }, width:{ideal:1280}, height:{ideal:720}, frameRate:{ideal:60} }
    });
    cam.srcObject = stream;
    await cam.play();
    sizeCanvas();
  }

  function sizeCanvas(){
    const MAX = 1280;
    let vw = cam.videoWidth || 1280, vh = cam.videoHeight || 720;
    const s = Math.min(1, MAX / Math.max(vw, vh));
    canvas.width = buf.width  = Math.round(vw * s);
    canvas.height= buf.height = Math.round(vh * s);
  }

  /* ---------- render loop ---------- */
  function loop(now){
    if (!running) return;
    requestAnimationFrame(loop);
    const interval = 1000 / targetFps;
    if (now - lastTick < interval) return;
    lastTick = now - ((now - lastTick) % interval);

    // build the current single-channel frame in the buffer (multiply isolates one channel)
    bctx.globalCompositeOperation = 'source-over';
    bctx.drawImage(cam, 0, 0, buf.width, buf.height);
    bctx.globalCompositeOperation = 'multiply';
    bctx.fillStyle = CHANNELS[channel];
    bctx.fillRect(0, 0, buf.width, buf.height);
    bctx.globalCompositeOperation = 'source-over';

    // composite onto the visible canvas. alpha 1 = hard cut; <1 keeps the previous
    // frame underneath, so successive R/G/B frames cross-fade (fast temporal blend).
    const a = 1 - (softness / 100) * 0.92;    // 0% -> 1.0, 100% -> 0.08
    ctx.globalAlpha = a;
    ctx.drawImage(buf, 0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 1;

    chanEl.forEach((el,i) => el.classList.toggle('on', i === channel));
    fpsDial.style.setProperty('--ring', RING[channel]);
    channel = (channel + 1) % 3;
  }

  /* ---------- recording ---------- */
  let recorder = null, chunks = [], recStart = 0, recTimer = null, recMime = '';
  function pickMime(){
    const c = ['video/mp4;codecs=h264','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
    for (const m of c) if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
    return '';
  }
  function startRec(){
    recMime = pickMime();
    if (!window.MediaRecorder || !recMime){ flashErr('Recording not supported on this browser.'); return; }
    const out = canvas.captureStream(60);
    chunks = [];
    recorder = new MediaRecorder(out, { mimeType:recMime, videoBitsPerSecond: 12_000_000 });
    recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = finalizeRec;
    recorder.start();
    recStart = Date.now();
    recBtn.classList.add('live'); recBtn.textContent = 'Stop';
    recDot.classList.add('live');
    recTimer = setInterval(() => {
      const s = Math.floor((Date.now()-recStart)/1000);
      recTime.textContent = Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
    }, 500);
  }
  function stopRec(){
    if (recorder && recorder.state !== 'inactive') recorder.stop();
    clearInterval(recTimer);
    recBtn.classList.remove('live'); recBtn.textContent = 'Record';
    recDot.classList.remove('live'); recTime.textContent = '0:00';
  }
  function finalizeRec(){
    const type = recMime.split(';')[0];
    const ext  = type.includes('mp4') ? 'mp4' : 'webm';
    const blob = new Blob(chunks, { type });
    const url  = URL.createObjectURL(blob);
    const d = new Date();
    const stamp = d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')
                + '_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+String(d.getSeconds()).padStart(2,'0');
    const name = `chrom3_${stamp}.${ext}`;
    const mb = (blob.size/1048576).toFixed(1);
    const row = document.createElement('div');
    row.className = 'clip';
    row.innerHTML = `<div class="meta"><b>${name}</b><br>${mb} MB · ${targetFps} fps · blend ${softness}%</div>
                     <a download="${name}" href="${url}">Save</a>
                     <span class="x" title="Discard">✕</span>`;
    row.querySelector('.x').onclick = () => { URL.revokeObjectURL(url); row.remove(); };
    clipsEl.prepend(row);
  }
  recBtn.addEventListener('click', () => {
    if (recorder && recorder.state === 'recording') stopRec(); else startRec();
  });
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && running){ e.preventDefault(); recBtn.click(); }
  });

  /* ---------- flip ---------- */
  flipBtn.addEventListener('click', async () => {
    facing = facing === 'environment' ? 'user' : 'environment';
    try { await openCamera(); } catch(err){ flashErr('Could not switch camera.'); }
  });

  /* ---------- start ---------- */
  function flashErr(m){ errEl.textContent = m; }
  goBtn.addEventListener('click', async () => {
    goBtn.disabled = true; flashErr('');
    try {
      await openCamera();
      running = true;
      recBtn.disabled = false; flipBtn.disabled = false;
      start.style.display = 'none';
      lastTick = performance.now();
      requestAnimationFrame(loop);
    } catch(err){
      goBtn.disabled = false;
      flashErr(err && err.name === 'NotAllowedError'
        ? 'Camera permission denied. Allow access and try again.'
        : 'No camera available, or access blocked. Open over https:// or from the device.');
    }
  });

  window.addEventListener('resize', () => { if (running) sizeCanvas(); });
})();
</script>
</body>
</html>
