<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>bu.FFer</title>
<style>
  /* bu.FFer v1.4 — streamlined FX-Cam shell (matches crt.4 / roto.5 / LCD.nx). Was the graphite
     frame-store rack skin; now the minimal dark shell, aqua accent. Markup + JS untouched; CSS only. */
  :root{
    --bg:#08090b; --panel:#101216; --line:#23262d; --ink:#e8e8ea; --dim:#6b7178;
    --accent:#3fe0d8; --rec:#ff3b30; --led:#3fe0d8; --r:#ff2a2a; --g:#25e05a; --b:#3a7bff;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;overscroll-behavior:none}
  body{display:flex;flex-direction:column}
  #stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
  #view{max-width:100%;max-height:100%;display:block;background:#000;touch-action:none}
  video{display:none}
  #hud{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;gap:13px;padding:9px 13px;
       font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--led);
       text-shadow:0 0 6px rgba(63,224,216,.45);pointer-events:none;user-select:none;background:linear-gradient(rgba(0,0,0,.6),transparent)}
  #hud .tag{font-weight:600}
  #store{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--led);opacity:.92}
  #fpsread{margin-left:auto}
  #rec-dot{display:none;align-items:center;gap:7px;color:var(--rec)}
  #rec-dot.live{display:flex}
  #rec-dot .bulb{width:7px;height:7px;border-radius:50%;background:var(--rec);animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:.12}}
  #start{position:absolute;inset:0;z-index:40;background:radial-gradient(120% 90% at 50% 40%,#15171c,#000 70%);
         display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;padding:24px}
  #start h1{margin:0;font-family:var(--mono);font-size:34px;letter-spacing:.06em;font-weight:500}
  #start h1 .d{color:var(--dim)}
  #start .rgb{display:flex;gap:5px;margin-top:8px;justify-content:center}
  #start .rgb span{width:32px;height:3px;border-radius:0;background:var(--accent);opacity:.85}
  #start .rgb span:nth-child(2){opacity:.5}#start .rgb span:nth-child(3){opacity:.28}
  #start p{margin:0;max-width:340px;font-size:12.5px;line-height:1.7;color:var(--dim)}
  #go{appearance:none;border:none;border-radius:3px;background:var(--accent);color:#062a27;font-weight:600;
      font-size:12px;letter-spacing:.2em;text-transform:uppercase;padding:15px 32px;cursor:pointer}
  #go:active{transform:translateY(1px)}
  #err{color:var(--rec);font-family:var(--mono);font-size:12px;min-height:1em;max-width:320px;line-height:1.5}
  #fsbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:56;align-items:center;gap:9px;
         padding:12px 13px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.9) 50%)}
  #fsbar .rd{display:none;align-items:center;gap:6px;color:var(--rec);font-family:var(--mono);font-size:11px;flex-shrink:0}
  #fsbar.live .rd{display:flex}
  #fsbar .rd .bulb{width:8px;height:8px;border-radius:50%;background:var(--rec);animation:blink 1s steps(1) infinite}
  #bar{display:flex;flex-direction:column;gap:13px;padding:14px 14px calc(14px + env(safe-area-inset-bottom));
       background:var(--panel);border-top:1px solid var(--line)}
  .dialgrid{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 12px}
  .actionrow{display:flex;align-items:center;gap:9px}
  .optrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 14px}
  .lineopt{display:flex;align-items:center;justify-content:center;gap:6px;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  .lineopt .seg{appearance:none;font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.1em;border:1px solid var(--line);border-radius:3px;background:var(--panel);color:var(--dim);padding:6px 12px;cursor:pointer}
  .lineopt .seg.on{background:var(--accent);border-color:var(--accent);color:#062a27}
  .chip{appearance:none;font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);border-radius:3px;background:var(--panel);color:var(--dim);padding:8px 13px;cursor:pointer;display:flex;align-items:center;gap:7px}
  .chip .dot{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .1s,box-shadow .1s}
  .chip.on{color:var(--accent);border-color:var(--accent)}
  .chip.on .dot{background:var(--accent);box-shadow:0 0 7px var(--accent)}
  #freezeChip.on .dot{background:var(--b);box-shadow:0 0 7px var(--b)}
  .dialwrap{display:flex;flex-direction:column;align-items:center;gap:6px;user-select:none;width:62px}
  .dial{width:56px;height:56px;border-radius:50%;position:relative;cursor:ns-resize;touch-action:none;
        background:conic-gradient(from 225deg,var(--ring,var(--accent)) var(--pct,0deg),#000 0 270deg,transparent 0)}
  .dial::after{content:"";position:absolute;inset:4px;border-radius:50%;background:#cfcbc2;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
  .ptr{position:absolute;left:50%;top:50%;z-index:2;width:2px;height:20px;background:#1b1a18;
       transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(var(--ang,0deg))}
  .dialval{position:absolute;inset:0;z-index:2;display:flex;align-items:flex-end;justify-content:center;padding-bottom:9px;
           font-family:var(--mono);font-size:12px;font-weight:600;color:#1b1a18;pointer-events:none}
  .dialwrap label{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:center}
  button.ctl{appearance:none;font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
    border:none;border-radius:3px;background:#cfcbc2;color:#1b1a18;height:46px;cursor:pointer;white-space:nowrap;flex-shrink:0}
  button.ctl:active{transform:translateY(1px)}
  button.ctl:disabled{opacity:.35;cursor:default}
  #flip,#cam,#full,#fsExit,#fsFlip,#fsCam{width:46px;padding:0;font-size:15px;background:#2b2e35;color:#e8e8ea}
  #rec,#fsRec{flex:1;background:var(--accent);color:#062a27}
  #rec.live,#fsRec.live{background:var(--rec);color:#fff}
  #cam.off,#fsCam.off{background:#2b2e35;color:var(--accent)}
  body.imgfull #bar,body.imgfull #hud{display:none}
  body.imgfull #stage{position:fixed;inset:0;z-index:50}
  body.imgfull #view{max-width:100vw;max-height:100vh}
  body.imgfull #fsbar{display:flex}
  #toast{position:absolute;left:12px;right:12px;bottom:12px;z-index:30;display:none;padding:11px 13px;border-radius:3px;
         background:rgba(0,0,0,.9);border-left:3px solid var(--accent);color:var(--accent);
         font-family:var(--mono);font-size:12px;line-height:1.5;text-align:center}
  #toast.show{display:block}
  #clips{position:absolute;left:12px;right:12px;bottom:12px;z-index:20;display:flex;flex-direction:column;gap:7px;max-height:30vh;overflow:auto}
  .clip{display:flex;align-items:center;gap:12px;background:rgba(207,203,194,.97);border-radius:3px;padding:9px 12px}
  .clip .meta{font-family:var(--mono);font-size:10.5px;color:#6e6a62;line-height:1.4}
  .clip .meta b{color:#1b1a18}
  .clip a{margin-left:auto;color:#fff;text-decoration:none;border-radius:3px;background:var(--accent);
          padding:7px 13px;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
  .clip a{color:#062a27}
  .clip .x{color:#8a857c;cursor:pointer;font-size:16px;padding:2px 4px}
</style>
</head>
<body>

<div id="stage">
  <canvas id="view"></canvas>
  <video id="cam-v" playsinline muted></video>

  <div id="hud">
    <span class="tag">bu.FFer</span>
    <span id="fpsread">–– fps</span>
    <span id="rec-dot"><span class="bulb"></span><span id="rectime">0:00</span></span>
    <span id="store">buf 0/48 · ▸ live</span>
  </div>

  <div id="clips"></div>
  <div id="toast"></div>

  <div id="start">
    <div>
      <h1>bu<span class="d">.</span>FFer</h1>
      <div class="rgb"><span></span><span></span><span></span></div>
    </div>
    <button id="go">Start camera</button>
    <div id="err"></div>
  </div>
</div>

<div id="fsbar">
  <button id="fsExit" class="ctl" title="Exit fullscreen">✕</button>
  <button id="fsFlip" class="ctl" title="Switch camera">⟲</button>
  <button id="fsCam"  class="ctl" title="Camera on/off">⏻</button>
  <span class="rd"><span class="bulb"></span><span id="fsTime">0:00</span></span>
  <button id="fsRec"  class="ctl">Record</button>
</div>

<div id="bar">
  <div class="dialgrid">
    <div class="dialwrap"><div class="dial" id="fpsDial"><div class="ptr"></div><div class="dialval">30</div></div><label>frame rate</label></div>
    <div class="dialwrap"><div class="dial" id="bufDial"><div class="ptr"></div><div class="dialval">48</div></div><label>buffer</label></div>
    <div class="dialwrap"><div class="dial" id="chaosDial"><div class="ptr"></div><div class="dialval">35</div></div><label>chaos</label></div>
    <div class="dialwrap"><div class="dial" id="softDial"><div class="ptr"></div><div class="dialval">0</div></div><label>blend %</label></div>
    <div class="dialwrap"><div class="dial" id="briDial"><div class="ptr"></div><div class="dialval">100</div></div><label>brightness</label></div>
    <div class="dialwrap"><div class="dial" id="conDial"><div class="ptr"></div><div class="dialval">100</div></div><label>contrast</label></div>
  </div>
  <div class="optrow">
    <div class="lineopt">
      <span>motion</span>
      <button class="seg on" data-o="mix">Mix</button>
      <button class="seg" data-o="stut">Stut</button>
      <button class="seg" data-o="sweep">Sweep</button>
      <button class="seg" data-o="pong">Pong</button>
    </div>
    <button id="audioChip" class="chip"><span class="dot"></span>Audio</button>
    <button id="freezeChip" class="chip"><span class="dot"></span>Freeze</button>
  </div>
  <div class="actionrow">
    <button id="flip" class="ctl" title="Switch camera" disabled>⟲</button>
    <button id="cam"  class="ctl" title="Camera on/off" disabled>⏻</button>
    <button id="full" class="ctl" title="Fullscreen" disabled>⤢</button>
    <button id="rec"  class="ctl" disabled>Record</button>
  </div>
</div>

<script>
(() => {
  const cam   = document.getElementById('cam-v');
  const canvas= document.getElementById('view');
  const ctx   = canvas.getContext('2d', { alpha:false });
  const stage = document.getElementById('stage');
  const start = document.getElementById('start');
  const goBtn = document.getElementById('go');
  const errEl = document.getElementById('err');
  const recBtn= document.getElementById('rec');
  const flipBtn=document.getElementById('flip');
  const camBtn = document.getElementById('cam');
  const fullBtn= document.getElementById('full');
  const fsExit = document.getElementById('fsExit');
  const fsFlip = document.getElementById('fsFlip');
  const fsCam  = document.getElementById('fsCam');
  const fsRec  = document.getElementById('fsRec');
  const fsBar  = document.getElementById('fsbar');
  const fsTime = document.getElementById('fsTime');
  const fpsRead=document.getElementById('fpsread');
  const storeEl=document.getElementById('store');
  const recDot = document.getElementById('rec-dot');
  const recTime= document.getElementById('rectime');
  const clipsEl= document.getElementById('clips');
  const toastEl= document.getElementById('toast');
  const audioChip = document.getElementById('audioChip');
  const freezeChip= document.getElementById('freezeChip');
  let toastT = null;
  function showToast(msg, ms = 4200){
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), ms);
  }

  // effect buffer (selected frame lands here) + temporal accumulator (blend)
  const buf  = document.createElement('canvas');
  const bctx = buf.getContext('2d', { alpha:false });
  const acc  = document.createElement('canvas');
  const accx = acc.getContext('2d', { alpha:false });

  const FPS_MIN = 5, FPS_MAX = 60;
  const CAP_MIN = 8, CAP_MAX = 96;            // frame-store depth (frames)
  const CAP_DIM = 720;                        // capture resolution cap (memory bound)

  let targetFps = 30, capacity = 48, chaos = 35, softness = 0, brightness = 100, contrast = 100;
  let motion = 'mix';                         // 'mix' | 'stut' | 'sweep' | 'pong'
  let facing = 'environment';
  let stream = null, running = false, camOn = false, lastTick = 0;

  // ---------- the ring frame store ----------
  let ring = [];            // canvases holding captured frames
  let writeHead = -1;       // last slot written
  let filled = 0;           // valid frames present
  let readHead = 0;         // playhead slot
  let dir = 1;              // sweep / pong direction (stepDirection)
  let stateTimer = 0;       // frames to hold the current behaviour (reference ratio)
  let stepMagnitude = 1;    // held step size for the current behaviour
  let capW = 0, capH = 0;
  let stateLabel = 'live';

  const rnd  = Math.random;
  const rint = n => (rnd() * n) | 0;

  /* ---------- reusable knob ---------- */
  function makeKnob(dial, min, max, sens, get, set){
    const val = dial.querySelector('.dialval');
    function paint(){
      const t = (get() - min) / (max - min);
      dial.style.setProperty('--ang', (-135 + t*270) + 'deg');
      dial.style.setProperty('--pct', (t*270) + 'deg');
      val.textContent = get();
    }
    const clamp = x => Math.max(min, Math.min(max, Math.round(x)));
    let sy = 0, sv = 0;
    dial.addEventListener('pointerdown', e => { dial.setPointerCapture(e.pointerId); sy = e.clientY; sv = get(); });
    dial.addEventListener('pointermove', e => {
      if (!dial.hasPointerCapture(e.pointerId)) return;
      set(clamp(sv + (sy - e.clientY) * sens)); paint();
    });
    dial.addEventListener('wheel', e => { e.preventDefault(); set(clamp(get() - Math.sign(e.deltaY))); paint(); }, {passive:false});
    return paint;
  }

  const fpsDial = document.getElementById('fpsDial');
  const paintFps  = makeKnob(fpsDial, FPS_MIN, FPS_MAX, 0.2, () => targetFps, v => { targetFps = v; fpsRead.textContent = v + ' fps'; });
  const paintBuf  = makeKnob(document.getElementById('bufDial'), CAP_MIN, CAP_MAX, 0.4, () => capacity, v => { setCapacity(v); });
  const paintChaos= makeKnob(document.getElementById('chaosDial'), 0, 100, 0.5, () => chaos,      v => { chaos = v; });
  const paintSoft = makeKnob(document.getElementById('softDial'), 0, 200, 0.8, () => softness,   v => { softness   = v; });
  const paintBri  = makeKnob(document.getElementById('briDial'),  50, 300, 1.0, () => brightness, v => { brightness = v; });
  const paintCon  = makeKnob(document.getElementById('conDial'),  50, 200, 0.6, () => contrast,   v => { contrast   = v; });
  for (const id of ['bufDial','chaosDial','softDial','briDial','conDial'])
    document.getElementById(id).style.setProperty('--ring', '#9a9aa2');
  fpsDial.style.setProperty('--ring', 'var(--led)');
  fpsRead.textContent = targetFps + ' fps';
  paintFps(); paintBuf(); paintChaos(); paintSoft(); paintBri(); paintCon();

  const segBtns = document.querySelectorAll('.lineopt .seg');
  segBtns.forEach(b => b.addEventListener('click', () => {
    motion = b.dataset.o;
    segBtns.forEach(x => x.classList.toggle('on', x === b));
    stateTimer = 0; dir = 1;
  }));

  function setCapacity(v){
    capacity = v;
    if (ring.length > capacity){                 // shrink: drop the tail, clamp heads
      ring.length = capacity;
      if (filled > capacity) filled = capacity;
      if (writeHead >= capacity) writeHead = capacity - 1;
      if (readHead  >= capacity) readHead  = readHead % capacity;
    }
  }

  /* ---------- camera ---------- */
  async function openCamera(){
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      audio:false,                               // recording stays video-only / silent
      video:{ facingMode:{ ideal:facing }, width:{ideal:1280}, height:{ideal:720}, frameRate:{ideal:60} }
    });
    cam.srcObject = stream;
    await cam.play();
    sizeCanvas();
  }
  function sizeCanvas(){
    let vw = cam.videoWidth || 1280, vh = cam.videoHeight || 720;
    const s = Math.min(1, CAP_DIM / Math.max(vw, vh));
    const w = Math.round(vw * s), h = Math.round(vh * s);
    // display == capture resolution: no upscale blur, ring frames match 1:1
    canvas.width = buf.width = acc.width = w;
    canvas.height= buf.height= acc.height= h;
    if (w !== capW || h !== capH){               // dimensions changed -> old frames invalid
      capW = w; capH = h;
      ring = []; writeHead = -1; filled = 0; readHead = 0;
    }
  }

  /* ---------- audio-triggered jumps (mic = input only, never recorded) ---------- */
  let audioCtx = null, analyser = null, micStream = null, micNode = null, freqData = null;
  let audioOn = false, lastEnergy = 0, onsetPending = false;
  async function enableAudio(){
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio:true });
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') await audioCtx.resume();
      analyser = audioCtx.createAnalyser(); analyser.fftSize = 256;
      micNode = audioCtx.createMediaStreamSource(micStream);
      micNode.connect(analyser);
      freqData = new Uint8Array(analyser.frequencyBinCount);
      audioOn = true;
      audioChip.classList.add('on');
    } catch(e){
      showToast("Microphone unavailable — audio jumps stay off."); audioOn = false; audioChip.classList.remove('on');
    }
  }
  function disableAudio(){
    audioOn = false; audioChip.classList.remove('on');
    if (micNode) { try { micNode.disconnect(); } catch(e){} micNode = null; }
    if (micStream){ micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    analyser = null;
  }
  audioChip.addEventListener('click', () => { audioOn ? disableAudio() : enableAudio(); });
  function audioOnset(){
    if (!audioOn || !analyser) return false;
    analyser.getByteFrequencyData(freqData);
    let sum = 0; for (let i = 0; i < freqData.length; i++) sum += freqData[i];
    const e = sum / freqData.length, delta = e - lastEnergy; lastEnergy = e;
    return delta > 11;                            // onset threshold
  }

  freezeChip.addEventListener('click', () => {
    frozen = !frozen; freezeChip.classList.toggle('on', frozen);
  });
  let frozen = false;

  /* ---------- playhead: the effect core ----------
     chaos is a continuous magnitude at the low end (gentle wobble around live
     forward playback); the disruptive events (rewind bursts, sweeps, teleports)
     are gated by chaos^2 so they only emerge as the dial climbs. Motion mode
     shapes what a disruption does, not how often it fires. */
  function advancePlayhead(){
    const n = filled;
    if (n < 5){ readHead = writeHead >= 0 ? writeHead : 0; stateLabel = 'live'; return; }
    // chaos dial -> the reference's chaosFactor range (0.1 .. 2.0). 35 ≈ its 0.75 default.
    const cf = 0.1 + (chaos / 100) * 1.9;

    // audio onset: jump into the buffer and commit briefly
    if (audioOnset()){ readHead = rint(n); stateTimer = 5 + rint(15); stateLabel = 'audio'; return; }

    // Pick a behaviour and HOLD it for a run of frames — this is the reference's
    // timing, and what keeps it from being nervous: one rewind / sweep travels
    // across many stored frames instead of re-rolling every tick. Higher chaos ->
    // shorter holds (behaviour changes more often).
    stateTimer--;
    if (stateTimer <= 0){
      stateTimer = Math.floor(rnd() * 40 * (2.1 - cf) + 5);
      if (motion === 'mix'){
        const r = rnd();
        if (r < 0.40){ stateLabel = 'stutter';  stepMagnitude = (rnd() > 0.5 ? 1 : -1) * (1 + rint(3)); }
        else if (r < 0.75){ stateLabel = 'rewind'; stepMagnitude = -(2 + rint(8)); }
        else { stateLabel = 'teleport'; readHead = rint(n); stepMagnitude = 1; }
      } else if (motion === 'stut'){
        stateLabel = 'stutter'; stepMagnitude = rnd() > 0.8 ? (rnd() > 0.5 ? 1 : -1) : 0;
      } else if (motion === 'sweep'){
        stateLabel = 'sweep';   stepMagnitude = rnd() > 0.5 ? -4 : 4;
      } else { // pong
        stateLabel = 'pong';    stepMagnitude = dir * (rnd() > 0.7 ? 3 : 1);
        if (rnd() > 0.85) dir *= -1;
      }
    }

    // move by the held magnitude, scaled by chaos; drift forward when it rounds to 0
    let step = Math.round(stepMagnitude * cf);
    if (step === 0 && motion !== 'stut') step = 1;
    readHead = ((readHead + step) % n + n) % n;
  }

  /* ---------- render loop ---------- */
  function loop(now){
    if (!running) return;
    requestAnimationFrame(loop);
    const interval = 1000 / targetFps;
    if (now - lastTick < interval) return;
    lastTick = now - ((now - lastTick) % interval);

    // 1. capture current camera frame into the ring (unless frozen)
    if (!frozen && cam.readyState >= 2){
      writeHead = (writeHead + 1) % capacity;
      let f = ring[writeHead];
      if (!f){ f = document.createElement('canvas'); f.width = capW; f.height = capH; ring[writeHead] = f; }
      f.getContext('2d', { alpha:false }).drawImage(cam, 0, 0, capW, capH);
      if (filled < capacity) filled++;
    }

    // 2. move the playhead, draw the selected frame into the effect buffer
    advancePlayhead();
    const src = ring[readHead] || ring[writeHead];
    bctx.globalCompositeOperation = 'source-over';
    bctx.globalAlpha = 1;
    if (src) bctx.drawImage(src, 0, 0, buf.width, buf.height);

    // 3. temporal blend accumulator (0..100 unchanged 1.0->0.08; 100..200 toward freeze)
    accx.globalAlpha = Math.max(0.006, softness <= 100 ? 1 - (softness/100)*0.92 : 0.08*(1 - (softness-100)/100));
    accx.drawImage(buf, 0, 0, acc.width, acc.height);
    accx.globalAlpha = 1;

    // 4. tone post inside the recorded path
    ctx.filter = `brightness(${brightness/100}) contrast(${contrast/100})`;
    ctx.drawImage(acc, 0, 0, canvas.width, canvas.height);
    ctx.filter = 'none';

    // readout
    storeEl.textContent = `buf ${filled}/${capacity} · ▸ ${frozen ? 'froz' : stateLabel}`;
  }

  /* ---------- recording ---------- */
  let recorder = null, chunks = [], recStart = 0, recTimer = null, recMime = '';
  function pickMime(){
    const c = ['video/mp4;codecs=h264','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
    for (const m of c) if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
    return '';
  }
  function startRec(){
    if (!window.MediaRecorder || !canvas.captureStream){
      showToast("This browser can't record video. Use your phone's screen recorder instead."); return;
    }
    let out;
    try { out = canvas.captureStream(); }
    catch(e){ showToast("Recording isn't available in this browser — try your phone's screen recorder."); return; }
    recMime = pickMime();
    chunks = [];
    const opts = recMime ? { mimeType: recMime, videoBitsPerSecond: 12000000 } : { videoBitsPerSecond: 12000000 };
    try { recorder = new MediaRecorder(out, opts); }
    catch(e){
      try { recorder = new MediaRecorder(out); }
      catch(e2){ showToast("This browser can't encode video. Use your phone's screen recorder instead."); return; }
    }
    recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = finalizeRec;
    try { recorder.start(); }
    catch(e){ showToast("Couldn't start the recording."); return; }
    recStart = Date.now();
    recBtn.classList.add('live'); recBtn.textContent = 'Stop';
    fsRec.classList.add('live');  fsRec.textContent  = 'Stop';
    recDot.classList.add('live'); fsBar.classList.add('live');
    recTimer = setInterval(() => {
      const s = Math.floor((Date.now()-recStart)/1000);
      recTime.textContent = fsTime.textContent = Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
    }, 500);
  }
  function stopRec(){
    if (recorder && recorder.state !== 'inactive') recorder.stop();
    clearInterval(recTimer);
    recBtn.classList.remove('live'); recBtn.textContent = 'Record';
    fsRec.classList.remove('live');  fsRec.textContent  = 'Record';
    recDot.classList.remove('live'); fsBar.classList.remove('live');
    recTime.textContent = fsTime.textContent = '0:00';
  }
  function finalizeRec(){
    const mt   = (recorder && recorder.mimeType) || recMime || 'video/webm';
    const type = mt.split(';')[0];
    const ext  = type.includes('mp4') ? 'mp4' : 'webm';
    const blob = new Blob(chunks, { type });
    if (!blob.size){ showToast("Nothing was captured — recording may be blocked here. Try your screen recorder."); return; }
    const url  = URL.createObjectURL(blob);
    const d = new Date(), p = n => String(n).padStart(2,'0');
    const stamp = p(d.getFullYear()%100)+p(d.getMonth()+1)+p(d.getDate())
                + '-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());
    const name = `buffer_${stamp}.${ext}`;
    const mb = (blob.size/1048576).toFixed(1);
    const row = document.createElement('div');
    row.className = 'clip';
    row.innerHTML = `<div class="meta"><b>${name}</b><br>${mb} MB · ${targetFps} fps · buf ${capacity} · chaos ${chaos} · ${motion}${audioOn?' +aud':''}${frozen?' froz':''} · blend ${softness}% · B${brightness}/C${contrast}</div>
                     <a download="${name}" href="${url}">Save</a>
                     <span class="x" title="Discard">✕</span>`;
    row.querySelector('.x').onclick = () => { URL.revokeObjectURL(url); row.remove(); };
    clipsEl.prepend(row);
  }
  recBtn.addEventListener('click', () => {
    if (recorder && recorder.state === 'recording') stopRec(); else startRec();
  });
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && camOn){ e.preventDefault(); recBtn.click(); }
  });

  /* ---------- camera on/off ---------- */
  async function setCam(on){
    if (on){
      try { await openCamera(); } catch(err){ flashErr('Could not start camera.'); return; }
      camOn = true; running = true;
      camBtn.classList.remove('off'); fsCam.classList.remove('off');
      lastTick = performance.now();
      requestAnimationFrame(loop);
    } else {
      camOn = false; running = false;
      if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
      camBtn.classList.add('off'); fsCam.classList.add('off');
      ctx.filter = 'none'; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
  }
  camBtn.addEventListener('click', () => setCam(!camOn));
  flipBtn.addEventListener('click', async () => {
    if (!camOn) return;
    facing = facing === 'environment' ? 'user' : 'environment';
    try { await openCamera(); } catch(err){ flashErr('Could not switch camera.'); }
  });

  /* ---------- fullscreen image ---------- */
  function enterFull(){
    document.body.classList.add('imgfull');
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});
  }
  function exitFullscreen(){
    document.body.classList.remove('imgfull');
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});
  }
  fullBtn.addEventListener('click', () => document.body.classList.contains('imgfull') ? exitFullscreen() : enterFull());
  fsExit.addEventListener('click', exitFullscreen);
  fsRec.addEventListener('click', () => recBtn.click());
  fsCam.addEventListener('click', () => camBtn.click());
  fsFlip.addEventListener('click', () => flipBtn.click());
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) document.body.classList.remove('imgfull'); });

  /* ---------- start ---------- */
  function flashErr(m){ errEl.textContent = m; }
  goBtn.addEventListener('click', async () => {
    goBtn.disabled = true; flashErr('');
    try {
      await openCamera();
      camOn = true; running = true;
      recBtn.disabled = flipBtn.disabled = camBtn.disabled = fullBtn.disabled = false;
      start.style.display = 'none';
      lastTick = performance.now();
      requestAnimationFrame(loop);
    } catch(err){
      goBtn.disabled = false;
      flashErr(err && err.name === 'NotAllowedError'
        ? 'Camera permission denied. Allow access and try again.'
        : 'No camera available, or access blocked. Open over https:// or from the device.');
    }
  });
  window.addEventListener('resize', () => { if (running) sizeCanvas(); });
})();
</script>
</body>
</html>
